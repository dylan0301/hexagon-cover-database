name: Add finite-enclosure subcase summary table

on:
  push:
    branches: [No-more-strategy-2]
    paths:
      - '.github/workflows/add-finite-enclosure-summary-table.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: finite-enclosure-summary-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_DATE_EPOCH: '946684800'
  FORCE_SOURCE_DATE: '1'
  TZ: UTC

jobs:
  edit-build-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Insert the finite-enclosure case table
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('arrange/paper_draft/06_finite_enclosure_full.tex')
          text = path.read_text(encoding='utf-8')
          marker = '\\input{06_direct_local_calculus}'
          label = '\\label{tab:finite-enclosure-subcases}'
          if label in text:
              raise SystemExit('finite-enclosure summary table already exists')
          if marker not in text:
              raise SystemExit('insertion marker not found')

          table = r'''
          \subsection{Finite-enclosure case summary}

          Table~\ref{tab:finite-enclosure-subcases} records the complete case
          ownership of the third strategy.  The displayed sets are the finite
          center-forced witnesses retained in each normalized subcase; reflected
          and rotated placements are included.  The Vd2 neighboring-midpoint
          rescue and the additional-positive-support branch are not listed,
          because their shorter terminals belong to the trace-length strategy.

          \begingroup
          \scriptsize
          \renewcommand{\arraystretch}{1.08}
          \setlength{\tabcolsep}{3pt}
          \begin{longtable}{@{}p{.20\textwidth}p{.34\textwidth}p{.37\textwidth}@{}}
          \caption{Finite-enclosure subcases.  The first column records
          $(N_{\mathrm{gap}},N_+,(d,t))$ together with any necessary center or
          placement refinement.  Gap endpoints are included whenever a gap is
          displayed.}
          \label{tab:finite-enclosure-subcases}\\
          \toprule
          normalized subcase&center-forced finite set&enclosure terminal\\
          \midrule
          \endfirsthead
          \multicolumn{3}{c}{\tablename\ \thetable\ continued}\\
          \toprule
          normalized subcase&center-forced finite set&enclosure terminal\\
          \midrule
          \endhead
          \midrule
          \multicolumn{3}{r}{continued on the next page}\\
          \endfoot
          \bottomrule
          \endlastfoot

          $N_{\mathrm{gap}}=0$, $N_+=1$, $(d,t)=(0,0)$
          &the radial disk $\mathcal D_\eta$ and the three strict-supercritical
          frontier points $Q_-,Q_0,Q_+$
          &the exact nine-point support-cap theorem\\

          $N_{\mathrm{gap}}=1$, $N_+=0$, $(d,t)=(0,0)$,
          CE1 or CE2
          &$\mathcal D_{h(1-c_*)}$ and the complementary gap
          $J(p,q)$, where $c_*=c_{\max}(p,q)$
          &common-pair radial forcing followed by the complementary-gap
          enclosure theorem\\

          $N_{\mathrm{gap}}=2$, $N_+\in\{0,1\}$, $(d,t)=(0,0)$,
          CE2
          &$D_2,D_4$ and the two center-forced gap segments
          &the CE2 short-ray theorem: one of $D_2,D_4$ lies beyond the
          corresponding transverse center exit\\

          $N_{\mathrm{gap}}=1$, $N_+=0$,
          $(d,t)=(0,1)$ or $(0,2)$
          &the type-aware radial hexagon and the complementary gap
          &neighbor capacities are dominated by the common $c_{\max}$;
          apply the complementary-gap theorem\\

          $N_{\mathrm{gap}}=2$, $N_+=0$,
          $(d,t)=(0,1)$ or $(0,2)$, CE2
          &$D_2,D_4$ with the permitted T3-like neighbor terms and both gaps
          &common-pair domination followed by the CE2 short-ray theorem\\

          $N_{\mathrm{gap}}=1$, $N_+=1$, $(d,t)=(0,0)$, CE1
          &$K_{410}=\{O,M_0,X(\ell),X(r),P_0,\ldots,P_5\}$
          &the direct CE1 reverse actual-reach certificate; no formal transfer
          iterate is introduced\\

          $N_{\mathrm{gap}}=1$, $N_+=1$, $(d,t)=(0,0)$, CE2
          &the same anisotropic set $K_{410}$
          &the direct one-site radial-threshold dichotomy at $T_4$ or $T_2$\\

          $N_{\mathrm{gap}}=2$, $N_+=1$, $(d,t)=(0,0)$, CE2
          &$D_2,D_4$ and both gaps
          &the CE2 short-ray theorem; the criticality of $T_0$ is irrelevant\\

          $N_{\mathrm{gap}}=1$, $N_+=1$, $(d,t)=(0,1)$,
          CE1 or CE2
          &the O-side T3-like endpoint $P_T$, the gap endpoints, and the
          ordinary path radial endpoints
          &the direct adjacent-rescuer inequality and the four-role boundary
          path budget\\

          $N_{\mathrm{gap}}=2$, $N_+=1$, $(d,t)=(0,1)$, CE2
          &$D_2,D_4$ with the type-aware T3-like neighbor capacity and both
          gaps
          &the CE2 short-ray theorem\\

          $N_+ =1$, $(d,t)=(1,0)$, CE2;
          the Vd role is adjacent to supercritical $T_0$
          &one radial point $D_2$ defined by the maximum of the Vd neighbor
          reach and the following own-ray reach
          &direct separation of $D_2$ from the CE2 exit on $r_2$\\

          $N_+ =1$, $(d,t)=(1,0)$, CE2;
          the Vd role is nonadjacent to supercritical $T_0$
          &the Vd-specific radial point $D_\tau$
          &the Vd corner margin places $D_\tau$ beyond the corresponding
          center exit\\

          $N_+ =1$, $(d,t)=(1,0)$, CE2;
          $T_0$ is Vd1 and rescues a neighboring midpoint
          &the O-side supported-trace endpoint $P_{\mathrm{Vd1}}$, the gap
          endpoints, and the ordinary path radial endpoints
          &the direct Vd1 adjacent-rescuer inequality and boundary path budget\\

          $N_+ =1$, $(d,t)=(1,0)$, CE2;
          the Vd1--supercritical pair is away from $T_0$
          &the recomputed all-Vd0 witness set after the two-chart replacement
          &output gap rank zero uses the trace-length terminal; ranks one and
          two use the complementary-gap and short-ray theorems, respectively\\
          \end{longtable}
          \endgroup

          '''

          text = text.replace(marker, table + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/add-finite-enclosure-summary-table.yml

      - name: Install pinned audit dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-proof.txt

      - name: Verify source interfaces
        run: |
          set -euo pipefail
          python tools/generate_active_dependency_graph.py --check
          python tools/generate_proof_manifest.py --check
          python tools/proof_lint.py
          python tools/verify_strategy2_pure_algebra.py
          python tools/verify_strategy2_spec_sync.py
          git diff --check

      - name: Replay exact finite-enclosure certificate
        working-directory: proof/3XXX_CE0/31XX_Nplus1/310X_all_Vd0/3105X_self_contained_direct_Vd0_nine_point/3105X_computation
        run: |
          set -euo pipefail
          python verify_mixed_overlap_core_derivation.py
          python verify_global_core_positivity.py

      - name: Build consolidated paper twice in pinned TeX Live 2025
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80
        with:
          docker_image: >-
            ghcr.io/xu-cheng/texlive-historic-debian:2025@sha256:d3e42adc0c8d84bc913bfc33571feaf7037616260a771bb6f027504661568bf6
          run: |
            set -euo pipefail
            export SOURCE_DATE_EPOCH=946684800
            export FORCE_SOURCE_DATE=1
            export TZ=UTC
            cd arrange/paper_draft

            build_pdf() {
              local output="$1"
              local log_copy="$2"
              rm -f main.pdf main.aux main.fdb_latexmk main.fls main.log \
                main.out main.toc main.xdv main.synctex.gz
              latexmk -xelatex -interaction=nonstopmode -halt-on-error \
                -file-line-error main.tex
              if grep -Eq 'LaTeX Warning: (Reference .* undefined|There were undefined references|Label .* multiply defined)' main.log; then
                echo 'Undefined or multiply-defined references found.' >&2
                exit 1
              fi
              if grep -Eq 'Overfull \\hbox|Overfull \\vbox' main.log; then
                echo 'Overfull horizontal or vertical boxes found.' >&2
                grep -E 'Overfull \\hbox|Overfull \\vbox' main.log >&2
                exit 1
              fi
              cp main.pdf "$output"
              cp main.log "$log_copy"
            }

            build_pdf main.rebuilt1.pdf main.rebuilt1.log
            build_pdf main.rebuilt2.pdf main.rebuilt2.log
            cp main.rebuilt2.pdf main.pdf
            cp main.rebuilt2.log main.log
            rm -f main.aux main.fdb_latexmk main.fls main.out main.toc \
              main.xdv main.synctex.gz

      - name: Audit PDF and refresh metadata
        run: |
          set -euo pipefail
          python tools/compare_pdfs_semantically.py \
            arrange/paper_draft/main.rebuilt1.pdf \
            arrange/paper_draft/main.rebuilt2.pdf --dpi 144
          python - <<'PY'
          from pathlib import Path
          import fitz
          pdf = Path('arrange/paper_draft/main.pdf')
          pages = fitz.open(pdf).page_count
          print(f'Consolidated paper pages: {pages}')
          if not 84 <= pages <= 104:
              raise SystemExit(f'Expected 84--104 pages; got {pages}')
          PY
          python tools/verify_pdf_render.py arrange/paper_draft/main.pdf
          python tools/generate_verification_summary.py
          rm -f \
            arrange/paper_draft/main.rebuilt1.pdf \
            arrange/paper_draft/main.rebuilt2.pdf \
            arrange/paper_draft/main.rebuilt1.log \
            arrange/paper_draft/main.rebuilt2.log
          git diff --check

      - name: Commit and push table and rebuilt PDF
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add finite-enclosure subcase summary table'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"

      - name: Dispatch full verification on final branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run proof-ci.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: finite-enclosure-summary-paper
          path: |
            arrange/paper_draft/main.pdf
            arrange/CURRENT_VERIFICATION_SUMMARY.txt
            arrange/paper_draft/main.log
          if-no-files-found: error
