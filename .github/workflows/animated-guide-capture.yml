name: Capture and validate animated proof guide
on:
  push:
    branches: [chatgpt/animated-proof-guide-20260916132528]
    paths:
      - .github/workflows/animated-guide-capture.yml
      - interactive/animated_proof_guide/.delivery-*
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Restore exactly reviewed sources and audit transport
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json, pathlib, shutil
          root=pathlib.Path('interactive/animated_proof_guide')
          audit=pathlib.Path('/tmp/guide-input-audit'); audit.mkdir()
          parts={}
          for i in range(5):
              name=f'.delivery-{i:02}.b64'
              shutil.copy2(root/name,audit/name)
              parts[name]=(root/name).read_text().strip()
          correction=root/'.delivery-corrections.json'
          if correction.exists():
              shutil.copy2(correction,audit/correction.name)
              patches=json.loads(correction.read_text())
              for name in parts:
                  for item in sorted((p for p in patches if p['part']==name),key=lambda x:x['start'],reverse=True):
                      assert parts[name][item['start']:item['end']]==item['old']
                      parts[name]=parts[name][:item['start']]+item['new']+parts[name][item['end']:]
          compressed=base64.b64decode(''.join(parts.values()),validate=True)
          assert hashlib.sha256(compressed).hexdigest()=='1868483493a02b508b629c0d3b08f71828ad782445015f81bb9303132eeafc13', 'Source transport hash mismatch'
          data=gzip.decompress(compressed)
          assert hashlib.sha256(data).hexdigest()=='eb69c05daf53e43734564d4a15cb2a5fa23e8a3b49faed0d62bacc7ecbc642e1'
          files=json.loads(data)
          allowed={'README.md','interactive/README.md','.github/workflows/ci.yml'}|{str(root/p) for p in ['README.md','requirements.txt','browser_qa.py','build.py','capture.py','cases.json','check.py','examples.cjs']}
          assert set(files)==allowed
          for name,text in files.items():
              path=pathlib.Path(name); assert not path.is_symlink()
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(text);path.chmod(0o644)
          print('Restored 11 reviewed source files; both SHA-256 checks passed.')
          PY
      - name: Install pinned capture and audit dependencies
        run: |
          python -m pip install --disable-pip-version-check -r arrange/_support/requirements.txt -r interactive/animated_proof_guide/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Build pinned visualizer and checked examples
        run: |
          git clone --quiet https://github.com/jcpaik/hexagon-cover-visual.git /tmp/atlas-visualizer
          git -C /tmp/atlas-visualizer checkout 1cd468b26aed30d5ddcf1ffa501805bf9720482c
          cd /tmp/atlas-visualizer
          npm ci
          npm run build
          npx tsc --noEmit false --module CommonJS --moduleResolution node --outDir /tmp/atlas-cjs
          cd "$GITHUB_WORKSPACE"
          node interactive/animated_proof_guide/examples.cjs /tmp/atlas-cjs /tmp/atlas-examples.json
      - name: Capture the live Surge application
        run: |
          python interactive/animated_proof_guide/capture.py --examples /tmp/atlas-examples.json --output interactive/animated_proof_guide --expected-dist /tmp/atlas-visualizer/dist/assets
      - name: Build and validate offline HTML, GIFs, and case mapping
        run: |
          python interactive/animated_proof_guide/build.py
          python interactive/animated_proof_guide/check.py --require-live
          python interactive/animated_proof_guide/browser_qa.py --folder interactive/animated_proof_guide --output /tmp/guide-qa
      - name: Preserve proof sources and replay exact certificates
        run: |
          python proof/check.py
          python arrange/_support/verify_inline_proofs.py
          python arrange/_support/verify_readability_preservation.py
          (cd proof/3XXX_CE0/31XX_Nplus1/310X_all_Vd0/3105X_self_contained_direct_Vd0_nine_point/3105X_computation && python verify_mixed_overlap_core_derivation.py && python verify_global_core_positivity.py)
          python interactive/generate.py --dependency-graph --check
          python interactive/generate.py --trace-assets --check
          python interactive/check.py
          git diff --check
      - name: Package validated output without publishing
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,shutil
          root=pathlib.Path('interactive/animated_proof_guide')
          capture=json.loads((root/'capture.json').read_text())
          qa=json.loads(pathlib.Path('/tmp/guide-qa/browser-checks.json').read_text())
          report='''# Animated guide validation\n\nThe read-only capture job completed all checks below before packaging.\n\n- 39 distinct GIFs, 47 entries, 546 rendered states.\n- Real live Surge browser captures; deployed JavaScript bytes match the pinned visualizer build.\n- All GIFs contain 14 frames, with matching posters and importable JSON snapshots.\n- Every Strategy 3 frame has six feasible local source families and valid construction checks.\n- Full witness enclosures, D inequalities, F easy/hard ranges, and contact normals checked numerically.\n- Both replacement charts, original supplier intervals, boundary-only cyclic example, raw normalization, and skeleton budget checked.\n- Desktop/mobile images, manual play/pause, search, chapter filter, deep links, and no horizontal overflow passed.\n- No browser JavaScript errors or failed guide asset requests.\n- Existing proof interfaces, inline proof order, readability preservation, exact zero-gap certificates, dependency graph, trace assets, and interactive-page audits passed.\n\nThese checks validate the explanatory assets, not new mathematical proofs. Floating-point checks do not replace the exact certificates. No proof or manuscript source is changed. Clean manuscript rebuilds and final remote publication are verified separately by the repository pull-request workflow.\n\n'''
          report+=f"Proof base: `3b927c996d7641b20887dc56c1fa741cac674256`.\n\nVisualizer: `1cd468b26aed30d5ddcf1ffa501805bf9720482c`.\n\nCapture workflow run: `{os.environ['GITHUB_RUN_ID']}`.\n\nSource payload SHA-256: `eb69c05daf53e43734564d4a15cb2a5fa23e8a3b49faed0d62bacc7ecbc642e1`.\n"
          (root/'VALIDATION.md').write_text(report)
          output=pathlib.Path('/tmp/guide-delivery'); delivery=output/'delivery';delivery.mkdir(parents=True)
          paths=[pathlib.Path(p) for p in ['README.md','interactive/README.md','.github/workflows/ci.yml']]
          for path in root.rglob('*'):
              if not path.is_file() or any(p.startswith('.') or p=='__pycache__' for p in path.relative_to(root).parts):continue
              if path.suffix not in {'.md','.txt','.py','.cjs','.json','.html','.gif','.png'}:raise ValueError(str(path))
              paths.append(path)
          manifest=[]
          for path in sorted(paths):
              assert not path.is_symlink()
              data=path.read_bytes();target=delivery/path;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data);target.chmod(0o644)
              manifest.append({'path':str(path),'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'gitBlob':hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest(),'mode':'100644'})
          (output/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          shutil.copytree('/tmp/guide-qa',output/'qa')
          shutil.copy2('/tmp/atlas-examples.json',output/'validated-examples.json')
          print('MANIFEST_SHA256',hashlib.sha256((output/'manifest.json').read_bytes()).hexdigest())
          print('DELIVERY_FILES',len(manifest))
          PY
      - name: Upload reviewed-input audit even if capture fails
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: animated-guide-input-audit
          path: /tmp/guide-input-audit
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload complete validated guide for inspection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: animated-proof-guide-verified
          path: /tmp/guide-delivery
          include-hidden-files: true
          if-no-files-found: error
