name: Apply finite-enclosure figure revision

on:
  push:
    branches:
      - No-more-strategy-2
    paths:
      - '.github/workflows/apply-finite-enclosure-figures.yml'
      - 'tools/apply_finite_enclosure_figures.py'
      - 'arrange/paper_draft/figures/finite_enclosure/**'

permissions:
  contents: write

concurrency:
  group: apply-finite-enclosure-figures-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_DATE_EPOCH: '946684800'
  FORCE_SOURCE_DATE: '1'
  TZ: UTC

jobs:
  apply-build-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout target branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install audit dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-proof.txt
          python -m pip install --disable-pip-version-check 'mistune==3.1.3'

      - name: Apply the surgical source revision
        run: |
          set -euo pipefail
          python tools/apply_finite_enclosure_figures.py
          # The repository lint correctly forbids permanent write-enabled workflows.
          # Delete this one-shot workflow from the working tree before the audit;
          # the current run continues, and the final commit keeps the deletion.
          rm -f .github/workflows/apply-finite-enclosure-figures.yml
          git diff --check

      - name: Audit proof and reader interfaces
        run: |
          set -euo pipefail
          python tools/proof_lint.py
          python tools/verify_readable_additive.py
          python tools/generate_readable_dependency_graph.py --check
          python tools/verify_readable_html.py
          git diff --check

      - name: Build both papers in pinned TeX Live 2025
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80
        with:
          docker_image: >-
            ghcr.io/xu-cheng/texlive-historic-debian:2025@sha256:d3e42adc0c8d84bc913bfc33571feaf7037616260a771bb6f027504661568bf6
          run: |
            set -euo pipefail
            export SOURCE_DATE_EPOCH=946684800
            export FORCE_SOURCE_DATE=1
            export TZ=UTC

            cd arrange/paper_draft
            rm -f main.pdf main.aux main.fdb_latexmk main.fls main.log \
              main.out main.toc main.xdv main.synctex.gz
            latexmk -xelatex -interaction=nonstopmode -halt-on-error \
              -file-line-error main.tex
            if grep -Eq 'LaTeX Warning: (Reference .* undefined|There were undefined references|Label .* multiply defined)' main.log; then
              echo 'Undefined or multiply-defined references in canonical paper.' >&2
              exit 1
            fi
            if grep -Eq 'Overfull \\hbox|Overfull \\vbox' main.log; then
              echo 'Overfull box in canonical paper.' >&2
              grep -E 'Overfull \\hbox|Overfull \\vbox' main.log >&2
              exit 1
            fi
            rm -f main.aux main.fdb_latexmk main.fls main.log main.out \
              main.toc main.xdv main.synctex.gz

            cd ../readable_paper
            ./build.sh

      - name: Verify generated PDFs and page counts
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import fitz

          limits = {
              Path('arrange/paper_draft/main.pdf'): (84, 104),
              Path('arrange/readable_paper/main.pdf'): (85, 110),
          }
          for path, (lo, hi) in limits.items():
              if not path.is_file():
                  raise SystemExit(f'missing generated PDF: {path}')
              pages = fitz.open(path).page_count
              print(f'{path}: {pages} pages')
              if not lo <= pages <= hi:
                  raise SystemExit(
                      f'unexpected page count for {path}: {pages}; expected {lo}--{hi}'
                  )
          PY
          python tools/verify_pdf_render.py arrange/paper_draft/main.pdf
          python tools/verify_pdf_render.py arrange/readable_paper/main.pdf
          python tools/generate_verification_summary.py
          git diff --check

      - name: Commit the source revision and rebuilt PDFs
        run: |
          set -euo pipefail
          target_branch="$GITHUB_REF_NAME"
          source_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote origin "refs/heads/$target_branch" | awk '{print $1}')"
          if [ -z "$remote_sha" ]; then
            echo "remote branch does not exist: $target_branch" >&2
            exit 1
          fi
          if [ "$source_sha" != "$remote_sha" ]; then
            echo "$target_branch advanced during the build; refusing a stale push" >&2
            exit 1
          fi

          rm -f \
            .github/workflows/apply-finite-enclosure-figures.yml \
            tools/apply_finite_enclosure_figures.py

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Add explanatory finite-enclosure figures'
          git push origin "HEAD:refs/heads/$target_branch"
