name: Apply full repository repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-full-repository-repair.yml
      - 'tools/full_repository_repair_bundle.part*.b64'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: full-repository-repair-main
  cancel-in-progress: false

env:
  SOURCE_DATE_EPOCH: '946684800'
  FORCE_SOURCE_DATE: '1'
  TZ: UTC

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0

      - name: Apply audited repair bundle and remove obsolete sources
        run: |
          set -euo pipefail
          cat tools/full_repository_repair_bundle.part*.b64 \
            | base64 --decode > /tmp/full_repository_repair_bundle.tar.gz
          echo '09f59c0738ef0f391cd2f4f5aa0e4e8e6b8aa30f90aeda230968f0f59500ae12  /tmp/full_repository_repair_bundle.tar.gz' \
            | sha256sum -c -
          tar -xzf /tmp/full_repository_repair_bundle.tar.gz -C .
          rm -f \
            .github/workflows/export-repair-snapshot.yml \
            arrange/20260802_verification_summary.txt \
            arrange/final_audit_repair_failure.log \
            tools/apply_final_audit_repair_followup.py \
            tools/apply_final_audit_repairs.py \
            tools/apply_strategy2_optimization_extraction.py \
            tools/finalize_strategy2_split_provenance.py
          chmod +x tools/check_pdf_layout.py tools/check_strategy2_registry.py \
            tools/write_verification_summary.py
          git diff --check

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install pinned proof dependency
        run: python -m pip install --disable-pip-version-check -r requirements-proof.txt

      - name: Regenerate and verify the active proof graph
        run: |
          set -euo pipefail
          python tools/generate_active_dependency_graph.py
          python tools/generate_proof_manifest.py
          python tools/generate_active_dependency_graph.py --check
          python tools/generate_proof_manifest.py --check
          python tools/proof_lint.py
          python tools/check_strategy2_registry.py
          git diff --check

      - name: Replay exact Strategy 4 derivation and positivity certificates
        working-directory: proof/3XXX_CE0/31XX_Nplus1/310X_all_Vd0/3105X_self_contained_direct_Vd0_nine_point/3105X_computation
        run: |
          set -euo pipefail
          python verify_mixed_overlap_core_derivation.py | tee /tmp/mixed-derivation.log
          python verify_global_core_positivity.py | tee /tmp/global-positivity.log

      - name: Elaborate pinned Strategy 2 Lean statements
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: formalization/strategy2_optimization
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Compile paper and electronic supplement in pinned TeX Live
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80
        with:
          texlive_version: 2025
          os: debian
          scheme: full
          run: |
            set -euo pipefail
            cd arrange/paper_draft
            rm -f main.pdf main.aux main.fdb_latexmk main.fls main.log main.out main.toc main.xdv main.synctex.gz
            latexmk -xelatex -interaction=nonstopmode -halt-on-error -file-line-error main.tex
            cd ../supplements
            rm -f strategy2_407X_supplement.pdf \
              strategy2_407X_supplement.aux strategy2_407X_supplement.fdb_latexmk \
              strategy2_407X_supplement.fls strategy2_407X_supplement.log \
              strategy2_407X_supplement.out strategy2_407X_supplement.toc \
              strategy2_407X_supplement.xdv strategy2_407X_supplement.synctex.gz
            latexmk -xelatex -interaction=nonstopmode -halt-on-error -file-line-error \
              strategy2_407X_supplement.tex

      - name: Install PDF rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Verify references, layout, statement registry, and current digests
        run: |
          set -euo pipefail
          test -s formalization/strategy2_optimization/lake-manifest.json
          for log in \
            arrange/paper_draft/main.log \
            arrange/supplements/strategy2_407X_supplement.log
          do
            if grep -Eq 'LaTeX Warning: (Reference .* undefined|There were undefined references|Label .* multiply defined)' "$log"; then
              echo "undefined or multiply-defined references in $log" >&2
              exit 1
            fi
          done
          python tools/check_pdf_layout.py arrange/paper_draft/main.pdf \
            --log arrange/paper_draft/main.log
          python tools/check_pdf_layout.py \
            arrange/supplements/strategy2_407X_supplement.pdf \
            --log arrange/supplements/strategy2_407X_supplement.log
          python tools/check_strategy2_registry.py
          python tools/write_verification_summary.py
          python tools/write_verification_summary.py --check
          python tools/generate_active_dependency_graph.py --check
          python tools/generate_proof_manifest.py --check
          python tools/proof_lint.py

      - name: Assemble archival release bundle
        run: |
          set -euo pipefail
          rm -rf /tmp/hexagon-cover-proof-release
          mkdir -p /tmp/hexagon-cover-proof-release
          cp arrange/paper_draft/main.pdf /tmp/hexagon-cover-proof-release/
          cp arrange/supplements/strategy2_407X_supplement.pdf /tmp/hexagon-cover-proof-release/
          cp arrange/CURRENT_VERIFICATION_SUMMARY.txt REPRODUCE.md LICENSE \
            /tmp/hexagon-cover-proof-release/
          cp proof/407X_PROVENANCE.json proof/3105X_CERTIFICATE_PROVENANCE.json \
            /tmp/hexagon-cover-proof-release/
          cp -R proof/4XXX_CE1CE2/40XX_Nplus0/407X_T3_like_no_Vd1Vd2 \
            /tmp/hexagon-cover-proof-release/407X_sources
          cp -R proof/3XXX_CE0/31XX_Nplus1/310X_all_Vd0/3105X_self_contained_direct_Vd0_nine_point/3105X_computation \
            /tmp/hexagon-cover-proof-release/strategy4_certificate
          tar -C /tmp -czf /tmp/hexagon-cover-proof-release.tar.gz \
            hexagon-cover-proof-release
          sha256sum /tmp/hexagon-cover-proof-release.tar.gz \
            > /tmp/hexagon-cover-proof-release.tar.gz.sha256

      - name: Commit and push the completed repair directly to main
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/apply-full-repository-repair.yml \
            .github/workflows/export-repair-snapshot.yml \
            tools/full_repository_repair_bundle.tar.gz \
            tools/full_repository_repair_bundle.part*.b64
          rm -f arrange/paper_draft/main.aux arrange/paper_draft/main.fdb_latexmk \
            arrange/paper_draft/main.fls arrange/paper_draft/main.log \
            arrange/paper_draft/main.out arrange/paper_draft/main.toc \
            arrange/paper_draft/main.xdv arrange/paper_draft/main.synctex.gz
          rm -f arrange/supplements/strategy2_407X_supplement.aux \
            arrange/supplements/strategy2_407X_supplement.fdb_latexmk \
            arrange/supplements/strategy2_407X_supplement.fls \
            arrange/supplements/strategy2_407X_supplement.log \
            arrange/supplements/strategy2_407X_supplement.out \
            arrange/supplements/strategy2_407X_supplement.toc \
            arrange/supplements/strategy2_407X_supplement.xdv \
            arrange/supplements/strategy2_407X_supplement.synctex.gz
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git status --short
          git commit -m 'repair Strategy 2 interfaces and release verification'
          git push origin HEAD:main

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: full-repository-repair-result
          path: |
            arrange/paper_draft/main.pdf
            arrange/supplements/strategy2_407X_supplement.pdf
            arrange/CURRENT_VERIFICATION_SUMMARY.txt
            formalization/strategy2_optimization/lake-manifest.json
            /tmp/hexagon-cover-proof-release.tar.gz
            /tmp/hexagon-cover-proof-release.tar.gz.sha256
            /tmp/mixed-derivation.log
            /tmp/global-positivity.log
          if-no-files-found: warn
