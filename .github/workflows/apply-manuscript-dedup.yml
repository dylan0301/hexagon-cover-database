name: Apply manuscript deduplication

on:
  push:
    branches:
      - agent/manuscript-unification
    paths:
      - arrange/paper_draft/_apply_unification_edits.py
      - .github/workflows/apply-manuscript-dedup.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/manuscript-unification
          fetch-depth: 0

      - name: Apply asserted transformations
        run: python arrange/paper_draft/_apply_unification_edits.py

      - name: Commit transformed sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Apply manuscript deduplication'
            git push origin HEAD:agent/manuscript-unification
          fi
