name: Apply paper interface revision

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply reader-interface revision
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/agent_paper_readability.py
          python3 .github/scripts/agent_paper_readability_followup.py
          git diff --check

      - name: Commit revised mathematical sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md arrange proof
          if git diff --cached --quiet; then
            echo "No mathematical source changes were produced" >&2
            exit 1
          fi
          git commit -m "Refine V-triangle terminology and appendix interfaces"
          git push origin HEAD:main
