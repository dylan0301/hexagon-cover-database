name: Apply 2026-08-02 proof repair

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/repair_source/**
      - .github/workflows/apply-proof-repair.yml

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply, verify, compile, and record result
        shell: bash
        run: |
          set +e
          exec > >(tee /tmp/repair.log) 2>&1

          echo 'Transparent repair-source checksums:'
          sha256sum tools/repair_source/part*
          cat tools/repair_source/part* > tools/apply_20260802_repair.py
          status=$?

          if [ "$status" -eq 0 ]; then
            python -m py_compile tools/apply_20260802_repair.py
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/apply_20260802_repair.py
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/proof_lint.py
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            pip install sympy
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            (
              cd proof/3XXX_CE0/31XX_Nplus1/310X_all_Vd0/3105X_self_contained_direct_Vd0_nine_point/3105X_computation
              python verify_mixed_overlap_core_derivation.py
              python verify_global_core_positivity.py
            )
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            sudo apt-get update
            sudo apt-get install -y latexmk texlive-xetex texlive-latex-extra texlive-fonts-recommended poppler-utils
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            (
              cd arrange/paper_draft
              latexmk -xelatex -interaction=nonstopmode -halt-on-error main.tex
              pdfinfo main.pdf | tee /tmp/pdfinfo.txt
              pages=$(awk '/^Pages:/ {print $2}' /tmp/pdfinfo.txt)
              test -n "$pages"
              mkdir -p /tmp/rendered
              pdftoppm -f 1 -singlefile -png -r 96 main.pdf /tmp/rendered/first
              pdftoppm -f "$pages" -singlefile -png -r 96 main.pdf /tmp/rendered/last
              test -s /tmp/rendered/first.png
              test -s /tmp/rendered/last.png
              python - "$pages" <<'PY'
          from pathlib import Path
          import sys
          pages = sys.argv[1]
          path = Path('../../arrange/20260802_repair_and_reaudit.md')
          text = path.read_text(encoding='utf-8').replace('BUILD_PAGE_COUNT', pages)
          path.write_text(text, encoding='utf-8')
          PY
            )
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python tools/proof_lint.py
            status=$?
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          if [ "$status" -eq 0 ]; then
            rm -rf tools/repair_source tools/repair_payload tools/apply_20260802_repair.py
            rm -f .github/workflows/apply-proof-repair.yml
            rm -f arrange/repair_failure.log
            git add -A
            git commit -m 'repair 4147 and consolidate proof verification'
            git push origin HEAD:main
            exit 0
          fi

          cp /tmp/repair.log arrange/repair_failure.log
          git add arrange/repair_failure.log
          git commit -m 'record proof repair workflow failure' || true
          git push origin HEAD:main || true
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repair-validation-output
          path: |
            arrange/paper_draft/main.pdf
            arrange/repair_failure.log
            /tmp/repair.log
            /tmp/rendered/first.png
            /tmp/rendered/last.png
          if-no-files-found: warn
