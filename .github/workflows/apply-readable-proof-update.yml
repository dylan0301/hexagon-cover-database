name: Apply reader-oriented proof architecture and dependency graph
# Transient write workflow. GitHub Actions pushes only ordinary repository
# content; the connected GitHub identity installs/removes workflow files after
# this audited build succeeds.

on:
  push:
    branches: [No-more-strategy-2]
    paths:
      - '.github/workflows/apply-readable-proof-update.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: apply-readable-proof-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_DATE_EPOCH: '946684800'
  FORCE_SOURCE_DATE: '1'
  TZ: UTC

jobs:
  apply-build-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Decode and apply the audited additive payload
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor 048320ccade291fc828c1b51fff167ebb7cb29cc HEAD; then
            echo 'The audited source head is not an ancestor of this run.' >&2
            exit 1
          fi
          mapfile -t chunks < <(LC_ALL=C find tools -maxdepth 1 -type f -name '.readable_update_payload_*.txt' | LC_ALL=C sort)
          if [ "${#chunks[@]}" -ne 16 ]; then
            printf 'Expected 16 payload chunks; found %s\n' "${#chunks[@]}" >&2
            printf '%s\n' "${chunks[@]}" >&2
            exit 1
          fi
          cat "${chunks[@]}" > /tmp/readable-update.b64
          base64 --decode /tmp/readable-update.b64 > /tmp/readable-update.tar.xz
          echo '36846b07448f85dcf3143b0c1960dfd819b578dad65e28d6c7649b2ff75e267c  /tmp/readable-update.tar.xz' | sha256sum --check
          python - <<'PY'
          import tarfile
          archive = '/tmp/readable-update.tar.xz'
          with tarfile.open(archive, 'r:xz') as tf:
              bad = [m.name for m in tf.getmembers()
                     if m.name.startswith('/') or '..' in m.name.split('/')]
              if bad:
                  raise SystemExit('unsafe archive paths: ' + ', '.join(bad))
              print(f'audited payload members: {len(tf.getmembers())}')
          PY
          tar -xJf /tmp/readable-update.tar.xz
          rm -f tools/.readable_update_payload_*.txt
          # GITHUB_TOKEN cannot create or update workflow files in this repo.
          # Keep this transient trigger unchanged during the Actions push and
          # omit the permanent workflow; the connected GitHub identity performs
          # those two workflow-file operations after the audited push succeeds.
          rm -f .github/workflows/readable-paper-rebuild.yml

      - name: Install graph and PDF-audit dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-proof.txt
          python -m pip install --disable-pip-version-check 'mistune==3.1.3'

      - name: Generate and audit the interactive dependency graph
        run: |
          set -euo pipefail
          python tools/verify_readable_additive.py
          python tools/generate_readable_dependency_graph.py
          python tools/generate_readable_dependency_graph.py --check
          python tools/verify_readable_html.py
          transient_workflow='.github/workflows/apply-readable-proof-update.yml'
          transient_backup='/tmp/apply-readable-proof-update.yml'
          mv "$transient_workflow" "$transient_backup"
          if ! python tools/proof_lint.py; then
            mv "$transient_backup" "$transient_workflow"
            exit 1
          fi
          mv "$transient_backup" "$transient_workflow"
          git diff --check
          sha256sum \
            interactive/readable_proof_dependency_graph.html \
            interactive/readable_proof_dependency_data.json \
            interactive/assets/readable_dependency/zero_gap_nine_point_witness.png

      - name: Create the local source-and-graph commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add reader-oriented proof architecture and dependency graph'

      - name: Build the reader-oriented paper in pinned TeX Live 2025
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80
        with:
          docker_image: >-
            ghcr.io/xu-cheng/texlive-historic-debian:2025@sha256:d3e42adc0c8d84bc913bfc33571feaf7037616260a771bb6f027504661568bf6
          run: |
            set -euo pipefail
            export SOURCE_DATE_EPOCH=946684800
            export FORCE_SOURCE_DATE=1
            export TZ=UTC
            cd arrange/readable_paper
            ./build.sh

      - name: Audit the compiled paper
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import fitz
          pdf = Path('arrange/readable_paper/main.pdf')
          if not pdf.is_file():
              raise SystemExit('readable paper was not generated')
          pages = fitz.open(pdf).page_count
          print(f'Readable paper pages: {pages}')
          if not 85 <= pages <= 110:
              raise SystemExit(f'Unexpected readable-paper length: {pages}')
          PY
          python tools/verify_pdf_render.py arrange/readable_paper/main.pdf
          git diff --check
          sha256sum arrange/readable_paper/main.pdf

      - name: Amend with the canonical PDF and push the final commit
        run: |
          set -euo pipefail
          trigger_sha="$GITHUB_SHA"
          remote_sha="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          if [ "$remote_sha" != "$trigger_sha" ]; then
            echo "$GITHUB_REF_NAME advanced during the build; refusing a stale push." >&2
            echo "trigger: $trigger_sha" >&2
            echo "remote:  $remote_sha" >&2
            exit 1
          fi
          git add arrange/readable_paper/main.pdf
          git commit --amend --no-edit
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"

      - name: Dispatch full proof verification on the final branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run proof-ci.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reader-oriented-paper-and-dependency-graph
          path: |
            arrange/readable_paper/main.pdf
            arrange/readable_paper/IMPLEMENTATION_REPORT.md
            interactive/readable_proof_dependency_graph.html
            interactive/readable_proof_dependency_data.json
            interactive/assets/readable_dependency/zero_gap_nine_point_witness.png
          if-no-files-found: error
