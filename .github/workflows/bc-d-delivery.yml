name: BC D branch delivery
on:
  push:
    branches: [chatgpt/bc-d-finite-calipers-20260922]
    paths: ['.github/workflows/bc-d-delivery.yml']
permissions:
  contents: read
jobs:
  diagnose:
    if: github.ref == 'refs/heads/chatgpt/bc-d-finite-calipers-20260922'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Compare exact source and line patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,lzma,sys
          print(sys.version)
          folder=Path('arrange/_support/bc_d_transport')
          manifest=json.loads((folder/'manifest.json').read_text())
          archive=base64.b64decode(''.join((folder/p).read_text().strip() for p in manifest['parts']),validate=True)
          assert hashlib.sha256(archive).hexdigest()=='273ae9520cdaa0230851998598533e8ce5e79898be9eebc7b50d713d7ffa6835'
          files=json.loads(lzma.decompress(archive))
          patch=Path('arrange/_support/bc_d_postpatch.json')
          assert hashlib.sha256(patch.read_bytes()).hexdigest()=='ce28dbcb25e80884809e0c51d8fcdd16152af0363f6918a87075c0d5e8519246'
          name='arrange/paper_draft/fixed_witness/D_bc_capacity_envelope.tex'
          v=json.loads(patch.read_text())[name]
          source=files[name]
          print('before',hashlib.sha256(source.encode()).hexdigest(),v['before'])
          assert hashlib.sha256(source.encode()).hexdigest()==v['before']
          lines=source.splitlines(keepends=True)
          for lo,hi,text in reversed(v['edits']):
              print('edit',lo,hi,repr(text))
              assert 0<=lo<=hi<=len(lines)
              lines[lo:hi]=[text]
          content=''.join(lines).encode()
          actual=hashlib.sha256(content).hexdigest()
          print('after',actual,v['after'])
          print('OUTPUT BASE64',base64.b64encode(content).decode())
          assert actual==v['after']
          PY
