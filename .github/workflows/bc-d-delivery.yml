name: BC D branch delivery
on:
  push:
    branches: [chatgpt/bc-d-finite-calipers-20260922]
    paths: ['.github/workflows/bc-d-delivery.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate:
    if: github.ref == 'refs/heads/chatgpt/bc-d-finite-calipers-20260922'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      bundle_sha: ${{ steps.delivery.outputs.bundle_sha }}
      manifest_sha: ${{ steps.delivery.outputs.manifest_sha }}
      final_sha: ${{ steps.delivery.outputs.final_sha }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install audit dependencies
        run: |
          python -m pip install -r arrange/_support/requirements.txt -r interactive/proof_trees/requirements.txt
          cd interactive/proof_trees
          npm install --no-save --no-package-lock --ignore-scripts mathjax-full@3.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bc-d-review
          run-id: 35738552404
          github-token: ${{ github.token }}
          path: /tmp/checked-review
      - name: Authenticate completion scripts and visual-review record
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import hashlib
          for name,expected in {
              'arrange/_support/bc_d_finish.py':'7303222e37fd060cef451e5d7752f3d98dbcf866ac0e435c21b46e788f490c12',
              'arrange/_support/bc_d_review_approval.json':'403f57b696fd3f962e083872902bb28579ed94f0f3fc1dcc250dc06d618c5576',
              'arrange/_support/bc_d_final_review.json':'fedc7eca553c413061afc7d75d4467f4372f28be6d1094f0e6d7ee81438e9262'
          }.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==expected,name
          Path('/tmp/bc_d_finish.py').write_bytes(Path('arrange/_support/bc_d_finish.py').read_bytes())
          PYCODE
      - name: Verify and apply pinned migration
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,lzma,subprocess
          folder=Path('arrange/_support/bc_d_transport')
          manifest=json.loads((folder/'manifest.json').read_text())
          assert manifest['base_commit']=='083d7fc08bf0918547c8d1624407924604b32e04'
          parts=[]
          for name in manifest['parts']:
              assert name in ['part00.b64','part01.b64','part02.b64','part03.b64']
              raw=(folder/name).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==manifest['part_sha256'][name],name
              parts.append(raw.decode().strip())
          encoded=''.join(parts)
          archive=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(archive).hexdigest()=='273ae9520cdaa0230851998598533e8ce5e79898be9eebc7b50d713d7ffa6835'
          files=json.loads(lzma.decompress(archive))
          assert set(files)==set(manifest['files'])
          for name,text in files.items():
              assert name.startswith(('proof/','arrange/','interactive/')) and '..' not in Path(name).parts
              assert hashlib.sha256(text.encode()).hexdigest()==manifest['files'][name],name
          manifest['archive_base64']=encoded
          Path('arrange/_support/bc_d_payload.json').write_text(json.dumps(manifest))
          Path('arrange/_support/bc_d_delivery.py').write_text(files['arrange/_support/bc_d_delivery.py'])
          hotfix=Path('arrange/_support/bc_d_hotfix.py')
          if hotfix.exists():
              subprocess.run(['python',str(hotfix)],check=True)
          Path('/tmp/bc_d_delivery.py').write_bytes(Path('arrange/_support/bc_d_delivery.py').read_bytes())
          subprocess.run(['python','/tmp/bc_d_delivery.py'],check=True)
          p=Path('arrange/_support/bc_d_postpatch.json')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='ce28dbcb25e80884809e0c51d8fcdd16152af0363f6918a87075c0d5e8519246'
          data=json.loads(p.read_text())
          assert len(data)==16
          for name,v in data.items():
              assert name.startswith(('arrange/','interactive/','proof/')) or name=='.github/workflows/ci.yml'
              assert '..' not in Path(name).parts and not Path(name).is_absolute()
              p=Path(name)
              assert hashlib.sha256(p.read_bytes()).hexdigest()==v['before'],name
              lines=p.read_text().splitlines(keepends=True)
              for lo,hi,text in reversed(v['edits']):
                  assert 0<=lo<=hi<=len(lines)
                  lines[lo:hi]=[text]
              content=''.join(lines).encode()
              assert hashlib.sha256(content).hexdigest()==v['after'],name
              p.write_bytes(content)
          final=json.loads(Path('arrange/_support/bc_d_final_review.json').read_text())
          assert len(final)==5
          for name,v in final.items():
              assert name.startswith(('arrange/','interactive/')) and '..' not in Path(name).parts
              p=Path(name);assert hashlib.sha256(p.read_bytes()).hexdigest()==v['before'],name
              text=p.read_text()
              for e in v['replacements']:
                  assert text.count(e['old'])==1,(name,e['old'])
                  text=text.replace(e['old'],e['new'])
              raw=text.encode();assert hashlib.sha256(raw).hexdigest()==v['after'],name
              p.write_bytes(raw)
          subprocess.run(['python','/tmp/bc_d_delivery.py','--baseline'],check=True)
          PY
          python /tmp/bc_d_finish.py prepare /tmp/checked-review
      - name: Generate current interactive views
        run: |
          python interactive/generate.py --dependency-graph
          python interactive/animated_proof_guide/build.py
          python interactive/proof_trees/build.py
      - name: Stage the generated dependency graph as the intended revision
        run: git add -- interactive/readable_proof_dependency_graph.html
      - name: Audit integrated proof and interactive interfaces
        run: |
          set -euo pipefail
          mkdir -p /tmp/bc-d-review
          {
            python proof/check.py
            python arrange/_support/verify_inline_proofs.py
            python arrange/_support/verify_readability_preservation.py
            python interactive/generate.py --dependency-graph --check
            python interactive/generate.py --trace-assets --check
            python interactive/check.py
            python interactive/proof_trees/check.py --html
            python interactive/proof_trees/build.py --check
            python interactive/animated_proof_guide/check.py --require-live
            (cd proof/3XXX_CE0/31XX_Nplus1/310X_all_Vd0/3105X_self_contained_direct_Vd0_nine_point/3105X_computation && python verify_mixed_overlap_core_derivation.py && python verify_global_core_positivity.py)
            git diff --check
            git diff --cached --check
          } 2>&1 | tee /tmp/bc-d-review/source-audit.log
      - name: Audit installed reviewed PDFs
        run: |
          python arrange/_support/verify_pdf_render.py arrange/paper_draft/main.pdf
          python arrange/_support/verify_pdf_render.py arrange/paper_draft/inline_proofs/main.pdf
          python arrange/_support/verify_inline_proofs.py --pdf arrange/paper_draft/inline_proofs/main.pdf
      - name: Create validated source and navigation commits without publication
        id: delivery
        run: python /tmp/bc_d_finish.py commit /tmp/bc-d-published
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bc-d-validated-delivery
          path: /tmp/bc-d-published
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: validate
    if: github.ref == 'refs/heads/chatgpt/bc-d-finite-calipers-20260922'
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          ref: chatgpt/bc-d-finite-calipers-20260922
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bc-d-validated-delivery
          path: /tmp/validated
      - name: Verify manifest, objects, and fast-forward only the task branch
        env:
          EXPECTED_BUNDLE: ${{ needs.validate.outputs.bundle_sha }}
          EXPECTED_MANIFEST: ${{ needs.validate.outputs.manifest_sha }}
          EXPECTED_TIP: ${{ needs.validate.outputs.final_sha }}
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import hashlib
          assert hashlib.sha256(Path('arrange/_support/bc_d_finish.py').read_bytes()).hexdigest()=='7303222e37fd060cef451e5d7752f3d98dbcf866ac0e435c21b46e788f490c12'
          PYCODE
          python arrange/_support/bc_d_finish.py publish /tmp/validated
