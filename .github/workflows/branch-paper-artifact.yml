name: Branch pinned paper artifact

on:
  push:
    branches:
      - agent/paper-notation-midpoint-clarity
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_DATE_EPOCH: '946684800'
  FORCE_SOURCE_DATE: '1'
  TZ: UTC

jobs:
  build:
    name: Build pinned paper artifact
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install pinned audit dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-proof.txt

      - name: Verify proof and source interfaces
        run: |
          set -euo pipefail
          python tools/generate_active_dependency_graph.py --check
          python tools/generate_proof_manifest.py --check
          python tools/proof_lint.py
          python tools/verify_strategy2_pure_algebra.py
          python tools/verify_strategy2_spec_sync.py
          git diff --check

      - name: Build with pinned TeX Live 2025
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80
        with:
          docker_image: >-
            ghcr.io/xu-cheng/texlive-historic-debian:2025@sha256:d3e42adc0c8d84bc913bfc33571feaf7037616260a771bb6f027504661568bf6
          run: |
            set -euo pipefail
            export SOURCE_DATE_EPOCH=946684800
            export FORCE_SOURCE_DATE=1
            export TZ=UTC
            cd arrange/paper_draft
            rm -f main.pdf main.aux main.fdb_latexmk main.fls main.log \
              main.out main.toc main.xdv main.synctex.gz
            latexmk -xelatex -interaction=nonstopmode -halt-on-error \
              -file-line-error main.tex
            if grep -Eq 'LaTeX Warning: (Reference .* undefined|There were undefined references|Label .* multiply defined)' main.log; then
              echo 'Undefined or multiply-defined references found.' >&2
              exit 1
            fi
            if grep -Eq 'Overfull \\hbox|Overfull \\vbox' main.log; then
              grep -E 'Overfull \\hbox|Overfull \\vbox' main.log >&2
              exit 1
            fi

      - name: Verify PDF and write summary
        run: |
          set -euo pipefail
          python tools/verify_pdf_render.py arrange/paper_draft/main.pdf
          python tools/generate_verification_summary.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: branch-pinned-paper
          path: |
            arrange/paper_draft/main.pdf
            arrange/CURRENT_VERIFICATION_SUMMARY.txt
            arrange/paper_draft/main.log
          if-no-files-found: error
