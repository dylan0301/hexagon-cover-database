name: Temporary fixed-witness delivery
on:
  push:
    branches: [chatgpt/fixed-finite-witnesses-20260906020437]
    paths: [.github/workflows/chatgpt-apply-fixed-witnesses.yml]
permissions: {}
concurrency:
  group: fixed-witness-delivery-20260906020437
  cancel-in-progress: false
env:
  SOURCE_DATE_EPOCH: '946684800'
  FORCE_SOURCE_DATE: '1'
  TZ: UTC
jobs:
  export:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact audited base without credentials
        run: |
          set -euo pipefail
          base=a47b162e233e961e8e6e746a4ab987c14638b429
          git merge-base --is-ancestor "$base" "$GITHUB_SHA"
          test "$(git diff --name-only "$base" "$GITHUB_SHA")" = '.github/workflows/chatgpt-apply-fixed-witnesses.yml'
          git update-ref refs/heads/export-fixed-witness-base "$base"
          git bundle create "$RUNNER_TEMP/fixed-witness-base.bundle" refs/heads/export-fixed-witness-base
          git archive --format=zip --output="$RUNNER_TEMP/fixed-witness-base.zip" "$base"
          sha256sum "$RUNNER_TEMP/fixed-witness-base.bundle" "$RUNNER_TEMP/fixed-witness-base.zip" > "$RUNNER_TEMP/base-digests.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fixed-witness-base-20260906020437
          path: |
            ${{ runner.temp }}/fixed-witness-base.bundle
            ${{ runner.temp }}/fixed-witness-base.zip
            ${{ runner.temp }}/base-digests.txt
          if-no-files-found: error
          retention-days: 3
