name: Temporary fixed-witness delivery
on:
  push:
    branches: [chatgpt/fixed-finite-witnesses-20260906020437]
    paths: [.github/workflows/chatgpt-apply-fixed-witnesses.yml]
permissions: {}
concurrency:
  group: fixed-witness-delivery-20260906020437
  cancel-in-progress: false
env:
  SOURCE_DATE_EPOCH: '946684800'
  FORCE_SOURCE_DATE: '1'
  TZ: UTC
  AUDITED_BASE: 'a47b162e233e961e8e6e746a4ab987c14638b429'
  DELIVERY_BRANCH: 'chatgpt/fixed-finite-witnesses-20260906020437'
jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify transport and apply exact source delta
        run: |
          set -euo pipefail
          python - <<'PYAPPLY'
          import base64, hashlib, json, lzma, os, pathlib, stat, subprocess
          root=pathlib.Path.cwd()
          base=os.environ['AUDITED_BASE']; branch=os.environ['DELIVERY_BRANCH']
          def git(*args):
              return subprocess.check_output(['git',*args])
          assert os.environ['GITHUB_REF']=='refs/heads/'+branch
          subprocess.run(['git','merge-base','--is-ancestor',base,os.environ['GITHUB_SHA']],check=True)
          transport=['.github/workflows/chatgpt-apply-fixed-witnesses.yml']+[
              f'.github/_transient/20260906020437/delta-{i}.b64' for i in range(4)]
          changed=git('diff','--name-only',base,os.environ['GITHUB_SHA']).decode().splitlines()
          assert set(changed)==set(transport), changed
          encoded=''.join((root/p).read_text().strip() for p in transport[1:])
          assert hashlib.sha256(encoded.encode()).hexdigest()=='d066eb90483430413283671a92761ed41e30f1b07c2e8d4247fd044fee890060'
          raw=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert len(raw)==143416
          assert hashlib.sha256(raw).hexdigest()=='2bfaf9e88d8c0ef7b647d9a4693d5c199d03840dd02c2a5a6ab81a9486c4a965'
          ops=json.loads(raw); assert len(ops)==35
          pathlib.Path(os.environ['RUNNER_TEMP'],'audited-delta.json').write_bytes(raw)
          subprocess.run(['git','checkout','--detach','--force',base],check=True)
          seen=set()
          for name,old_sha,new_sha,edits in ops:
              p=pathlib.PurePosixPath(name)
              assert name==str(p) and not p.is_absolute() and '..' not in p.parts
              assert name not in seen and '\x00' not in name and not name.startswith('.github/')
              seen.add(name); dest=root/name
              assert all(not q.is_symlink() for q in [dest,*dest.parents])
              old=dest.read_bytes() if dest.exists() else b''
              if old_sha is None:
                  assert not dest.exists(); mode=0o644
              else:
                  assert dest.is_file() and hashlib.sha256(old).hexdigest()==old_sha, name
                  mode=stat.S_IMODE(dest.stat().st_mode)
                  assert mode in (0o644,0o755)
              lines=old.decode('utf-8').splitlines(keepends=True)
              previous=0
              for i,j,replacement in edits:
                  assert isinstance(i,int) and isinstance(j,int) and previous<=i<=j<=len(lines)
                  assert isinstance(replacement,str); previous=j
              for i,j,replacement in reversed(edits):
                  lines[i:j]=[replacement]
              final=''.join(lines).encode('utf-8')
              assert hashlib.sha256(final).hexdigest()==new_sha, name
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(final); dest.chmod(mode)
          eof_fixes={'arrange/paper_draft/alternatives/06_legacy_nonzero_gap_body.tex': ['96e3e0bb98b0c6ca0da6ecfb1e91cc892a4041af812389dfb53d41144611396b', '2e6da625539002a354c37867948263f8ac942be825d3c839b43241729699232d'], 'arrange/paper_draft/fixed_witness/06_fixed_witness_body.tex': ['f67e2eb4359d494c1e5f61d4a9e62d680255aab73289216bac3c940b46fa7f4a', '2c625a9bf83e3318f3555bd1e9caacbcc2a0502f90ba15f7596535efc78f3207'], 'arrange/paper_draft/fixed_witness/06_fixed_zero_gap_coordinates.tex': ['208a4f84b738b90145058c1f2c5a801484211f3b3f02f147b37e5d73b1f963db', 'ad9f752e63b05ad7e971dc7904110510ae04a7cd601c052e366b459d992d6a37']}
          for op in ops:
              if op[0] in eof_fixes:
                  before,after=eof_fixes[op[0]]
                  assert op[2]==before
                  target=root/op[0]; final=target.read_bytes().rstrip(b"\n")+b"\n"
                  assert hashlib.sha256(final).hexdigest()==after
                  target.write_bytes(final); op[2]=after
          pathlib.Path(os.environ["RUNNER_TEMP"],"audited-delta.json").write_text(json.dumps(ops))
          subprocess.run(['git','add','--',*sorted(seen)],check=True)
          print('Applied exactly 35 hash-checked source changes; transient files absent from prospective tree.')
          PYAPPLY
      - name: Run all source and exact-certificate checks
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r arrange/_support/requirements.txt
          python interactive/generate.py --dependency-graph
          git add interactive/readable_proof_dependency_graph.html
          python proof/check.py
          python proof/2XXX_geometric_lemmas/26XX_enclosing_triangle_tools/verify_fixed_witness_identities.py
          cert=proof/3XXX_CE0/31XX_Nplus1/310X_all_Vd0/3105X_self_contained_direct_Vd0_nine_point/3105X_computation
          python "$cert/verify_mixed_overlap_core_derivation.py"
          python "$cert/verify_global_core_positivity.py"
          python interactive/generate.py --dependency-graph --check
          python interactive/generate.py --trace-assets --check
          python interactive/check.py
          git diff --cached --check
      - name: Rebuild canonical manuscript in pinned TeX Live 2025
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80
        with:
          docker_image: >-
            ghcr.io/xu-cheng/texlive-historic-debian:2025@sha256:d3e42adc0c8d84bc913bfc33571feaf7037616260a771bb6f027504661568bf6
          run: |
            set -euo pipefail
            python3 arrange/build.py --all --output-dir arrange/_build
      - name: Validate exact prospective tree and package reviewed artifacts
        run: |
          set -euo pipefail
          cp arrange/_build/canonical.pdf arrange/paper_draft/main.pdf
          chmod 644 arrange/paper_draft/main.pdf
          git add arrange/paper_draft/main.pdf
          python proof/check.py
          python interactive/generate.py --dependency-graph --check
          python interactive/check.py
          python arrange/_support/verify_pdf_render.py arrange/paper_draft/main.pdf
          git diff --cached --check
          python - <<'PYPACK'
          import hashlib,json,os,pathlib,stat,subprocess,zipfile
          import fitz
          root=pathlib.Path.cwd(); base=os.environ['AUDITED_BASE']
          ops=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'audited-delta.json').read_bytes())
          expected={x[0]:x[2] for x in ops}
          for name in ['interactive/readable_proof_dependency_graph.html','arrange/paper_draft/main.pdf']:
              expected[name]=None
          changed=subprocess.check_output(['git','diff','--cached','--name-only',base]).decode().splitlines()
          assert set(changed)==set(expected), (changed,sorted(expected))
          assert not subprocess.check_output(['git','diff','--name-only']).strip(), 'unexpected unstaged changes'
          assert not subprocess.check_output(['git','ls-files','--others','--exclude-standard']).strip(), 'unexpected untracked files'
          entries=[]
          for name in sorted(expected):
              p=root/name
              assert p.is_file() and not p.is_symlink()
              content=p.read_bytes(); digest=hashlib.sha256(content).hexdigest()
              if expected[name] is not None: assert digest==expected[name],name
              stage=subprocess.check_output(['git','ls-files','-s','--',name]).decode().split()
              mode,blob=stage[0:2]; assert mode in ('100644','100755')
              base_entry=subprocess.check_output(['git','ls-tree',base,'--',name]).decode().split()
              if base_entry: assert mode==base_entry[0],name
              else: assert mode=='100644',name
              entries.append(dict(path=name,operation='replace' if base_entry else 'add',mode=mode,sha256=digest,blob=blob,size=len(content)))
          assert len(entries)==37
          pages=fitz.open(root/'arrange/paper_draft/main.pdf').page_count
          assert 89<=pages<=93,pages
          manifest=dict(base=base,branch=os.environ['DELIVERY_BRANCH'],tree=subprocess.check_output(['git','write-tree']).decode().strip(),pages=pages,entries=entries)
          raw=(json.dumps(manifest,sort_keys=True,indent=2)+'\n').encode()
          out=pathlib.Path(os.environ['RUNNER_TEMP'],'validated');out.mkdir()
          (out/'manifest.json').write_bytes(raw)
          with zipfile.ZipFile(out/'files.zip','w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for e in entries:
                  info=zipfile.ZipInfo(e['path'],date_time=(2000,1,1,0,0,0))
                  info.create_system=3;info.external_attr=(stat.S_IFREG | int(e['mode'][-3:],8))<<16
                  info.compress_type=zipfile.ZIP_DEFLATED
                  z.writestr(info,(root/e['path']).read_bytes())
          digests=''.join(hashlib.sha256((out/n).read_bytes()).hexdigest()+'  '+n+'\n' for n in ['manifest.json','files.zip'])
          (out/'digests.txt').write_text(digests)
          print(digests); print('Validated manifest:',manifest['tree'],pages,'pages,',len(entries),'files')
          PYPACK
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fixed-witness-validated-20260906020437
          path: ${{ runner.temp }}/validated/
          if-no-files-found: error
          retention-days: 3
