name: Temporary pinned BC validation
on:
  push:
    branches: ['chatgpt/unified-bc-selected-gap-20260907073324']
    paths: ['.github/workflows/chatgpt-apply-unified-bc.yml']
permissions: {}
concurrency:
  group: unified-bc-20260907073324-validate
  cancel-in-progress: false
env:
  SOURCE_DATE_EPOCH: '946684800'
  FORCE_SOURCE_DATE: '1'
  TZ: UTC
jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the reviewed manifest and reconstruct only its source files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,zlib
          base='c9e8269a7989cab1cb108af70801240113b3e51b'
          branch='chatgpt/unified-bc-selected-gap-20260907073324'
          assert os.environ['GITHUB_REF']=='refs/heads/'+branch
          subprocess.run(['git','merge-base','--is-ancestor',base,'HEAD'],check=True)
          root=pathlib.Path('.github/_transient/unified-bc-20260907073324')
          wf='.github/workflows/chatgpt-apply-unified-bc.yml'
          allowed={str(root/f'delta-{i:02d}.b64') for i in range(6)}|{wf}
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          assert changed==allowed,changed
          parts=[]
          for i in range(6):
              p=root/f'delta-{i:02d}.b64'
              assert p.is_file() and not any(x.is_symlink() for x in [p,*p.parents])
              text=p.read_text(encoding='ascii').strip()
              if i==2:
                  # Repair the identified two-character transcription insertion;
                  # the original reviewed combined and decoded digests stay fixed.
                  assert text.count('SDCDYPu6Lu')==1
                  text=text.replace('SDCDYPu6Lu','SDYPu6Lu')
              parts.append(text)
          transport=(''.join(parts)+'\n').encode('ascii')
          assert hashlib.sha256(transport).hexdigest()=='427eacea9e6237952d128005f192a06e41ca272c1511542c62f314819c30988f'
          dec=zlib.decompressobj()
          raw=dec.decompress(base64.b64decode(transport.strip(),validate=True),1000000)
          assert dec.eof and not dec.unused_data and not dec.unconsumed_tail
          assert hashlib.sha256(raw).hexdigest()=='df3f8ff12000afb15fed5cd2fc0c2c09889ca4fe30513b3d2ba12e2ca0d8d583'
          entries=json.loads(raw); assert len(entries)==24
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'bc-source-delta.json').write_bytes(raw)
          subprocess.run(['git','reset','--hard',base],check=True)
          seen=set()
          for e in entries:
              path=e['path']; p=pathlib.PurePosixPath(path); target=pathlib.Path(path)
              assert str(p)==path and not p.is_absolute() and '..' not in p.parts and '\x00' not in path
              assert path not in seen and not path.startswith('.github/'); seen.add(path)
              assert not any(x.is_symlink() for x in [target,*target.parents])
              assert e['mode'] in ('100644','100755')
              if e['op']=='replace':
                  old=target.read_bytes()
              else:
                  assert e['op']=='add' and not target.exists(); old=b''
              assert hashlib.sha256(old).hexdigest()==e['base_sha256'],path
              lines=old.decode('utf-8').splitlines(keepends=True); cursor=0; out=[]
              for start,end,text in e['edits']:
                  assert 0<=cursor<=start<=end<=len(lines)
                  out.extend(lines[cursor:start]);out.append(text);cursor=end
              out.extend(lines[cursor:]); data=''.join(out).encode('utf-8')
              assert hashlib.sha256(data).hexdigest()==e['sha256'],path
              target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
              target.chmod(int(e['mode'],8)&0o777)
          assert not pathlib.Path('.github/_transient').exists()
          subprocess.run(['git','add','--',*sorted(seen)],check=True)
          print('All 24 reviewed source files reconstructed and byte-verified.')
          PY
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Pinned source, D-preservation, and interactive checks
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r arrange/_support/requirements.txt
          python interactive/generate.py --dependency-graph
          git add interactive/readable_proof_dependency_graph.html
          python proof/check.py
          python interactive/generate.py --dependency-graph --check
          python interactive/generate.py --trace-assets --check
          python interactive/check.py
          git diff --check
          git diff --cached --check
      - name: Replay both exact zero-gap certificates
        working-directory: proof/3XXX_CE0/31XX_Nplus1/310X_all_Vd0/3105X_self_contained_direct_Vd0_nine_point/3105X_computation
        shell: bash
        run: |
          set -euo pipefail
          python verify_mixed_overlap_core_derivation.py
          python verify_global_core_positivity.py
      - name: Build in the unchanged pinned publication environment
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80
        with:
          docker_image: >-
            ghcr.io/xu-cheng/texlive-historic-debian:2025@sha256:d3e42adc0c8d84bc913bfc33571feaf7037616260a771bb6f027504661568bf6
          run: |
            set -euo pipefail
            python3 arrange/build.py --all --output-dir arrange/_build
      - name: Check and package the exact prospective tree
        shell: bash
        run: |
          set -euo pipefail
          cp arrange/_build/canonical.pdf arrange/paper_draft/main.pdf
          python arrange/_support/verify_pdf_render.py arrange/paper_draft/main.pdf
          python proof/check.py
          python interactive/check.py
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess,zipfile
          import fitz
          base='c9e8269a7989cab1cb108af70801240113b3e51b'
          branch='chatgpt/unified-bc-selected-gap-20260907073324'
          raw=(pathlib.Path(os.environ['RUNNER_TEMP'])/'bc-source-delta.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='df3f8ff12000afb15fed5cd2fc0c2c09889ca4fe30513b3d2ba12e2ca0d8d583'
          entries=json.loads(raw)
          for e in entries:
              assert hashlib.sha256(pathlib.Path(e['path']).read_bytes()).hexdigest()==e['sha256'],e['path']
          paths={e['path'] for e in entries}|{'arrange/paper_draft/main.pdf','interactive/readable_proof_dependency_graph.html'}
          assert len(paths)==26
          subprocess.run(['git','add','--',*sorted(paths)],check=True)
          changed=subprocess.check_output(['git','diff','--cached','--name-status',base],text=True).splitlines()
          statuses={line.split('\t')[1]:line.split('\t')[0] for line in changed}
          assert set(statuses)==paths and all(s in ('A','M') for s in statuses.values()),statuses
          assert not subprocess.check_output(['git','diff','--name-only'],text=True).strip()
          assert not pathlib.Path('.github/_transient').exists()
          assert sorted(p.name for p in pathlib.Path('.github/workflows').iterdir())==['ci.yml']
          subprocess.run(['git','diff','--cached','--check'],check=True)
          pages=fitz.open('arrange/paper_draft/main.pdf').page_count; assert pages==89,pages
          manifest={'base':base,'branch':branch,'pages':pages,'tree_sha':subprocess.check_output(['git','write-tree'],text=True).strip(),'files':[]}
          for path in sorted(paths):
              p=pathlib.Path(path); assert p.is_file() and not p.is_symlink()
              data=p.read_bytes()
              mode,blob,_=subprocess.check_output(['git','ls-files','-s','--',path],text=True).split()[:3]
              assert mode in ('100644','100755')
              assert blob==hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              manifest['files'].append({'path':path,'op':'add' if statuses[path]=='A' else 'replace','mode':mode,'size':len(data),'blob_sha':blob,'sha256':hashlib.sha256(data).hexdigest()})
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'bc-validated';out.mkdir()
          mraw=(json.dumps(manifest,indent=2)+'\n').encode();(out/'manifest.json').write_bytes(mraw)
          with zipfile.ZipFile(out/'delivery.zip','w',compression=zipfile.ZIP_DEFLATED) as z:
              z.writestr('manifest.json',mraw)
              for path in sorted(paths):z.write(path,'files/'+path)
          for name in ('manifest.json','delivery.zip'):
              print('VALIDATED_DIGEST',name,hashlib.sha256((out/name).read_bytes()).hexdigest())
          print('VALIDATED_TREE',manifest['tree_sha'],'PAGES',pages,'FILES',len(paths))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unified-bc-validated
          path: ${{ runner.temp }}/bc-validated/
          if-no-files-found: error
          retention-days: 7
