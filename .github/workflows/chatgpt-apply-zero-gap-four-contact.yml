name: Publish validated four-contact proof
on:
  push:
    branches: ['chatgpt/zero-gap-four-contact-20260905120108']
    paths: ['.github/workflows/chatgpt-apply-zero-gap-four-contact.yml']
permissions: {}
concurrency:
  group: four-contact-final-delivery-20260905
  cancel-in-progress: false
env:
  SOURCE_DATE_EPOCH: '946684800'
  FORCE_SOURCE_DATE: '1'
  TZ: UTC
  AUDITED_BASE: a1c9ccb569a5549044498984490b24d36417de8e
  RECOVERY_COMMIT: e673198f25d5386d061d39f075637a2676e7d035
  CLEAN_HEAD: 09172333a258371efd231f218dc44ef7a877e069
  TASK_BRANCH: chatgpt/zero-gap-four-contact-20260905120108
  TRANSIENT_WORKFLOW: .github/workflows/chatgpt-apply-zero-gap-four-contact.yml
  SOURCE_MANIFEST_SHA: a714cf38aaf9a4b225142889fd1bfd1ff20163e6db3d8c80c2cf4150d60c3641
  FINAL_MANIFEST_SHA: ecf6dc42cf36c5139cdc77f0b19d90a6398b1d889632e0bd37f0d0896de1fa15
jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Recover and verify the exact historical source payload
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, lzma, os, stat, subprocess
          from pathlib import Path, PurePosixPath
          base=os.environ['AUDITED_BASE']; old=os.environ['RECOVERY_COMMIT']
          wf=os.environ['TRANSIENT_WORKFLOW']; tmp=Path(os.environ['RUNNER_TEMP'])
          def git(*args): return subprocess.check_output(['git',*args])
          assert os.environ['GITHUB_REF_NAME']==os.environ['TASK_BRANCH']
          assert git('rev-parse','HEAD^').decode().strip()==os.environ['CLEAN_HEAD']
          subprocess.run(['git','merge-base','--is-ancestor',base,'HEAD'],check=True)
          assert git('diff','--name-only',base,'HEAD').decode().splitlines()==[wf]
          task='.github/_transient/zero-gap-four-contact-20260905120108/'
          raw=git('show',old+':'+task+'source-manifest.json')
          assert hashlib.sha256(raw).hexdigest()==os.environ['SOURCE_MANIFEST_SHA']
          m=json.loads(raw)
          assert m['base']==base and m['branch']==os.environ['TASK_BRANCH']
          assert len(m['files'])==18 and len({f['path'] for f in m['files']})==18
          for f in m['files']:
              p=PurePosixPath(f['path'])
              assert not p.is_absolute() and '..' not in p.parts and '\x00' not in str(p)
              assert str(p)==f['path'] and p.parts[0] in {'proof','arrange','interactive'}
              assert f['operation'] in {'add','replace'} and f['mode'] in {'100644','100755'}
          encoded=b''.join(git('show',old+':'+task+f'source.patch.part{i}').strip() for i in range(4))
          dec=lzma.LZMADecompressor(memlimit=134217728)
          patch=dec.decompress(base64.b64decode(encoded,validate=True),max_length=1000000)
          assert dec.eof and not dec.unused_data and len(patch)==79253
          assert hashlib.sha256(patch).hexdigest()==m['patch_sha256']
          (tmp/'source-manifest.json').write_bytes(raw)
          (tmp/'source.patch').write_bytes(patch)
          subprocess.run(['git','apply','--index',str(tmp/'source.patch')],check=True)
          subprocess.run(['git','rm','--',wf],check=True)
          observed=dict((p,s) for s,p in (r.split('\t') for r in git('diff','--cached','--name-status','--no-renames',base).decode().splitlines()))
          assert observed=={f['path']:('A' if f['operation']=='add' else 'M') for f in m['files']}
          for f in m['files']:
              p=Path(f['path']); st=p.lstat()
              assert stat.S_ISREG(st.st_mode) and st.st_nlink==1
              assert hashlib.sha256(p.read_bytes()).hexdigest()==f['sha256'],f['path']
              assert git('ls-files','-s','--',f['path']).decode().split()[0]==f['mode']
          print('PASS: original 18 source files recovered and authenticated')
          PY
      - name: Install pinned audit dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r arrange/_support/requirements.txt
      - name: Replay source and exact certificate checks
        run: |
          set -euo pipefail
          python proof/check.py
          cd proof/3XXX_CE0/31XX_Nplus1/310X_all_Vd0/3105X_self_contained_direct_Vd0_nine_point/3105X_computation
          python verify_mixed_overlap_core_derivation.py
          python verify_global_core_positivity.py
      - name: Regenerate and audit the dependency graph
        run: |
          set -euo pipefail
          python interactive/generate.py --dependency-graph
          git add interactive/readable_proof_dependency_graph.html
          python interactive/generate.py --dependency-graph --check
          python interactive/generate.py --trace-assets --check
          python interactive/check.py
      - name: Rebuild the canonical paper in pinned TeX Live 2025
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80
        with:
          docker_image: ghcr.io/xu-cheng/texlive-historic-debian:2025@sha256:d3e42adc0c8d84bc913bfc33571feaf7037616260a771bb6f027504661568bf6
          run: |
            set -euo pipefail
            python3 arrange/build.py --all --output-dir arrange/_build
      - name: Authenticate all final bytes and export the validated tree
        run: |
          set -euo pipefail
          cp arrange/_build/canonical.pdf arrange/paper_draft/main.pdf
          git add arrange/paper_draft/main.pdf
          python proof/check.py
          python arrange/_support/compare_pdfs_semantically.py arrange/paper_draft/main.pdf arrange/_build/canonical.pdf --dpi 144
          python arrange/_support/verify_pdf_render.py arrange/paper_draft/main.pdf
          git diff --cached --check "$AUDITED_BASE"
          python - <<'PY'
          import hashlib, json, os, stat, subprocess
          from pathlib import Path
          import fitz
          base=os.environ['AUDITED_BASE']; tmp=Path(os.environ['RUNNER_TEMP'])
          m=json.loads((tmp/'source-manifest.json').read_bytes())
          assert fitz.open('arrange/paper_draft/main.pdf').page_count==92
          sources={f['path']:f for f in m['files']}; expected=set(sources)|set(m['generated'])
          def git(*args): return subprocess.check_output(['git',*args])
          changes=dict((p,s) for s,p in (r.split('\t') for r in git('diff','--cached','--name-status','--no-renames',base).decode().splitlines()))
          assert set(changes)==expected and len(changes)==20
          out=tmp/'delivery'; (out/'tree').mkdir(parents=True)
          files=[]
          for path in sorted(expected):
              p=Path(path); st=p.lstat()
              assert stat.S_ISREG(st.st_mode) and st.st_nlink==1
              mode,blob,stage=git('ls-files','-s','--',path).decode().split('\t')[0].split()
              assert mode in {'100644','100755'} and stage=='0'
              data=git('show',':'+path); assert data==p.read_bytes()
              digest=hashlib.sha256(data).hexdigest()
              if path in sources:
                  f=sources[path]
                  assert digest==f['sha256'] and mode==f['mode']
                  assert changes[path]==('A' if f['operation']=='add' else 'M')
              else: assert mode=='100644' and changes[path]=='M'
              files.append({'path':path,'operation':'add' if changes[path]=='A' else 'replace','mode':mode,'sha256':digest,'git_blob':blob})
              dest=out/'tree'/path; dest.parent.mkdir(parents=True,exist_ok=True); dest.write_bytes(data)
          manifest={'base':base,'branch':m['branch'],'files':files,'pages':92}
          raw=(json.dumps(manifest,sort_keys=True,separators=(',',':'))+'\n').encode()
          assert hashlib.sha256(raw).hexdigest()==os.environ['FINAL_MANIFEST_SHA'],raw.decode()
          (out/'final-manifest.json').write_bytes(raw)
          names=git('ls-files').decode().splitlines()
          assert not any(p.startswith('.github/_transient/') or p.startswith('.github/workflows/chatgpt-apply-') for p in names)
          print('PASS: 20 final files exactly match the previously validated artifact')
          print('Final manifest SHA256:',hashlib.sha256(raw).hexdigest())
          print('Prospective tree:',git('write-tree').decode().strip())
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: upload
        with:
          name: four-contact-publish-tree
          path: ${{ runner.temp }}/delivery/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.push.outputs.commit }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact_id }}
          path: ${{ runner.temp }}/payload
          merge-multiple: true
      - name: Reconstruct authenticated Git objects without executing repository code
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, stat, subprocess
          from pathlib import Path, PurePosixPath
          tmp=Path(os.environ['RUNNER_TEMP']); payload=tmp/'payload'
          raw=(payload/'final-manifest.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()==os.environ['FINAL_MANIFEST_SHA']
          m=json.loads(raw); base=os.environ['AUDITED_BASE']; branch=os.environ['TASK_BRANCH']; trigger=os.environ['GITHUB_SHA']; wf=os.environ['TRANSIENT_WORKFLOW']
          assert m['base']==base and m['branch']==branch and len(m['files'])==20
          allowed={'final-manifest.json'}|{'tree/'+f['path'] for f in m['files']}
          actual=set()
          for p in payload.rglob('*'):
              st=p.lstat()
              assert not stat.S_ISLNK(st.st_mode)
              if stat.S_ISDIR(st.st_mode): continue
              assert stat.S_ISREG(st.st_mode) and st.st_nlink==1
              actual.add(p.relative_to(payload).as_posix())
          assert actual==allowed
          repo=tmp/'publish'; repo.mkdir()
          def git(*args,input=None): return subprocess.check_output(['git','-c','core.hooksPath=/dev/null',*args],cwd=repo,input=input)
          git('init'); git('remote','add','origin','https://github.com/dylan0301/hexagon-cover-database.git')
          git('fetch','--no-tags','origin',trigger)
          assert git('rev-parse','FETCH_HEAD').decode().strip()==trigger
          git('merge-base','--is-ancestor',base,trigger)
          assert git('rev-parse',trigger+'^').decode().strip()==os.environ['CLEAN_HEAD']
          assert git('diff','--name-only',base,trigger).decode().splitlines()==[wf]
          git('read-tree',trigger)
          for f in m['files']:
              p=PurePosixPath(f['path'])
              assert str(p)==f['path'] and not p.is_absolute() and '..' not in p.parts and '\x00' not in str(p)
              assert p.parts[0] in {'proof','arrange','interactive'}
              assert f['mode'] in {'100644','100755'} and f['operation'] in {'add','replace'}
              data=(payload/'tree'/p).read_bytes()
              assert hashlib.sha256(data).hexdigest()==f['sha256']
              blob=git('hash-object','-w','--stdin',input=data).decode().strip()
              assert blob==f['git_blob']
              git('update-index','--add','--cacheinfo',f['mode'],blob,str(p))
          git('update-index','--force-remove','--',wf)
          changes=dict((p,s) for s,p in (r.split('\t') for r in git('diff','--cached','--name-status','--no-renames',base).decode().splitlines()))
          assert changes=={f['path']:('A' if f['operation']=='add' else 'M') for f in m['files']}
          git('diff','--cached','--check',base)
          for f in m['files']:
              assert hashlib.sha256(git('show',':'+f['path'])).hexdigest()==f['sha256']
              assert git('ls-files','-s','--',f['path']).decode().split()[0]==f['mode']
          names=git('ls-files').decode().splitlines()
          assert not any(p.startswith('.github/_transient/') or p.startswith('.github/workflows/chatgpt-apply-') for p in names)
          tree=git('write-tree').decode().strip()
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          message=b'proof: replace zero-gap support caps with four-contact enclosure\n\nPublish the exact validated 20-file proof, manuscript, figure, and PDF tree.\nRetain all exact polynomial data and type-independent forcing.\nRemove the temporary delivery workflow in this same commit.\n'
          commit=git('commit-tree',tree,'-p',trigger,input=message).decode().strip()
          (tmp/'publication-commit').write_text(commit+'\n')
          print('Prepared commit:',commit)
          print('Prepared tree:',tree)
          print('Artifact digest verified by download action: ${{ needs.validate.outputs.artifact_digest }}')
          PY
      - name: Guarded fast-forward publication to the existing feature branch
        id: push
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/publish"
          commit=$(cat "$RUNNER_TEMP/publication-commit")
          remote=$(git ls-remote origin "refs/heads/$TASK_BRANCH" | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' '${{ github.token }}' | base64 -w0)" push origin "$commit:refs/heads/$TASK_BRANCH"
          git fetch --no-tags origin "refs/heads/$TASK_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Verify remote paths, modes, and exact bytes
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          tmp=Path(os.environ['RUNNER_TEMP']); repo=tmp/'publish'
          m=json.loads((tmp/'payload/final-manifest.json').read_bytes())
          def git(*args): return subprocess.check_output(['git',*args],cwd=repo)
          head=git('rev-parse','FETCH_HEAD').decode().strip()
          assert head==(tmp/'publication-commit').read_text().strip()
          changes=dict((p,s) for s,p in (r.split('\t') for r in git('diff','--name-status','--no-renames',m['base'],head).decode().splitlines()))
          assert changes=={f['path']:('A' if f['operation']=='add' else 'M') for f in m['files']}
          for f in m['files']:
              data=git('show',head+':'+f['path'])
              assert hashlib.sha256(data).hexdigest()==f['sha256']
              mode,kind,blob=git('ls-tree',head,'--',f['path']).decode().split('\t')[0].split()
              assert mode==f['mode'] and kind=='blob' and blob==f['git_blob']
              print('VERIFIED',f['mode'],f['sha256'],f['path'])
          names=git('ls-tree','-r','--name-only',head).decode().splitlines()
          assert not any(p.startswith('.github/_transient/') or p.startswith('.github/workflows/chatgpt-apply-') for p in names)
          report={'head':head,'base':m['base'],'branch':m['branch'],'file_count':20,'manifest_sha256':os.environ['FINAL_MANIFEST_SHA'],'transient_paths_absent':True,'files':m['files']}
          (tmp/'remote-verification.json').write_text(json.dumps(report,indent=2)+'\n')
          print('PASS: published tree and all 20 remote files verified; no transient paths')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: four-contact-remote-verification
          path: ${{ runner.temp }}/remote-verification.json
          if-no-files-found: error
          retention-days: 7
  dispatch:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch normal CI against the clean final branch
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'Authorization: Bearer ${{ github.token }}' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/dylan0301/hexagon-cover-database/actions/workflows/ci.yml/dispatches \
            --data '{"ref":"chatgpt/zero-gap-four-contact-20260905120108"}'
          echo 'Dispatched CI for ${{ needs.publish.outputs.commit }}'
