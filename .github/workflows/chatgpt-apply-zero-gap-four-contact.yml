name: Temporary four-contact source snapshot
on:
  push:
    branches: ['chatgpt/zero-gap-four-contact-20260905120108']
    paths: ['.github/workflows/chatgpt-apply-zero-gap-four-contact.yml']
permissions: {}
concurrency:
  group: chatgpt-zero-gap-four-contact-20260905120108
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact public baseline without credentials
        run: |
          set -euo pipefail
          base=a1c9ccb569a5549044498984490b24d36417de8e
          git merge-base --is-ancestor "$base" HEAD
          test "$(git diff --name-only "$base" HEAD)" = '.github/workflows/chatgpt-apply-zero-gap-four-contact.yml'
          git branch audit-baseline "$base"
          git bundle create "$RUNNER_TEMP/four-contact-baseline.bundle" audit-baseline
          sha256sum "$RUNNER_TEMP/four-contact-baseline.bundle"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: four-contact-baseline
          path: ${{ runner.temp }}/four-contact-baseline.bundle
          if-no-files-found: error
          retention-days: 3
