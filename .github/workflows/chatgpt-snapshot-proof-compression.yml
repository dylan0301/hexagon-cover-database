name: Temporary read-only proof-compression snapshot
on:
  push:
    branches: ['chatgpt/proof-compression-20260906142930']
    paths: ['.github/workflows/chatgpt-snapshot-proof-compression.yml']
permissions: {}
concurrency:
  group: snapshot-proof-compression-20260906142930
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: 83d6f08ccdfdee464f51d7e621897b55cf49d9fa
          persist-credentials: false
      - name: Archive the exact audited baseline without executing repository code
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 83d6f08ccdfdee464f51d7e621897b55cf49d9fa
          mkdir -p "$RUNNER_TEMP/proof-compression-snapshot"
          git archive --format=tar HEAD > "$RUNNER_TEMP/proof-compression-snapshot/source.tar"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/proof-compression-snapshot/identity.txt"
          sha256sum "$RUNNER_TEMP/proof-compression-snapshot/source.tar"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: proof-compression-baseline
          path: ${{ runner.temp }}/proof-compression-snapshot/
          if-no-files-found: error
          retention-days: 7
