name: Compile body-appendix paper

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the pull request branch
        uses: actions/checkout@v4

      - name: Install XeLaTeX toolchain
        run: |
          sudo apt-get update -qq >/dev/null
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            latexmk \
            texlive-xetex \
            texlive-latex-extra \
            texlive-fonts-recommended \
            poppler-utils >/dev/null

      - name: Compile the complete manuscript
        id: compile
        continue-on-error: true
        working-directory: arrange/paper_draft
        run: |
          set +e
          latexmk -xelatex -interaction=nonstopmode -halt-on-error main.tex > build.stdout 2>&1
          status=$?
          echo "latexmk exit status: ${status}"
          if [ "${status}" -ne 0 ]; then
            echo "--- concise TeX diagnostics ---"
            grep -n -E '^!|LaTeX Error|Package .* Error|Undefined control sequence|Emergency stop|Fatal error|File .* not found' main.log build.stdout 2>/dev/null | tail -n 120 || true
            echo "--- final compiler output ---"
            tail -n 100 build.stdout || true
          fi
          exit "${status}"

      - name: Record PDF metadata and body-end page
        if: steps.compile.outcome == 'success'
        working-directory: arrange/paper_draft
        run: |
          pdfinfo main.pdf
          echo "Body-end label:"
          grep -F 'newlabel{page:proof-body-end}' main.aux || true
          echo "Undefined-reference diagnostics:"
          grep -E 'undefined references|Reference .* undefined|Citation .* undefined' main.log || true

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hexagon-cover-paper-build-diagnostics
          path: |
            arrange/paper_draft/build.stdout
            arrange/paper_draft/main.log
            arrange/paper_draft/main.aux
          if-no-files-found: warn
          retention-days: 7

      - name: Upload compiled manuscript
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: hexagon-cover-body-appendix-paper
          path: arrange/paper_draft/main.pdf
          if-no-files-found: error
          retention-days: 7

      - name: Fail workflow when compilation failed
        if: steps.compile.outcome == 'failure'
        run: exit 1
