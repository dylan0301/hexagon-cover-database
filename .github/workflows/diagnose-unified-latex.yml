name: Diagnose unified LaTeX

on:
  workflow_dispatch:
  push:
    branches:
      - agent/manuscript-unification
    paths:
      - .github/workflows/diagnose-unified-latex.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-unified-latex.yml
      - arrange/paper_draft/*.tex

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/manuscript-unification
          fetch-depth: 0

      - name: Compile with XeLaTeX container
        id: compile
        continue-on-error: true
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: arrange/paper_draft
          latexmk_use_xelatex: true
          args: -interaction=nonstopmode -halt-on-error -file-line-error

      - name: Persist compiler tail on failure
        if: steps.compile.outcome != 'success'
        run: |
          if [ -f arrange/paper_draft/main.log ]; then
            tail -n 240 arrange/paper_draft/main.log > arrange/paper_draft/latex_diagnostic.log
          else
            printf '%s\n' 'XeLaTeX failed before main.log was produced.' > arrange/paper_draft/latex_diagnostic.log
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arrange/paper_draft/latex_diagnostic.log
          git commit -m 'Record XeLaTeX diagnostic'
          git push origin HEAD:agent/manuscript-unification
          exit 1

      - name: Remove stale diagnostic after success
        if: steps.compile.outcome == 'success'
        run: |
          if [ -f arrange/paper_draft/latex_diagnostic.log ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git rm arrange/paper_draft/latex_diagnostic.log
            git commit -m 'Remove resolved XeLaTeX diagnostic'
            git push origin HEAD:agent/manuscript-unification
          fi
