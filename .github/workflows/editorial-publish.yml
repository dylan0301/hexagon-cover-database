name: Temporary validated editorial publication
on:
  push:
    branches: [chatgpt/paper-shortening-20260909141118]
    paths: [.github/workflows/editorial-publish.yml]
permissions:
  contents: read
env:
  SOURCE_DATE_EPOCH: '946684800'
  FORCE_SOURCE_DATE: '1'
  TZ: UTC
  DELIVERY_BRANCH: chatgpt/paper-shortening-20260909141118
  PAYLOAD_BASE: e81da4dc651db7ac3adddba0fada88514e9a4656
  PAYLOAD_SHA256: 2a2838fd34f9903d067a0c9e7fae7251c1650046a030d7692bd9e04a2e224904
jobs:
  validate:
    if: github.ref == 'refs/heads/chatgpt/paper-shortening-20260909141118'
    runs-on: ubuntu-24.04
    outputs:
      manifest_sha: ${{ steps.package.outputs.manifest_sha }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply authenticated text edits
        run: |
          set -euo pipefail
          mkdir -p /tmp/editorial-delivery
          python - <<'PY'
          import base64, gzip, hashlib, json, os, subprocess
          from pathlib import Path
          chunks = []
          for i in range(7):
              t = Path(f'arrange/_support/.editorial_publish_{i:02}.b64').read_text().strip()
              if i == 3:
                  assert t.count('UXHaHpppXY') == 1
                  t = t.replace('UXHaHpppXY', 'UXHaHppXY', 1)
              chunks.append(t)
          packed = base64.b64decode(''.join(chunks), validate=True)
          assert hashlib.sha256(packed).hexdigest() == os.environ['PAYLOAD_SHA256']
          data = json.loads(gzip.decompress(packed))
          assert data['format'] == 'verified-line-copy-v1'
          assert data['base'] == os.environ['PAYLOAD_BASE']
          entries = data['changes']
          names = [e['path'] for e in entries]
          assert len(names) == len(set(names)) == 26
          for e in entries:
              name = e['path']; p = Path(name)
              assert not p.is_absolute() and '..' not in p.parts
              assert name in ('.github/workflows/ci.yml', 'README.md') or name.startswith(('arrange/', 'proof/'))
              assert not p.is_symlink() and all(not q.is_symlink() for q in p.parents)
              old = p.read_bytes() if p.exists() else None
              assert (hashlib.sha256(old).hexdigest() if old is not None else None) == e['before'], name
              lines = old.decode().splitlines(keepends=True) if old is not None else []
              result = []
              for op in e['ops']:
                  if 'copy' in op:
                      a,b = op['copy']; assert 0 <= a <= b <= len(lines)
                      result.append(''.join(lines[a:b]))
                  else:
                      assert set(op) == {'text'}
                      result.append(op['text'])
              content = ''.join(result).encode()
              assert hashlib.sha256(content).hexdigest() == e['after'], name
              assert e['mode'] in ('100644', '100755')
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(content); p.chmod(int(e['mode'][-3:], 8))
          Path('/tmp/editorial-delivery/payload.gz').write_bytes(packed)
          subprocess.run(['git', 'add', '--', *names], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          print('Authenticated 26 text edits')
          PY
      - name: Install pinned audit dependencies
        run: python -m pip install --disable-pip-version-check -r arrange/_support/requirements.txt
      - name: Check proof interfaces and exact certificates
        run: |
          set -euo pipefail
          python proof/check.py | tee /tmp/editorial-delivery/source-check.log
          cd proof/3XXX_CE0/31XX_Nplus1/310X_all_Vd0/3105X_self_contained_direct_Vd0_nine_point/3105X_computation
          python verify_mixed_overlap_core_derivation.py | tee /tmp/editorial-delivery/derivation.log
          python verify_global_core_positivity.py | tee /tmp/editorial-delivery/positivity.log
      - name: Regenerate and verify publication navigation
        run: |
          set -euo pipefail
          python interactive/generate.py --dependency-graph
          git add interactive/readable_proof_dependency_graph.html
          python interactive/generate.py --dependency-graph --check
          python interactive/generate.py --trace-assets --check
          python interactive/check.py
          git diff --cached --check
          git diff --check
      - name: Build both PDFs in pinned TeX Live 2025
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80
        with:
          docker_image: >-
            ghcr.io/xu-cheng/texlive-historic-debian:2025@sha256:d3e42adc0c8d84bc913bfc33571feaf7037616260a771bb6f027504661568bf6
          run: |
            set -euo pipefail
            python3 arrange/build.py --all --output-dir arrange/_build
            cp arrange/_build/canonical.pdf arrange/paper_draft/main.pdf
            bash arrange/_support/build_proof_free_paper.sh
      - name: Audit every PDF page
        run: |
          set -euo pipefail
          python arrange/_support/verify_pdf_render.py arrange/paper_draft/main.pdf
          python arrange/_support/verify_pdf_render.py arrange/paper_draft/proof_free.pdf
          python - <<'PY'
          import fitz
          for name, expected in [('main', 69), ('proof_free', 37)]:
              count = len(fitz.open(f'arrange/paper_draft/{name}.pdf'))
              assert count == expected, (name, count, expected)
              print(name, count)
          PY
      - name: Package validated paths and byte hashes
        id: package
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip, hashlib, json, os, subprocess, zipfile
          from pathlib import Path
          out = Path('/tmp/editorial-delivery')
          data = json.loads(gzip.decompress((out/'payload.gz').read_bytes()))
          names = [e['path'] for e in data['changes']] + ['arrange/paper_draft/main.pdf', 'arrange/paper_draft/proof_free.pdf', 'interactive/readable_proof_dependency_graph.html']
          manifest = {'source_sha':os.environ['GITHUB_SHA'], 'base':data['base'], 'entries':[]}
          with zipfile.ZipFile(out/'delivery.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for name in names:
                  p=Path(name); content=p.read_bytes()
                  old=subprocess.run(['git','show',os.environ['GITHUB_SHA']+':'+name],capture_output=True)
                  before=hashlib.sha256(old.stdout).hexdigest() if old.returncode == 0 else None
                  mode='100755' if p.stat().st_mode & 0o111 else '100644'
                  manifest['entries'].append({'path':name,'before':before,'after':hashlib.sha256(content).hexdigest(),'mode':mode})
                  z.writestr(name,content)
          raw=json.dumps(manifest,sort_keys=True,indent=2).encode()
          (out/'manifest.json').write_bytes(raw)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('manifest_sha='+hashlib.sha256(raw).hexdigest()+'\n')
          print('Packaged',len(names),'validated files')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: editorial-validated
          path: /tmp/editorial-delivery/
          retention-days: 7
          if-no-files-found: error
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: editorial-diagnostics
          path: /tmp/editorial-delivery/
          retention-days: 3
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: chatgpt/paper-shortening-20260909141118
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: editorial-validated
          path: /tmp/editorial-delivery
      - name: Commit exactly the validated publication
        env:
          MANIFEST_SHA: ${{ needs.validate.outputs.manifest_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import gzip, hashlib, json, os, subprocess, zipfile
          from pathlib import Path
          out=Path('/tmp/editorial-delivery'); raw=(out/'manifest.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest() == os.environ['MANIFEST_SHA']
          packed=(out/'payload.gz').read_bytes()
          assert hashlib.sha256(packed).hexdigest() == os.environ['PAYLOAD_SHA256']
          data=json.loads(gzip.decompress(packed)); manifest=json.loads(raw)
          assert manifest['source_sha'] == os.environ['GITHUB_SHA'] and manifest['base'] == os.environ['PAYLOAD_BASE']
          expected={e['path'] for e in data['changes']} | {'arrange/paper_draft/main.pdf','arrange/paper_draft/proof_free.pdf','interactive/readable_proof_dependency_graph.html'}
          assert {e['path'] for e in manifest['entries']} == expected
          changed=[]
          with zipfile.ZipFile(out/'delivery.zip') as z:
              assert set(z.namelist()) == expected
              for e in manifest['entries']:
                  name=e['path']; p=Path(name)
                  assert not p.is_absolute() and '..' not in p.parts
                  assert not p.is_symlink() and all(not q.is_symlink() for q in p.parents)
                  old=p.read_bytes() if p.exists() else None
                  assert (hashlib.sha256(old).hexdigest() if old is not None else None) == e['before'], name
                  content=z.read(name)
                  assert hashlib.sha256(content).hexdigest() == e['after'], name
                  assert e['mode'] in ('100644','100755')
                  if name == '.github/workflows/ci.yml':
                      continue
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_bytes(content);p.chmod(int(e['mode'][-3:],8));changed.append(name)
          for pattern,count in [('.editorial_publish_',7),('.editorial_recovery_',2)]:
              for i in range(count):
                  p=Path(f'arrange/_support/{pattern}{i:02}.b64')
                  assert p.is_file() and not p.is_symlink()
                  p.unlink();changed.append(str(p))
          subprocess.run(['git','add','--',*changed],check=True)
          staged=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert staged and staged <= set(changed)
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete self-containment and editorial repair; preserve (3,0) normalization'
          git push origin "HEAD:refs/heads/$DELIVERY_BRANCH"
          git rev-parse HEAD > /tmp/editorial-delivery/PUBLISHED_SHA
          git bundle create /tmp/editorial-delivery/published.bundle "refs/heads/$DELIVERY_BRANCH"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: editorial-publication
          path: |
            /tmp/editorial-delivery/PUBLISHED_SHA
            /tmp/editorial-delivery/published.bundle
            /tmp/editorial-delivery/manifest.json
          retention-days: 7
          if-no-files-found: error
