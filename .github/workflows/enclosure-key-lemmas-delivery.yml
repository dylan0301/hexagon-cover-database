name: Enclosure key lemmas delivery
on:
  push:
    branches: [chatgpt/enclosure-key-lemmas-20260914140239]
    paths: [.github/workflows/enclosure-key-lemmas-delivery.yml]
permissions:
  contents: read
env:
  SOURCE_DATE_EPOCH: '946684800'
  FORCE_SOURCE_DATE: '1'
  TZ: UTC
jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      manifest: ${{ steps.package.outputs.manifest }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r arrange/_support/requirements.txt
      - name: Apply reviewed relocation and complete formula reminders
        run: |
          python - <<'PY'
          import subprocess,textwrap
          from pathlib import Path
          old=subprocess.check_output(['git','show','eb1f53147e5e2f2a0b4c626c83ccfeb7e966644f:.github/workflows/enclosure-key-lemmas-delivery.yml'],text=True)
          start=old.index("          python - <<'PY'\n")+len("          python - <<'PY'\n")
          end=old.index('          PY\n',start)
          exec(compile(textwrap.dedent(old[start:end]),'reviewed-relocation','exec'))
          p=Path('arrange/paper_draft/A_structural_shared_local_signed_center_optimization.tex')
          s=p.read_text();marker='These recall the main-text proposition, whose proof is not repeated.'
          assert s.count(marker)==1
          reminder=r'''For the disk--finite-set applications, use the same inverse scaling:
          \[
           \Lambda(K)=\frac{2}{\sqrt3}\min_{\|n\|=1}W_K(n),
           \qquad K=\mathbb B(O,\rho)\cup\{w_1,\ldots,w_s\}.
          \]
          '''
          s=s.replace('the two formulas used here are','the gauge formulas used here are',1)
          p.write_text(s.replace(marker,textwrap.dedent(reminder)+marker,1))
          p=Path('arrange/20260914_enclosure_key_lemmas_report.md')
          p.write_text(p.read_text().replace('only two short gauge formulas','only short gauge formulas'))
          PY
      - name: Prepare dependencies and verify preservation before build
        run: |
          set -euo pipefail
          python interactive/generate.py --dependency-graph
          python arrange/_support/verify_readability_preservation.py
          python arrange/_support/verify_inline_proofs.py
          git diff --check
      - name: Rebuild both editions in pinned TeX Live 2025
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80
        with:
          docker_image: ghcr.io/xu-cheng/texlive-historic-debian:2025@sha256:d3e42adc0c8d84bc913bfc33571feaf7037616260a771bb6f027504661568bf6
          run: |
            set -euo pipefail
            python3 arrange/build.py --all --output-dir arrange/_build
      - name: Verify PDFs and synchronize the canonical publication
        run: |
          set -euo pipefail
          python arrange/_support/verify_pdf_render.py arrange/_build/canonical.pdf
          python arrange/_support/verify_pdf_render.py arrange/_build/inline_proofs.pdf
          python arrange/_support/verify_inline_proofs.py --pdf arrange/_build/inline_proofs.pdf
          python arrange/_support/compare_pdfs_semantically.py arrange/paper_draft/inline_proofs/main.pdf arrange/_build/inline_proofs.pdf --dpi 144
          python - <<'PY'
          import fitz
          from pathlib import Path
          p=Path('arrange/_build/canonical.pdf');n=fitz.open(p).page_count
          print('Canonical pages:',n);assert 73<=n<=78,n
          Path('arrange/paper_draft/main.pdf').write_bytes(p.read_bytes())
          PY
      - name: Regenerate and audit sources against the rebuilt PDF
        run: |
          set -euo pipefail
          python interactive/generate.py --dependency-graph
          python proof/check.py
          python arrange/_support/verify_inline_proofs.py
          python arrange/_support/verify_readability_preservation.py
          # The graph intentionally differs from HEAD after relocation. Stage
          # this reviewed output so --check tests deterministic regeneration,
          # rather than incorrectly requiring the old node locations.
          git add -- interactive/readable_proof_dependency_graph.html
          python interactive/generate.py --dependency-graph --check
          python interactive/generate.py --trace-assets --check
          python interactive/check.py
          python proof/3XXX_CE0/31XX_Nplus1/310X_all_Vd0/3105X_self_contained_direct_Vd0_nine_point/3105X_computation/verify_mixed_overlap_core_derivation.py
          python proof/3XXX_CE0/31XX_Nplus1/310X_all_Vd0/3105X_self_contained_direct_Vd0_nine_point/3105X_computation/verify_global_core_positivity.py
          git diff HEAD --check
      - name: Package allowlisted byte-hashed delivery
        id: package
        run: |
          python - <<'PY'
          import hashlib,json,os,shutil,subprocess
          from pathlib import Path
          allowed={'arrange/paper_draft/06_finite_enclosure_full.tex','arrange/paper_draft/A_structural_shared_local_signed_center_optimization.tex','arrange/paper_draft/main.pdf','interactive/readable_proof_dependency_graph.html','interactive/readable_proof_dependency_data.json','arrange/README.md','arrange/20260914_enclosure_key_lemmas_report.md'}
          # Include staged as well as unstaged intended changes.
          changed=set(subprocess.check_output(['git','diff','HEAD','--name-only'],text=True).splitlines())
          changed.update(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          assert changed<=allowed,changed-allowed
          required={'arrange/paper_draft/06_finite_enclosure_full.tex','arrange/paper_draft/A_structural_shared_local_signed_center_optimization.tex','arrange/paper_draft/main.pdf','interactive/readable_proof_dependency_graph.html','arrange/20260914_enclosure_key_lemmas_report.md'}
          assert required<=changed,required-changed
          report=Path('arrange/20260914_enclosure_key_lemmas_report.md')
          report.write_text(report.read_text()+'\n## Completed validation\n\nAll validation steps preceding packaging passed: the pinned builds of both editions; PDF render checks; identical inline-edition text and 144-dpi pixels; all 186 canonical statements and 184 proof groups preserved; the 446-file numbered proof/support fingerprint; exact-certificate checks; and dependency/trace regeneration and static checks. The dependency graph is staged before its freshness check, and packaging compares against HEAD so this staged generated file cannot be omitted. No check script or mathematical baseline was weakened. Remote publication is still separately gated by the hashed manifest and branch-head check.\n')
          out=Path('/tmp/enclosure-delivery');out.mkdir()
          m={'base':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'files':{},'delete':['.github/workflows/enclosure-key-lemmas-delivery.yml']}
          for name in sorted(changed):
              p=Path(name);dest=out/'files'/name;dest.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,dest)
              m['files'][name]=hashlib.sha256(p.read_bytes()).hexdigest()
          data=json.dumps(m,sort_keys=True,indent=2).encode();(out/'manifest.json').write_bytes(data)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('manifest='+hashlib.sha256(data).hexdigest()+'\n')
          print(data.decode())
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: enclosure-key-lemmas-validated
          path: /tmp/enclosure-delivery
          if-no-files-found: error
  publish:
    needs: validate
    if: github.ref == 'refs/heads/chatgpt/enclosure-key-lemmas-20260914140239'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: chatgpt/enclosure-key-lemmas-20260914140239
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: enclosure-key-lemmas-validated
          path: /tmp/enclosure-delivery
      - name: Verify manifest and publish only the task branch
        env:
          EXPECTED_MANIFEST: ${{ needs.validate.outputs.manifest }}
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path('/tmp/enclosure-delivery');raw=(root/'manifest.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()==os.environ['EXPECTED_MANIFEST']
          m=json.loads(raw);assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==m['base']
          allowed={'arrange/paper_draft/06_finite_enclosure_full.tex','arrange/paper_draft/A_structural_shared_local_signed_center_optimization.tex','arrange/paper_draft/main.pdf','interactive/readable_proof_dependency_graph.html','interactive/readable_proof_dependency_data.json','arrange/README.md','arrange/20260914_enclosure_key_lemmas_report.md'}
          assert set(m['files'])<=allowed
          assert m['delete']==['.github/workflows/enclosure-key-lemmas-delivery.yml']
          for name,sha in m['files'].items():
              data=(root/'files'/name).read_bytes();assert hashlib.sha256(data).hexdigest()==sha,name
              p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          for name in m['delete']:Path(name).unlink()
          subprocess.run(['git','add','--',*m['files'],*m['delete']],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','Promote enclosure calculus to main text; preserve proofs and clarify structural reductions'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/chatgpt/enclosure-key-lemmas-20260914140239'],check=True)
          subprocess.run(['git','log','-1','--format=%H'],check=True)
          PY
