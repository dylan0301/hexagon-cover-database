name: Enclosure notation finalization
on:
  push:
    branches: [chatgpt/enclosure-key-lemmas-20260914140239]
    paths: [.github/workflows/enclosure-key-lemmas-delivery.yml]
permissions:
  contents: read
env:
  SOURCE_DATE_EPOCH: '946684800'
  FORCE_SOURCE_DATE: '1'
  TZ: UTC
jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      manifest: ${{ steps.package.outputs.manifest }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r arrange/_support/requirements.txt
      - name: Define the shorthand before its appendix use
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('arrange/paper_draft/A_structural_shared_local_signed_center_optimization.tex')
          s=p.read_text()
          old='general results. For reference, the gauge formulas used here are'
          assert s.count(old)==1
          new=r'''general results. For these reminders, write
          \[
           W_K(n):=\sum_{j=0}^{2}h_K(\mathsf R^j n)\qquad(\|n\|=1).
          \]
          For reference, the gauge formulas used here are'''
          p.write_text(s.replace(old,new,1))
          p=Path('arrange/20260914_enclosure_key_lemmas_report.md')
          p.write_text(p.read_text()+'\n## Final notation review\n\nThe appendix reminder now explicitly defines W_K as the three-direction support sum before using it. This is a notation clarification outside the preserved formal statements and proofs. The main-text four-result relocation is unchanged. Both editions and the final checks are rerun after this clarification.\n')
          PY
      - name: Prepare dependencies and verify preservation
        run: |
          set -euo pipefail
          python interactive/generate.py --dependency-graph
          python arrange/_support/verify_readability_preservation.py
          python arrange/_support/verify_inline_proofs.py
          git diff --check
      - name: Rebuild both editions in pinned TeX Live 2025
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80
        with:
          docker_image: ghcr.io/xu-cheng/texlive-historic-debian:2025@sha256:d3e42adc0c8d84bc913bfc33571feaf7037616260a771bb6f027504661568bf6
          run: |
            set -euo pipefail
            python3 arrange/build.py --all --output-dir arrange/_build
      - name: Verify PDFs and synchronize the canonical publication
        run: |
          set -euo pipefail
          python arrange/_support/verify_pdf_render.py arrange/_build/canonical.pdf
          python arrange/_support/verify_pdf_render.py arrange/_build/inline_proofs.pdf
          python arrange/_support/verify_inline_proofs.py --pdf arrange/_build/inline_proofs.pdf
          python arrange/_support/compare_pdfs_semantically.py arrange/paper_draft/inline_proofs/main.pdf arrange/_build/inline_proofs.pdf --dpi 144
          python - <<'PY'
          import fitz
          from pathlib import Path
          p=Path('arrange/_build/canonical.pdf');n=fitz.open(p).page_count
          print('Canonical pages:',n);assert 73<=n<=78,n
          Path('arrange/paper_draft/main.pdf').write_bytes(p.read_bytes())
          PY
      - name: Run final proof and generated-publication checks
        run: |
          set -euo pipefail
          python interactive/generate.py --dependency-graph
          python proof/check.py
          python arrange/_support/verify_inline_proofs.py
          python arrange/_support/verify_readability_preservation.py
          git add -- interactive/readable_proof_dependency_graph.html
          python interactive/generate.py --dependency-graph --check
          python interactive/generate.py --trace-assets --check
          python interactive/check.py
          python proof/3XXX_CE0/31XX_Nplus1/310X_all_Vd0/3105X_self_contained_direct_Vd0_nine_point/3105X_computation/verify_mixed_overlap_core_derivation.py
          python proof/3XXX_CE0/31XX_Nplus1/310X_all_Vd0/3105X_self_contained_direct_Vd0_nine_point/3105X_computation/verify_global_core_positivity.py
          git diff HEAD --check
      - name: Package verified delivery
        id: package
        run: |
          python - <<'PY'
          import hashlib,json,os,shutil,subprocess,fitz
          from pathlib import Path
          allowed={'arrange/paper_draft/A_structural_shared_local_signed_center_optimization.tex','arrange/paper_draft/main.pdf','interactive/readable_proof_dependency_graph.html','arrange/README.md','arrange/20260914_enclosure_key_lemmas_report.md'}
          changed=set(subprocess.check_output(['git','diff','HEAD','--name-only'],text=True).splitlines())
          changed.update(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          assert changed<=allowed,changed-allowed
          required={'arrange/paper_draft/A_structural_shared_local_signed_center_optimization.tex','arrange/paper_draft/main.pdf','arrange/20260914_enclosure_key_lemmas_report.md'}
          assert required<=changed,required-changed
          p=Path('arrange/20260914_enclosure_key_lemmas_report.md')
          n=fitz.open('arrange/paper_draft/main.pdf').page_count
          p.write_text(p.read_text()+f'\nAll final validation steps passed after the notation clarification. The canonical PDF has {n} pages. No formal statement, proof, numbered proof/support file, checker, or preservation baseline was changed.\n')
          out=Path('/tmp/enclosure-delivery');out.mkdir()
          m={'base':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'files':{},'delete':['.github/workflows/enclosure-key-lemmas-delivery.yml']}
          for name in sorted(changed):
              p=Path(name);dest=out/'files'/name;dest.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,dest)
              m['files'][name]=hashlib.sha256(p.read_bytes()).hexdigest()
          data=json.dumps(m,sort_keys=True,indent=2).encode();(out/'manifest.json').write_bytes(data)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('manifest='+hashlib.sha256(data).hexdigest()+'\n')
          print(data.decode())
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: enclosure-notation-final-validated
          path: /tmp/enclosure-delivery
          if-no-files-found: error
  publish:
    needs: validate
    if: github.ref == 'refs/heads/chatgpt/enclosure-key-lemmas-20260914140239'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: chatgpt/enclosure-key-lemmas-20260914140239
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: enclosure-notation-final-validated
          path: /tmp/enclosure-delivery
      - name: Verify hashes and publish to the existing task branch
        env:
          EXPECTED_MANIFEST: ${{ needs.validate.outputs.manifest }}
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path('/tmp/enclosure-delivery');raw=(root/'manifest.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()==os.environ['EXPECTED_MANIFEST']
          m=json.loads(raw);assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==m['base']
          allowed={'arrange/paper_draft/A_structural_shared_local_signed_center_optimization.tex','arrange/paper_draft/main.pdf','interactive/readable_proof_dependency_graph.html','arrange/README.md','arrange/20260914_enclosure_key_lemmas_report.md'}
          assert set(m['files'])<=allowed
          assert m['delete']==['.github/workflows/enclosure-key-lemmas-delivery.yml']
          for name,sha in m['files'].items():
              data=(root/'files'/name).read_bytes();assert hashlib.sha256(data).hexdigest()==sha,name
              p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          for name in m['delete']:Path(name).unlink()
          subprocess.run(['git','add','--',*m['files'],*m['delete']],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','Define support-sum shorthand before appendix use and refresh validated publication'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/chatgpt/enclosure-key-lemmas-20260914140239'],check=True)
          subprocess.run(['git','log','-1','--format=%H'],check=True)
          PY
