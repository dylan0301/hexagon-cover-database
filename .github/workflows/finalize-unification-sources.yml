name: Finalize unified sources

on:
  workflow_dispatch:
  push:
    branches:
      - agent/manuscript-unification
    paths:
      - arrange/paper_draft/_finalize_unification_sources.py
      - .github/workflows/finalize-unification-sources.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/manuscript-unification
          fetch-depth: 0

      - name: Apply asserted final edits
        run: python arrange/paper_draft/_finalize_unification_sources.py

      - name: Commit finalized sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Finalize unified manuscript sources'
            git push origin HEAD:agent/manuscript-unification
          fi
