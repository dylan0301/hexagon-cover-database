name: Mathematical audit source export (temporary)
on:
  push:
    branches: ['chatgpt/math-audit-fixes-20260924092000']
    paths: ['.github/workflows/math-audit-source-export.yml']
permissions:
  contents: read
jobs:
  export:
    if: github.repository == 'dylan0301/hexagon-cover-database' && github.ref == 'refs/heads/chatgpt/math-audit-fixes-20260924092000'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - name: Export tracked sources and manifest
        run: |
          set -euo pipefail
          mkdir -p /tmp/math-audit-export
          git archive --format=zip HEAD > /tmp/math-audit-export/source.zip
          git rev-parse HEAD > /tmp/math-audit-export/head.txt
          git ls-tree -r HEAD > /tmp/math-audit-export/tree.txt
          sha256sum /tmp/math-audit-export/source.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: math-audit-source
          path: /tmp/math-audit-export/
          retention-days: 1
          if-no-files-found: error
