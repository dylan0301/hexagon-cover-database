name: Apply corrected direct finite-enclosure proofs

on:
  push:
    branches: [No-more-strategy-2]
    paths:
      - '.github/workflows/no2-corrected-direct-proofs.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: no2-corrected-direct-proofs-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_DATE_EPOCH: '946684800'
  FORCE_SOURCE_DATE: '1'
  TZ: UTC

jobs:
  apply-build-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Decode and apply corrected direct-proof source payload
        run: |
          set -euo pipefail
          LC_ALL=C cat tools/.no2_corrected_payload_*.txt > /tmp/no2-corrected-source.b64
          base64 --decode /tmp/no2-corrected-source.b64 > /tmp/no2-corrected-source.tar.xz
          echo '23b9db08254ed4e80abb75d9bdc77c6857d3c5feaff3bf74564048f439faaab0  /tmp/no2-corrected-source.tar.xz' | sha256sum --check
          tar -xJf /tmp/no2-corrected-source.tar.xz
          rm -f tools/.no2_corrected_payload_*.txt
          rm -f .github/workflows/no2-corrected-direct-proofs.yml

      - name: Install pinned proof dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-proof.txt

      - name: Regenerate active proof graph and manifest
        run: |
          set -euo pipefail
          python tools/generate_active_dependency_graph.py
          python tools/generate_proof_manifest.py

      - name: Verify proof sources and legacy scalar interfaces
        run: |
          set -euo pipefail
          python tools/generate_active_dependency_graph.py --check
          python tools/generate_proof_manifest.py --check
          python tools/proof_lint.py
          python tools/verify_strategy2_pure_algebra.py
          python tools/verify_strategy2_spec_sync.py
          git diff --check

      - name: Replay exact nine-point Strategy 3 certificate
        working-directory: proof/3XXX_CE0/31XX_Nplus1/310X_all_Vd0/3105X_self_contained_direct_Vd0_nine_point/3105X_computation
        run: |
          set -euo pipefail
          python verify_mixed_overlap_core_derivation.py
          python verify_global_core_positivity.py

      - name: Build corrected consolidated paper twice in pinned TeX Live 2025
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80
        with:
          docker_image: >-
            ghcr.io/xu-cheng/texlive-historic-debian:2025@sha256:d3e42adc0c8d84bc913bfc33571feaf7037616260a771bb6f027504661568bf6
          run: |
            set -euo pipefail
            export SOURCE_DATE_EPOCH=946684800
            export FORCE_SOURCE_DATE=1
            export TZ=UTC
            cd arrange/paper_draft

            build_pdf() {
              local output="$1"
              local log_copy="$2"
              rm -f main.pdf main.aux main.fdb_latexmk main.fls main.log \
                main.out main.toc main.xdv main.synctex.gz
              latexmk -xelatex -interaction=nonstopmode -halt-on-error \
                -file-line-error main.tex
              if grep -Eq 'LaTeX Warning: (Reference .* undefined|There were undefined references|Label .* multiply defined)' main.log; then
                echo 'Undefined or multiply-defined references found.' >&2
                exit 1
              fi
              if grep -Eq 'Overfull \\hbox|Overfull \\vbox' main.log; then
                echo 'Overfull horizontal or vertical boxes found.' >&2
                grep -E 'Overfull \\hbox|Overfull \\vbox' main.log >&2
                exit 1
              fi
              cp main.pdf "$output"
              cp main.log "$log_copy"
            }

            build_pdf main.rebuilt1.pdf main.rebuilt1.log
            build_pdf main.rebuilt2.pdf main.rebuilt2.log
            cp main.rebuilt2.pdf main.pdf
            cp main.rebuilt2.log main.log
            rm -f main.aux main.fdb_latexmk main.fls main.out main.toc \
              main.xdv main.synctex.gz

      - name: Audit corrected PDF semantics, rendering, and metadata
        run: |
          set -euo pipefail
          python tools/compare_pdfs_semantically.py \
            arrange/paper_draft/main.rebuilt1.pdf \
            arrange/paper_draft/main.rebuilt2.pdf --dpi 144
          python - <<'PY'
          from pathlib import Path
          import fitz
          pdf = Path('arrange/paper_draft/main.pdf')
          pages = fitz.open(pdf).page_count
          print(f'Corrected consolidated paper pages: {pages}')
          if not 84 <= pages <= 104:
              raise SystemExit(f'Expected 84--104 pages; got {pages}')
          PY
          python tools/verify_pdf_render.py arrange/paper_draft/main.pdf
          python tools/generate_verification_summary.py
          rm -f \
            arrange/paper_draft/main.rebuilt1.pdf \
            arrange/paper_draft/main.rebuilt2.pdf \
            arrange/paper_draft/main.rebuilt1.log \
            arrange/paper_draft/main.rebuilt2.log
          git diff --check

      - name: Commit and push corrected proof and manuscript
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace finite-enclosure wrappers with direct proofs'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"

      - name: Dispatch full read-only verification on corrected branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run proof-ci.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: no2-corrected-direct-paper
          path: |
            arrange/paper_draft/main.pdf
            arrange/CURRENT_VERIFICATION_SUMMARY.txt
            arrange/paper_draft/main.log
          if-no-files-found: error
