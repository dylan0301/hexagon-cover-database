name: Temporary verified shortening publication
on:
  push:
    branches: [chatgpt/paper-shortening-20260909141118]
    paths: [.github/workflows/paper-shortening-transport.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: paper-shortening-20260909141118
  cancel-in-progress: false
env:
  DELIVERY_BRANCH: chatgpt/paper-shortening-20260909141118
  AUDITED_BASE: 908f81032cbf582b3be22f18a61f51746ef0196c
  PAYLOAD_SHA256: 91e7d850789e7b70dc0ce11b3e098a19fc7cc4ef9c26bca3e2f860d6878dec19
  VALIDATED_MANIFEST: 216b90038bf46afcae9b3ba4f2b92415661184197cc67bd120bc9ad1db6a7f55
jobs:
  validate:
    if: github.ref == 'refs/heads/chatgpt/paper-shortening-20260909141118'
    runs-on: ubuntu-24.04
    outputs:
      manifest_sha: ${{ steps.verify.outputs.manifest_sha }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: paper-shortening-validated
          run-id: 34364925024
          github-token: ${{ github.token }}
          path: /tmp/validated
      - name: Verify all validated bytes and correct only six report whitespace bytes
        id: verify
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$AUDITED_BASE" HEAD
          python - <<'PY'
          import gzip, hashlib, json, os, subprocess, zipfile
          from pathlib import Path
          source = Path('/tmp/validated')
          out = Path('/tmp/shortening-corrected')
          out.mkdir()
          raw = (source/'manifest.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest() == os.environ['VALIDATED_MANIFEST']
          packed = (source/'payload.gz').read_bytes()
          assert hashlib.sha256(packed).hexdigest() == os.environ['PAYLOAD_SHA256']
          data = json.loads(gzip.decompress(packed))
          manifest = json.loads(raw)
          assert manifest['source_sha'] == '5015d1fe51311b36b00c3c3768be1c50e732c5fd'
          assert manifest['base'] == os.environ['AUDITED_BASE']
          expected = {x['path'] for x in data['changes']} | {'arrange/paper_draft/main.pdf', 'arrange/paper_draft/proof_free.pdf', 'interactive/readable_proof_dependency_graph.html'} | {f'arrange/_support/.paper_shortening_payload_{i:02}.b64' for i in range(5)}
          assert {x['path'] for x in manifest['entries']} == expected
          report = 'arrange/20260909_paper_shortening_implementation_report.md'
          changed = []
          with zipfile.ZipFile(source/'delivery.zip') as zin, zipfile.ZipFile(out/'delivery.zip','w',zipfile.ZIP_DEFLATED) as zout:
              for item in manifest['entries']:
                  name = item['path']
                  p = Path(name)
                  assert not p.is_absolute() and '..' not in p.parts and not p.is_symlink()
                  assert all(not a.is_symlink() for a in p.parents)
                  old = p.read_bytes() if p.exists() else None
                  assert (hashlib.sha256(old).hexdigest() if old is not None else None) == item['before'], name
                  if item['after'] is None:
                      p.unlink()
                  else:
                      content = zin.read(name)
                      assert hashlib.sha256(content).hexdigest() == item['after'], name
                      if name == report:
                          assert item['after'] == 'f93490499e5c63d813dcb99d0c942a5cb3aa0b8bbf301f553f9f0051155ad292'
                          fixed = b'\n'.join(line.rstrip() for line in content.split(b'\n'))
                          assert len(content)-len(fixed) == 6
                          content = fixed
                          item['after'] = hashlib.sha256(content).hexdigest()
                          assert item['after'] == '0a194d79350b3cd8b1bb143680f6efc9e46e654621c5d315405f0d8ff006f47f'
                      assert item['mode'] in ('0o644','0o755')
                      p.parent.mkdir(parents=True,exist_ok=True)
                      p.write_bytes(content)
                      p.chmod(int(item['mode'],8))
                      zout.writestr(name,content)
                  changed.append(name)
          subprocess.run(['git','add','--',*changed],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          manifest['validated_source_sha'] = manifest['source_sha']
          manifest['source_sha'] = os.environ['GITHUB_SHA']
          raw = json.dumps(manifest,indent=2,sort_keys=True).encode()
          (out/'manifest.json').write_bytes(raw)
          (out/'payload.gz').write_bytes(packed)
          with zipfile.ZipFile(source/'source.zip') as zin, zipfile.ZipFile(out/'source.zip','w',zipfile.ZIP_DEFLATED) as zout:
              for item in zin.infolist():
                  content = Path(report).read_bytes() if item.filename == report else zin.read(item.filename)
                  zout.writestr(item,content)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              print('manifest_sha='+hashlib.sha256(raw).hexdigest(),file=f)
          print('All mathematical sources, exact programs, navigation, and pinned PDFs retain their validated bytes.')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: paper-shortening-corrected
          path: /tmp/shortening-corrected/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: chatgpt/paper-shortening-20260909141118
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: paper-shortening-corrected
          path: /tmp/shortening-corrected
      - name: Commit and push only the validated delivery paths
        env:
          MANIFEST_SHA: ${{ needs.validate.outputs.manifest_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import gzip, hashlib, json, os, subprocess, zipfile
          from pathlib import Path
          out = Path('/tmp/shortening-corrected')
          raw = (out/'manifest.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest() == os.environ['MANIFEST_SHA']
          packed = (out/'payload.gz').read_bytes()
          assert hashlib.sha256(packed).hexdigest() == os.environ['PAYLOAD_SHA256']
          data = json.loads(gzip.decompress(packed))
          manifest = json.loads(raw)
          assert manifest['source_sha'] == os.environ['GITHUB_SHA'] and manifest['base'] == os.environ['AUDITED_BASE']
          expected = {x['path'] for x in data['changes']} | {'arrange/paper_draft/main.pdf', 'arrange/paper_draft/proof_free.pdf', 'interactive/readable_proof_dependency_graph.html'} | {f'arrange/_support/.paper_shortening_payload_{i:02}.b64' for i in range(5)}
          assert {x['path'] for x in manifest['entries']} == expected
          changed = []
          with zipfile.ZipFile(out/'delivery.zip') as z:
              for item in manifest['entries']:
                  name = item['path']
                  # The connected GitHub App will update CI and remove this workflow.
                  if name == '.github/workflows/ci.yml':
                      continue
                  p = Path(name)
                  assert not p.is_absolute() and '..' not in p.parts and not p.is_symlink()
                  assert all(not a.is_symlink() for a in p.parents)
                  old = p.read_bytes() if p.exists() else None
                  assert (hashlib.sha256(old).hexdigest() if old is not None else None) == item['before'], name
                  if item['after'] is None:
                      p.unlink()
                  else:
                      content = z.read(name)
                      assert hashlib.sha256(content).hexdigest() == item['after'], name
                      assert item['mode'] in ('0o644','0o755')
                      p.parent.mkdir(parents=True,exist_ok=True)
                      p.write_bytes(content)
                      p.chmod(int(item['mode'],8))
                  changed.append(name)
          subprocess.run(['git','add','--',*changed],check=True)
          actual = set(subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines())
          assert actual <= set(changed) and actual
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Shorten paper to 66 pages while preserving raw (3,0) normalization'
          git push origin "HEAD:refs/heads/$DELIVERY_BRANCH"
          git rev-parse HEAD | tee /tmp/shortening-corrected/PUBLISHED_SHA
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: paper-shortening-publication
          path: |
            /tmp/shortening-corrected/PUBLISHED_SHA
            /tmp/shortening-corrected/manifest.json
          if-no-files-found: error
          retention-days: 7
