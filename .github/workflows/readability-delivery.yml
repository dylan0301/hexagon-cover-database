name: Publish validated readability artifact
on:
  push:
    branches: [chatgpt/human-readable-paper-20260913145427]
    paths: [.github/workflows/readability-delivery.yml]
permissions:
  contents: read
concurrency:
  group: readability-publication-${{ github.ref }}
  cancel-in-progress: false
env:
  DELIVERY_BRANCH: chatgpt/human-readable-paper-20260913145427
jobs:
  publish:
    if: github.ref == 'refs/heads/chatgpt/human-readable-paper-20260913145427'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: readability-publication
          path: /tmp/readability-publication
          run-id: 34765602787
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Authenticate validated files and publish the whitespace correction
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$DELIVERY_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          python - <<'PY'
          import hashlib,json,shutil,subprocess
          from pathlib import Path
          out=Path('/tmp/readability-publication')
          m=json.loads((out/'manifest.json').read_text())
          policy=json.loads(Path('arrange/_support/readability_delivery_manifest.json').read_text())
          assert m['parent']=='a16a04df1b6065bbfe1d5ad39a92df3404136cb1'
          assert set(m['files'])==set(policy['sources'])|set(policy['generated'])
          for name,expected in m['files'].items():
              path=Path(name);src=out/'files'/path
              assert not path.is_absolute() and '..' not in path.parts and not src.is_symlink()
              assert hashlib.sha256(src.read_bytes()).hexdigest()==expected['sha256'],name
              mode=int(expected['mode'],8)
              assert mode in (0o644,0o755),name
              path.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(src,path);path.chmod(mode)
          report=Path(policy['report'])
          report.write_bytes(report.read_bytes().rstrip(b'\n')+b'\n')
          assert hashlib.sha256(report.read_bytes()).hexdigest()=='5e0ed8f984e2639cb814830af4bd0752ba2ac9c7c9d67d897fd29cf08ae91415'
          subprocess.run(['git','add','--',*m['files']],check=True)
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert changed<=set(m['files']) and changed
          print('Authenticated 44 validated files; only report EOF whitespace normalized')
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Revise both manuscripts for human readability; preserve all proofs and rebuild PDFs'
          git push origin "HEAD:refs/heads/$DELIVERY_BRANCH"
          sha=$(git rev-parse HEAD)
          test "$(git ls-remote origin "refs/heads/$DELIVERY_BRANCH" | cut -f1)" = "$sha"
          echo "Verified published commit: $sha"
