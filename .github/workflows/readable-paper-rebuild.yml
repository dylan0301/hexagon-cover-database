name: Reader-oriented paper and dependency graph

on:
  push:
    branches:
      - main
      - No-more-strategy-2
    paths:
      - 'arrange/readable_paper/**'
      - 'arrange/paper_draft/**'
      - 'proof/**'
      - 'interactive/readable_proof_dependency_graph.html'
      - 'interactive/readable_proof_dependency_data.json'
      - 'interactive/assets/readable_dependency/**'
      - 'tools/generate_readable_dependency_graph.py'
      - 'tools/verify_readable_additive.py'
      - 'tools/verify_readable_html.py'
      - 'tools/proof_lint.py'
      - 'tools/verify_pdf_render.py'
      - '.github/workflows/readable-paper-rebuild.yml'
  pull_request:
    paths:
      - 'arrange/readable_paper/**'
      - 'arrange/paper_draft/**'
      - 'proof/**'
      - 'interactive/readable_proof_dependency_graph.html'
      - 'interactive/readable_proof_dependency_data.json'
      - 'interactive/assets/readable_dependency/**'
      - 'tools/generate_readable_dependency_graph.py'
      - 'tools/verify_readable_additive.py'
      - 'tools/verify_readable_html.py'
      - 'tools/proof_lint.py'
      - 'tools/verify_pdf_render.py'
      - '.github/workflows/readable-paper-rebuild.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readable-paper-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_DATE_EPOCH: '946684800'
  FORCE_SOURCE_DATE: '1'
  TZ: UTC

jobs:
  audit-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install proof-audit dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-proof.txt
          python -m pip install --disable-pip-version-check 'mistune==3.1.3'

      - name: Verify additive source preservation
        run: python tools/verify_readable_additive.py

      - name: Regenerate and compare dependency graph
        run: python tools/generate_readable_dependency_graph.py --check

      - name: Audit the interactive HTML and graph
        run: python tools/verify_readable_html.py

      - name: Run repository proof linter
        run: python tools/proof_lint.py

      - name: Verify exact zero-gap certificate
        run: |
          python proof/3XXX_CE0/31XX_Nplus1/310X_all_Vd0/3105X_self_contained_direct_Vd0_nine_point/3105X_computation/verify_global_core_positivity.py

      - name: Build reader-oriented paper in pinned TeX Live 2025
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80
        with:
          docker_image: >-
            ghcr.io/xu-cheng/texlive-historic-debian:2025@sha256:d3e42adc0c8d84bc913bfc33571feaf7037616260a771bb6f027504661568bf6
          run: |
            set -euo pipefail
            export SOURCE_DATE_EPOCH=946684800
            export FORCE_SOURCE_DATE=1
            export TZ=UTC
            cd arrange/readable_paper
            ./build.sh

      - name: Verify page count
        run: |
          python - <<'PY'
          from pathlib import Path
          import fitz
          pdf = Path('arrange/readable_paper/main.pdf')
          if not pdf.is_file():
              raise SystemExit('reader-oriented PDF was not generated')
          pages = fitz.open(pdf).page_count
          print(f'Reader-oriented PDF pages: {pages}')
          if not 85 <= pages <= 110:
              raise SystemExit(f'Unexpected reader-oriented paper length: {pages} pages')
          PY

      - name: Verify PDF rendering
        run: python tools/verify_pdf_render.py arrange/readable_paper/main.pdf

      - name: Verify canonical committed PDF
        run: |
          set -euo pipefail
          git diff --exit-code -- arrange/readable_paper/main.pdf
          sha256sum arrange/readable_paper/main.pdf

      - name: Upload reader-oriented publication artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reader-oriented-paper-and-dependency-graph
          path: |
            arrange/readable_paper/main.pdf
            arrange/readable_paper/IMPLEMENTATION_REPORT.md
            interactive/readable_proof_dependency_graph.html
            interactive/readable_proof_dependency_data.json
            interactive/assets/readable_dependency/zero_gap_nine_point_witness.png
          if-no-files-found: error
