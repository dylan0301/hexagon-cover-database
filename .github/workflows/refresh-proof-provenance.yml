name: Apply final proof-audit repairs and rebuild paper

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-proof-provenance.yml

permissions:
  contents: write

concurrency:
  group: final-proof-audit-main
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      SOURCE_DATE_EPOCH: '946684800'
      FORCE_SOURCE_DATE: '1'
      TZ: UTC
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Apply audited source repairs and generate manifests
        run: |
          set -euo pipefail
          python tools/apply_final_audit_repair_followup.py
          python tools/apply_final_audit_repairs.py
          rm -f .github/workflows/refresh-proof-provenance.yml
          rm -f tools/apply_final_audit_repair_followup.py
          rm -f tools/apply_final_audit_repairs.py
          rm -f arrange/provenance_refresh_failure.log arrange/final_audit_repair_failure.log
          python tools/generate_active_dependency_graph.py
          python tools/generate_proof_manifest.py

      - name: Install pinned proof dependency
        run: python -m pip install --disable-pip-version-check -r requirements-proof.txt

      - name: Verify proof sources and replay exact certificates
        run: |
          set -euo pipefail
          python tools/generate_active_dependency_graph.py --check
          python tools/generate_proof_manifest.py --check
          python tools/proof_lint.py
          git diff --check
          cd proof/3XXX_CE0/31XX_Nplus1/310X_all_Vd0/3105X_self_contained_direct_Vd0_nine_point/3105X_computation
          python verify_mixed_overlap_core_derivation.py | tee /tmp/mixed-derivation.log
          python verify_global_core_positivity.py | tee /tmp/global-positivity.log

      - name: Install TeX and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-xetex texlive-latex-extra texlive-fonts-recommended poppler-utils

      - name: Compile deterministic PDF and record verification metadata
        working-directory: arrange/paper_draft
        run: |
          set -euo pipefail
          rm -f main.pdf main.aux main.fdb_latexmk main.fls main.log main.out main.toc main.xdv main.synctex.gz
          latexmk -xelatex -interaction=nonstopmode -halt-on-error -file-line-error main.tex
          if grep -Eq 'LaTeX Warning: (Reference .* undefined|There were undefined references|Label .* multiply defined)' main.log; then
            echo 'Undefined or multiply-defined references found.' >&2
            exit 1
          fi
          pdfinfo main.pdf | tee /tmp/pdfinfo.txt
          pages=$(awk '/^Pages:/ {print $2}' /tmp/pdfinfo.txt)
          test -n "$pages"
          rm -rf /tmp/rendered
          mkdir -p /tmp/rendered
          pdftoppm -png -r 72 main.pdf /tmp/rendered/page >/dev/null
          rendered=$(find /tmp/rendered -maxdepth 1 -name 'page-*.png' | wc -l)
          test "$rendered" -eq "$pages"
          pdf_sha=$(sha256sum main.pdf | awk '{print $1}')
          python_version=$(python --version 2>&1)
          sympy_version=$(python -c 'import sympy; print(sympy.__version__)')
          xelatex_version=$(xelatex --version | head -n 1)
          latexmk_version=$(latexmk -v | head -n 1)

          python - "$pages" "$pdf_sha" "$python_version" "$sympy_version" "$xelatex_version" "$latexmk_version" "$GITHUB_SHA" "$GITHUB_RUN_ID" <<'PY'
          from pathlib import Path
          import sys

          pages, pdf_sha, python_version, sympy_version, xelatex_version, latexmk_version, source_sha, run_id = sys.argv[1:]
          root = Path('../..')
          summary = root / 'arrange/20260802_verification_summary.txt'
          summary.write_text(
              'Final proof and paper verification\n'
              '==================================\n'
              f'Source commit: {source_sha}\n'
              f'GitHub Actions run: {run_id}\n'
              'proof_lint.py: PASS\n'
              'transitive dependency graph: PASS\n'
              'two-way proof manifest: PASS\n'
              '407X Git-blob manifest: PASS\n'
              'Strategy 4 Git-blob manifest: PASS\n'
              'verify_mixed_overlap_core_derivation.py: PASS\n'
              'verify_global_core_positivity.py: PASS\n'
              'latexmk -xelatex -halt-on-error main.tex: PASS\n'
              f'PDF pages rendered: {pages}\n'
              f'PDF SHA-256: {pdf_sha}\n'
              'Certificate transcript SHA-256: dc46aaf263655d5159ecd3a81db72ee82477951d06172f4743b248df37209485\n'
              f'Python: {python_version}\n'
              f'SymPy: {sympy_version}\n'
              f'XeLaTeX: {xelatex_version}\n'
              f'latexmk: {latexmk_version}\n'
              'SOURCE_DATE_EPOCH: 946684800\n',
              encoding='utf-8',
          )

          audit = root / 'arrange/20260802_repair_and_reaudit.md'
          text = audit.read_text(encoding='utf-8')
          metadata = (
              '## Final build metadata\n\n'
              f'- Source commit: `{source_sha}`\n'
              f'- GitHub Actions run: `{run_id}`\n'
              f'- PDF page count: **{pages}**\n'
              f'- PDF SHA-256: `{pdf_sha}`\n'
              '- All source, provenance, exact-certificate, LaTeX, and page-render checks passed.\n'
          )
          audit.write_text(text.replace('BUILD_METADATA_PLACEHOLDER', metadata), encoding='utf-8')

          ledger = root / 'arrange/paper_draft/source_ledger.md'
          text = ledger.read_text(encoding='utf-8')
          marker = '`../20260802_verification_summary.txt`.'
          addition = f' The verified build contains **{pages} pages** and has SHA-256 `{pdf_sha}`.'
          if addition not in text:
              text = text.replace(marker, marker + addition)
          ledger.write_text(text, encoding='utf-8')
          PY

          rm -f main.aux main.fdb_latexmk main.fls main.log main.out main.toc main.xdv main.synctex.gz

      - name: Re-run checks on exact commit contents
        run: |
          set -euo pipefail
          python tools/generate_active_dependency_graph.py --check
          python tools/generate_proof_manifest.py --check
          python tools/proof_lint.py
          git diff --check
          test -s arrange/paper_draft/main.pdf
          test -s arrange/20260802_verification_summary.txt

      - name: Commit repairs and rebuilt PDF directly to main
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'complete proof audit repairs and rebuild paper'
          git push origin HEAD:main

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success()
        with:
          name: final-verified-hexagon-cover-paper
          path: |
            arrange/paper_draft/main.pdf
            arrange/20260802_repair_and_reaudit.md
            arrange/20260802_verification_summary.txt
            /tmp/pdfinfo.txt
            /tmp/mixed-derivation.log
            /tmp/global-positivity.log
          if-no-files-found: error

      - name: Record repair failure
        if: failure()
        run: |
          set +e
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git restore .github/workflows/refresh-proof-provenance.yml 2>/dev/null || true
          {
            echo 'Final proof-audit repair failed.'
            echo "Source commit: $GITHUB_SHA"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo 'Inspect the workflow job log for the failing command.'
          } > arrange/final_audit_repair_failure.log
          git add arrange/final_audit_repair_failure.log
          git commit -m 'record final proof-audit repair failure'
          git push origin HEAD:main
