name: Shortening source transport
on:
  push:
    branches: [chatgpt/reusable-lemmas-shortening-20260922232121]
    paths: [.github/workflows/shortening-transport.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    if: github.ref == 'refs/heads/chatgpt/reusable-lemmas-shortening-20260922232121'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Export reviewed baseline with Git metadata
        run: |
          git checkout --detach a4f44a8b52c5097e07b82d2e4dec7efb83dd80e4
          tar -czf /tmp/hexagon-source.tar.gz .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: shortening-source-snapshot
          path: /tmp/hexagon-source.tar.gz
          retention-days: 1
          if-no-files-found: error
