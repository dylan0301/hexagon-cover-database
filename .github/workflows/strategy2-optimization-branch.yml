name: Strategy 2 optimization extraction and PDF

on:
  push:
    branches:
      - agent/strategy2-optimization-separation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: strategy2-optimization-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_DATE_EPOCH: '946684800'
  FORCE_SOURCE_DATE: '1'
  TZ: UTC

jobs:
  extract-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Apply Strategy 2 extraction and split
        run: |
          set -euo pipefail
          python tools/apply_strategy2_optimization_extraction.py
          git diff --check
          test -s formalization/strategy2_optimization/Strategy2OptimizationProblems.lean
          grep -q 'theorem problemS2T3' formalization/strategy2_optimization/Strategy2OptimizationProblems.lean
          test "$(grep -c 'sorry' formalization/strategy2_optimization/Strategy2OptimizationProblems.lean)" -ge 10

      - name: Install pinned proof dependency
        run: python -m pip install --disable-pip-version-check -r requirements-proof.txt

      - name: Verify repository source invariants
        run: |
          set -euo pipefail
          python tools/generate_active_dependency_graph.py --check
          python tools/generate_proof_manifest.py --check
          python tools/proof_lint.py
          git diff --check

      - name: Install TeX and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-xetex texlive-latex-extra texlive-fonts-recommended poppler-utils

      - name: Compile and render the paper
        working-directory: arrange/paper_draft
        run: |
          set -euo pipefail
          rm -f main.pdf main.aux main.fdb_latexmk main.fls main.log main.out main.toc main.xdv main.synctex.gz
          latexmk -xelatex -interaction=nonstopmode -halt-on-error -file-line-error main.tex
          if grep -Eq 'LaTeX Warning: (Reference .* undefined|There were undefined references|Label .* multiply defined)' main.log; then
            echo 'Undefined or multiply-defined references found.' >&2
            exit 1
          fi
          pdfinfo main.pdf | tee /tmp/strategy2-pdfinfo.txt
          pages=$(awk '/^Pages:/ {print $2}' /tmp/strategy2-pdfinfo.txt)
          test -n "$pages"
          rm -rf /tmp/strategy2-rendered
          mkdir -p /tmp/strategy2-rendered
          pdftoppm -png -r 72 main.pdf /tmp/strategy2-rendered/page >/dev/null
          rendered=$(find /tmp/strategy2-rendered -maxdepth 1 -name 'page-*.png' | wc -l)
          test "$rendered" -eq "$pages"
          pdf_sha=$(sha256sum main.pdf | awk '{print $1}')
          python - "$pages" "$pdf_sha" "$GITHUB_SHA" "$GITHUB_RUN_ID" <<'PY'
          from pathlib import Path
          import sys

          pages, pdf_sha, source_sha, run_id = sys.argv[1:]
          path = Path("../20260807_strategy2_optimization_extraction_audit.md")
          text = path.read_text(encoding="utf-8").rstrip()
          block = (
              "\n\n## Branch build result\n\n"
              "- Source commit that triggered the build: `" + source_sha + "`\n"
              "- GitHub Actions run: `" + run_id + "`\n"
              "- Repository source checks: **PASS**\n"
              "- XeLaTeX/latexmk compilation: **PASS**\n"
              "- Undefined or multiply-defined references: **none detected**\n"
              "- Rendered PDF pages: **" + pages + "**\n"
              "- PDF SHA-256: `" + pdf_sha + "`\n"
              "- Lean scope: problem statements only; `sorry` retained intentionally.\n"
          )
          path.write_text(text + block, encoding="utf-8")
          PY
          rm -f main.aux main.fdb_latexmk main.fls main.log main.out main.toc main.xdv main.synctex.gz

      - name: Re-run checks on commit contents
        run: |
          set -euo pipefail
          python tools/generate_active_dependency_graph.py --check
          python tools/generate_proof_manifest.py --check
          python tools/proof_lint.py
          git diff --check
          test -s arrange/paper_draft/main.pdf

      - name: Commit extracted domains, Lean shell, and rebuilt PDF
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'complete Strategy 2 optimization extraction and rebuild paper'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: strategy2-optimization-paper
          path: |
            arrange/paper_draft/main.pdf
            arrange/20260807_strategy2_optimization_extraction_audit.md
            formalization/strategy2_optimization/Strategy2OptimizationProblems.lean
            formalization/strategy2_optimization/README.md
            /tmp/strategy2-pdfinfo.txt
          if-no-files-found: error
