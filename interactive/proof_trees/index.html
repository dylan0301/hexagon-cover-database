i>U<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> with <span class=\"math-inline\"><math aria-label=\"i=j-1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>i<\/mi>\n<mo>=<\/mo>\n<mi>j<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<\/math><\/span> or <span class=\"math-inline\"><math aria-label=\"j+1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>j<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"M_j\\in U_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>j<\/mi>\n<\/msub>\n<mo>∈<\/mo>\n<msub>\n<mi>U<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>. “Rescuer” means the same thing here. Supplying a midpoint implies positive support by openness; positive support alone does not imply supplying that midpoint. <span class=\"math-inline\"><math aria-label=\"N_{\\rm sp}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>N<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi mathvariant=\"normal\">s<\/mi>\n<mi mathvariant=\"normal\">p<\/mi>\n<\/mrow>\n<\/msub>\n<\/math><\/span> counts V triangles having positive adjacent support.<\/li>\n<li><strong>Type labels.<\/strong> CE0, CE1, CE2 count the boundary edges met by <span class=\"math-inline\"><math aria-label=\"T_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> in positive length; they do not count gaps. For a V triangle let <span class=\"math-inline\"><math aria-label=\"o\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>o<\/mi>\n<\/math><\/span> count its vertices outside <span class=\"math-inline\"><math aria-label=\"H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>H<\/mi>\n<\/math><\/span>, and <span class=\"math-inline\"><math aria-label=\"n\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>n<\/mi>\n<\/math><\/span> its neighboring spokes met in positive length. Vd0 means <span class=\"math-inline\"><math aria-label=\"n=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>n<\/mi>\n<mo>=<\/mo>\n<mn>0<\/mn>\n<\/math><\/span>; Vd1 means <span class=\"math-inline\"><math aria-label=\"(o,n)=(1,1)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<mi>o<\/mi>\n<mo>,<\/mo>\n<mi>n<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>; Vd2 means <span class=\"math-inline\"><math aria-label=\"(1,2)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>,<\/mo>\n<mn>2<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>; T3-like means <span class=\"math-inline\"><math aria-label=\"(2,1)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<mn>2<\/mn>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>. The names are labels, not additional assumptions.<\/li>\n<li><strong>Chart and side slack.<\/strong> A chart is a coordinate description, not a new geometric object. Here <span class=\"math-inline\"><math aria-label=\"X=V_0+x(V_1-V_0)+y(V_5-V_0)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>X<\/mi>\n<mo>=<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>+<\/mo>\n<mi>x<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<mo>−<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo stretchy=\"false\">)<\/mo>\n<mo>+<\/mo>\n<mi>y<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>5<\/mn>\n<\/msub>\n<mo>−<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>, so the local wedge is <span class=\"math-inline\"><math aria-label=\"x,y\\ge0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>x<\/mi>\n<mo>,<\/mo>\n<mi>y<\/mi>\n<mo>≥<\/mo>\n<mn>0<\/mn>\n<\/math><\/span>, the center has coordinates <span class=\"math-inline\"><math aria-label=\"(1,1)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>, and neighboring spokes lie on <span class=\"math-inline\"><math aria-label=\"x=1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>x<\/mi>\n<mo>=<\/mo>\n<mn>1<\/mn>\n<\/math><\/span> or <span class=\"math-inline\"><math aria-label=\"y=1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>y<\/mi>\n<mo>=<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>. A side slack is an affine function whose nonnegative values define one closed half-plane of the triangle. A negative value proves exclusion even from the closure.<\/li>\n<\/ul><\/details>\n<p><strong>Statement.<\/strong> If an original vertex role is T3-like, then <span class=\"math-inline\"><math aria-label=\"M_i\\notin T_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>∉<\/mo>\n<msub>\n<mi>T<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>. This is a short side-inequality check, not a calculation leaf.<\/p>\n<h2>Tree<\/h2>\n<ul class=\"proof-tree\">\n<li><details open=\"\"><summary><strong>Normalize the vertex and supported spoke.<\/strong>\n<\/summary><ul>\n<li>Use <span class=\"math-inline\"><math aria-label=\"V_0=(0,0)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>0<\/mn>\n<mo>,<\/mo>\n<mn>0<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"O=(1,1)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"M_0=(1/2,1/2)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> in the local wedge coordinates.<\/li>\n<li>Reflect so that the positive neighboring support is on the spoke <span class=\"math-inline\"><math aria-label=\"x=1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>x<\/mi>\n<mo>=<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<li>The T3-like orientation has the Type-II side description below, with <span class=\"math-inline\"><math aria-label=\"0&lt;t&lt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>0<\/mn>\n<mo>&lt;<\/mo>\n<mi>t<\/mi>\n<mo>&lt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<li>Set <span class=\"math-inline\"><math aria-label=\"z=\\sqrt{1-t+t^2}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>z<\/mi>\n<mo>=<\/mo>\n<msqrt>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>t<\/mi>\n<mo>+<\/mo>\n<msup>\n<mi>t<\/mi>\n<mn>2<\/mn>\n<\/msup>\n<\/msqrt>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"\\Delta=z^2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi mathvariant=\"normal\">Δ<\/mi>\n<mo>=<\/mo>\n<msup>\n<mi>z<\/mi>\n<mn>2<\/mn>\n<\/msup>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Write the relevant sides.<\/strong>\n<\/summary><ul>\n<li><span class=\"math-inline\"><math aria-label=\"F(x,y)=\\alpha+(1-t)x+ty\\ge0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>F<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>x<\/mi>\n<mo>,<\/mo>\n<mi>y<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mi>α<\/mi>\n<mo>+<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>t<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mi>x<\/mi>\n<mo>+<\/mo>\n<mi>t<\/mi>\n<mi>y<\/mi>\n<mo>≥<\/mo>\n<mn>0<\/mn>\n<\/math><\/span>.<\/li>\n<li><span class=\"math-inline\"><math aria-label=\"G(x,y)=\\beta+tx-y\\ge0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>G<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>x<\/mi>\n<mo>,<\/mo>\n<mi>y<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mi>β<\/mi>\n<mo>+<\/mo>\n<mi>t<\/mi>\n<mi>x<\/mi>\n<mo>−<\/mo>\n<mi>y<\/mi>\n<mo>≥<\/mo>\n<mn>0<\/mn>\n<\/math><\/span>.<\/li>\n<li><span class=\"math-inline\"><math aria-label=\"F+G\\le z\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>F<\/mi>\n<mo>+<\/mo>\n<mi>G<\/mi>\n<mo>≤<\/mo>\n<mi>z<\/mi>\n<\/math><\/span>, where <span class=\"math-inline\"><math aria-label=\"\\alpha,\\beta&gt;0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>α<\/mi>\n<mo>,<\/mo>\n<mi>β<\/mi>\n<mo>&gt;<\/mo>\n<mn>0<\/mn>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"\\alpha+\\beta&lt;z\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>α<\/mi>\n<mo>+<\/mo>\n<mi>β<\/mi>\n<mo>&lt;<\/mo>\n<mi>z<\/mi>\n<\/math><\/span>.<\/li>\n<li>The unique wedge vertex has first coordinate <span class=\"math-inline\"><math aria-label=\"(z-\\alpha-t\\beta)/\\Delta\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<mi>z<\/mi>\n<mo>−<\/mo>\n<mi>α<\/mi>\n<mo>−<\/mo>\n<mi>t<\/mi>\n<mi>β<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mi mathvariant=\"normal\">Δ<\/mi>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Use positive neighboring support.<\/strong>\n<\/summary><ul>\n<li>This first coordinate exceeds <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<li>Therefore <span class=\"math-inline\"><math aria-label=\"\\beta&lt;(z-\\alpha-\\Delta)/t&lt;(z-z^2)/t\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>β<\/mi>\n<mo>&lt;<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mi>z<\/mi>\n<mo>−<\/mo>\n<mi>α<\/mi>\n<mo>−<\/mo>\n<mi mathvariant=\"normal\">Δ<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mi>t<\/mi>\n<mo>&lt;<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mi>z<\/mi>\n<mo>−<\/mo>\n<msup>\n<mi>z<\/mi>\n<mn>2<\/mn>\n<\/msup>\n<mo stretchy=\"false\">)<\/mo>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mi>t<\/mi>\n<\/math><\/span>.<\/li>\n<li>The identity <span class=\"math-inline\"><math aria-label=\"t(1-t)-2(z-z^2)=(1-z)^2&gt;0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>t<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>t<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>−<\/mo>\n<mn>2<\/mn>\n<mo stretchy=\"false\">(<\/mo>\n<mi>z<\/mi>\n<mo>−<\/mo>\n<msup>\n<mi>z<\/mi>\n<mn>2<\/mn>\n<\/msup>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>z<\/mi>\n<msup>\n<mo stretchy=\"false\">)<\/mo>\n<mn>2<\/mn>\n<\/msup>\n<mo>&gt;<\/mo>\n<mn>0<\/mn>\n<\/math><\/span> gives <span class=\"math-inline\"><math aria-label=\"\\beta&lt;(1-t)/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>β<\/mi>\n<mo>&lt;<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>t<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Test the own midpoint.<\/strong>\n<\/summary><ul>\n<li><span class=\"math-inline\"><math aria-label=\"G(M_0)=\\beta+t/2-1/2=\\beta-(1-t)/2&lt;0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>G<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<msub>\n<mi>M<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mi>β<\/mi>\n<mo>+<\/mo>\n<mi>t<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<mo>=<\/mo>\n<mi>β<\/mi>\n<mo>−<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>t<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<mo>&lt;<\/mo>\n<mn>0<\/mn>\n<\/math><\/span>.<\/li>\n<li>Hence <span class=\"math-inline\"><math aria-label=\"M_0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<\/math><\/span> lies outside the closed triangle.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Undo the normalization.<\/strong>\n<\/summary><ul>\n<li>Every original T3-like role misses its own midpoint.<\/li>\n<li>In the unique-supplier configuration, a T3-like supplier must therefore be based at the center midpoint index — <a class=\"node-link\" href=\"#/SUPPLIER\">[SUPPLIER]<\/a>.<\/li>\n<\/ul>\n<\/details><\/li>\n<\/ul>\n<h2>Why this chart is sufficient<\/h2>\n<p>Type I is the alternative coordinate form <span class=\"math-inline\"><math aria-label=\"F=\\alpha+y-tx\\ge0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>F<\/mi>\n<mo>=<\/mo>\n<mi>α<\/mi>\n<mo>+<\/mo>\n<mi>y<\/mi>\n<mo>−<\/mo>\n<mi>t<\/mi>\n<mi>x<\/mi>\n<mo>≥<\/mo>\n<mn>0<\/mn>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"G=\\beta+x-(1-t)y\\ge0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>G<\/mi>\n<mo>=<\/mo>\n<mi>β<\/mi>\n<mo>+<\/mo>\n<mi>x<\/mi>\n<mo>−<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>t<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mi>y<\/mi>\n<mo>≥<\/mo>\n<mn>0<\/mn>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"F+G\\le z\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>F<\/mi>\n<mo>+<\/mo>\n<mi>G<\/mi>\n<mo>≤<\/mo>\n<mi>z<\/mi>\n<\/math><\/span>, with the same <span class=\"math-inline\"><math aria-label=\"z=\\sqrt{1-t+t^2}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>z<\/mi>\n<mo>=<\/mo>\n<msqrt>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>t<\/mi>\n<mo>+<\/mo>\n<msup>\n<mi>t<\/mi>\n<mn>2<\/mn>\n<\/msup>\n<\/msqrt>\n<\/math><\/span>. The local classification in source 1201 shows that a Type-I triangle with two outside vertices has no positive neighboring support. Hence a T3-like role must use the Type-II chart (after reflection). The endpoint orientations <span class=\"math-inline\"><math aria-label=\"t=0,1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>t<\/mi>\n<mo>=<\/mo>\n<mn>0<\/mn>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<\/math><\/span> likewise have no positive neighboring support. No translation of the original role is used in the midpoint test.<\/p>\n<hr/>\n<p><strong>Proof sources:<\/strong> <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/1XXX_foundations/12XX_V_triangle/1201_V_triangle_types.md\" rel=\"noopener noreferrer\" target=\"_blank\">1201<\/a> · <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/2XXX_geometric_lemmas/26XX_enclosing_triangle_tools/2613_midpoint_supplier_reduction.md\" rel=\"noopener noreferrer\" target=\"_blank\">2613<\/a>. All source links are pinned to the same repository snapshot.<\/p>\n<p><a class=\"node-link\" href=\"#/MAIN\">[MAIN]<\/a> Return to the main tree.<\/p>\n"},"USE":{"id":"USE","file":"USING.md","title":"Opening and navigating the tree bundle","group":"Reference","html":"<h1>[USE] Opening and navigating the tree bundle<\/h1>\n<p><a class=\"node-link\" href=\"#/MAIN\">[MAIN]<\/a> · <a class=\"node-link\" href=\"#/NOTATION\">[NOTATION]<\/a><\/p>\n<p><strong>Start at <code>README.md<\/code> in a Markdown preview. The downloadable bundle also includes an offline <code>index.html<\/code>; a repository checkout can generate it with the commands below.<\/strong> Keep the folder together so relative links continue to work.<\/p>\n<details class=\"local-terms\" open=\"\"><summary>Terms used here<\/summary><p>A <strong>tree<\/strong> is a hierarchy of statements and their reasons. A bracketed label is a page link, not a mathematical variable. Markdown preview means the rendered view of a <code>.md<\/code> file; raw text still shows the indentation but does not activate links. A calculation leaf is where the conceptual tree stops expanding a long verification. <a class=\"node-link\" href=\"#/GLOSSARY\">GLOSSARY<\/a> defines the mathematical vocabulary; each argument page also repeats the definitions it needs.<\/p><\/details>\n<h2>Tree<\/h2>\n<ul class=\"proof-tree\">\n<li><details open=\"\"><summary><strong>Markdown view.<\/strong>\n<\/summary><ul>\n<li>Every tree is a nested Markdown list, not a fenced code block.<\/li>\n<li>Bracketed labels are real links to separate <code>.md<\/code> files.<\/li>\n<li>Example: click <a class=\"node-link\" href=\"#/D\">[D]<\/a> to open <code>D.md<\/code>; its own children and calculation leaf are clickable.<\/li>\n<li>Top and bottom navigation links return to <a class=\"node-link\" href=\"#/MAIN\">[MAIN]<\/a> or related parent trees.<\/li>\n<li>Mathematical expressions use standard dollar-delimited LaTeX; display depends on the Markdown renderer's math support.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Offline browser view.<\/strong>\n<\/summary><ul>\n<li>Open <code>index.html<\/code>; no server or internet connection is required for the local trees.<\/li>\n<li>Click a node label to change pages.<\/li>\n<li>Click a disclosure triangle to expand or collapse a branch.<\/li>\n<li>Use the page selector, Back button, or Main button to navigate.<\/li>\n<li>Use Expand all / Collapse all for the current tree.<\/li>\n<li>Equations are embedded as MathML; no external font or script files are bundled.<\/li>\n<li>External proof-source links open GitHub and require internet access.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Separate flow from detail.<\/strong>\n<\/summary><ul>\n<li>Main geometry and short midpoint arguments remain in the proof-tree pages.<\/li>\n<li>A CALCULATION LEAF links to a page in <code>details/<\/code>.<\/li>\n<li>Those pages state the required inputs and outputs and link to the exact repository derivations.<\/li>\n<li>They do not claim to reproduce every long calculation or the complete certificate data.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Read in proof order.<\/strong>\n<\/summary><ul>\n<li><a class=\"node-link\" href=\"#/SETUP\">[SETUP]<\/a> → <a class=\"node-link\" href=\"#/CLASSIFICATION\">[CLASSIFICATION]<\/a> → <a class=\"node-link\" href=\"#/MIDPOINTS\">[MIDPOINTS]<\/a>.<\/li>\n<li>Shared enclosure idea <a class=\"node-link\" href=\"#/WITNESS\">[WITNESS]<\/a>; selected-gap theorem <a class=\"node-link\" href=\"#/BC\">[BC]<\/a>; then <a class=\"node-link\" href=\"#/N0\">[N0]<\/a>.<\/li>\n<li>Zero-gap branches <a class=\"node-link\" href=\"#/F\">[F]<\/a> and <a class=\"node-link\" href=\"#/AREA\">[AREA]<\/a>.<\/li>\n<li>Nonzero-gap count <a class=\"node-link\" href=\"#/LENGTH\">[LENGTH]<\/a> and routing <a class=\"node-link\" href=\"#/SUPPLIER\">[SUPPLIER]<\/a>.<\/li>\n<li>Finish with <a class=\"node-link\" href=\"#/D\">[D]<\/a>, <a class=\"node-link\" href=\"#/PERIMETER\">[PERIMETER]<\/a>, or <a class=\"node-link\" href=\"#/REPLACEMENT\">[REPLACEMENT]<\/a> as required.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Scope and provenance.<\/strong>\n<\/summary><ul>\n<li>All repository source links are pinned to <code>f7fe2f89cde04903cba8ba347bd0645abee9b905<\/code>.<\/li>\n<li>This is a presentation layer built from the discussed repository proof, not an independent full proof audit.<\/li>\n<li>This directory is maintained in the repository under <code>interactive/proof_trees/<\/code>. Uploading HTML to GitHub does not itself deploy a website; GitHub displays its source.<\/li>\n<\/ul>\n<\/details><\/li>\n<\/ul>\n<h2>Complete page map<\/h2>\n<ul class=\"proof-tree\">\n<li><details open=\"\"><summary><a class=\"node-link\" href=\"#/MAIN\">[MAIN]<\/a>\n<\/summary><ul>\n<li><details open=\"\"><summary><a class=\"node-link\" href=\"#/SETUP\">[SETUP]<\/a>\n<\/summary><ul>\n<li><a class=\"node-link\" href=\"#/CLASSIFICATION\">[CLASSIFICATION]<\/a><\/li>\n<li><details open=\"\"><summary><a class=\"node-link\" href=\"#/MIDPOINTS\">[MIDPOINTS]<\/a>\n<\/summary><ul>\n<li><a class=\"node-link\" href=\"#/C-MIDPOINT\">[C-MIDPOINT]<\/a><\/li>\n<li><a class=\"node-link\" href=\"#/SELF-MIDPOINT\">[SELF-MIDPOINT]<\/a><\/li>\n<li><a class=\"node-link\" href=\"#/T3-MIDPOINT\">[T3-MIDPOINT]<\/a><\/li>\n<\/ul>\n<\/details><\/li>\n<\/ul>\n<\/details><\/li>\n<li><a class=\"node-link\" href=\"#/N0\">[N0]<\/a><\/li>\n<li><details open=\"\"><summary><a class=\"node-link\" href=\"#/SUPPLIER\">[SUPPLIER]<\/a>\n<\/summary><ul>\n<li><a class=\"node-link\" href=\"#/LENGTH\">[LENGTH]<\/a><\/li>\n<li><a class=\"node-link\" href=\"#/BC\">[BC]<\/a><\/li>\n<li><a class=\"node-link\" href=\"#/D\">[D]<\/a><\/li>\n<li><a class=\"node-link\" href=\"#/PERIMETER\">[PERIMETER]<\/a><\/li>\n<li><a class=\"node-link\" href=\"#/REPLACEMENT\">[REPLACEMENT]<\/a><\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><a class=\"node-link\" href=\"#/F\">[F]<\/a>\n<\/summary><ul>\n<li><a class=\"node-link\" href=\"#/CALIPERS\">[CALIPERS]<\/a><\/li>\n<\/ul>\n<\/details><\/li>\n<li><a class=\"node-link\" href=\"#/AREA\">[AREA]<\/a><\/li>\n<li><a class=\"node-link\" href=\"#/WITNESS\">[WITNESS]<\/a><\/li>\n<li><a class=\"node-link\" href=\"#/NOTATION\">[NOTATION]<\/a><\/li>\n<li><details open=\"\"><summary>Calculation leaves\n<\/summary><ul>\n<li><a class=\"node-link\" href=\"#/BC-CALC\">[BC-CALC]<\/a><\/li>\n<li><a class=\"node-link\" href=\"#/D-CALC\">[D-CALC]<\/a><\/li>\n<li><a class=\"node-link\" href=\"#/F-CALC\">[F-CALC]<\/a><\/li>\n<li><a class=\"node-link\" href=\"#/BOUNDS\">[BOUNDS]<\/a><\/li>\n<li><a class=\"node-link\" href=\"#/REPLACE-CALC\">[REPLACE-CALC]<\/a><\/li>\n<li><a class=\"node-link\" href=\"#/HANDOFFS\">[HANDOFFS]<\/a><\/li>\n<\/ul>\n<\/details><\/li>\n<\/ul>\n<\/details><\/li>\n<\/ul>\n<p><a class=\"node-link\" href=\"#/MAIN\">[MAIN]<\/a> Return to the main tree.<\/p>\n<h2>Build and check the offline viewer<\/h2>\n<p>Markdown navigation on GitHub requires no installation. To create the single-file browser viewer from a repository checkout, run from <code>interactive/proof_trees/<\/code>:<\/p>\n<pre><code class=\"language-bash\">python -m pip install -r requirements.txt\nnpm install --ignore-scripts --no-audit --no-fund\npython check.py\npython build.py\npython check.py --html\npython build.py --check\n<\/code><\/pre>\n<p>Then open the generated <code>index.html<\/code>. Build dependencies are pinned; only the build needs Python, Node, and the installed packages. The generated file embeds the pages and MathML and does not use external scripts or fonts. It is tracked alongside the Markdown and checked against a deterministic rebuild in CI. The Markdown, renderer, and mathematical proof sources remain authoritative.<\/p>\n<p>Use the <strong>Start here<\/strong> and <strong>Glossary<\/strong> buttons for vocabulary. Each page's <strong>Terms used here<\/strong> panel is open initially and can be folded once familiar. The expansion state of each page is remembered during that browser session.<\/p>\n"},"WITNESS":{"id":"WITNESS","file":"WITNESS.md","title":"The common fixed-point enclosure contradiction","group":"Proof trees","html":"<h1>[WITNESS] The common fixed-point enclosure contradiction<\/h1>\n<p><a class=\"node-link\" href=\"#/MAIN\">[MAIN]<\/a> · <a class=\"node-link\" href=\"#/NOTATION\">[NOTATION]<\/a> · <a class=\"node-link\" href=\"#/USE\">[USE]<\/a> · <a class=\"node-link\" href=\"#/GLOSSARY\">[GLOSSARY]<\/a><\/p>\n<details class=\"local-terms\" open=\"\"><summary>Terms used here<\/summary><ul class=\"proof-tree\">\n<li><strong>Geometry and triangles.<\/strong> <span class=\"math-inline\"><math aria-label=\"H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>H<\/mi>\n<\/math><\/span> is the closed regular hexagon of side <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span>, with center <span class=\"math-inline\"><math aria-label=\"O=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<mo>=<\/mo>\n<mn>0<\/mn>\n<\/math><\/span> and vertices <span class=\"math-inline\"><math aria-label=\"V_0,\\ldots,V_5\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>,<\/mo>\n<mo>…<\/mo>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>5<\/mn>\n<\/msub>\n<\/math><\/span> in cyclic order. Indices are modulo <span class=\"math-inline\"><math aria-label=\"6\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>6<\/mn>\n<\/math><\/span> (so <span class=\"math-inline\"><math aria-label=\"V_6=V_0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mn>6<\/mn>\n<\/msub>\n<mo>=<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<\/math><\/span>). A <strong>spoke<\/strong> is <span class=\"math-inline\"><math aria-label=\"r_i=[O,V_i]\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>r<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<mi>O<\/mi>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<\/math><\/span>; its midpoint is <span class=\"math-inline\"><math aria-label=\"M_i=V_i/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>. The boundary edge <span class=\"math-inline\"><math aria-label=\"e_{i,i+1}=[V_i,V_{i+1}]\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>e<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>,<\/mo>\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<\/math><\/span> has parameterization <span class=\"math-inline\"><math aria-label=\"X_i(t)=(1-t)V_i+tV_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>X<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>t<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>t<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<mi>t<\/mi>\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"0\\le t\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>0<\/mn>\n<mo>≤<\/mo>\n<mi>t<\/mi>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<li><strong>C triangle and V triangles.<\/strong> <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> is an open unit equilateral triangle containing <span class=\"math-inline\"><math aria-label=\"O\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<\/math><\/span>; <span class=\"math-inline\"><math aria-label=\"U_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> is one containing <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>. A <strong>role<\/strong> means one of these assigned triangles. Their closures <span class=\"math-inline\"><math aria-label=\"T_C,T_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>T<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> include their sides and vertices; the open triangles do not. Coverage always uses the open triangles. A <strong>trace<\/strong> is intersection with the stated edge or spoke; the <strong>relative interior<\/strong> of an edge removes its endpoints.<\/li>\n<li><strong>Reaches and criticality.<\/strong> <span class=\"math-inline\"><math aria-label=\"A_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"B_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> are the actual lengths reached by <span class=\"math-inline\"><math aria-label=\"T_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> from <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> toward <span class=\"math-inline\"><math aria-label=\"V_{i-1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"V_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>, respectively. <span class=\"math-inline\"><math aria-label=\"C_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>C<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> is its actual distance along its own spoke from <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> toward <span class=\"math-inline\"><math aria-label=\"O\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<\/math><\/span>. <strong>Supercritical<\/strong> means <span class=\"math-inline\"><math aria-label=\"A_i+B_i&gt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>&gt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>; <strong>nonsupercritical<\/strong> means <span class=\"math-inline\"><math aria-label=\"A_i+B_i\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>. <span class=\"math-inline\"><math aria-label=\"N_+\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>N<\/mi>\n<mo>+<\/mo>\n<\/msub>\n<\/math><\/span> counts supercritical V triangles. Lowercase <span class=\"math-inline\"><math aria-label=\"a_i,b_i,c_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>a<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>b<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>c<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> are selected lower bounds, not necessarily these maxima.<\/li>\n<li><strong>Gaps and skeleton.<\/strong> A <strong>boundary gap<\/strong> is a nonempty part of an edge missed by all six open V triangles. On <span class=\"math-inline\"><math aria-label=\"e_{i,i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>e<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>,<\/mo>\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span> it is <span class=\"math-inline\"><math aria-label=\"X_i([B_i,1-A_{i+1}])\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>X<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<msub>\n<mi>A<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> when <span class=\"math-inline\"><math aria-label=\"B_i+A_{i+1}\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>A<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>; equality leaves one missing point. The <strong>skeleton<\/strong> is <span class=\"math-inline\"><math aria-label=\"S=\\partial H\\cup\\bigcup_i r_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>S<\/mi>\n<mo>=<\/mo>\n<mi>∂<\/mi>\n<mi>H<\/mi>\n<mo>∪<\/mo>\n<munder>\n<mo data-mjx-texclass=\"OP\">⋃<\/mo>\n<mi>i<\/mi>\n<\/munder>\n<msub>\n<mi>r<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>, of length <span class=\"math-inline\"><math aria-label=\"12\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>12<\/mn>\n<\/math><\/span>. Skeleton coverage need not cover points between the spokes.<\/li>\n<li><strong>Enclosure language.<\/strong> A <strong>witness<\/strong> is a chosen point used to contradict the cover. <strong>Forced into <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span><\/strong> means the cover and previously stated geometry imply that membership. A <strong>candidate<\/strong> is any other open unit equilateral triangle tested against the same fixed witnesses; it need not complete a cover with the old V triangles. <span class=\"math-inline\"><math aria-label=\"\\operatorname{conv}(K)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>conv<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>K<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> is the convex hull, the set of all convex combinations of points of <span class=\"math-inline\"><math aria-label=\"K\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>K<\/mi>\n<\/math><\/span>. For a nonempty compact set <span class=\"math-inline\"><math aria-label=\"K\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>K<\/mi>\n<\/math><\/span> (closed and bounded here), <span class=\"math-inline\"><math aria-label=\"\\Lambda(K)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi mathvariant=\"normal\">Λ<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>K<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> is the least side length of a closed equilateral triangle containing it. Thus <span class=\"math-inline\"><math aria-label=\"K\\subset U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>K<\/mi>\n<mo>⊂<\/mo>\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> gives <span class=\"math-inline\"><math aria-label=\"\\Lambda(K)&lt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi mathvariant=\"normal\">Λ<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>K<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>&lt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span> by shrinking its three sides slightly.<\/li>\n<li><strong>Total radial frontier.<\/strong> Put <span class=\"math-inline\"><math aria-label=\"Z_i(c)=(1-c)V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>Z<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>c<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>c<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>. For <span class=\"math-inline\"><math aria-label=\"j=i-1,i+1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>j<\/mi>\n<mo>=<\/mo>\n<mi>i<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<mo>,<\/mo>\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>, let <span class=\"math-inline\"><math aria-label=\"u_{j\\to i}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>u<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>j<\/mi>\n<mo accent=\"false\" stretchy=\"false\">→<\/mo>\n<mi>i<\/mi>\n<\/mrow>\n<\/msub>\n<\/math><\/span> be the largest <span class=\"math-inline\"><math aria-label=\"c\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>c<\/mi>\n<\/math><\/span> of a positive-length trace <span class=\"math-inline\"><math aria-label=\"T_j\\cap r_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>j<\/mi>\n<\/msub>\n<mo>∩<\/mo>\n<msub>\n<mi>r<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>, or <span class=\"math-inline\"><math aria-label=\"0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>0<\/mn>\n<\/math><\/span> when that trace is absent. Define <span class=\"math-inline\"><math aria-label=\"\\gamma_i=\\max\\{C_i,u_{i-1\\to i},u_{i+1\\to i}\\}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>γ<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<mo data-mjx-texclass=\"OP\" movablelimits=\"true\">max<\/mo>\n<mo fence=\"false\" stretchy=\"false\">{<\/mo>\n<msub>\n<mi>C<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>u<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<mo accent=\"false\" stretchy=\"false\">→<\/mo>\n<mi>i<\/mi>\n<\/mrow>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>u<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<mo accent=\"false\" stretchy=\"false\">→<\/mo>\n<mi>i<\/mi>\n<\/mrow>\n<\/msub>\n<mo fence=\"false\" stretchy=\"false\">}<\/mo>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"\\widehat P_i=(1-\\gamma_i)V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mrow data-mjx-texclass=\"ORD\">\n<mover>\n<mi>P<\/mi>\n<mo>^<\/mo>\n<\/mover>\n<\/mrow>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<msub>\n<mi>γ<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">)<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>. This is the endpoint closest to <span class=\"math-inline\"><math aria-label=\"O\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<\/math><\/span> after accounting for all V triangles that can reach that spoke, not just <span class=\"math-inline\"><math aria-label=\"T_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>.<\/li>\n<\/ul><\/details>\n<p><strong>Purpose:<\/strong> explain this argument once, then reuse it for BC, D, and F. For compact <span class=\"math-inline\"><math aria-label=\"K\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>K<\/mi>\n<\/math><\/span>, write <span class=\"math-inline\"><math aria-label=\"\\Lambda(K)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi mathvariant=\"normal\">Λ<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>K<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> for the least side length of a closed equilateral triangle containing <span class=\"math-inline\"><math aria-label=\"K\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>K<\/mi>\n<\/math><\/span>.<\/p>\n<h2>Tree<\/h2>\n<ul class=\"proof-tree\">\n<li><details open=\"\"><summary><strong>Choose a fixed set from the original configuration.<\/strong>\n<\/summary><ul>\n<li>The points are chosen before introducing an arbitrary enclosing candidate.<\/li>\n<li>They cannot be moved in response to that candidate.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Force the set into the original center triangle.<\/strong>\n<\/summary><ul>\n<li>Some anchors are already known to belong to <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span>.<\/li>\n<li>Gap endpoints are missed by all open vertex roles, so they belong to <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span>.<\/li>\n<li><details open=\"\"><summary>Radial frontier points are chosen beyond every relevant vertex-role contribution.\n<\/summary><ul>\n<li>Include neighboring contributions, not only the own-spoke reach.<\/li>\n<\/ul>\n<\/details><\/li>\n<li>Any remaining interior witnesses require full-hexagon coverage to force them into <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Suppose an arbitrary open unit candidate contains the same set.<\/strong>\n<\/summary><ul>\n<li>Candidate containment gives geometric demands.<\/li>\n<li>The appropriate enclosure theorem proves <span class=\"math-inline\"><math aria-label=\"\\Lambda(K)\\ge1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi mathvariant=\"normal\">Λ<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>K<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>≥<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<li>The candidate need not form a cover together with the old vertex roles; use only established candidate-containment consequences.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Use compactness and openness.<\/strong>\n<\/summary><ul>\n<li>If <span class=\"math-inline\"><math aria-label=\"K\\subset U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>K<\/mi>\n<mo>⊂<\/mo>\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span>, its distance from each side is positive.<\/li>\n<li>Move all three sides inward slightly to obtain a smaller closed equilateral triangle still containing <span class=\"math-inline\"><math aria-label=\"K\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>K<\/mi>\n<\/math><\/span>.<\/li>\n<li>Hence <span class=\"math-inline\"><math aria-label=\"\\Lambda(K)&lt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi mathvariant=\"normal\">Λ<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>K<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>&lt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>, a contradiction.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>The active witness families.<\/strong>\n<\/summary><ul>\n<li><a class=\"node-link\" href=\"#/BC\">[BC]<\/a>: at most five points; skeleton coverage suffices; no disk.<\/li>\n<li><a class=\"node-link\" href=\"#/D\">[D]<\/a>: at most four points; skeleton coverage suffices; no disk.<\/li>\n<li><a class=\"node-link\" href=\"#/F\">[F]<\/a>: at most nine points; uses full-hexagon coverage; a disk is obtained by convexity from six radial points.<\/li>\n<\/ul>\n<\/details><\/li>\n<\/ul>\n<h2>Total radial frontier<\/h2>\n<p>For the spoke <span class=\"math-inline\"><math aria-label=\"r_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>r<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>, let <span class=\"math-inline\"><math aria-label=\"\\gamma_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>γ<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> be the maximum of the own radial reach and the two actual neighboring O-side endpoints, measured from <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> toward <span class=\"math-inline\"><math aria-label=\"O\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<\/math><\/span>. Then <span class=\"math-inline\"><math aria-label=\"\\widehat P_i=(1-\\gamma_i)V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mrow data-mjx-texclass=\"ORD\">\n<mover>\n<mi>P<\/mi>\n<mo>^<\/mo>\n<\/mover>\n<\/mrow>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<msub>\n<mi>γ<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">)<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> is missed by every open vertex role. Under skeleton coverage it belongs to <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span>. This is not automatically the own endpoint <span class=\"math-inline\"><math aria-label=\"(1-C_i)V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<msub>\n<mi>C<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">)<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>.<\/p>\n<hr/>\n<p><strong>Proof sources:<\/strong> <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/2XXX_geometric_lemmas/26XX_enclosing_triangle_tools/2610_finite_enclosure_terminal_interfaces.md\" rel=\"noopener noreferrer\" target=\"_blank\">2610<\/a> · <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/2XXX_geometric_lemmas/26XX_enclosing_triangle_tools/2612_fixed_witness_unification.md\" rel=\"noopener noreferrer\" target=\"_blank\">2612<\/a> · <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/3XXX_CE0/31XX_Nplus1/310X_all_Vd0/3105X_self_contained_direct_Vd0_nine_point/31058_center_independent_direct_nine_point_obstruction.md\" rel=\"noopener noreferrer\" target=\"_blank\">31058<\/a>. All source links are pinned to the same repository snapshot.<\/p>\n<p><a class=\"node-link\" href=\"#/MAIN\">[MAIN]<\/a> Return to the main tree.<\/p>\n"},"BC-CALC":{"id":"BC-CALC","file":"details/BC-calculations.md","title":"Finite calipers and the rational envelope","group":"Calculation leaves","html":"<h1>[BC-CALC] Finite calipers and the rational envelope<\/h1>\n<p><a class=\"node-link\" href=\"#/MAIN\">[MAIN]<\/a> · <a class=\"node-link\" href=\"#/BC\">[BC]<\/a> · <a class=\"node-link\" href=\"#/D\">[D]<\/a> · <a class=\"node-link\" href=\"#/CALIPERS\">[CALIPERS]<\/a><\/p>\n<details class=\"local-terms\" open=\"\"><summary>Terms used here<\/summary><p><span class=\"math-inline\"><math aria-label=\"H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>H<\/mi>\n<\/math><\/span> is the closed regular hexagon of side one, <span class=\"math-inline\"><math aria-label=\"O=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<mo>=<\/mo>\n<mn>0<\/mn>\n<\/math><\/span> its center, and\n<span class=\"math-inline\"><math aria-label=\"V_i=(\\cos(i\\pi/3),\\sin(i\\pi/3))\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mi>cos<\/mi>\n<mo data-mjx-texclass=\"NONE\">⁡<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mi>i<\/mi>\n<mi>π<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>3<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<mo>,<\/mo>\n<mi>sin<\/mi>\n<mo data-mjx-texclass=\"NONE\">⁡<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mi>i<\/mi>\n<mi>π<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>3<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> its vertices (indices modulo six).\nThe spoke is <span class=\"math-inline\"><math aria-label=\"r_i=[O,V_i]\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>r<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<mi>O<\/mi>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<\/math><\/span> and its midpoint is <span class=\"math-inline\"><math aria-label=\"M_i=V_i/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>.\n<span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> is the open unit equilateral triangle containing <span class=\"math-inline\"><math aria-label=\"O\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<\/math><\/span>; <span class=\"math-inline\"><math aria-label=\"U_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> contains <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>.\nTheir closures are <span class=\"math-inline\"><math aria-label=\"T_C,T_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>T<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>. Coverage uses the open triangles.\n<span class=\"math-inline\"><math aria-label=\"A_i,B_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> are the actual boundary reaches toward <span class=\"math-inline\"><math aria-label=\"V_{i-1},V_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>.\nNonsupercritical means <span class=\"math-inline\"><math aria-label=\"A_i+B_i\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>, not a condition on arbitrary lower demands.\nA gap <span class=\"math-inline\"><math aria-label=\"X_i([B_i,1-A_{i+1}])\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>X<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<msub>\n<mi>A<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>, where <span class=\"math-inline\"><math aria-label=\"X_i(w)=(1-w)V_i+wV_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>X<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>w<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>w<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<mi>w<\/mi>\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>,\nincludes a singleton when its endpoints coincide.\nA witness is forced into <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> if the original covering hypotheses imply that membership.\n<span class=\"math-inline\"><math aria-label=\"\\Lambda(F)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi mathvariant=\"normal\">Λ<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>F<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> is the minimum closed equilateral enclosure side of the compact set <span class=\"math-inline\"><math aria-label=\"F\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>F<\/mi>\n<\/math><\/span>;\n<span class=\"math-inline\"><math aria-label=\"F\\subset U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>F<\/mi>\n<mo>⊂<\/mo>\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> implies <span class=\"math-inline\"><math aria-label=\"\\Lambda(F)&lt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi mathvariant=\"normal\">Λ<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>F<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>&lt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.\n<span class=\"math-inline\"><math aria-label=\"C_0(a,b)=c_{\\max}(a,b)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>C<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>a<\/mi>\n<mo>,<\/mo>\n<mi>b<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<msub>\n<mi>c<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mo data-mjx-texclass=\"OP\" movablelimits=\"true\">max<\/mo>\n<\/mrow>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>a<\/mi>\n<mo>,<\/mo>\n<mi>b<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> is the own-ray capacity function, not the actual scalar <span class=\"math-inline\"><math aria-label=\"C_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>C<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>.\n<span class=\"math-inline\"><math aria-label=\"C_+\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>C<\/mi>\n<mo>+<\/mo>\n<\/msub>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"C_-\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>C<\/mi>\n<mo>−<\/mo>\n<\/msub>\n<\/math><\/span> are neighboring-ray capacities for that same prescribed pair.<\/p><\/details>\n<h2>Tree<\/h2>\n<ul class=\"proof-tree\">\n<li><details open=\"\"><summary><strong>Five calipers, one capacity-dependent orientation.<\/strong>\n<\/summary><ul>\n<li>With <span class=\"math-inline\"><math aria-label=\"P=rV_2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>P<\/mi>\n<mo>=<\/mo>\n<mi>r<\/mi>\n<msub>\n<mi>V<\/mi>\n<mn>2<\/mn>\n<\/msub>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"Q=tV_4\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>Q<\/mi>\n<mo>=<\/mo>\n<mi>t<\/mi>\n<msub>\n<mi>V<\/mi>\n<mn>4<\/mn>\n<\/msub>\n<\/math><\/span>, and <span class=\"math-inline\"><math aria-label=\"k=y-r\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>k<\/mi>\n<mo>=<\/mo>\n<mi>y<\/mi>\n<mo>−<\/mo>\n<mi>r<\/mi>\n<\/math><\/span>, the hull edges are <span class=\"math-inline\"><math aria-label=\"MG_x,G_xG_y,G_yP,PQ,QM\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>M<\/mi>\n<msub>\n<mi>G<\/mi>\n<mi>x<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>G<\/mi>\n<mi>x<\/mi>\n<\/msub>\n<msub>\n<mi>G<\/mi>\n<mi>y<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>G<\/mi>\n<mi>y<\/mi>\n<\/msub>\n<mi>P<\/mi>\n<mo>,<\/mo>\n<mi>P<\/mi>\n<mi>Q<\/mi>\n<mo>,<\/mo>\n<mi>Q<\/mi>\n<mi>M<\/mi>\n<\/math><\/span>.<\/li>\n<li>The difficult side is <span class=\"math-inline\"><math aria-label=\"[r+t+\\max\\{1/2,1-x(1-k)\\}]/\\sqrt{1-k+k^2}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">[<\/mo>\n<mi>r<\/mi>\n<mo>+<\/mo>\n<mi>t<\/mi>\n<mo>+<\/mo>\n<mo data-mjx-texclass=\"OP\" movablelimits=\"true\">max<\/mo>\n<mo fence=\"false\" stretchy=\"false\">{<\/mo>\n<mn>1<\/mn>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>x<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>k<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo fence=\"false\" stretchy=\"false\">}<\/mo>\n<mo stretchy=\"false\">]<\/mo>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<msqrt>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>k<\/mi>\n<mo>+<\/mo>\n<msup>\n<mi>k<\/mi>\n<mn>2<\/mn>\n<\/msup>\n<\/msqrt>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Use the coupled inequality.<\/strong>\n<\/summary><ul>\n<li>The two radii satisfy <span class=\"math-inline\"><math aria-label=\"2(r+t)&gt;(1-y+r)(2x-y+r)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>2<\/mn>\n<mo stretchy=\"false\">(<\/mo>\n<mi>r<\/mi>\n<mo>+<\/mo>\n<mi>t<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>&gt;<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>y<\/mi>\n<mo>+<\/mo>\n<mi>r<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>2<\/mn>\n<mi>x<\/mi>\n<mo>−<\/mo>\n<mi>y<\/mi>\n<mo>+<\/mo>\n<mi>r<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>.<\/li>\n<li>Thus its numerator exceeds <span class=\"math-inline\"><math aria-label=\"1-k/2+k^2/2\\ge\\sqrt{1-k+k^2}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>k<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<mo>+<\/mo>\n<msup>\n<mi>k<\/mi>\n<mn>2<\/mn>\n<\/msup>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<mo>≥<\/mo>\n<msqrt>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>k<\/mi>\n<mo>+<\/mo>\n<msup>\n<mi>k<\/mi>\n<mn>2<\/mn>\n<\/msup>\n<\/msqrt>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Use a reusable local envelope, not a new center normal form.<\/strong>\n<\/summary><ul>\n<li>For <span class=\"math-inline\"><math aria-label=\"m=\\min(a,b)\\le3/8\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>m<\/mi>\n<mo>=<\/mo>\n<mo data-mjx-texclass=\"OP\" movablelimits=\"true\">min<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mi>a<\/mi>\n<mo>,<\/mo>\n<mi>b<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>≤<\/mo>\n<mn>3<\/mn>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>8<\/mn>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"\\delta=1-a-b\\ge0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>δ<\/mi>\n<mo>=<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>a<\/mi>\n<mo>−<\/mo>\n<mi>b<\/mi>\n<mo>≥<\/mo>\n<mn>0<\/mn>\n<\/math><\/span>, put <span class=\"math-inline\"><math aria-label=\"b(m)=m/2-2m^2/5\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>b<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>m<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mi>m<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<mo>−<\/mo>\n<mn>2<\/mn>\n<msup>\n<mi>m<\/mi>\n<mn>2<\/mn>\n<\/msup>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>5<\/mn>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"K(m)=(5+4m)/(5-4m)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>K<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>m<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>5<\/mn>\n<mo>+<\/mo>\n<mn>4<\/mn>\n<mi>m<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mo stretchy=\"false\">(<\/mo>\n<mn>5<\/mn>\n<mo>−<\/mo>\n<mn>4<\/mn>\n<mi>m<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>.<\/li>\n<li>Then <span class=\"math-inline\"><math aria-label=\"1-C_0(a,b)\\ge\\max\\{b(m),m-K(m)\\delta\\}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<mo>−<\/mo>\n<msub>\n<mi>C<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>a<\/mi>\n<mo>,<\/mo>\n<mi>b<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>≥<\/mo>\n<mo data-mjx-texclass=\"OP\" movablelimits=\"true\">max<\/mo>\n<mo fence=\"false\" stretchy=\"false\">{<\/mo>\n<mi>b<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>m<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>,<\/mo>\n<mi>m<\/mi>\n<mo>−<\/mo>\n<mi>K<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>m<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mi>δ<\/mi>\n<mo fence=\"false\" stretchy=\"false\">}<\/mo>\n<\/math><\/span>.<\/li>\n<li>Outside this coefficient range use <span class=\"math-inline\"><math aria-label=\"m(1-m)/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>m<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>m<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>; do not extend the rational envelope without proof.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Retain the complete analytic reduction.<\/strong>\n<\/summary><ul>\n<li>Branchwise concavity reduces the coupled inequality to three transition configurations.<\/li>\n<li>Their residuals have explicitly positive cubic, quartic, and quadratic bounds in 2615.<\/li>\n<li>Exact symbolic checkers audit identities, not the completeness of the geometric proof.<\/li>\n<\/ul>\n<\/details><\/li>\n<\/ul>\n<p>The other four calipers are evaluated explicitly in 2616; finite calipers are exhaustive, not an angular scan.<\/p>\n<h2>Proof sources<\/h2>\n<p>The active terminal is <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/2XXX_geometric_lemmas/26XX_enclosing_triangle_tools/2616_bc_d_finite_calipers.md\" rel=\"noopener noreferrer\" target=\"_blank\">2616<\/a>.\nIts capacity input is <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/2XXX_geometric_lemmas/26XX_enclosing_triangle_tools/2615_slack_sensitive_radial_envelope.md\" rel=\"noopener noreferrer\" target=\"_blank\">2615<\/a>.\nThe entire page is explanatory; numbered sources supply proof authority.<\/p>\n"},"D-CALC":{"id":"D-CALC","file":"details/D-calculations.md","title":"The four D caliper calculations","group":"Calculation leaves","html":"<h1>[D-CALC] The four D caliper calculations<\/h1>\n<p><a class=\"node-link\" href=\"#/MAIN\">[MAIN]<\/a> · <a class=\"node-link\" href=\"#/BC\">[BC]<\/a> · <a class=\"node-link\" href=\"#/D\">[D]<\/a> · <a class=\"node-link\" href=\"#/CALIPERS\">[CALIPERS]<\/a><\/p>\n<details class=\"local-terms\" open=\"\"><summary>Terms used here<\/summary><p><span class=\"math-inline\"><math aria-label=\"H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>H<\/mi>\n<\/math><\/span> is the closed regular hexagon of side one, <span class=\"math-inline\"><math aria-label=\"O=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<mo>=<\/mo>\n<mn>0<\/mn>\n<\/math><\/span> its center, and\n<span class=\"math-inline\"><math aria-label=\"V_i=(\\cos(i\\pi/3),\\sin(i\\pi/3))\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mi>cos<\/mi>\n<mo data-mjx-texclass=\"NONE\">⁡<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mi>i<\/mi>\n<mi>π<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>3<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<mo>,<\/mo>\n<mi>sin<\/mi>\n<mo data-mjx-texclass=\"NONE\">⁡<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mi>i<\/mi>\n<mi>π<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>3<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> its vertices (indices modulo six).\nThe spoke is <span class=\"math-inline\"><math aria-label=\"r_i=[O,V_i]\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>r<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<mi>O<\/mi>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<\/math><\/span> and its midpoint is <span class=\"math-inline\"><math aria-label=\"M_i=V_i/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>.\n<span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> is the open unit equilateral triangle containing <span class=\"math-inline\"><math aria-label=\"O\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<\/math><\/span>; <span class=\"math-inline\"><math aria-label=\"U_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> contains <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>.\nTheir closures are <span class=\"math-inline\"><math aria-label=\"T_C,T_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>T<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>. Coverage uses the open triangles.\n<span class=\"math-inline\"><math aria-label=\"A_i,B_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> are the actual boundary reaches toward <span class=\"math-inline\"><math aria-label=\"V_{i-1},V_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>.\nNonsupercritical means <span class=\"math-inline\"><math aria-label=\"A_i+B_i\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>, not a condition on arbitrary lower demands.\nA gap <span class=\"math-inline\"><math aria-label=\"X_i([B_i,1-A_{i+1}])\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>X<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<msub>\n<mi>A<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>, where <span class=\"math-inline\"><math aria-label=\"X_i(w)=(1-w)V_i+wV_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>X<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>w<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>w<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<mi>w<\/mi>\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>,\nincludes a singleton when its endpoints coincide.\nA witness is forced into <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> if the original covering hypotheses imply that membership.\n<span class=\"math-inline\"><math aria-label=\"\\Lambda(F)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi mathvariant=\"normal\">Λ<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>F<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> is the minimum closed equilateral enclosure side of the compact set <span class=\"math-inline\"><math aria-label=\"F\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>F<\/mi>\n<\/math><\/span>;\n<span class=\"math-inline\"><math aria-label=\"F\\subset U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>F<\/mi>\n<mo>⊂<\/mo>\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> implies <span class=\"math-inline\"><math aria-label=\"\\Lambda(F)&lt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi mathvariant=\"normal\">Λ<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>F<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>&lt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.\n<span class=\"math-inline\"><math aria-label=\"C_0(a,b)=c_{\\max}(a,b)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>C<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>a<\/mi>\n<mo>,<\/mo>\n<mi>b<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<msub>\n<mi>c<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mo data-mjx-texclass=\"OP\" movablelimits=\"true\">max<\/mo>\n<\/mrow>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>a<\/mi>\n<mo>,<\/mo>\n<mi>b<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> is the own-ray capacity function, not the actual scalar <span class=\"math-inline\"><math aria-label=\"C_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>C<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>.\n<span class=\"math-inline\"><math aria-label=\"C_+\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>C<\/mi>\n<mo>+<\/mo>\n<\/msub>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"C_-\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>C<\/mi>\n<mo>−<\/mo>\n<\/msub>\n<\/math><\/span> are neighboring-ray capacities for that same prescribed pair.<\/p><\/details>\n<p>A supported midpoint has an adjacent <strong>supplier<\/strong> whose open triangle contains that midpoint;\npositive support alone does not imply supplying that midpoint.\nFor D, <span class=\"math-inline\"><math aria-label=\"Y(w)=V_0-wV_1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>Y<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>w<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>−<\/mo>\n<mi>w<\/mi>\n<msub>\n<mi>V<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"a\\ge0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>a<\/mi>\n<mo>≥<\/mo>\n<mn>0<\/mn>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"\\varepsilon&gt;0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>ε<\/mi>\n<mo>&gt;<\/mo>\n<mn>0<\/mn>\n<\/math><\/span>, and <span class=\"math-inline\"><math aria-label=\"\\beta\\ge0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>β<\/mi>\n<mo>≥<\/mo>\n<mn>0<\/mn>\n<\/math><\/span>.\nThe original placement adapters force the four points and prove the ratio bound.<\/p>\n<h2>Tree<\/h2>\n<ul class=\"proof-tree\">\n<li><details open=\"\"><summary><strong>Separate original placement from the geometric theorem.<\/strong>\n<\/summary><ul>\n<li>The T3-like or Vd1 chart forces <span class=\"math-inline\"><math aria-label=\"O,\\varepsilon V_1,Y(a),Y(1-\\beta)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<mo>,<\/mo>\n<mi>ε<\/mi>\n<msub>\n<mi>V<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<mo>,<\/mo>\n<mi>Y<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>a<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>,<\/mo>\n<mi>Y<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>β<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> into <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span>.<\/li>\n<li>It proves <span class=\"math-inline\"><math aria-label=\"\\beta\\le\\varepsilon/(a+\\varepsilon)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>β<\/mi>\n<mo>≤<\/mo>\n<mi>ε<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mo stretchy=\"false\">(<\/mo>\n<mi>a<\/mi>\n<mo>+<\/mo>\n<mi>ε<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>.<\/li>\n<li>Size bounds may still help force original gap endpoints; the geometric theorem does not require them.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Use diameter at the boundary.<\/strong>\n<\/summary><ul>\n<li>If <span class=\"math-inline\"><math aria-label=\"a=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>a<\/mi>\n<mo>=<\/mo>\n<mn>0<\/mn>\n<\/math><\/span>, the points contain <span class=\"math-inline\"><math aria-label=\"O,V_0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<\/math><\/span>.<\/li>\n<li>Put <span class=\"math-inline\"><math aria-label=\"s=a+\\varepsilon\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>s<\/mi>\n<mo>=<\/mo>\n<mi>a<\/mi>\n<mo>+<\/mo>\n<mi>ε<\/mi>\n<\/math><\/span>. If <span class=\"math-inline\"><math aria-label=\"s\\ge1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>s<\/mi>\n<mo>≥<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>, then <span class=\"math-inline\"><math aria-label=\"\\|Y(a)-\\varepsilon V_1\\|^2=1-s+s^2\\ge1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo data-mjx-texclass=\"ORD\">∥<\/mo>\n<mi>Y<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>a<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>−<\/mo>\n<mi>ε<\/mi>\n<msub>\n<mi>V<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<msup>\n<mo data-mjx-texclass=\"ORD\">∥<\/mo>\n<mn>2<\/mn>\n<\/msup>\n<mo>=<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>s<\/mi>\n<mo>+<\/mo>\n<msup>\n<mi>s<\/mi>\n<mn>2<\/mn>\n<\/msup>\n<mo>≥<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Otherwise reduce by convexity.<\/strong>\n<\/summary><ul>\n<li>Put <span class=\"math-inline\"><math aria-label=\"v=a/s\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>v<\/mi>\n<mo>=<\/mo>\n<mi>a<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mi>s<\/mi>\n<\/math><\/span>, so <span class=\"math-inline\"><math aria-label=\"0&lt;s,v&lt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>0<\/mn>\n<mo>&lt;<\/mo>\n<mi>s<\/mi>\n<mo>,<\/mo>\n<mi>v<\/mi>\n<mo>&lt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"a=sv\\le v\\le1-\\beta\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>a<\/mi>\n<mo>=<\/mo>\n<mi>s<\/mi>\n<mi>v<\/mi>\n<mo>≤<\/mo>\n<mi>v<\/mi>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>β<\/mi>\n<\/math><\/span>.<\/li>\n<li>Replace the far point by <span class=\"math-inline\"><math aria-label=\"Y(v)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>Y<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>v<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> on the same boundary segment.<\/li>\n<li>The smaller quadrilateral is <span class=\"math-inline\"><math aria-label=\"O,Y(v),Y(sv),s(1-v)V_1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<mo>,<\/mo>\n<mi>Y<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>v<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>,<\/mo>\n<mi>Y<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>s<\/mi>\n<mi>v<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>,<\/mo>\n<mi>s<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>v<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Use four hull-edge calipers.<\/strong>\n<\/summary><ul>\n<li>Their side lengths are <span class=\"math-inline\"><math aria-label=\"1/\\sqrt{1-v+v^2}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<msqrt>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>v<\/mi>\n<mo>+<\/mo>\n<msup>\n<mi>v<\/mi>\n<mn>2<\/mn>\n<\/msup>\n<\/msqrt>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"1+s(1-v)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<mo>+<\/mo>\n<mi>s<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>v<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"1/\\sqrt{1-s+s^2}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<msqrt>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>s<\/mi>\n<mo>+<\/mo>\n<msup>\n<mi>s<\/mi>\n<mn>2<\/mn>\n<\/msup>\n<\/msqrt>\n<\/math><\/span>, and <span class=\"math-inline\"><math aria-label=\"1+v(1-s)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<mo>+<\/mo>\n<mi>v<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>s<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>.<\/li>\n<li>All exceed one for <span class=\"math-inline\"><math aria-label=\"0&lt;s,v&lt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>0<\/mn>\n<mo>&lt;<\/mo>\n<mi>s<\/mi>\n<mo>,<\/mo>\n<mi>v<\/mi>\n<mo>&lt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span> — <a class=\"node-link\" href=\"#/D-CALC\">[D-CALC]<\/a>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><strong>Conclude <span class=\"math-inline\"><math aria-label=\"\\Lambda(K_D)\\ge1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi mathvariant=\"normal\">Λ<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<msub>\n<mi>K<\/mi>\n<mi>D<\/mi>\n<\/msub>\n<mo stretchy=\"false\">)<\/mo>\n<mo>≥<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.<\/strong> Compact containment in an open unit triangle is impossible.<\/li>\n<\/ul>\n<p>This proof neither forces a candidate midpoint nor introduces signed center parameters.<\/p>\n<h2>Proof sources<\/h2>\n<p>The active terminal is <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/2XXX_geometric_lemmas/26XX_enclosing_triangle_tools/2616_bc_d_finite_calipers.md\" rel=\"noopener noreferrer\" target=\"_blank\">2616<\/a>.\nIts capacity input is <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/2XXX_geometric_lemmas/26XX_enclosing_triangle_tools/2615_slack_sensitive_radial_envelope.md\" rel=\"noopener noreferrer\" target=\"_blank\">2615<\/a>.\nThe entire page is explanatory; numbered sources supply proof authority.<\/p>\n"},"F-CALC":{"id":"F-CALC","file":"details/F-certificate.md","title":"F forcing and exact contact certificate","group":"Calculation leaves","html":"<h1>[F-CALC] F forcing and exact contact certificate<\/h1>\n<p><a class=\"node-link\" href=\"#/MAIN\">[MAIN]<\/a> · <a class=\"node-link\" href=\"#/F\">[F]<\/a> · <a class=\"node-link\" href=\"#/NOTATION\">[NOTATION]<\/a> · <a class=\"node-link\" href=\"#/USE\">[USE]<\/a> · <a class=\"node-link\" href=\"#/GLOSSARY\">[GLOSSARY]<\/a><\/p>\n<details class=\"local-terms\" open=\"\"><summary>Terms used here<\/summary><ul class=\"proof-tree\">\n<li><strong>Geometry and triangles.<\/strong> <span class=\"math-inline\"><math aria-label=\"H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>H<\/mi>\n<\/math><\/span> is the closed regular hexagon of side <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span>, with center <span class=\"math-inline\"><math aria-label=\"O=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<mo>=<\/mo>\n<mn>0<\/mn>\n<\/math><\/span> and vertices <span class=\"math-inline\"><math aria-label=\"V_0,\\ldots,V_5\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>,<\/mo>\n<mo>…<\/mo>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>5<\/mn>\n<\/msub>\n<\/math><\/span> in cyclic order. Indices are modulo <span class=\"math-inline\"><math aria-label=\"6\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>6<\/mn>\n<\/math><\/span> (so <span class=\"math-inline\"><math aria-label=\"V_6=V_0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mn>6<\/mn>\n<\/msub>\n<mo>=<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<\/math><\/span>). A <strong>spoke<\/strong> is <span class=\"math-inline\"><math aria-label=\"r_i=[O,V_i]\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>r<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<mi>O<\/mi>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<\/math><\/span>; its midpoint is <span class=\"math-inline\"><math aria-label=\"M_i=V_i/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>. The boundary edge <span class=\"math-inline\"><math aria-label=\"e_{i,i+1}=[V_i,V_{i+1}]\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>e<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>,<\/mo>\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<\/math><\/span> has parameterization <span class=\"math-inline\"><math aria-label=\"X_i(t)=(1-t)V_i+tV_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>X<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>t<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>t<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<mi>t<\/mi>\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=
