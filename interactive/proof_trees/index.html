tes</option><option value="D-CALC">[D-CALC] The four D caliper calculations</option><option value="F-CALC">[F-CALC] F forcing and exact contact certificate</option><option value="HANDOFFS">[HANDOFFS] Strict boundary handoff selection</option><option value="REPLACE-CALC">[REPLACE-CALC] Two charts and five strict preservation margins</option></optgroup><optgroup label="Reference"><option value="GLOSSARY">[GLOSSARY] The vocabulary of the proof</option><option value="NOTATION">[NOTATION] Notation and logical scopes</option><option value="START">[START] Read the proof without knowing its terminology</option><option value="USE">[USE] Opening and navigating the tree bundle</option></optgroup></select><button id="expand" type="button">Expand all</button><button id="collapse" type="button">Collapse all</button></nav></header>

<script id="proof-pages" type="application/json">{"AREA":{"id":"AREA","file":"AREA.md","title":"Two ascents force too much exterior area","group":"Proof trees","html":"<h1>[AREA] Two ascents force too much exterior area<\/h1>\n<p><a class=\"node-link\" href=\"#/MAIN\">[MAIN]<\/a> · <a class=\"node-link\" href=\"#/NOTATION\">[NOTATION]<\/a> · <a class=\"node-link\" href=\"#/USE\">[USE]<\/a> · <a class=\"node-link\" href=\"#/GLOSSARY\">[GLOSSARY]<\/a><\/p>\n<details class=\"local-terms\" open=\"\"><summary>Terms used here<\/summary><ul class=\"proof-tree\">\n<li><strong>Geometry and triangles.<\/strong> <span class=\"math-inline\"><math aria-label=\"H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>H<\/mi>\n<\/math><\/span> is the closed regular hexagon of side <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span>, with center <span class=\"math-inline\"><math aria-label=\"O=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<mo>=<\/mo>\n<mn>0<\/mn>\n<\/math><\/span> and vertices <span class=\"math-inline\"><math aria-label=\"V_0,\\ldots,V_5\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>,<\/mo>\n<mo>…<\/mo>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>5<\/mn>\n<\/msub>\n<\/math><\/span> in cyclic order. Indices are modulo <span class=\"math-inline\"><math aria-label=\"6\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>6<\/mn>\n<\/math><\/span> (so <span class=\"math-inline\"><math aria-label=\"V_6=V_0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mn>6<\/mn>\n<\/msub>\n<mo>=<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<\/math><\/span>). A <strong>spoke<\/strong> is <span class=\"math-inline\"><math aria-label=\"r_i=[O,V_i]\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>r<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<mi>O<\/mi>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<\/math><\/span>; its midpoint is <span class=\"math-inline\"><math aria-label=\"M_i=V_i/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>. The boundary edge <span class=\"math-inline\"><math aria-label=\"e_{i,i+1}=[V_i,V_{i+1}]\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>e<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>,<\/mo>\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<\/math><\/span> has parameterization <span class=\"math-inline\"><math aria-label=\"X_i(t)=(1-t)V_i+tV_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>X<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>t<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>t<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<mi>t<\/mi>\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"0\\le t\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>0<\/mn>\n<mo>≤<\/mo>\n<mi>t<\/mi>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<li><strong>C triangle and V triangles.<\/strong> <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> is an open unit equilateral triangle containing <span class=\"math-inline\"><math aria-label=\"O\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<\/math><\/span>; <span class=\"math-inline\"><math aria-label=\"U_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> is one containing <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>. A <strong>role<\/strong> means one of these assigned triangles. Their closures <span class=\"math-inline\"><math aria-label=\"T_C,T_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>T<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> include their sides and vertices; the open triangles do not. Coverage always uses the open triangles. A <strong>trace<\/strong> is intersection with the stated edge or spoke; the <strong>relative interior<\/strong> of an edge removes its endpoints.<\/li>\n<li><strong>Reaches and criticality.<\/strong> <span class=\"math-inline\"><math aria-label=\"A_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"B_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> are the actual lengths reached by <span class=\"math-inline\"><math aria-label=\"T_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> from <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> toward <span class=\"math-inline\"><math aria-label=\"V_{i-1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"V_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>, respectively. <span class=\"math-inline\"><math aria-label=\"C_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>C<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> is its actual distance along its own spoke from <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> toward <span class=\"math-inline\"><math aria-label=\"O\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<\/math><\/span>. <strong>Supercritical<\/strong> means <span class=\"math-inline\"><math aria-label=\"A_i+B_i&gt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>&gt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>; <strong>nonsupercritical<\/strong> means <span class=\"math-inline\"><math aria-label=\"A_i+B_i\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>. <span class=\"math-inline\"><math aria-label=\"N_+\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>N<\/mi>\n<mo>+<\/mo>\n<\/msub>\n<\/math><\/span> counts supercritical V triangles. Lowercase <span class=\"math-inline\"><math aria-label=\"a_i,b_i,c_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>a<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>b<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>c<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> are selected lower bounds, not necessarily these maxima.<\/li>\n<li><strong>Gaps and skeleton.<\/strong> A <strong>boundary gap<\/strong> is a nonempty part of an edge missed by all six open V triangles. On <span class=\"math-inline\"><math aria-label=\"e_{i,i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>e<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>,<\/mo>\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span> it is <span class=\"math-inline\"><math aria-label=\"X_i([B_i,1-A_{i+1}])\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>X<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<msub>\n<mi>A<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> when <span class=\"math-inline\"><math aria-label=\"B_i+A_{i+1}\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>A<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>; equality leaves one missing point. The <strong>skeleton<\/strong> is <span class=\"math-inline\"><math aria-label=\"S=\\partial H\\cup\\bigcup_i r_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>S<\/mi>\n<mo>=<\/mo>\n<mi>∂<\/mi>\n<mi>H<\/mi>\n<mo>∪<\/mo>\n<munder>\n<mo data-mjx-texclass=\"OP\">⋃<\/mo>\n<mi>i<\/mi>\n<\/munder>\n<msub>\n<mi>r<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>, of length <span class=\"math-inline\"><math aria-label=\"12\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>12<\/mn>\n<\/math><\/span>. Skeleton coverage need not cover points between the spokes.<\/li>\n<li><strong>Handoff, ascent, and loss.<\/strong> A handoff is a point <span class=\"math-inline\"><math aria-label=\"X_i(x_i)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>X<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<msub>\n<mi>x<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> in the open overlap of the V triangles on edge <span class=\"math-inline\"><math aria-label=\"e_{i,i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>e<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>,<\/mo>\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>. It gives selected demands <span class=\"math-inline\"><math aria-label=\"(a_i,b_i)=(1-x_{i-1},x_i)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<msub>\n<mi>a<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>b<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<msub>\n<mi>x<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>x<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>. An ascent is <span class=\"math-inline\"><math aria-label=\"x_i&gt;x_{i-1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>x<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>&gt;<\/mo>\n<msub>\n<mi>x<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>, equivalent to their sum being greater than <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span>. A minimum plateau is a consecutive block attaining the minimum cyclic value. <span class=\"math-inline\"><math aria-label=\"G_i=\\operatorname{area}(T_i\\setminus H)/(\\sqrt3/4)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>G<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<mi>area<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<msub>\n<mi>T<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>∖<\/mo>\n<mi>H<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mo stretchy=\"false\">(<\/mo>\n<msqrt>\n<mn>3<\/mn>\n<\/msqrt>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>4<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> is the exterior area of V triangle <span class=\"math-inline\"><math aria-label=\"i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>i<\/mi>\n<\/math><\/span>, in units of a unit equilateral triangle's area. A loss is area outside <span class=\"math-inline\"><math aria-label=\"H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>H<\/mi>\n<\/math><\/span>, not an overlap deduction.<\/li>\n<\/ul><\/details>\n<p><strong>Input:<\/strong> no boundary gaps and <span class=\"math-inline\"><math aria-label=\"N_+\\ge2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>N<\/mi>\n<mo>+<\/mo>\n<\/msub>\n<mo>≥<\/mo>\n<mn>2<\/mn>\n<\/math><\/span>. Normalize the area of one unit equilateral triangle to <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span>; then the hexagon has area <span class=\"math-inline\"><math aria-label=\"6\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>6<\/mn>\n<\/math><\/span>.<\/p>\n<h2>Tree<\/h2>\n<ul class=\"proof-tree\">\n<li><details open=\"\"><summary><strong>Select strict boundary handoffs preserving at least two supercritical roles<\/strong> — <a class=\"node-link\" href=\"#/HANDOFFS\">[HANDOFFS]<\/a>.\n<\/summary><ul>\n<li>Write <span class=\"math-inline\"><math aria-label=\"(a_i,b_i)=(1-x_{i-1},x_i)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<msub>\n<mi>a<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>b<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<msub>\n<mi>x<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>x<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>.<\/li>\n<li>A selected supercritical role is exactly an ascent <span class=\"math-inline\"><math aria-label=\"x_i&gt;x_{i-1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>x<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>&gt;<\/mo>\n<msub>\n<mi>x<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Use the local exterior-area estimates.<\/strong>\n<\/summary><ul>\n<li>Write <span class=\"math-inline\"><math aria-label=\"G_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>G<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> for the normalized area of <span class=\"math-inline\"><math aria-label=\"T_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> outside <span class=\"math-inline\"><math aria-label=\"H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>H<\/mi>\n<\/math><\/span>.<\/li>\n<li>Every role satisfies <span class=\"math-inline\"><math aria-label=\"G_i\\ge\\min(a_i,b_i)^2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>G<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>≥<\/mo>\n<mo data-mjx-texclass=\"OP\" movablelimits=\"true\">min<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<msub>\n<mi>a<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>b<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<msup>\n<mo stretchy=\"false\">)<\/mo>\n<mn>2<\/mn>\n<\/msup>\n<\/math><\/span>.<\/li>\n<li>A selected supercritical role satisfies <span class=\"math-inline\"><math aria-label=\"G_i\\ge\\max(a_i,b_i)^2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>G<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>≥<\/mo>\n<mo data-mjx-texclass=\"OP\" movablelimits=\"true\">max<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<msub>\n<mi>a<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>b<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<msup>\n<mo stretchy=\"false\">)<\/mo>\n<mn>2<\/mn>\n<\/msup>\n<\/math><\/span>.<\/li>\n<li><strong>CALCULATION LEAF:<\/strong> the geometric square-loss bounds — <a class=\"node-link\" href=\"#/BOUNDS\">[BOUNDS]<\/a>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Aggregate around the cycle.<\/strong>\n<\/summary><ul>\n<li>Put <span class=\"math-inline\"><math aria-label=\"m=\\min_i x_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>m<\/mi>\n<mo>=<\/mo>\n<munder>\n<mo data-mjx-texclass=\"OP\" movablelimits=\"true\">min<\/mo>\n<mi>i<\/mi>\n<\/munder>\n<msub>\n<mi>x<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"M=\\max_i x_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>M<\/mi>\n<mo>=<\/mo>\n<munder>\n<mo data-mjx-texclass=\"OP\" movablelimits=\"true\">max<\/mo>\n<mi>i<\/mi>\n<\/munder>\n<msub>\n<mi>x<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>.<\/li>\n<li>Reflection exchanges the two demand coordinates, so assume <span class=\"math-inline\"><math aria-label=\"m\\le1-M\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>m<\/mi>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>M<\/mi>\n<\/math><\/span>.<\/li>\n<li>Every selected coordinate is then at least <span class=\"math-inline\"><math aria-label=\"m\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>m<\/mi>\n<\/math><\/span>.<\/li>\n<li>An ascent leaving a minimum plateau contributes at least <span class=\"math-inline\"><math aria-label=\"(1-m)^2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>m<\/mi>\n<msup>\n<mo stretchy=\"false\">)<\/mo>\n<mn>2<\/mn>\n<\/msup>\n<\/math><\/span>.<\/li>\n<li>A second ascent contributes strictly more than <span class=\"math-inline\"><math aria-label=\"1/4\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>4<\/mn>\n<\/math><\/span>.<\/li>\n<li>The remaining four roles each contribute at least <span class=\"math-inline\"><math aria-label=\"m^2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msup>\n<mi>m<\/mi>\n<mn>2<\/mn>\n<\/msup>\n<\/math><\/span>.<\/li>\n<li>Therefore <span class=\"math-inline\"><math aria-label=\"\\sum_iG_i&gt;(1-m)^2+1/4+4m^2=5(m-1/5)^2+21/20&gt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<munder>\n<mo data-mjx-texclass=\"OP\">∑<\/mo>\n<mi>i<\/mi>\n<\/munder>\n<msub>\n<mi>G<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>&gt;<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>m<\/mi>\n<msup>\n<mo stretchy=\"false\">)<\/mo>\n<mn>2<\/mn>\n<\/msup>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>4<\/mn>\n<mo>+<\/mo>\n<mn>4<\/mn>\n<msup>\n<mi>m<\/mi>\n<mn>2<\/mn>\n<\/msup>\n<mo>=<\/mo>\n<mn>5<\/mn>\n<mo stretchy=\"false\">(<\/mo>\n<mi>m<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>5<\/mn>\n<msup>\n<mo stretchy=\"false\">)<\/mo>\n<mn>2<\/mn>\n<\/msup>\n<mo>+<\/mo>\n<mn>21<\/mn>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>20<\/mn>\n<mo>&gt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Compare inside area.<\/strong>\n<\/summary><ul>\n<li>The six vertex triangles have total area inside <span class=\"math-inline\"><math aria-label=\"H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>H<\/mi>\n<\/math><\/span> below <span class=\"math-inline\"><math aria-label=\"5\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>5<\/mn>\n<\/math><\/span>.<\/li>\n<li>The center contributes at most <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<li>The union cannot cover a hexagon of area <span class=\"math-inline\"><math aria-label=\"6\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>6<\/mn>\n<\/math><\/span>.<\/li>\n<li>Contradiction.<\/li>\n<\/ul>\n<\/details><\/li>\n<\/ul>\n<h2>Presentation cutoff<\/h2>\n<p>Keep the aggregation above in the main explanation: it is short. The calculation leaf is the proof of the local square-loss estimates, not this cyclic sum.<\/p>\n<hr/>\n<p><strong>Proof sources:<\/strong> <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/2XXX_geometric_lemmas/24XX_area_loss/2400_zero_gap_area_loss_interface.md\" rel=\"noopener noreferrer\" target=\"_blank\">2400<\/a> · <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/2XXX_geometric_lemmas/25XX_length_bounds/2532_open_cover_budget.md\" rel=\"noopener noreferrer\" target=\"_blank\">2532<\/a>. All source links are pinned to the same repository snapshot.<\/p>\n<p><a class=\"node-link\" href=\"#/MAIN\">[MAIN]<\/a> Return to the main tree.<\/p>\n"},"BC":{"id":"BC","file":"BC.md","title":"Five-point selected-gap obstruction","group":"Proof trees","html":"<h1>[BC] Five-point selected-gap obstruction<\/h1>\n<p><a class=\"node-link\" href=\"#/MAIN\">[MAIN]<\/a> · <a class=\"node-link\" href=\"#/BC\">[BC]<\/a> · <a class=\"node-link\" href=\"#/D\">[D]<\/a> · <a class=\"node-link\" href=\"#/CALIPERS\">[CALIPERS]<\/a><\/p>\n<details class=\"local-terms\" open=\"\"><summary>Terms used here<\/summary><p><span class=\"math-inline\"><math aria-label=\"H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>H<\/mi>\n<\/math><\/span> is the closed regular hexagon of side one, <span class=\"math-inline\"><math aria-label=\"O=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<mo>=<\/mo>\n<mn>0<\/mn>\n<\/math><\/span> its center, and\n<span class=\"math-inline\"><math aria-label=\"V_i=(\\cos(i\\pi/3),\\sin(i\\pi/3))\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mi>cos<\/mi>\n<mo data-mjx-texclass=\"NONE\">⁡<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mi>i<\/mi>\n<mi>π<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>3<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<mo>,<\/mo>\n<mi>sin<\/mi>\n<mo data-mjx-texclass=\"NONE\">⁡<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mi>i<\/mi>\n<mi>π<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>3<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> its vertices (indices modulo six).\nThe spoke is <span class=\"math-inline\"><math aria-label=\"r_i=[O,V_i]\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>r<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<mi>O<\/mi>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<\/math><\/span> and its midpoint is <span class=\"math-inline\"><math aria-label=\"M_i=V_i/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>.\n<span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> is the open unit equilateral triangle containing <span class=\"math-inline\"><math aria-label=\"O\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<\/math><\/span>; <span class=\"math-inline\"><math aria-label=\"U_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> contains <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>.\nTheir closures are <span class=\"math-inline\"><math aria-label=\"T_C,T_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>T<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>. Coverage uses the open triangles.\n<span class=\"math-inline\"><math aria-label=\"A_i,B_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> are the actual boundary reaches toward <span class=\"math-inline\"><math aria-label=\"V_{i-1},V_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>.\nNonsupercritical means <span class=\"math-inline\"><math aria-label=\"A_i+B_i\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>, not a condition on arbitrary lower demands.\nA gap <span class=\"math-inline\"><math aria-label=\"X_i([B_i,1-A_{i+1}])\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>X<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<msub>\n<mi>A<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>, where <span class=\"math-inline\"><math aria-label=\"X_i(w)=(1-w)V_i+wV_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>X<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>w<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>w<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<mi>w<\/mi>\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>,\nincludes a singleton when its endpoints coincide.\nA witness is forced into <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> if the original covering hypotheses imply that membership.\n<span class=\"math-inline\"><math aria-label=\"\\Lambda(F)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi mathvariant=\"normal\">Λ<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>F<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> is the minimum closed equilateral enclosure side of the compact set <span class=\"math-inline\"><math aria-label=\"F\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>F<\/mi>\n<\/math><\/span>;\n<span class=\"math-inline\"><math aria-label=\"F\\subset U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>F<\/mi>\n<mo>⊂<\/mo>\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> implies <span class=\"math-inline\"><math aria-label=\"\\Lambda(F)&lt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi mathvariant=\"normal\">Λ<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>F<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>&lt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.\n<span class=\"math-inline\"><math aria-label=\"C_0(a,b)=c_{\\max}(a,b)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>C<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>a<\/mi>\n<mo>,<\/mo>\n<mi>b<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<msub>\n<mi>c<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mo data-mjx-texclass=\"OP\" movablelimits=\"true\">max<\/mo>\n<\/mrow>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>a<\/mi>\n<mo>,<\/mo>\n<mi>b<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> is the own-ray capacity function, not the actual scalar <span class=\"math-inline\"><math aria-label=\"C_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>C<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>.\n<span class=\"math-inline\"><math aria-label=\"C_+\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>C<\/mi>\n<mo>+<\/mo>\n<\/msub>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"C_-\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>C<\/mi>\n<mo>−<\/mo>\n<\/msub>\n<\/math><\/span> are neighboring-ray capacities for that same prescribed pair.<\/p><\/details>\n<h2>Tree<\/h2>\n<ul class=\"proof-tree\">\n<li><details open=\"\"><summary><strong>Use the original boundary path.<\/strong>\n<\/summary><ul>\n<li>Normalize the structural midpoint to <span class=\"math-inline\"><math aria-label=\"M_0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<\/math><\/span> and select gap <span class=\"math-inline\"><math aria-label=\"J_0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>J<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<\/math><\/span>.<\/li>\n<li>The five roles <span class=\"math-inline\"><math aria-label=\"T_1,\\ldots,T_5\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<mo>,<\/mo>\n<mo>…<\/mo>\n<mo>,<\/mo>\n<msub>\n<mi>T<\/mi>\n<mn>5<\/mn>\n<\/msub>\n<\/math><\/span> are nonsupercritical; four middle edges have <span class=\"math-inline\"><math aria-label=\"B_i+A_{i+1}&gt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>A<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>&gt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<li>Thus <span class=\"math-inline\"><math aria-label=\"A\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>A<\/mi>\n<\/math><\/span> increases and <span class=\"math-inline\"><math aria-label=\"B\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>B<\/mi>\n<\/math><\/span> decreases. Original perimeter coverage supplies <span class=\"math-inline\"><math aria-label=\"B_5&gt;B_0/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>B<\/mi>\n<mn>5<\/mn>\n<\/msub>\n<mo>&gt;<\/mo>\n<msub>\n<mi>B<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Keep two different comparison pairs.<\/strong>\n<\/summary><ul>\n<li>Put <span class=\"math-inline\"><math aria-label=\"x=B_0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>x<\/mi>\n<mo>=<\/mo>\n<msub>\n<mi>B<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"y=1-A_1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>y<\/mi>\n<mo>=<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<msub>\n<mi>A<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"z=B_3\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>z<\/mi>\n<mo>=<\/mo>\n<msub>\n<mi>B<\/mi>\n<mn>3<\/mn>\n<\/msub>\n<\/math><\/span>, so <span class=\"math-inline\"><math aria-label=\"0&lt;x\\le y&lt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>0<\/mn>\n<mo>&lt;<\/mo>\n<mi>x<\/mi>\n<mo>≤<\/mo>\n<mi>y<\/mi>\n<mo>&lt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"x/2\\le z\\le y\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>x<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<mo>≤<\/mo>\n<mi>z<\/mi>\n<mo>≤<\/mo>\n<mi>y<\/mi>\n<\/math><\/span>.<\/li>\n<li>Set <span class=\"math-inline\"><math aria-label=\"r=1-C_0(1-y,z)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>r<\/mi>\n<mo>=<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<msub>\n<mi>C<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>y<\/mi>\n<mo>,<\/mo>\n<mi>z<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"t=1-C_0(1-z,x/2)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>t<\/mi>\n<mo>=<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<msub>\n<mi>C<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>z<\/mi>\n<mo>,<\/mo>\n<mi>x<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>.<\/li>\n<li>No uniform minimum pair is used. There is no point on <span class=\"math-inline\"><math aria-label=\"r_3\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>r<\/mi>\n<mn>3<\/mn>\n<\/msub>\n<\/math><\/span>, but <span class=\"math-inline\"><math aria-label=\"B_3\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>B<\/mi>\n<mn>3<\/mn>\n<\/msub>\n<\/math><\/span> remains essential.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Force at most five points.<\/strong>\n<\/summary><ul>\n<li>The midpoint and both selected-gap endpoints are in <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span>.<\/li>\n<li>Apply <span class=\"math-inline\"><math aria-label=\"C_\\pm(a,b)\\le1-\\min(a,b)\\le C_0(a,b)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>C<\/mi>\n<mo>±<\/mo>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>a<\/mi>\n<mo>,<\/mo>\n<mi>b<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mo data-mjx-texclass=\"OP\" movablelimits=\"true\">min<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mi>a<\/mi>\n<mo>,<\/mo>\n<mi>b<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>≤<\/mo>\n<msub>\n<mi>C<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>a<\/mi>\n<mo>,<\/mo>\n<mi>b<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> separately at each triangle's own pair.<\/li>\n<li>Safe radii are <span class=\"math-inline\"><math aria-label=\"\\min\\{1-C_0(A_i,B_i),A_{i-1},B_{i+1}\\}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo data-mjx-texclass=\"OP\" movablelimits=\"true\">min<\/mo>\n<mo fence=\"false\" stretchy=\"false\">{<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<msub>\n<mi>C<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">)<\/mo>\n<mo>,<\/mo>\n<msub>\n<mi>A<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>B<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo fence=\"false\" stretchy=\"false\">}<\/mo>\n<\/math><\/span>.<\/li>\n<li>Therefore the fixed witnesses are <span class=\"math-inline\"><math aria-label=\"M_0,G_x,G_y,rV_2,\\min(t,A_3)V_4\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>G<\/mi>\n<mi>x<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>G<\/mi>\n<mi>y<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<mi>r<\/mi>\n<msub>\n<mi>V<\/mi>\n<mn>2<\/mn>\n<\/msub>\n<mo>,<\/mo>\n<mo data-mjx-texclass=\"OP\" movablelimits=\"true\">min<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mi>t<\/mi>\n<mo>,<\/mo>\n<msub>\n<mi>A<\/mi>\n<mn>3<\/mn>\n<\/msub>\n<mo stretchy=\"false\">)<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>4<\/mn>\n<\/msub>\n<\/math><\/span>, where <span class=\"math-inline\"><math aria-label=\"G_w=X_0(w)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>G<\/mi>\n<mi>w<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<msub>\n<mi>X<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>w<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Deal with the one clipping explicitly.<\/strong>\n<\/summary><ul>\n<li>If <span class=\"math-inline\"><math aria-label=\"A_3&lt;t\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mn>3<\/mn>\n<\/msub>\n<mo>&lt;<\/mo>\n<mi>t<\/mi>\n<\/math><\/span>, then <span class=\"math-inline\"><math aria-label=\"A_3\\ge1-y\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mn>3<\/mn>\n<\/msub>\n<mo>≥<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>y<\/mi>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"\\|G_y-A_3V_4\\|^2\\ge1+(1-y)(2-y)&gt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo data-mjx-texclass=\"ORD\">∥<\/mo>\n<msub>\n<mi>G<\/mi>\n<mi>y<\/mi>\n<\/msub>\n<mo>−<\/mo>\n<msub>\n<mi>A<\/mi>\n<mn>3<\/mn>\n<\/msub>\n<msub>\n<mi>V<\/mi>\n<mn>4<\/mn>\n<\/msub>\n<msup>\n<mo data-mjx-texclass=\"ORD\">∥<\/mo>\n<mn>2<\/mn>\n<\/msup>\n<mo>≥<\/mo>\n<mn>1<\/mn>\n<mo>+<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>y<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>2<\/mn>\n<mo>−<\/mo>\n<mi>y<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>&gt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>: diameter ends the proof.<\/li>\n<li>Otherwise the fixed set is <span class=\"math-inline\"><math aria-label=\"M_0,G_x,G_y,rV_2,tV_4\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>G<\/mi>\n<mi>x<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>G<\/mi>\n<mi>y<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<mi>r<\/mi>\n<msub>\n<mi>V<\/mi>\n<mn>2<\/mn>\n<\/msub>\n<mo>,<\/mo>\n<mi>t<\/mi>\n<msub>\n<mi>V<\/mi>\n<mn>4<\/mn>\n<\/msub>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Apply finite calipers.<\/strong>\n<\/summary><ul>\n<li>The hull order is <span class=\"math-inline\"><math aria-label=\"M_0,G_x,G_y,rV_2,tV_4\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>G<\/mi>\n<mi>x<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>G<\/mi>\n<mi>y<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<mi>r<\/mi>\n<msub>\n<mi>V<\/mi>\n<mn>2<\/mn>\n<\/msub>\n<mo>,<\/mo>\n<mi>t<\/mi>\n<msub>\n<mi>V<\/mi>\n<mn>4<\/mn>\n<\/msub>\n<\/math><\/span>; discard a zero gap edge if <span class=\"math-inline\"><math aria-label=\"x=y\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>x<\/mi>\n<mo>=<\/mo>\n<mi>y<\/mi>\n<\/math><\/span>.<\/li>\n<li>Four calipers exceed one by elementary squared identities.<\/li>\n<li>The fifth follows from <span class=\"math-inline\"><math aria-label=\"2(r+t)&gt;(1-y+r)(2x-y+r)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>2<\/mn>\n<mo stretchy=\"false\">(<\/mo>\n<mi>r<\/mi>\n<mo>+<\/mo>\n<mi>t<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>&gt;<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>y<\/mi>\n<mo>+<\/mo>\n<mi>r<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>2<\/mn>\n<mi>x<\/mi>\n<mo>−<\/mo>\n<mi>y<\/mi>\n<mo>+<\/mo>\n<mi>r<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>.<\/li>\n<li><strong>CALCULATION LEAF:<\/strong> reusable envelope, coupled inequality, and five support formulas — <a class=\"node-link\" href=\"#/BC-CALC\">[BC-CALC]<\/a>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><strong>Conclude.<\/strong> Every branch has <span class=\"math-inline\"><math aria-label=\"\\Lambda(K_{BC})&gt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi mathvariant=\"normal\">Λ<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<msub>\n<mi>K<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>B<\/mi>\n<mi>C<\/mi>\n<\/mrow>\n<\/msub>\n<mo stretchy=\"false\">)<\/mo>\n<mo>&gt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>, contrary to compact containment in <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span>.<\/li>\n<\/ul>\n<p>There is no candidate CE1/CE2 split, no CE1 return, no disk, and no sixth radial witness.\nStructural midpoint and supplier classifications elsewhere remain part of the full proof.<\/p>\n<h2>Proof sources<\/h2>\n<p>The active terminal is <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/2XXX_geometric_lemmas/26XX_enclosing_triangle_tools/2616_bc_d_finite_calipers.md\" rel=\"noopener noreferrer\" target=\"_blank\">2616<\/a>.\nIts capacity input is <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/2XXX_geometric_lemmas/26XX_enclosing_triangle_tools/2615_slack_sensitive_radial_envelope.md\" rel=\"noopener noreferrer\" target=\"_blank\">2615<\/a>.\nThe entire page is explanatory; numbered sources supply proof authority.<\/p>\n"},"C-MIDPOINT":{"id":"C-MIDPOINT","file":"C-MIDPOINT.md","title":"Exactly one center midpoint","group":"Proof trees","html":"<h1>[C-MIDPOINT] Exactly one center midpoint<\/h1>\n<p><a class=\"node-link\" href=\"#/MAIN\">[MAIN]<\/a> · <a class=\"node-link\" href=\"#/MIDPOINTS\">[MIDPOINTS]<\/a> · <a class=\"node-link\" href=\"#/NOTATION\">[NOTATION]<\/a> · <a class=\"node-link\" href=\"#/USE\">[USE]<\/a> · <a class=\"node-link\" href=\"#/GLOSSARY\">[GLOSSARY]<\/a><\/p>\n<details class=\"local-terms\" open=\"\"><summary>Terms used here<\/summary><ul class=\"proof-tree\">\n<li><strong>Geometry and triangles.<\/strong> <span class=\"math-inline\"><math aria-label=\"H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>H<\/mi>\n<\/math><\/span> is the closed regular hexagon of side <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span>, with center <span class=\"math-inline\"><math aria-label=\"O=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<mo>=<\/mo>\n<mn>0<\/mn>\n<\/math><\/span> and vertices <span class=\"math-inline\"><math aria-label=\"V_0,\\ldots,V_5\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>,<\/mo>\n<mo>…<\/mo>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>5<\/mn>\n<\/msub>\n<\/math><\/span> in cyclic order. Indices are modulo <span class=\"math-inline\"><math aria-label=\"6\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>6<\/mn>\n<\/math><\/span> (so <span class=\"math-inline\"><math aria-label=\"V_6=V_0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mn>6<\/mn>\n<\/msub>\n<mo>=<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<\/math><\/span>). A <strong>spoke<\/strong> is <span class=\"math-inline\"><math aria-label=\"r_i=[O,V_i]\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>r<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<mi>O<\/mi>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<\/math><\/span>; its midpoint is <span class=\"math-inline\"><math aria-label=\"M_i=V_i/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>. The boundary edge <span class=\"math-inline\"><math aria-label=\"e_{i,i+1}=[V_i,V_{i+1}]\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>e<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>,<\/mo>\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<\/math><\/span> has parameterization <span class=\"math-inline\"><math aria-label=\"X_i(t)=(1-t)V_i+tV_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>X<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>t<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>t<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<mi>t<\/mi>\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"0\\le t\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>0<\/mn>\n<mo>≤<\/mo>\n<mi>t<\/mi>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<li><strong>C triangle and V triangles.<\/strong> <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> is an open unit equilateral triangle containing <span class=\"math-inline\"><math aria-label=\"O\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<\/math><\/span>; <span class=\"math-inline\"><math aria-label=\"U_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> is one containing <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>. A <strong>role<\/strong> means one of these assigned triangles. Their closures <span class=\"math-inline\"><math aria-label=\"T_C,T_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>T<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> include their sides and vertices; the open triangles do not. Coverage always uses the open triangles. A <strong>trace<\/strong> is intersection with the stated edge or spoke; the <strong>relative interior<\/strong> of an edge removes its endpoints.<\/li>\n<li><strong>Trace and side slack.<\/strong> A trace is the intersection with a hexagon edge; positive length excludes a singleton. An affine <strong>side slack<\/strong> is a linear expression plus a constant, chosen so <span class=\"math-inline\"><math aria-label=\"F\\ge0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>F<\/mi>\n<mo>≥<\/mo>\n<mn>0<\/mn>\n<\/math><\/span> describes one triangle half-plane and <span class=\"math-inline\"><math aria-label=\"F&gt;0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>F<\/mi>\n<mo>&gt;<\/mo>\n<mn>0<\/mn>\n<\/math><\/span> its interior. It need not equal Euclidean distance to the side. The local coordinates <span class=\"math-inline\"><math aria-label=\"(b,a)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<mi>b<\/mi>\n<mo>,<\/mo>\n<mi>a<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> below have origin <span class=\"math-inline\"><math aria-label=\"V_0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<\/math><\/span> and basis <span class=\"math-inline\"><math aria-label=\"V_1-V_0,V_5-V_0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<mo>−<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>5<\/mn>\n<\/msub>\n<mo>−<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<\/math><\/span>, so the global center <span class=\"math-inline\"><math aria-label=\"O\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<\/math><\/span> has coordinates <span class=\"math-inline\"><math aria-label=\"(1,1)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>.<\/li>\n<\/ul><\/details>\n<p><strong>Statement.<\/strong> If <span class=\"math-inline\"><math aria-label=\"O\\in\\operatorname{int}(T_C)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<mo>∈<\/mo>\n<mi>int<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<msub>\n<mi>T<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"T_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> has a positive-length trace on a boundary edge, then exactly one spoke midpoint lies in <span class=\"math-inline\"><math aria-label=\"T_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span>, and that midpoint lies in its interior. The hypothesis that <span class=\"math-inline\"><math aria-label=\"O\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<\/math><\/span> is interior is essential.<\/p>\n<h2>Tree<\/h2>\n<ul class=\"proof-tree\">\n<li><details open=\"\"><summary><strong>Normalize one positive trace to <span class=\"math-inline\"><math aria-label=\"e_{0,1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>e<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mn>0<\/mn>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>.<\/strong>\n<\/summary><ul>\n<li>Use <span class=\"math-inline\"><math aria-label=\"X=V_0+b(V_1-V_0)+a(V_5-V_0)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>X<\/mi>\n<mo>=<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>+<\/mo>\n<mi>b<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<mo>−<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo stretchy=\"false\">)<\/mo>\n<mo>+<\/mo>\n<mi>a<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>5<\/mn>\n<\/msub>\n<mo>−<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>.<\/li>\n<li>Reflect if necessary to obtain <span class=\"math-inline\"><math aria-label=\"0&lt;\\lambda&lt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>0<\/mn>\n<mo>&lt;<\/mo>\n<mi>λ<\/mi>\n<mo>&lt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>; set <span class=\"math-inline\"><math aria-label=\"\\rho=\\sqrt{1-\\lambda+\\lambda^2}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>ρ<\/mi>\n<mo>=<\/mo>\n<msqrt>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>λ<\/mi>\n<mo>+<\/mo>\n<msup>\n<mi>λ<\/mi>\n<mn>2<\/mn>\n<\/msup>\n<\/msqrt>\n<\/math><\/span>.<\/li>\n<li>Let the trace endpoints be <span class=\"math-inline\"><math aria-label=\"s&lt;t\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>s<\/mi>\n<mo>&lt;<\/mo>\n<mi>t<\/mi>\n<\/math><\/span> in edge parameters.<\/li>\n<li><details open=\"\"><summary>The triangle is defined by three nonnegative affine side slacks:\n<\/summary><ul>\n<li><span class=\"math-inline\"><math aria-label=\"F_1=\\lambda b+(1-\\lambda)a-\\lambda s\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>F<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<mo>=<\/mo>\n<mi>λ<\/mi>\n<mi>b<\/mi>\n<mo>+<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>λ<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mi>a<\/mi>\n<mo>−<\/mo>\n<mi>λ<\/mi>\n<mi>s<\/mi>\n<\/math><\/span>.<\/li>\n<li><span class=\"math-inline\"><math aria-label=\"F_2=-b+\\lambda a+t\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>F<\/mi>\n<mn>2<\/mn>\n<\/msub>\n<mo>=<\/mo>\n<mo>−<\/mo>\n<mi>b<\/mi>\n<mo>+<\/mo>\n<mi>λ<\/mi>\n<mi>a<\/mi>\n<mo>+<\/mo>\n<mi>t<\/mi>\n<\/math><\/span>.<\/li>\n<li><span class=\"math-inline\"><math aria-label=\"F_0=(1-\\lambda)b-a+\\rho+\\lambda s-t\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>F<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>λ<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mi>b<\/mi>\n<mo>−<\/mo>\n<mi>a<\/mi>\n<mo>+<\/mo>\n<mi>ρ<\/mi>\n<mo>+<\/mo>\n<mi>λ<\/mi>\n<mi>s<\/mi>\n<mo>−<\/mo>\n<mi>t<\/mi>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li>Their sum is <span class=\"math-inline\"><math aria-label=\"\\rho\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>ρ<\/mi>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Evaluate the slacks at the center.<\/strong>\n<\/summary><ul>\n<li>Put <span class=\"math-inline\"><math aria-label=\"\\kappa_j=F_j(O)&gt;0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>κ<\/mi>\n<mi>j<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<msub>\n<mi>F<\/mi>\n<mi>j<\/mi>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>O<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>&gt;<\/mo>\n<mn>0<\/mn>\n<\/math><\/span>; thus <span class=\"math-inline\"><math aria-label=\"\\kappa_0+\\kappa_1+\\kappa_2=\\rho\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>κ<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>κ<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>κ<\/mi>\n<mn>2<\/mn>\n<\/msub>\n<mo>=<\/mo>\n<mi>ρ<\/mi>\n<\/math><\/span>.<\/li>\n<li>Positive trace length is equivalent to <span class=\"math-inline\"><math aria-label=\"\\kappa_0+(1-\\lambda)\\kappa_2&lt;P\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>κ<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>+<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>λ<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<msub>\n<mi>κ<\/mi>\n<mn>2<\/mn>\n<\/msub>\n<mo>&lt;<\/mo>\n<mi>P<\/mi>\n<\/math><\/span>, where <span class=\"math-inline\"><math aria-label=\"P=\\rho(1-\\rho)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>P<\/mi>\n<mo>=<\/mo>\n<mi>ρ<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>ρ<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>.<\/li>\n<li><details open=\"\"><summary>Since <span class=\"math-inline\"><math aria-label=\"P=\\lambda(1-\\lambda)\\rho/(1+\\rho)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>P<\/mi>\n<mo>=<\/mo>\n<mi>λ<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>λ<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mi>ρ<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>+<\/mo>\n<mi>ρ<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>:\n<\/summary><ul>\n<li><span class=\"math-inline\"><math aria-label=\"\\kappa_0&lt;P&lt;\\lambda(1-\\lambda)/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>κ<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>&lt;<\/mo>\n<mi>P<\/mi>\n<mo>&lt;<\/mo>\n<mi>λ<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>λ<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>.<\/li>\n<li><span class=\"math-inline\"><math aria-label=\"\\kappa_2&lt;P/(1-\\lambda)&lt;\\lambda/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>κ<\/mi>\n<mn>2<\/mn>\n<\/msub>\n<mo>&lt;<\/mo>\n<mi>P<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>λ<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>&lt;<\/mo>\n<mi>λ<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>.<\/li>\n<li><span class=\"math-inline\"><math aria-label=\"\\kappa_1&gt;\\rho-P/(1-\\lambda)=\\rho(\\rho-\\lambda)/(1-\\lambda)&gt;1/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>κ<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<mo>&gt;<\/mo>\n<mi>ρ<\/mi>\n<mo>−<\/mo>\n<mi>P<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>λ<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mi>ρ<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>ρ<\/mi>\n<mo>−<\/mo>\n<mi>λ<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>λ<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>&gt;<\/mo>\n<mn>1<\/mn>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li>The last comparison follows from <span class=\"math-inline\"><math aria-label=\"2\\rho(\\rho-\\lambda)-(1-\\lambda)=(1-\\lambda)(\\rho-\\lambda)/(\\rho+\\lambda)&gt;0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>2<\/mn>\n<mi>ρ<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>ρ<\/mi>\n<mo>−<\/mo>\n<mi>λ<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>−<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>λ<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>λ<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mi>ρ<\/mi>\n<mo>−<\/mo>\n<mi>λ<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mo stretchy=\"false\">(<\/mo>\n<mi>ρ<\/mi>\n<mo>+<\/mo>\n<mi>λ<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>&gt;<\/mo>\n<mn>0<\/mn>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Substitute the six midpoint coordinates into the side inequalities.<\/strong>\n<\/summary><ul>\n<li><span class=\"math-inline\"><math aria-label=\"M_0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<\/math><\/span> needs <span class=\"math-inline\"><math aria-label=\"\\kappa_1\\ge1/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>κ<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<mo>≥<\/mo>\n<mn>1<\/mn>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>; the strict inequality puts it inside.<\/li>\n<li><span class=\"math-inline\"><math aria-label=\"M_1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<\/math><\/span> needs <span class=\"math-inline\"><math aria-label=\"\\kappa_2\\ge\\lambda/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>κ<\/mi>\n<mn>2<\/mn>\n<\/msub>\n<mo>≥<\/mo>\n<mi>λ<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>; it fails.<\/li>\n<li><span class=\"math-inline\"><math aria-label=\"M_2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mn>2<\/mn>\n<\/msub>\n<\/math><\/span> needs <span class=\"math-inline\"><math aria-label=\"\\kappa_2\\ge1/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>κ<\/mi>\n<mn>2<\/mn>\n<\/msub>\n<mo>≥<\/mo>\n<mn>1<\/mn>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>; it fails.<\/li>\n<li><span class=\"math-inline\"><math aria-label=\"M_3\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mn>3<\/mn>\n<\/msub>\n<\/math><\/span> needs <span class=\"math-inline\"><math aria-label=\"\\kappa_0\\ge\\lambda/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>κ<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>≥<\/mo>\n<mi>λ<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>; it fails.<\/li>\n<li><span class=\"math-inline\"><math aria-label=\"M_4\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mn>4<\/mn>\n<\/msub>\n<\/math><\/span> needs <span class=\"math-inline\"><math aria-label=\"\\kappa_0\\ge1/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>κ<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>≥<\/mo>\n<mn>1<\/mn>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>; it fails.<\/li>\n<li><span class=\"math-inline\"><math aria-label=\"M_5\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mn>5<\/mn>\n<\/msub>\n<\/math><\/span> needs <span class=\"math-inline\"><math aria-label=\"\\kappa_0\\ge(1-\\lambda)/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>κ<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>≥<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>λ<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>; it fails.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Locate any companion boundary trace.<\/strong>\n<\/summary><ul>\n<li>The center classification permits only a trace adjacent to <span class=\"math-inline\"><math aria-label=\"e_{0,1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>e<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mn>0<\/mn>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>.<\/li>\n<li>On <span class=\"math-inline\"><math aria-label=\"e_{1,2}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>e<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mn>1<\/mn>\n<mo>,<\/mo>\n<mn>2<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>, parameterized by <span class=\"math-inline\"><math aria-label=\"a=q,b=1+q\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>a<\/mi>\n<mo>=<\/mo>\n<mi>q<\/mi>\n<mo>,<\/mo>\n<mi>b<\/mi>\n<mo>=<\/mo>\n<mn>1<\/mn>\n<mo>+<\/mo>\n<mi>q<\/mi>\n<\/math><\/span>, the side slack is <span class=\"math-inline\"><math aria-label=\"F_2=t-1-(1-\\lambda)q\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>F<\/mi>\n<mn>2<\/mn>\n<\/msub>\n<mo>=<\/mo>\n<mi>t<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>λ<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mi>q<\/mi>\n<\/math><\/span>.<\/li>\n<li>Since <span class=\"math-inline\"><math aria-label=\"t=\\kappa_2+1-\\lambda&lt;1-\\lambda/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>t<\/mi>\n<mo>=<\/mo>\n<msub>\n<mi>κ<\/mi>\n<mn>2<\/mn>\n<\/msub>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>λ<\/mi>\n<mo>&lt;<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>λ<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>, this slack is negative.<\/li>\n<li>Thus the only possible companion edge is <span class=\"math-inline\"><math aria-label=\"e_{5,0}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>e<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mn>5<\/mn>\n<mo>,<\/mo>\n<mn>0<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Undo the symmetry.<\/strong>\n<\/summary><ul>\n<li>There is a unique index <span class=\"math-inline\"><math aria-label=\"k\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>k<\/mi>\n<\/math><\/span> with <span class=\"math-inline\"><math aria-label=\"M_k\\in U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>k<\/mi>\n<\/msub>\n<mo>∈<\/mo>\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span>.<\/li>\n<li>All other <span class=\"math-inline\"><math aria-label=\"M_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> lie outside <span class=\"math-inline\"><math aria-label=\"T_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span>.<\/li>\n<li>Every possible gap lies on one of the two edges incident with <span class=\"math-inline\"><math aria-label=\"V_k\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>k<\/mi>\n<\/msub>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<\/ul>\n<h2>Why the open-center hypothesis stays visible<\/h2>\n<p>The closed triangle <span class=\"math-inline\"><math aria-label=\"\\operatorname{conv}\\{O,V_0,V_1\\}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>conv<\/mi>\n<mo fence=\"false\" stretchy=\"false\">{<\/mo>\n<mi>O<\/mi>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<mo fence=\"false\" stretchy=\"false\">}<\/mo>\n<\/math><\/span> contains both <span class=\"math-inline\"><math aria-label=\"M_0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"M_1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<\/math><\/span> and overlaps a boundary edge. It is not a counterexample: <span class=\"math-inline\"><math aria-label=\"O\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<\/math><\/span> lies on its boundary, not in its interior.<\/p>\n<hr/>\n<p><strong>Proof sources:<\/strong> <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/2XXX_geometric_lemmas/21XX_C_triangle_geometry/2100_CE1_CE2_exactly_one_midpoint_lemma.md\" rel=\"noopener noreferrer\" target=\"_blank\">2100<\/a> · <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/2XXX_geometric_lemmas/21XX_C_triangle_geometry/2109_signed_CE1_CE2_center_normal_form.md\" rel=\"noopener noreferrer\" target=\"_blank\">2109<\/a>. All source links are pinned to the same repository snapshot.<\/p>\n<p><a class=\"node-link\" href=\"#/MAIN\">[MAIN]<\/a> Return to the main tree.<\/p>\n"},"CALIPERS":{"id":"CALIPERS","file":"CALIPERS.md","title":"Why the enclosing candidates are finite","group":"Proof trees","html":"<h1>[CALIPERS] Why the enclosing candidates are finite<\/h1>\n<p><a class=\"node-link\" href=\"#/MAIN\">[MAIN]<\/a> · <a class=\"node-link\" href=\"#/F\">[F]<\/a> · <a class=\"node-link\" href=\"#/SELF-MIDPOINT\">[SELF-MIDPOINT]<\/a> · <a class=\"node-link\" href=\"#/NOTATION\">[NOTATION]<\/a> · <a class=\"node-link\" href=\"#/USE\">[USE]<\/a> · <a class=\"node-link\" href=\"#/GLOSSARY\">[GLOSSARY]<\/a><\/p>\n<details class=\"local-terms\" open=\"\"><summary>Terms used here<\/summary><ul class=\"proof-tree\">\n<li><strong>Geometry and triangles.<\/strong> <span class=\"math-inline\"><math aria-label=\"H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>H<\/mi>\n<\/math><\/span> is the closed regular hexagon of side <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span>, with center <span class=\"math-inline\"><math aria-label=\"O=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<mo>=<\/mo>\n<mn>0<\/mn>\n<\/math><\/span> and vertices <span class=\"math-inline\"><math aria-label=\"V_0,\\ldots,V_5\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>,<\/mo>\n<mo>…<\/mo>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>5<\/mn>\n<\/msub>\n<\/math><\/span> in cyclic order. Indices are modulo <span class=\"math-inline\"><math aria-label=\"6\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>6<\/mn>\n<\/math><\/span> (so <span class=\"math-inline\"><math aria-label=\"V_6=V_0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mn>6<\/mn>\n<\/msub>\n<mo>=<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<\/math><\/span>). A <strong>spoke<\/strong> is <span class=\"math-inline\"><math aria-label=\"r_i=[O,V_i]\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>r<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<mi>O<\/mi>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<\/math><\/span>; its midpoint is <span class=\"math-inline\"><math aria-label=\"M_i=V_i/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>. The boundary edge <span class=\"math-inline\"><math aria-label=\"e_{i,i+1}=[V_i,V_{i+1}]\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>e<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>,<\/mo>\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<\/math><\/span> has parameterization <span class=\"math-inline\"><math aria-label=\"X_i(t)=(1-t)V_i+tV_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>X<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>t<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>t<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<mi>t<\/mi>\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"0\\le t\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>0<\/mn>\n<mo>≤<\/mo>\n<mi>t<\/mi>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<li><strong>C triangle and V triangles.<\/strong> <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> is an open unit equilateral triangle containing <span class=\"math-inline\"><math aria-label=\"O\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<\/math><\/span>; <span class=\"math-inline\"><math aria-label=\"U_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> is one containing <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>. A <strong>role<\/strong> means one of these assigned triangles. Their closures <span class=\"math-inline\"><math aria-label=\"T_C,T_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>T<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> include their sides and vertices; the open triangles do not. Coverage always uses the open triangles. A <strong>trace<\/strong> is intersection with the stated edge or spoke; the <strong>relative interior<\/strong> of an edge removes its endpoints.<\/li>\n<li><strong>Enclosure language.<\/strong> A <strong>witness<\/strong> is a chosen point used to contradict the cover. <strong>Forced into <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span><\/strong> means the cover and previously stated geometry imply that membership. A <strong>candidate<\/strong> is any other open unit equilateral triangle tested against the same fixed witnesses; it need not complete a cover with the old V triangles. <span class=\"math-inline\"><math aria-label=\"\\operatorname{conv}(K)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>conv<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>K<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> is the convex hull, the set of all convex combinations of points of <span class=\"math-inline\"><math aria-label=\"K\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>K<\/mi>\n<\/math><\/span>. For a nonempty compact set <span class=\"math-inline\"><math aria-label=\"K\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>K<\/mi>\n<\/math><\/span> (closed and bounded here), <span class=\"math-inline\"><math aria-label=\"\\Lambda(K)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi mathvariant=\"normal\">Λ<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>K<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> is the least side length of a closed equilateral triangle containing it. Thus <span class=\"math-inline\"><math aria-label=\"K\\subset U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>K<\/mi>\n<mo>⊂<\/mo>\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> gives <span class=\"math-inline\"><math aria-label=\"\\Lambda(K)&lt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi mathvariant=\"normal\">Λ<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>K<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>&lt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span> by shrinking its three sides slightly.<\/li>\n<li><strong>Support and contact.<\/strong> For a unit vector <span class=\"math-inline\"><math aria-label=\"n\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>n<\/mi>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"h_K(n)=\\max_{x\\in K}\\langle x,n\\rangle\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>h<\/mi>\n<mi>K<\/mi>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>n<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<munder>\n<mo data-mjx-texclass=\"OP\" movablelimits=\"true\">max<\/mo>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>x<\/mi>\n<mo>∈<\/mo>\n<mi>K<\/mi>\n<\/mrow>\n<\/munder>\n<mo fence=\"false\" stretchy=\"false\">⟨<\/mo>\n<mi>x<\/mi>\n<mo>,<\/mo>\n<mi>n<\/mi>\n<mo fence=\"false\" stretchy=\"false\">⟩<\/mo>\n<\/math><\/span> is the support value, where <span class=\"math-inline\"><math aria-label=\"\\langle x,n\\rangle\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo fence=\"false\" stretchy=\"false\">⟨<\/mo>\n<mi>x<\/mi>\n<mo>,<\/mo>\n<mi>n<\/mi>\n<mo fence=\"false\" stretchy=\"false\">⟩<\/mo>\n<\/math><\/span> is the ordinary dot product. The line <span class=\"math-inline\"><math aria-label=\"\\langle x,n\\rangle=h_K(n)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo fence=\"false\" stretchy=\"false\">⟨<\/mo>\n<mi>x<\/mi>\n<mo>,<\/mo>\n<mi>n<\/mi>\n<mo fence=\"false\" stretchy=\"false\">⟩<\/mo>\n<mo>=<\/mo>\n<msub>\n<mi>h<\/mi>\n<mi>K<\/mi>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>n<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> touches <span class=\"math-inline\"><math aria-label=\"K\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>K<\/mi>\n<\/math><\/span> and leaves it on one side; <span class=\"math-inline\"><math aria-label=\"n\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>n<\/mi>\n<\/math><\/span> is its outward normal. A <strong>support cell<\/strong> is an interval of orientations with the same support sources. A <strong>tie<\/strong> is an orientation where two sources attain one maximum. A disk tangent touches the circular boundary in one point. An <strong>exposed<\/strong> tangent also supports the whole point-and-disk convex hull.<\/li>\n<li><strong>The word calipers.<\/strong> It names the rotating-support-line method for finding an enclosing triangle, not an additional covering assumption. The finite-point claim below is stated for a polygon with interior. A point or line segment needs its elementary degenerate treatment.<\/li>\n<\/ul><\/details>\n<p><strong>Purpose:<\/strong> keep the geometric reduction in the spoken explanation while leaving explicit contact formulas and certificates on the detail pages.<\/p>\n<h2>Tree<\/h2>\n<ul class=\"proof-tree\">\n<li><details open=\"\"><summary><strong>Fix an orientation.<\/strong>\n<\/summary><ul>\n<li>Let <span class=\"math-inline\"><math aria-label=\"n_0,n_1,n_2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>n<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>n<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>n<\/mi>\n<mn>2<\/mn>\n<\/msub>\n<\/math><\/span> be outward unit normals separated by <span class=\"math-inline\"><math aria-label=\"120^\\circ\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msup>\n<mn>120<\/mn>\n<mo>∘<\/mo>\n<\/msup>\n<\/math><\/span>.<\/li>\n<li>The smallest triangle with those normals containing a compact set <span class=\"math-inline\"><math aria-label=\"K\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>K<\/mi>\n<\/math><\/span> uses support values <span class=\"math-inline\"><math aria-label=\"h_K(n_j)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>h<\/mi>\n<mi>K<\/mi>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<msub>\n<mi>n<\/mi>\n<mi>j<\/mi>\n<\/msub>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>.<\/li>\n<li>Its side length is <span class=\"math-inline\"><math aria-label=\"(2/\\sqrt3)\\sum_{j=0}^2h_K(n_j)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<mn>2<\/mn>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<msqrt>\n<mn>3<\/mn>\n<\/msqrt>\n<mo stretchy=\"false\">)<\/mo>\n<munderover>\n<mo data-mjx-texclass=\"OP\">∑<\/mo>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>j<\/mi>\n<mo>=<\/mo>\n<mn>0<\/mn>\n<\/mrow>\n<mn>2<\/mn>\n<\/munderover>\n<msub>\n<mi>h<\/mi>\n<mi>K<\/mi>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<msub>\n<mi>n<\/mi>\n<mi>j<\/mi>\n<\/msub>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>For a finite point set, vary the orientation.<\/strong>\n<\/summary><ul>\n<li>Between support changes, the three supporting points stay fixed.<\/li>\n<li>Their support sum has form <span class=\"math-inline\"><math aria-label=\"X\\cos\\phi+Y\\sin\\phi\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>X<\/mi>\n<mi>cos<\/mi>\n<mo data-mjx-texclass=\"NONE\">⁡<\/mo>\n<mi>ϕ<\/mi>\n<mo>+<\/mo>\n<mi>Y<\/mi>\n<mi>sin<\/mi>\n<mo data-mjx-texclass=\"NONE\">⁡<\/mo>\n<mi>ϕ<\/mi>\n<\/math><\/span>.<\/li>\n<li>Its second derivative is the negative of the sum.<\/li>\n<li>For a nondegenerate hull the sum is positive, so there is no interior minimum on such a cell.<\/li>\n<li>A minimum occurs at a support change: one side contains two hull vertices.<\/li>\n<li><details open=\"\"><summary>Hence a polygon has finitely many relevant hull-edge contacts.\n<\/summary><ul>\n<li>This gives the four contacts in <a class=\"node-link\" href=\"#/SELF-MIDPOINT\">[SELF-MIDPOINT]<\/a>.<\/li>\n<\/ul>\n<\/details><\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>For a centered disk and finitely many points, include disk support.<\/strong>\n<\/summary><ul>\n<li>Each support is the maximum of the disk radius and the point projections.<\/li>\n<li>If an orientation has disk support on all three sides, it attains the disk-only lower bound.<\/li>\n<li><details open=\"\"><summary>Otherwise a minimum can be chosen at a support tie.\n<\/summary><ul>\n<li><strong>Point–point tie:<\/strong> one side contains two points.<\/li>\n<li><strong>Point–disk tie:<\/strong> one side is tangent to the disk and contains a point.<\/li>\n<\/ul>\n<\/details><\/li>\n<li>There are finitely many such directions.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Specialize to the inner configuration in F.<\/strong>\n<\/summary><ul>\n<li>The points <span class=\"math-inline\"><math aria-label=\"A,B,C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>A<\/mi>\n<mo>,<\/mo>\n<mi>B<\/mi>\n<mo>,<\/mo>\n<mi>C<\/mi>\n<\/math><\/span> must form the specified consecutive part
