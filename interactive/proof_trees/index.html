ss=\"math-inline\"><math aria-label=\"S\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>S<\/mi>\n<\/math><\/span>:<\/strong> the perimeter together with all six spokes. Its length is <span class=\"math-inline\"><math aria-label=\"6+6=12\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>6<\/mn>\n<mo>+<\/mo>\n<mn>6<\/mn>\n<mo>=<\/mo>\n<mn>12<\/mn>\n<\/math><\/span> because isolated intersection points have zero length. Skeleton coverage need not cover the regions between the spokes.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Intersections, reaches, and gaps.<\/strong>\n<\/summary><ul>\n<li><strong>Trace:<\/strong> the intersection of a triangle with the specified edge or spoke. <strong>Positive trace/support:<\/strong> an intersection containing an interval of positive length, not merely a point.<\/li>\n<li><strong>Incident edges:<\/strong> the two perimeter edges having the given vertex as endpoint. <strong>Adjacent edges:<\/strong> edges sharing an endpoint. <strong>Relative interior of an edge:<\/strong> that edge with both endpoints removed.<\/li>\n<li><strong>Actual reaches <span class=\"math-inline\"><math aria-label=\"A_i,B_i,C_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>C<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>:<\/strong> the farthest distances realized by the closed triangle <span class=\"math-inline\"><math aria-label=\"T_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> along the preceding edge from <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>, the following edge from <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>, and the own spoke from <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> toward <span class=\"math-inline\"><math aria-label=\"O\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<\/math><\/span>.<\/li>\n<li><strong>Selected demands <span class=\"math-inline\"><math aria-label=\"a_i,b_i,c_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>a<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>b<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>c<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>:<\/strong> specified lower bounds on those reaches. They are not automatically the actual maxima. A triangle <strong>realizes<\/strong> a demand when it contains the specified point at that distance.<\/li>\n<li><strong>Supercritical:<\/strong> <span class=\"math-inline\"><math aria-label=\"A_i+B_i&gt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>&gt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>. <strong>Nonsupercritical:<\/strong> <span class=\"math-inline\"><math aria-label=\"A_i+B_i\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>. <span class=\"math-inline\"><math aria-label=\"N_+\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>N<\/mi>\n<mo>+<\/mo>\n<\/msub>\n<\/math><\/span> counts supercritical V triangles. The threshold concerns boundary length, not triangle area or number of supported spokes.<\/li>\n<li><strong>Boundary gap:<\/strong> a nonempty portion of a perimeter edge missed by all six open V triangles. It can still be covered by <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span>. Equality of the two closed trace endpoints leaves a <strong>singleton gap<\/strong>, a single point still requiring open coverage.<\/li>\n<li><strong>Gap-free:<\/strong> the open V traces cover that edge completely, so their reaches overlap strictly. <strong>Zero-gap configuration:<\/strong> the six open V triangles alone cover the whole perimeter. This does not imply CE0.<\/li>\n<li><strong>Center-free edge:<\/strong> <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> covers no point in that edge's relative interior. It need not be an edge with a gap: the incident V triangles must cover it without help from <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Support is not the same as supplying a midpoint.<\/strong>\n<\/summary><ul>\n<li><strong>Positive adjacent support:<\/strong> <span class=\"math-inline\"><math aria-label=\"T_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> meets a neighboring spoke in positive length. <span class=\"math-inline\"><math aria-label=\"N_{\\rm sp}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>N<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi mathvariant=\"normal\">s<\/mi>\n<mi mathvariant=\"normal\">p<\/mi>\n<\/mrow>\n<\/msub>\n<\/math><\/span> counts triangles with at least one such trace, not the number of supported spokes.<\/li>\n<li><strong>Neighboring supplier of <span class=\"math-inline\"><math aria-label=\"M_j\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>j<\/mi>\n<\/msub>\n<\/math><\/span>:<\/strong> a V triangle <span class=\"math-inline\"><math aria-label=\"U_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> with <span class=\"math-inline\"><math aria-label=\"i=j-1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>i<\/mi>\n<mo>=<\/mo>\n<mi>j<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<\/math><\/span> or <span class=\"math-inline\"><math aria-label=\"j+1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>j<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"M_j\\in U_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>j<\/mi>\n<\/msub>\n<mo>∈<\/mo>\n<msub>\n<mi>U<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>. <strong>Rescuer<\/strong> is a synonym for that same coverage relationship.<\/li>\n<li><strong>Example:<\/strong> when <span class=\"math-inline\"><math aria-label=\"M_1\\in U_0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<mo>∈<\/mo>\n<msub>\n<mi>U<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<\/math><\/span>, the triangle based at <span class=\"math-inline\"><math aria-label=\"V_0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<\/math><\/span> supplies the midpoint on <span class=\"math-inline\"><math aria-label=\"r_1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>r<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<\/math><\/span>. If <span class=\"math-inline\"><math aria-label=\"T_0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<\/math><\/span> merely meets <span class=\"math-inline\"><math aria-label=\"r_1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>r<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<\/math><\/span> away from <span class=\"math-inline\"><math aria-label=\"M_1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<\/math><\/span>, it has support but is not a supplier of <span class=\"math-inline\"><math aria-label=\"M_1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<\/math><\/span>.<\/li>\n<li><strong>One-way implication:<\/strong> supplying an interior spoke midpoint openly gives a small interval around it, hence positive support. The converse is false without midpoint containment.<\/li>\n<li><strong>Center-based supplier:<\/strong> its vertex index is <span class=\"math-inline\"><math aria-label=\"k\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>k<\/mi>\n<\/math><\/span>, where <span class=\"math-inline\"><math aria-label=\"M_k\\in U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>k<\/mi>\n<\/msub>\n<mo>∈<\/mo>\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span>. It remains a V triangle, not the C triangle. <strong>Away supplier:<\/strong> its index differs from <span class=\"math-inline\"><math aria-label=\"k\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>k<\/mi>\n<\/math><\/span>.<\/li>\n<li><strong><span class=\"math-inline\"><math aria-label=\"\\sigma\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>σ<\/mi>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"\\tau\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>τ<\/mi>\n<\/math><\/span>:<\/strong> after reduction, <span class=\"math-inline\"><math aria-label=\"\\sigma\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>σ<\/mi>\n<\/math><\/span> labels the unique supercritical V triangle; <span class=\"math-inline\"><math aria-label=\"\\tau\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>τ<\/mi>\n<\/math><\/span> labels the neighbor containing <span class=\"math-inline\"><math aria-label=\"M_\\sigma\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>σ<\/mi>\n<\/msub>\n<\/math><\/span> when <span class=\"math-inline\"><math aria-label=\"\\sigma\\ne k\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>σ<\/mi>\n<mo>≠<\/mo>\n<mi>k<\/mi>\n<\/math><\/span>. Their uniqueness is proved, not assumed for every configuration.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>The classification labels.<\/strong>\n<\/summary><ul>\n<li><strong>CE0/CE1/CE2:<\/strong> the closure of the C triangle meets zero, one, or two boundary edges in positive length. These count traces, not uncovered gaps.<\/li>\n<li>For a V triangle, <strong><span class=\"math-inline\"><math aria-label=\"o\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>o<\/mi>\n<\/math><\/span><\/strong> counts its vertices outside <span class=\"math-inline\"><math aria-label=\"H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>H<\/mi>\n<\/math><\/span>; <strong><span class=\"math-inline\"><math aria-label=\"n\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>n<\/mi>\n<\/math><\/span><\/strong> counts neighboring spokes met in positive length. A vertex on the boundary of <span class=\"math-inline\"><math aria-label=\"H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>H<\/mi>\n<\/math><\/span> is not outside.<\/li>\n<li><strong>Vd0:<\/strong> <span class=\"math-inline\"><math aria-label=\"n=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>n<\/mi>\n<mo>=<\/mo>\n<mn>0<\/mn>\n<\/math><\/span>; after an exact-trace normalization the possible outside-vertex counts are <span class=\"math-inline\"><math aria-label=\"o=1,2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>o<\/mi>\n<mo>=<\/mo>\n<mn>1<\/mn>\n<mo>,<\/mo>\n<mn>2<\/mn>\n<\/math><\/span>.<\/li>\n<li><strong>Vd1:<\/strong> <span class=\"math-inline\"><math aria-label=\"(o,n)=(1,1)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<mi>o<\/mi>\n<mo>,<\/mo>\n<mi>n<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>. <strong>Vd2:<\/strong> <span class=\"math-inline\"><math aria-label=\"(o,n)=(1,2)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<mi>o<\/mi>\n<mo>,<\/mo>\n<mi>n<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>,<\/mo>\n<mn>2<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>. <strong>T3-like:<\/strong> <span class=\"math-inline\"><math aria-label=\"(o,n)=(2,1)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<mi>o<\/mi>\n<mo>,<\/mo>\n<mi>n<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>2<\/mn>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>. Their classification and normalization are in <a class=\"node-link\" href=\"#/CLASSIFICATION\">CLASSIFICATION<\/a>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>The finite-witness method.<\/strong>\n<\/summary><ul>\n<li><strong>Witness:<\/strong> a point selected from the original configuration whose required containment helps exclude the cover. <strong>Fixed<\/strong> means it is chosen before introducing any candidate enclosing triangle.<\/li>\n<li><strong>Forced into <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span>:<\/strong> logically required to belong to the original open C triangle; for example, a point in the covered set excluded from all six V triangles.<\/li>\n<li><strong>Candidate:<\/strong> any open unit equilateral triangle being tested for containment of the same fixed witnesses. It is not automatically a replacement C triangle completing the old cover.<\/li>\n<li><strong>Convex hull <span class=\"math-inline\"><math aria-label=\"\\operatorname{conv}(K)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>conv<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>K<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>:<\/strong> all convex combinations of points of <span class=\"math-inline\"><math aria-label=\"K\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>K<\/mi>\n<\/math><\/span>, meaning averages with nonnegative coefficients summing to <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span>. A triangle containing <span class=\"math-inline\"><math aria-label=\"K\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>K<\/mi>\n<\/math><\/span> contains its convex hull.<\/li>\n<li><strong><span class=\"math-inline\"><math aria-label=\"\\Lambda(K)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi mathvariant=\"normal\">Λ<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>K<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>:<\/strong> the smallest side length of a closed equilateral triangle containing nonempty compact <span class=\"math-inline\"><math aria-label=\"K\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>K<\/mi>\n<\/math><\/span> (closed and bounded here). For finite <span class=\"math-inline\"><math aria-label=\"K\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>K<\/mi>\n<\/math><\/span>, open unit containment gives <span class=\"math-inline\"><math aria-label=\"\\Lambda(K)&lt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi mathvariant=\"normal\">Λ<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>K<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>&lt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span> by moving all sides slightly inward.<\/li>\n<li><strong>BC, D, F:<\/strong> historical names for witness arguments using at most five, four, and nine points. D is not a disk. F obtains an auxiliary disk from a convex hull; BC and D use no disk.<\/li>\n<li><strong>Total radial frontier:<\/strong> the endpoint closest to <span class=\"math-inline\"><math aria-label=\"O\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<\/math><\/span> of all V contributions on a spoke, including both neighboring contributors. It is missed by the open V triangles. Its definition and endpoint proof are in <a class=\"node-link\" href=\"#/WITNESS\">WITNESS<\/a>.<\/li>\n<li><strong>Capacity/envelope:<\/strong> a bound on how far a triangle can reach while meeting specified boundary demands. <span class=\"math-inline\"><math aria-label=\"c_{\\max}(p,q)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>c<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mo data-mjx-texclass=\"OP\" movablelimits=\"true\">max<\/mo>\n<\/mrow>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>p<\/mi>\n<mo>,<\/mo>\n<mi>q<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> is maximal own-spoke reach; <span class=\"math-inline\"><math aria-label=\"C_+(p,q),C_-(p,q)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>C<\/mi>\n<mo>+<\/mo>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>p<\/mi>\n<mo>,<\/mo>\n<mi>q<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>,<\/mo>\n<msub>\n<mi>C<\/mi>\n<mo>−<\/mo>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>p<\/mi>\n<mo>,<\/mo>\n<mi>q<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> are the two neighboring-spoke versions. They are optimization functions, not extra covering triangles.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>How the estimates are organized.<\/strong>\n<\/summary><ul>\n<li><strong>Handoff:<\/strong> a chosen point in the open overlap of two V triangles on their shared edge. Its coordinate is <span class=\"math-inline\"><math aria-label=\"x_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>x<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>; it gives demands <span class=\"math-inline\"><math aria-label=\"(a_i,b_i)=(1-x_{i-1},x_i)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<msub>\n<mi>a<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>b<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<msub>\n<mi>x<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>x<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>.<\/li>\n<li><strong>Ascent/descent:<\/strong> respectively <span class=\"math-inline\"><math aria-label=\"x_i&gt;x_{i-1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>x<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>&gt;<\/mo>\n<msub>\n<mi>x<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span> or <span class=\"math-inline\"><math aria-label=\"x_i&lt;x_{i-1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>x<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>&lt;<\/mo>\n<msub>\n<mi>x<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span> in the cyclic sequence. An ascent is equivalent to a selected boundary-demand sum greater than <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<li><strong>Path monotonicity:<\/strong> nonsupercriticality and strict overlap force preceding-edge reaches to increase and following-edge reaches to decrease along a consecutive V-triangle path.<\/li>\n<li><strong>Tail bound/return:<\/strong> a tail bound concerns the last triangle on a path. A return propagates inequalities along the path back to an incompatible demand at the beginning.<\/li>\n<li><strong>Chart/normal form:<\/strong> a declared coordinate description obtained by rotation, reflection, translation, or reparameterization. The geometric points remain the same unless an actual replacement is explicitly stated.<\/li>\n<li><strong>Side slack:<\/strong> an affine expression whose nonnegative values define a triangle's closed side half-plane; negative values prove exclusion. It need not be Euclidean distance to the line.<\/li>\n<li><strong>Radial exit:<\/strong> where a candidate C triangle stops along a spoke, measured from <span class=\"math-inline\"><math aria-label=\"O\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<\/math><\/span>. Actual V reaches <span class=\"math-inline\"><math aria-label=\"C_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>C<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> use the opposite origin, <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>.<\/li>\n<li><strong>Adapter:<\/strong> a lemma checking that a specific placement satisfies the hypotheses of another lemma. <strong>Margin:<\/strong> positive room in a strict inequality, needed to preserve open containment after a small change.<\/li>\n<li><strong>Length/area budget:<\/strong> the sum of triangle contributions cannot fall below the length/area of the set being covered. Overlaps can make this sum larger than the union; one never subtracts an unproved overlap estimate.<\/li>\n<li><strong>Calipers/support contact:<\/strong> rotate the three sides of an enclosing equilateral triangle and track the points or disk touching them. A supporting line leaves the whole convex set on one side. <a class=\"node-link\" href=\"#/CALIPERS\">CALIPERS<\/a> defines the support-function formula.<\/li>\n<li><strong>Certificate:<\/strong> exact identities establishing the signs of required expressions throughout a parameter region. It is not a numerical scan or picture.<\/li>\n<li><strong>Calculation leaf:<\/strong> the displayed tree stops expanding a long derivation, but states what it assumes and proves and links the numbered source. The guide is self-contained in its vocabulary and argument interfaces, not a duplicate of every polynomial certificate.<\/li>\n<\/ul>\n<\/details><\/li>\n<\/ul>\n<p><strong>Source ownership:<\/strong> <a class=\"node-link\" href=\"#/SETUP\">SETUP<\/a>, <a class=\"node-link\" href=\"#/CLASSIFICATION\">CLASSIFICATION<\/a>, <a class=\"node-link\" href=\"#/SUPPLIER\">SUPPLIER<\/a>, <a class=\"node-link\" href=\"#/WITNESS\">WITNESS<\/a>, and the calculation pages link the numbered mathematical sources for these definitions and implications.<\/p>\n"},"LENGTH":{"id":"LENGTH","file":"LENGTH.md","title":"The skeleton count","group":"Proof trees","html":"<h1>[LENGTH] The skeleton count<\/h1>\n<p><a class=\"node-link\" href=\"#/MAIN\">[MAIN]<\/a> · <a class=\"node-link\" href=\"#/SUPPLIER\">[SUPPLIER]<\/a> · <a class=\"node-link\" href=\"#/NOTATION\">[NOTATION]<\/a> · <a class=\"node-link\" href=\"#/USE\">[USE]<\/a> · <a class=\"node-link\" href=\"#/GLOSSARY\">[GLOSSARY]<\/a><\/p>\n<details class=\"local-terms\" open=\"\"><summary>Terms used here<\/summary><ul class=\"proof-tree\">\n<li><strong>Geometry and triangles.<\/strong> <span class=\"math-inline\"><math aria-label=\"H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>H<\/mi>\n<\/math><\/span> is the closed regular hexagon of side <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span>, with center <span class=\"math-inline\"><math aria-label=\"O=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<mo>=<\/mo>\n<mn>0<\/mn>\n<\/math><\/span> and vertices <span class=\"math-inline\"><math aria-label=\"V_0,\\ldots,V_5\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>,<\/mo>\n<mo>…<\/mo>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>5<\/mn>\n<\/msub>\n<\/math><\/span> in cyclic order. Indices are modulo <span class=\"math-inline\"><math aria-label=\"6\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>6<\/mn>\n<\/math><\/span> (so <span class=\"math-inline\"><math aria-label=\"V_6=V_0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mn>6<\/mn>\n<\/msub>\n<mo>=<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<\/math><\/span>). A <strong>spoke<\/strong> is <span class=\"math-inline\"><math aria-label=\"r_i=[O,V_i]\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>r<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<mi>O<\/mi>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<\/math><\/span>; its midpoint is <span class=\"math-inline\"><math aria-label=\"M_i=V_i/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>. The boundary edge <span class=\"math-inline\"><math aria-label=\"e_{i,i+1}=[V_i,V_{i+1}]\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>e<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>,<\/mo>\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<\/math><\/span> has parameterization <span class=\"math-inline\"><math aria-label=\"X_i(t)=(1-t)V_i+tV_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>X<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>t<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>t<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<mi>t<\/mi>\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"0\\le t\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>0<\/mn>\n<mo>≤<\/mo>\n<mi>t<\/mi>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<li><strong>C triangle and V triangles.<\/strong> <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> is an open unit equilateral triangle containing <span class=\"math-inline\"><math aria-label=\"O\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<\/math><\/span>; <span class=\"math-inline\"><math aria-label=\"U_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> is one containing <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>. A <strong>role<\/strong> means one of these assigned triangles. Their closures <span class=\"math-inline\"><math aria-label=\"T_C,T_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>T<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> include their sides and vertices; the open triangles do not. Coverage always uses the open triangles. A <strong>trace<\/strong> is intersection with the stated edge or spoke; the <strong>relative interior<\/strong> of an edge removes its endpoints.<\/li>\n<li><strong>Reaches and criticality.<\/strong> <span class=\"math-inline\"><math aria-label=\"A_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"B_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> are the actual lengths reached by <span class=\"math-inline\"><math aria-label=\"T_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> from <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> toward <span class=\"math-inline\"><math aria-label=\"V_{i-1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"V_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>, respectively. <span class=\"math-inline\"><math aria-label=\"C_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>C<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> is its actual distance along its own spoke from <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> toward <span class=\"math-inline\"><math aria-label=\"O\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<\/math><\/span>. <strong>Supercritical<\/strong> means <span class=\"math-inline\"><math aria-label=\"A_i+B_i&gt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>&gt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>; <strong>nonsupercritical<\/strong> means <span class=\"math-inline\"><math aria-label=\"A_i+B_i\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>. <span class=\"math-inline\"><math aria-label=\"N_+\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>N<\/mi>\n<mo>+<\/mo>\n<\/msub>\n<\/math><\/span> counts supercritical V triangles. Lowercase <span class=\"math-inline\"><math aria-label=\"a_i,b_i,c_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>a<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>b<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>c<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> are selected lower bounds, not necessarily these maxima.<\/li>\n<li><strong>Gaps and skeleton.<\/strong> A <strong>boundary gap<\/strong> is a nonempty part of an edge missed by all six open V triangles. On <span class=\"math-inline\"><math aria-label=\"e_{i,i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>e<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>,<\/mo>\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span> it is <span class=\"math-inline\"><math aria-label=\"X_i([B_i,1-A_{i+1}])\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>X<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<msub>\n<mi>A<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> when <span class=\"math-inline\"><math aria-label=\"B_i+A_{i+1}\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>A<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>; equality leaves one missing point. The <strong>skeleton<\/strong> is <span class=\"math-inline\"><math aria-label=\"S=\\partial H\\cup\\bigcup_i r_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>S<\/mi>\n<mo>=<\/mo>\n<mi>∂<\/mi>\n<mi>H<\/mi>\n<mo>∪<\/mo>\n<munder>\n<mo data-mjx-texclass=\"OP\">⋃<\/mo>\n<mi>i<\/mi>\n<\/munder>\n<msub>\n<mi>r<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>, of length <span class=\"math-inline\"><math aria-label=\"12\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>12<\/mn>\n<\/math><\/span>. Skeleton coverage need not cover points between the spokes.<\/li>\n<li><strong>Neighboring support and supplier.<\/strong> The neighboring spokes for a V triangle at <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> are <span class=\"math-inline\"><math aria-label=\"r_{i-1},r_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>r<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>r<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>. It has <strong>positive adjacent support<\/strong> if its closure meets one of those spokes in an interval of positive length. A <strong>neighboring supplier of <span class=\"math-inline\"><math aria-label=\"M_j\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>j<\/mi>\n<\/msub>\n<\/math><\/span><\/strong> is specifically a triangle <span class=\"math-inline\"><math aria-label=\"U_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> with <span class=\"math-inline\"><math aria-label=\"i=j-1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>i<\/mi>\n<mo>=<\/mo>\n<mi>j<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<\/math><\/span> or <span class=\"math-inline\"><math aria-label=\"j+1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>j<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"M_j\\in U_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>j<\/mi>\n<\/msub>\n<mo>∈<\/mo>\n<msub>\n<mi>U<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>. “Rescuer” means the same thing here. Supplying a midpoint implies positive support by openness; positive support alone does not imply supplying that midpoint. <span class=\"math-inline\"><math aria-label=\"N_{\\rm sp}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>N<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi mathvariant=\"normal\">s<\/mi>\n<mi mathvariant=\"normal\">p<\/mi>\n<\/mrow>\n<\/msub>\n<\/math><\/span> counts V triangles having positive adjacent support.<\/li>\n<li><strong>Type labels.<\/strong> CE0, CE1, CE2 count the boundary edges met by <span class=\"math-inline\"><math aria-label=\"T_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> in positive length; they do not count gaps. For a V triangle let <span class=\"math-inline\"><math aria-label=\"o\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>o<\/mi>\n<\/math><\/span> count its vertices outside <span class=\"math-inline\"><math aria-label=\"H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>H<\/mi>\n<\/math><\/span>, and <span class=\"math-inline\"><math aria-label=\"n\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>n<\/mi>\n<\/math><\/span> its neighboring spokes met in positive length. Vd0 means <span class=\"math-inline\"><math aria-label=\"n=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>n<\/mi>\n<mo>=<\/mo>\n<mn>0<\/mn>\n<\/math><\/span>; Vd1 means <span class=\"math-inline\"><math aria-label=\"(o,n)=(1,1)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<mi>o<\/mi>\n<mo>,<\/mo>\n<mi>n<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>; Vd2 means <span class=\"math-inline\"><math aria-label=\"(1,2)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>,<\/mo>\n<mn>2<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>; T3-like means <span class=\"math-inline\"><math aria-label=\"(2,1)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<mn>2<\/mn>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>. The names are labels, not additional assumptions.<\/li>\n<li><strong>Length contribution.<\/strong> <span class=\"math-inline\"><math aria-label=\"L_S(T)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>L<\/mi>\n<mi>S<\/mi>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>T<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> is the total length of <span class=\"math-inline\"><math aria-label=\"T\\cap S\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>T<\/mi>\n<mo>∩<\/mo>\n<mi>S<\/mi>\n<\/math><\/span>, adding its segments on the perimeter and six spokes; isolated points add zero. A <strong>budget<\/strong> compares the sum of these contributions to the length required for a cover. Overlaps may be counted more than once, so the sum is an upper bound for the covered length, not its exact value.<\/li>\n<\/ul><\/details>\n<p><strong>Input:<\/strong> a nonzero-gap skeleton cover. Let <span class=\"math-inline\"><math aria-label=\"q=N_++N_{\\rm sp}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>q<\/mi>\n<mo>=<\/mo>\n<msub>\n<mi>N<\/mi>\n<mo>+<\/mo>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>N<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi mathvariant=\"normal\">s<\/mi>\n<mi mathvariant=\"normal\">p<\/mi>\n<\/mrow>\n<\/msub>\n<\/math><\/span>. <strong>Conclusion:<\/strong> <span class=\"math-inline\"><math aria-label=\"q\\le2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>q<\/mi>\n<mo>≤<\/mo>\n<mn>2<\/mn>\n<\/math><\/span>.<\/p>\n<h2>Tree<\/h2>\n<ul class=\"proof-tree\">\n<li><details open=\"\"><summary><strong>Separate the counted roles.<\/strong>\n<\/summary><ul>\n<li>A positive-support role is Vd1, Vd2, or T3-like.<\/li>\n<li>Their boundary caps are respectively below <span class=\"math-inline\"><math aria-label=\"1/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>, below <span class=\"math-inline\"><math aria-label=\"1/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>, and below <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<li>Since total vertex boundary length is <span class=\"math-inline\"><math aria-label=\"A_i+B_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>, none is supercritical.<\/li>\n<li>Thus the <span class=\"math-inline\"><math aria-label=\"N_+\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>N<\/mi>\n<mo>+<\/mo>\n<\/msub>\n<\/math><\/span> supercritical roles and <span class=\"math-inline\"><math aria-label=\"N_{\\rm sp}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>N<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi mathvariant=\"normal\">s<\/mi>\n<mi mathvariant=\"normal\">p<\/mi>\n<\/mrow>\n<\/msub>\n<\/math><\/span> positive-support roles are disjoint.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Use the local skeleton-length ledger.<\/strong>\n<\/summary><ul>\n<li>The center role has skeleton contribution below <span class=\"math-inline\"><math aria-label=\"3/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>3<\/mn>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span> in CE1/CE2.<\/li>\n<li>Every supercritical role has contribution below <span class=\"math-inline\"><math aria-label=\"3/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>3<\/mn>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>.<\/li>\n<li>Every positive-support role has contribution below <span class=\"math-inline\"><math aria-label=\"3/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>3<\/mn>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>.<\/li>\n<li>Every remaining nonsupercritical Vd0 role contributes at most <span class=\"math-inline\"><math aria-label=\"2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>2<\/mn>\n<\/math><\/span>.<\/li>\n<li><strong>CALCULATION LEAF:<\/strong> local geometric caps — <a class=\"node-link\" href=\"#/BOUNDS\">[BOUNDS]<\/a>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Add the capacities.<\/strong>\n<\/summary><ul>\n<li>The total is strictly below <span class=\"math-inline\"><math aria-label=\"3/2+(3/2)q+2(6-q)=27/2-q/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>3<\/mn>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<mo>+<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>3<\/mn>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<mi>q<\/mi>\n<mo>+<\/mo>\n<mn>2<\/mn>\n<mo stretchy=\"false\">(<\/mo>\n<mn>6<\/mn>\n<mo>−<\/mo>\n<mi>q<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mn>27<\/mn>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<mo>−<\/mo>\n<mi>q<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>.<\/li>\n<li>If <span class=\"math-inline\"><math aria-label=\"q\\ge3\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>q<\/mi>\n<mo>≥<\/mo>\n<mn>3<\/mn>\n<\/math><\/span>, this is at most <span class=\"math-inline\"><math aria-label=\"12\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>12<\/mn>\n<\/math><\/span>.<\/li>\n<li>But the skeleton itself has length <span class=\"math-inline\"><math aria-label=\"12\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>12<\/mn>\n<\/math><\/span> and must be covered.<\/li>\n<li>The strict upper bound makes coverage impossible.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Therefore <span class=\"math-inline\"><math aria-label=\"N_++N_{\\rm sp}\\le2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>N<\/mi>\n<mo>+<\/mo>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>N<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi mathvariant=\"normal\">s<\/mi>\n<mi mathvariant=\"normal\">p<\/mi>\n<\/mrow>\n<\/msub>\n<mo>≤<\/mo>\n<mn>2<\/mn>\n<\/math><\/span>.<\/strong>\n<\/summary><ul>\n<li>The midpoint argument then rules out <span class=\"math-inline\"><math aria-label=\"N_+\\ge2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>N<\/mi>\n<mo>+<\/mo>\n<\/msub>\n<mo>≥<\/mo>\n<mn>2<\/mn>\n<\/math><\/span> — <a class=\"node-link\" href=\"#/SUPPLIER\">[SUPPLIER]<\/a>.<\/li>\n<\/ul>\n<\/details><\/li>\n<\/ul>\n<hr/>\n<p><strong>Proof sources:<\/strong> <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/2XXX_geometric_lemmas/25XX_length_bounds/2500_boundary_length_bounds.md\" rel=\"noopener noreferrer\" target=\"_blank\">2500<\/a> · <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/2XXX_geometric_lemmas/25XX_length_bounds/2531_length_budget_corollaries.md\" rel=\"noopener noreferrer\" target=\"_blank\">2531<\/a> · <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/2XXX_geometric_lemmas/25XX_length_bounds/2532_open_cover_budget.md\" rel=\"noopener noreferrer\" target=\"_blank\">2532<\/a>. All source links are pinned to the same repository snapshot.<\/p>\n<p><a class=\"node-link\" href=\"#/MAIN\">[MAIN]<\/a> Return to the main tree.<\/p>\n"},"MIDPOINTS":{"id":"MIDPOINTS","file":"MIDPOINTS.md","title":"The geometric engine of the case reduction","group":"Proof trees","html":"<h1>[MIDPOINTS] The geometric engine of the case reduction<\/h1>\n<p><a class=\"node-link\" href=\"#/MAIN\">[MAIN]<\/a> · <a class=\"node-link\" href=\"#/SETUP\">[SETUP]<\/a> · <a class=\"node-link\" href=\"#/NOTATION\">[NOTATION]<\/a> · <a class=\"node-link\" href=\"#/USE\">[USE]<\/a> · <a class=\"node-link\" href=\"#/GLOSSARY\">[GLOSSARY]<\/a><\/p>\n<details class=\"local-terms\" open=\"\"><summary>Terms used here<\/summary><ul class=\"proof-tree\">\n<li><strong>Geometry and triangles.<\/strong> <span class=\"math-inline\"><math aria-label=\"H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>H<\/mi>\n<\/math><\/span> is the closed regular hexagon of side <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span>, with center <span class=\"math-inline\"><math aria-label=\"O=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<mo>=<\/mo>\n<mn>0<\/mn>\n<\/math><\/span> and vertices <span class=\"math-inline\"><math aria-label=\"V_0,\\ldots,V_5\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>,<\/mo>\n<mo>…<\/mo>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>5<\/mn>\n<\/msub>\n<\/math><\/span> in cyclic order. Indices are modulo <span class=\"math-inline\"><math aria-label=\"6\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>6<\/mn>\n<\/math><\/span> (so <span class=\"math-inline\"><math aria-label=\"V_6=V_0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mn>6<\/mn>\n<\/msub>\n<mo>=<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<\/math><\/span>). A <strong>spoke<\/strong> is <span class=\"math-inline\"><math aria-label=\"r_i=[O,V_i]\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>r<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<mi>O<\/mi>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<\/math><\/span>; its midpoint is <span class=\"math-inline\"><math aria-label=\"M_i=V_i/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>. The boundary edge <span class=\"math-inline\"><math aria-label=\"e_{i,i+1}=[V_i,V_{i+1}]\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>e<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>,<\/mo>\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<\/math><\/span> has parameterization <span class=\"math-inline\"><math aria-label=\"X_i(t)=(1-t)V_i+tV_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>X<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>t<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>t<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<mi>t<\/mi>\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"0\\le t\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>0<\/mn>\n<mo>≤<\/mo>\n<mi>t<\/mi>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<li><strong>C triangle and V triangles.<\/strong> <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> is an open unit equilateral triangle containing <span class=\"math-inline\"><math aria-label=\"O\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<\/math><\/span>; <span class=\"math-inline\"><math aria-label=\"U_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> is one containing <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>. A <strong>role<\/strong> means one of these assigned triangles. Their closures <span class=\"math-inline\"><math aria-label=\"T_C,T_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>T<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> include their sides and vertices; the open triangles do not. Coverage always uses the open triangles. A <strong>trace<\/strong> is intersection with the stated edge or spoke; the <strong>relative interior<\/strong> of an edge removes its endpoints.<\/li>\n<li><strong>Reaches and criticality.<\/strong> <span class=\"math-inline\"><math aria-label=\"A_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"B_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> are the actual lengths reached by <span class=\"math-inline\"><math aria-label=\"T_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> from <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> toward <span class=\"math-inline\"><math aria-label=\"V_{i-1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"V_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>, respectively. <span class=\"math-inline\"><math aria-label=\"C_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>C<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> is its actual distance along its own spoke from <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> toward <span class=\"math-inline\"><math aria-label=\"O\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<\/math><\/span>. <strong>Supercritical<\/strong> means <span class=\"math-inline\"><math aria-label=\"A_i+B_i&gt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>&gt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>; <strong>nonsupercritical<\/strong> means <span class=\"math-inline\"><math aria-label=\"A_i+B_i\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>. <span class=\"math-inline\"><math aria-label=\"N_+\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>N<\/mi>\n<mo>+<\/mo>\n<\/msub>\n<\/math><\/span> counts supercritical V triangles. Lowercase <span class=\"math-inline\"><math aria-label=\"a_i,b_i,c_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>a<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>b<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>c<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> are selected lower bounds, not necessarily these maxima.<\/li>\n<li><strong>Gaps and skeleton.<\/strong> A <strong>boundary gap<\/strong> is a nonempty part of an edge missed by all six open V triangles. On <span class=\"math-inline\"><math aria-label=\"e_{i,i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>e<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>,<\/mo>\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span> it is <span class=\"math-inline\"><math aria-label=\"X_i([B_i,1-A_{i+1}])\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>X<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<msub>\n<mi>A<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> when <span class=\"math-inline\"><math aria-label=\"B_i+A_{i+1}\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>A<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>; equality leaves one missing point. The <strong>skeleton<\/strong> is <span class=\"math-inline\"><math aria-label=\"S=\\partial H\\cup\\bigcup_i r_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>S<\/mi>\n<mo>=<\/mo>\n<mi>∂<\/mi>\n<mi>H<\/mi>\n<mo>∪<\/mo>\n<munder>\n<mo data-mjx-texclass=\"OP\">⋃<\/mo>\n<mi>i<\/mi>\n<\/munder>\n<msub>\n<mi>r<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>, of length <span class=\"math-inline\"><math aria-label=\"12\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>12<\/mn>\n<\/math><\/span>. Skeleton coverage need not cover points between the spokes.<\/li>\n<li><strong>Neighboring support and supplier.<\/strong> The neighboring spokes for a V triangle at <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> are <span class=\"math-inline\"><math aria-label=\"r_{i-1},r_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>r<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>r<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>. It has <strong>positive adjacent support<\/strong> if its closure meets one of those spokes in an interval of positive length. A <strong>neighboring supplier of <span class=\"math-inline\"><math aria-label=\"M_j\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>j<\/mi>\n<\/msub>\n<\/math><\/span><\/strong> is specifically a triangle <span class=\"math-inline\"><math aria-label=\"U_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> with <span class=\"math-inline\"><math aria-label=\"i=j-1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>i<\/mi>\n<mo>=<\/mo>\n<mi>j<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<\/math><\/span> or <span class=\"math-inline\"><math aria-label=\"j+1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>j<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"M_j\\in U_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>j<\/mi>\n<\/msub>\n<mo>∈<\/mo>\n<msub>\n<mi>U<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>. “Rescuer” means the same thing here. Supplying a midpoint implies positive support by openness; positive support alone does not imply supplying that midpoint. <span class=\"math-inline\"><math aria-label=\"N_{\\rm sp}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>N<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi mathvariant=\"normal\">s<\/mi>\n<mi mathvariant=\"normal\">p<\/mi>\n<\/mrow>\n<\/msub>\n<\/math><\/span> counts V triangles having positive adjacent support.<\/li>\n<li><strong>Type labels.<\/strong> CE0, CE1, CE2 count the boundary edges met by <span class=\"math-inline\"><math aria-label=\"T_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> in positive length; they do not count gaps. For a V triangle let <span class=\"math-inline\"><math aria-label=\"o\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>o<\/mi>\n<\/math><\/span> count its vertices outside <span class=\"math-inline\"><math aria-label=\"H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>H<\/mi>\n<\/math><\/span>, and <span class=\"math-inline\"><math aria-label=\"n\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>n<\/mi>\n<\/math><\/span> its neighboring spokes met in positive length. Vd0 means <span class=\"math-inline\"><math aria-label=\"n=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>n<\/mi>\n<mo>=<\/mo>\n<mn>0<\/mn>\n<\/math><\/span>; Vd1 means <span class=\"math-inline\"><math aria-label=\"(o,n)=(1,1)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<mi>o<\/mi>\n<mo>,<\/mo>\n<mi>n<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>; Vd2 means <span class=\"math-inline\"><math aria-label=\"(1,2)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>,<\/mo>\n<mn>2<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>; T3-like means <span class=\"math-inline\"><math aria-label=\"(2,1)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<mn>2<\/mn>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>. The names are labels, not additional assumptions.<\/li>\n<\/ul><\/details>\n<p><strong>Midpoints always mean spoke midpoints:<\/strong> <span class=\"math-inline\"><math aria-label=\"M_i=V_i/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>, not midpoints of boundary edges.<\/p>\n<h2>Tree<\/h2>\n<ul class=\"proof-tree\">\n<li><details open=\"\"><summary><strong>Center midpoint containment<\/strong> — <a class=\"node-link\" href=\"#/C-MIDPOINT\">[C-MIDPOINT]<\/a>.\n<\/summary><ul>\n<li>If <span class=\"math-inline\"><math aria-label=\"O\\in U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<mo>∈<\/mo>\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> and the center has a positive boundary trace, exactly one <span class=\"math-inline\"><math aria-label=\"M_k\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>k<\/mi>\n<\/msub>\n<\/math><\/span> lies in <span class=\"math-inline\"><math aria-label=\"T_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span>.<\/li>\n<li>In fact <span class=\"math-inline\"><math aria-label=\"M_k\\in U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>k<\/mi>\n<\/msub>\n<mo>∈<\/mo>\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span>, while all other midpoints lie outside <span class=\"math-inline\"><math aria-label=\"T_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span>.<\/li>\n<li>All possible center boundary traces are incident with <span class=\"math-inline\"><math aria-label=\"V_k\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>k<\/mi>\n<\/msub>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Supercritical own-midpoint exclusion<\/strong> — <a class=\"node-link\" href=\"#/SELF-MIDPOINT\">[SELF-MIDPOINT]<\/a>.\n<\/summary><ul>\n<li><span class=\"math-inline\"><math aria-label=\"M_i\\in T_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>∈<\/mo>\n<msub>\n<mi>T<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> would imply <span class=\"math-inline\"><math aria-label=\"A_i+B_i\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<li>Therefore a supercritical role misses its own midpoint, even in its closure.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>T3-like own-midpoint exclusion<\/strong> — <a class=\"node-link\" href=\"#/T3-MIDPOINT\">[T3-MIDPOINT]<\/a>.\n<\/summary><ul>\n<li>Neighboring-spoke support puts the own midpoint beyond one of the triangle's sides.<\/li>\n<li>This applies directly to the original open role and its closure.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>A Vd0 role cannot supply a neighboring midpoint.<\/strong>\n<\/summary><ul>\n<li>Open containment would include a positive-length interval of the neighboring spoke.<\/li>\n<li>That contradicts the definition <span class=\"math-inline\"><math aria-label=\"n=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>n<\/mi>\n<mo>=<\/mo>\n<mn>0<\/mn>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Consequence: a missed midpoint forces a supplier.<\/strong>\n<\/summary><ul>\n<li>If both the center and own vertex role miss <span class=\"math-inline\"><math aria-label=\"M_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>, locality leaves only <span class=\"math-inline\"><math aria-label=\"U_{i-1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"U_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>.<\/li>\n<li>A covering neighbor must be a positive-support role.<\/li>\n<li>Combine this with the skeleton count to obtain a unique supplier — <a class=\"node-link\" href=\"#/SUPPLIER\">[SUPPLIER]<\/a>.<\/li>\n<\/ul>\n<\/details><\/li>\n<\/ul>\n<hr/>\n<p><strong>Proof sources:<\/strong> <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/2XXX_geometric_lemmas/21XX_C_triangle_geometry/2100_CE1_CE2_exactly_one_midpoint_lemma.md\" rel=\"noopener noreferrer\" target=\"_blank\">2100<\/a> · <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/2XXX_geometric_lemmas/21XX_C_triangle_geometry/2109_signed_CE1_CE2_center_normal_form.md\" rel=\"noopener noreferrer\" target=\"_blank\">2109<\/a> · <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/2XXX_geometric_lemmas/20XX_V_triangle_geometry/2005_midpoint_self_cover_lemma.md\" rel=\"noopener noreferrer\" target=\"_blank\">2005<\/a> · <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/1XXX_foundations/12XX_V_triangle/1201_V_triangle_types.md\" rel=\"noopener noreferrer\" target=\"_blank\">1201<\/a> · <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/2XXX_geometric_lemmas/26XX_enclosing_triangle_tools/2613_midpoint_supplier_reduction.md\" rel=\"noopener noreferrer\" target=\"_blank\">2613<\/a>. All source links are pinned to the same repository snapshot.<\/p>\n<p><a class=\"node-link\" href=\"#/MAIN\">[MAIN]<\/a> Return to the main tree.<\/p>\n"},"N0":{"id":"N0","file":"N0.md","title":"Every skeleton cover has a supercritical role","group":"Proof trees","html":"<h1>[N0] Every skeleton cover has a supercritical role<\/h1>\n<p><a class=\"node-link\" href=\"#/MAIN\">[MAIN]<\/a> · <a class=\"node-link\" href=\"#/NOTATION\">[NOTATION]<\/a> · <a class=\"node-link\" href=\"#/USE\">[USE]<\/a> · <a class=\"node-link\" href=\"#/GLOSSARY\">[GLOSSARY]<\/a><\/p>\n<details class=\"local-terms\" open=\"\"><summary>Terms used here<\/summary><ul class=\"proof-tree\">\n<li><strong>Geometry and triangles.<\/strong> <span class=\"math-inline\"><math aria-label=\"H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>H<\/mi>\n<\/math><\/span> is the closed regular hexagon of side <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span>, with center <span class=\"math-inline\"><math aria-label=\"O=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<mo>=<\/mo>\n<mn>0<\/mn>\n<\/math><\/span> and vertices <span class=\"math-inline\"><math aria-label=\"V_0,\\ldots,V_5\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>,<\/mo>\n<mo>…<\/mo>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>5<\/mn>\n<\/msub>\n<\/math><\/span> in cyclic order. Indices are modulo <span class=\"math-inline\"><math aria-label=\"6\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>6<\/mn>\n<\/math><\/span> (so <span class=\"math-inline\"><math aria-label=\"V_6=V_0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mn>6<\/mn>\n<\/msub>\n<mo>=<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<\/math><\/span>). A <strong>spoke<\/strong> is <span class=\"math-inline\"><math aria-label=\"r_i=[O,V_i]\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>r<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<mi>O<\/mi>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<\/math><\/span>; its midpoint is <span class=\"math-inline\"><math aria-label=\"M_i=V_i/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>. The boundary edge <span class=\"math-inline\"><math aria-label=\"e_{i,i+1}=[V_i,V_{i+1}]\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>e<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>,<\/mo>\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<\/math><\/span> has parameterization <span class=\"math-inline\"><math aria-label=\"X_i(t)=(1-t)V_i+tV_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>X<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>t<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>t<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<mi>t<\/mi>\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"0\\le t\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>0<\/mn>\n<mo>≤<\/mo>\n<mi>t<\/mi>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<li><strong>C triangle and V triangles.<\/strong> <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> is an open unit equilateral triangle containing <span class=\"math-inline\"><math aria-label=\"O\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<\/math><\/span>; <span class=\"math-inline\"><math aria-label=\"U_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> is one containing <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>. A <strong>role<\/strong> means one of these assigned triangles. Their closures <span class=\"math-inline\"><math aria-label=\"T_C,T_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>T<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> include their sides and vertices; the open triangles do not. Coverage always uses the open triangles. A <strong>trace<\/strong> is intersection with the stated edge or spoke; the <strong>relative interior<\/strong> of an edge removes its endpoints.<\/li>\n<li><strong>Reaches and criticality.<\/strong> <span class=\"math-inline\"><math aria-label=\"A_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"B_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> are the actual lengths reached by <span class=\"math-inline\"><math aria-label=\"T_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> from <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> toward <span class=\"math-inline\"><math aria-label=\"V_{i-1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"V_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>, respectively. <span class=\"math-inline\"><math aria-label=\"C_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>C<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> is its actual distance along its own spoke from <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> toward <span class=\"math-inline\"><math aria-label=\"O\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<\/math><\/span>. <strong>Supercritical<\/strong> means <span class=\"math-inline\"><math aria-label=\"A_i+B_i&gt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>&gt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>; <strong>nonsupercritical<\/strong> means <span class=\"math-inline\"><math aria-label=\"A_i+B_i\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>. <span class=\"math-inline\"><math aria-label=\"N_+\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>N<\/mi>\n<mo>+<\/mo>\n<\/msub>\n<\/math><\/span> counts supercritical V triangles. Lowercase <span class=\"math-inline\"><math aria-label=\"a_i,b_i,c_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>a<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>b<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>c<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> are selected lower bounds, not necessarily these maxima.<\/li>\n<li><strong>Gaps and skeleton.<\/strong> A <strong>boundary gap<\/strong> is a nonempty part of an edge missed by all six open V triangles. On <span class=\"math-inline\"><math aria-label=\"e_{i,i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>e<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>,<\/mo>\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span> it is <span class=\"math-inline\"><math aria-label=\"X_i([B_i,1-A_{i+1}])\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>X<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<msub>\n<mi>A<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> when <span class=\"math-inline\"><math aria-label=\"B_i+A_{i+1}\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>A<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>; equality leaves one missing point. The <strong>skeleton<\/strong> is <span class=\"math-inline\"><math aria-label=\"S=\\partial H\\cup\\bigcup_i r_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>S<\/mi>\n<mo>=<\/mo>\n<mi>∂<\/mi>\n<mi>H<\/mi>\n<mo>∪<\/mo>\n<munder>\n<mo data-mjx-texclass=\"OP\">⋃<\/mo>\n<mi>i<\/mi>\n<\/munder>\n<msub>\n<mi>r<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>, of length <span class=\"math-inline\"><math aria-label=\"12\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>12<\/mn>\n<\/math><\/span>. Skeleton coverage need not cover points between the spokes.<\/li>\n<li><strong>Enclosure language.<\/strong> A <strong>witness<\/strong> is a chosen point used to contradict the cover. <strong>Forced into <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span><\/strong> means the cover and previously stated geometry imply that membership. A <strong>candidate<\/strong> is any other open unit equilateral triangle tested against the same fixed witnesses; it need not complete a cover with the old V triangles. <span class=\"math-inline\"><math aria-label=\"\\operatorname{conv}(K)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>conv<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>K<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> is the convex hull, the set of all convex combinations of points of <span class=\"math-inline\"><math aria-label=\"K\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>K<\/mi>\n<\/math><\/span>. For a nonempty compact set <span class=\"math-inline\"><math aria-label=\"K\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>K<\/mi>\n<\/math><\/span> (closed and bounded here), <span class=\"math-inline\"><math aria-label=\"\\Lambda(K)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi mathvariant=\"normal\">Λ<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>K<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> is the least side length of a closed equilateral triangle containing it. Thus <span class=\"math-inline\"><math aria-label=\"K\\subset U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>K<\/mi>\n<mo>⊂<\/mo>\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> gives <span class=\"math-inline\"><math aria-label=\"\\Lambda(K)&lt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi mathvariant=\"normal\">Λ<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>K<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>&lt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span> by shrinking its three sides slightly.<\/li>\n<\/ul><\/details>\n<p><strong>Statement.<\/strong> Seven open role triangles cannot cover the full skeleton with <span class=\"math-inline\"><math aria-label=\"N_+=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>N<\/mi>\n<mo>+<\/mo>\n<\/msub>\n<mo>=<\/mo>\n<mn>0<\/mn>\n<\/math><\/span>. Only skeleton coverage is needed; this is why the result can be reused after replacement.<\/p>\n<h2>Tree<\/h2>\n<ul class=\"proof-tree\">\n<li><details open=\"\"><summary><strong>Suppose all six vertex roles are nonsupercritical.<\/strong>\n<\/summary><ul>\n<li>Thus <span class=\"math-inline\"><math aria-label=\"A_i+B_i\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span> for every <span class=\"math-inline\"><math aria-label=\"i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>i<\/mi>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>No boundary gaps.<\/strong>\n<\/summary><ul>\n<li>Each edge has strict overlap: <span class=\"math-inline\"><math aria-label=\"B_i+A_{i+1}&gt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>A<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>&gt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<li>Summing gives <span class=\"math-inline\"><math aria-label=\"\\sum_i(A_i+B_i)&gt;6\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<munder>\n<mo data-mjx-texclass=\"OP\">∑<\/mo>\n<mi>i<\/mi>\n<\/munder>\n<mo stretchy=\"false\">(<\/mo>\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">)<\/mo>\n<mo>&gt;<\/mo>\n<mn>6<\/mn>\n<\/math><\/span>.<\/li>\n<li>Nonsupercriticality gives the opposite bound <span class=\"math-inline\"><math aria-label=\"\\sum_i(A_i+B_i)\\le6\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<munder>\n<mo data-mjx-texclass=\"OP\">∑<\/mo>\n<mi>i<\/mi>\n<\/munder>\n<mo stretchy=\"false\">(<\/mo>\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">)<\/mo>\n<mo>≤<\/mo>\n<mn>6<\/mn>\n<\/math><\/span>.<\/li>\n<li>Contradiction.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>At least one boundary gap.<\/strong>\n<\/summary><ul>\n<li>The center contains exactly one midpoint <span class=\"math-inline\"><math aria-label=\"M_k\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>k<\/mi>\n<\/msub>\n<\/math><\/span> — <a class=\"node-link\" href=\"#/C-MIDPOINT\">[C-MIDPOINT]<\/a>.<\/li>\n<li>Every other vertex role is nonsupercritical.<\/li>\n<li>The center-aligned selected-gap theorem applies — <a class=\"node-link\" href=\"#/BC\">[BC]<\/a>.<\/li>\n<li>Its fixed five-point set lies in <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> but has minimum enclosing side at least <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<li>Contradiction.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Therefore every skeleton cover has <span class=\"math-inline\"><math aria-label=\"N_+\\ge1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>N<\/mi>\n<mo>+<\/mo>\n<\/msub>\n<mo>≥<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.<\/strong>\n<\/summary><ul>\n<li>Reuse this conclusion after <a class=\"node-link\" href=\"#/REPLACEMENT\">[REPLACEMENT]<\/a>.<\/li>\n<\/ul>\n<\/details><\/li>\n<\/ul>\n<h2>Dependency direction<\/h2>\n<p>BC is proved from its own path geometry, local bounds, and CE1/CE2 enclosure checks. It does <strong>not<\/strong> depend on N0, the supplier reduction, or replacement. The proof dependencies are therefore BC → N0 → supplier reduction → replacement contradiction. Navigation links back to the main page are not logical dependencies.<\/p>\n<hr/>\n<p><strong>Proof sources:<\/strong> <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/2XXX_geometric_lemmas/26XX_enclosing_triangle_tools/2612_fixed_witness_unification.md\" rel=\"noopener noreferrer\" target=\"_blank\">2612<\/a> · <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/2XXX_geometric_lemmas/25XX_length_bounds/2531_length_budget_corollaries.md\" rel=\"noopener noreferrer\" target=\"_blank\">2531<\/a>. All source links are pinned to the same repository snapshot.<\/p>\n<p><a class=\"node-link\" href=\"#/MAIN\">[MAIN]<\/a> Return to the main tree.<\/p>\n"},"NOTATION":{"id":"NOTATION","file":"NOTATION.md"
