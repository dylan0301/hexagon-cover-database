1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>,<\/mo>\n<mo>…<\/mo>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>5<\/mn>\n<\/msub>\n<\/math><\/span> in cyclic order. Indices are modulo <span class=\"math-inline\"><math aria-label=\"6\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>6<\/mn>\n<\/math><\/span> (so <span class=\"math-inline\"><math aria-label=\"V_6=V_0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mn>6<\/mn>\n<\/msub>\n<mo>=<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<\/math><\/span>). A <strong>spoke<\/strong> is <span class=\"math-inline\"><math aria-label=\"r_i=[O,V_i]\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>r<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<mi>O<\/mi>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<\/math><\/span>; its midpoint is <span class=\"math-inline\"><math aria-label=\"M_i=V_i/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>. The boundary edge <span class=\"math-inline\"><math aria-label=\"e_{i,i+1}=[V_i,V_{i+1}]\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>e<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>,<\/mo>\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<\/math><\/span> has parameterization <span class=\"math-inline\"><math aria-label=\"X_i(t)=(1-t)V_i+tV_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>X<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>t<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>t<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<mi>t<\/mi>\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"0\\le t\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>0<\/mn>\n<mo>≤<\/mo>\n<mi>t<\/mi>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<li><strong>C triangle and V triangles.<\/strong> <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> is an open unit equilateral triangle containing <span class=\"math-inline\"><math aria-label=\"O\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<\/math><\/span>; <span class=\"math-inline\"><math aria-label=\"U_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> is one containing <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>. A <strong>role<\/strong> means one of these assigned triangles. Their closures <span class=\"math-inline\"><math aria-label=\"T_C,T_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>T<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> include their sides and vertices; the open triangles do not. Coverage always uses the open triangles. A <strong>trace<\/strong> is intersection with the stated edge or spoke; the <strong>relative interior<\/strong> of an edge removes its endpoints.<\/li>\n<li><strong>Reaches and criticality.<\/strong> <span class=\"math-inline\"><math aria-label=\"A_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"B_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> are the actual lengths reached by <span class=\"math-inline\"><math aria-label=\"T_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> from <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> toward <span class=\"math-inline\"><math aria-label=\"V_{i-1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"V_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>, respectively. <span class=\"math-inline\"><math aria-label=\"C_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>C<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> is its actual distance along its own spoke from <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> toward <span class=\"math-inline\"><math aria-label=\"O\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<\/math><\/span>. <strong>Supercritical<\/strong> means <span class=\"math-inline\"><math aria-label=\"A_i+B_i&gt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>&gt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>; <strong>nonsupercritical<\/strong> means <span class=\"math-inline\"><math aria-label=\"A_i+B_i\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>. <span class=\"math-inline\"><math aria-label=\"N_+\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>N<\/mi>\n<mo>+<\/mo>\n<\/msub>\n<\/math><\/span> counts supercritical V triangles. Lowercase <span class=\"math-inline\"><math aria-label=\"a_i,b_i,c_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>a<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>b<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>c<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> are selected lower bounds, not necessarily these maxima.<\/li>\n<li><strong>Enclosure language.<\/strong> A <strong>witness<\/strong> is a chosen point used to contradict the cover. <strong>Forced into <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span><\/strong> means the cover and previously stated geometry imply that membership. A <strong>candidate<\/strong> is any other open unit equilateral triangle tested against the same fixed witnesses; it need not complete a cover with the old V triangles. <span class=\"math-inline\"><math aria-label=\"\\operatorname{conv}(K)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>conv<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>K<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> is the convex hull, the set of all convex combinations of points of <span class=\"math-inline\"><math aria-label=\"K\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>K<\/mi>\n<\/math><\/span>. For a nonempty compact set <span class=\"math-inline\"><math aria-label=\"K\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>K<\/mi>\n<\/math><\/span> (closed and bounded here), <span class=\"math-inline\"><math aria-label=\"\\Lambda(K)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi mathvariant=\"normal\">Λ<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>K<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> is the least side length of a closed equilateral triangle containing it. Thus <span class=\"math-inline\"><math aria-label=\"K\\subset U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>K<\/mi>\n<mo>⊂<\/mo>\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> gives <span class=\"math-inline\"><math aria-label=\"\\Lambda(K)&lt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi mathvariant=\"normal\">Λ<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>K<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>&lt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span> by shrinking its three sides slightly.<\/li>\n<li><strong>Supported edge.<\/strong> A supporting line touches a convex set and leaves that set on one side. A hull edge is an edge of its convex hull. A contact orientation fixes a triangle side along such a line and chooses the other two sides just far enough out to enclose the set. The local origin <span class=\"math-inline\"><math aria-label=\"0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>0<\/mn>\n<\/math><\/span> below is the translated vertex <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>, not the hexagon center.<\/li>\n<\/ul><\/details>\n<p><strong>Statement.<\/strong> For a closed unit vertex triangle, <span class=\"math-inline\"><math aria-label=\"M_i\\in T_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>∈<\/mo>\n<msub>\n<mi>T<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> implies <span class=\"math-inline\"><math aria-label=\"A_i+B_i\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>. Thus <span class=\"math-inline\"><math aria-label=\"A_i+B_i&gt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>&gt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span> excludes <span class=\"math-inline\"><math aria-label=\"M_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> from the closure.<\/p>\n<h2>Tree<\/h2>\n<ul class=\"proof-tree\">\n<li><details open=\"\"><summary><strong>Assume the contrary.<\/strong>\n<\/summary><ul>\n<li>Translate <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> to <span class=\"math-inline\"><math aria-label=\"0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>0<\/mn>\n<\/math><\/span> and choose unit edge directions <span class=\"math-inline\"><math aria-label=\"u,v\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>u<\/mi>\n<mo>,<\/mo>\n<mi>v<\/mi>\n<\/math><\/span> meeting at <span class=\"math-inline\"><math aria-label=\"120^\\circ\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msup>\n<mn>120<\/mn>\n<mo>∘<\/mo>\n<\/msup>\n<\/math><\/span>.<\/li>\n<li>Put <span class=\"math-inline\"><math aria-label=\"a=A_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>a<\/mi>\n<mo>=<\/mo>\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"b=B_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>b<\/mi>\n<mo>=<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"P=au\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>P<\/mi>\n<mo>=<\/mo>\n<mi>a<\/mi>\n<mi>u<\/mi>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"Q=bv\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>Q<\/mi>\n<mo>=<\/mo>\n<mi>b<\/mi>\n<mi>v<\/mi>\n<\/math><\/span>, and <span class=\"math-inline\"><math aria-label=\"M=(u+v)/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>M<\/mi>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mi>u<\/mi>\n<mo>+<\/mo>\n<mi>v<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>.<\/li>\n<li>Assume <span class=\"math-inline\"><math aria-label=\"a+b&gt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>a<\/mi>\n<mo>+<\/mo>\n<mi>b<\/mi>\n<mo>&gt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span> and that a closed unit triangle contains <span class=\"math-inline\"><math aria-label=\"0,P,M,Q\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>0<\/mn>\n<mo>,<\/mo>\n<mi>P<\/mi>\n<mo>,<\/mo>\n<mi>M<\/mi>\n<mo>,<\/mo>\n<mi>Q<\/mi>\n<\/math><\/span>.<\/li>\n<li>These points form the quadrilateral <span class=\"math-inline\"><math aria-label=\"K=\\operatorname{conv}\\{0,P,M,Q\\}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>K<\/mi>\n<mo>=<\/mo>\n<mi>conv<\/mi>\n<mo fence=\"false\" stretchy=\"false\">{<\/mo>\n<mn>0<\/mn>\n<mo>,<\/mo>\n<mi>P<\/mi>\n<mo>,<\/mo>\n<mi>M<\/mi>\n<mo>,<\/mo>\n<mi>Q<\/mi>\n<mo fence=\"false\" stretchy=\"false\">}<\/mo>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Reduce the enclosing orientation to four contacts<\/strong> — <a class=\"node-link\" href=\"#/CALIPERS\">[CALIPERS]<\/a>.\n<\/summary><ul>\n<li>The minimum occurs with a side supported along a hull edge.<\/li>\n<li>Check <span class=\"math-inline\"><math aria-label=\"0P\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>0<\/mn>\n<mi>P<\/mi>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"PM\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>P<\/mi>\n<mi>M<\/mi>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"MQ\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>M<\/mi>\n<mi>Q<\/mi>\n<\/math><\/span>, and <span class=\"math-inline\"><math aria-label=\"Q0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>Q<\/mi>\n<mn>0<\/mn>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>The edge <span class=\"math-inline\"><math aria-label=\"0P\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>0<\/mn>\n<mi>P<\/mi>\n<\/math><\/span> requires side length greater than <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span>.<\/strong>\n<\/summary><ul>\n<li>Its required length is <span class=\"math-inline\"><math aria-label=\"L_{0P}=b+\\max\\{a,1/2\\}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>L<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mn>0<\/mn>\n<mi>P<\/mi>\n<\/mrow>\n<\/msub>\n<mo>=<\/mo>\n<mi>b<\/mi>\n<mo>+<\/mo>\n<mo data-mjx-texclass=\"OP\" movablelimits=\"true\">max<\/mo>\n<mo fence=\"false\" stretchy=\"false\">{<\/mo>\n<mi>a<\/mi>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<mo fence=\"false\" stretchy=\"false\">}<\/mo>\n<\/math><\/span>.<\/li>\n<li>If <span class=\"math-inline\"><math aria-label=\"a\\ge1/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>a<\/mi>\n<mo>≥<\/mo>\n<mn>1<\/mn>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>, this is <span class=\"math-inline\"><math aria-label=\"a+b&gt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>a<\/mi>\n<mo>+<\/mo>\n<mi>b<\/mi>\n<mo>&gt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<li>If <span class=\"math-inline\"><math aria-label=\"a&lt;1/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>a<\/mi>\n<mo>&lt;<\/mo>\n<mn>1<\/mn>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>, then <span class=\"math-inline\"><math aria-label=\"b&gt;1-a&gt;1/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>b<\/mi>\n<mo>&gt;<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>a<\/mi>\n<mo>&gt;<\/mo>\n<mn>1<\/mn>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>, so again <span class=\"math-inline\"><math aria-label=\"L_{0P}&gt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>L<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mn>0<\/mn>\n<mi>P<\/mi>\n<\/mrow>\n<\/msub>\n<mo>&gt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<li>The edge <span class=\"math-inline\"><math aria-label=\"Q0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>Q<\/mi>\n<mn>0<\/mn>\n<\/math><\/span> is symmetric.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>The edge <span class=\"math-inline\"><math aria-label=\"PM\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>P<\/mi>\n<mi>M<\/mi>\n<\/math><\/span> also requires side length greater than <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span>.<\/strong>\n<\/summary><ul>\n<li>Set <span class=\"math-inline\"><math aria-label=\"d_a=\\sqrt{4a^2-2a+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>d<\/mi>\n<mi>a<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<msqrt>\n<mn>4<\/mn>\n<msup>\n<mi>a<\/mi>\n<mn>2<\/mn>\n<\/msup>\n<mo>−<\/mo>\n<mn>2<\/mn>\n<mi>a<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/msqrt>\n<\/math><\/span>.<\/li>\n<li>If <span class=\"math-inline\"><math aria-label=\"a\\le1/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>a<\/mi>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>, then <span class=\"math-inline\"><math aria-label=\"L_{PM}=(a+b)/d_a&gt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>L<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>P<\/mi>\n<mi>M<\/mi>\n<\/mrow>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mi>a<\/mi>\n<mo>+<\/mo>\n<mi>b<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<msub>\n<mi>d<\/mi>\n<mi>a<\/mi>\n<\/msub>\n<mo>&gt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span> because <span class=\"math-inline\"><math aria-label=\"d_a\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>d<\/mi>\n<mi>a<\/mi>\n<\/msub>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<li><details open=\"\"><summary>If <span class=\"math-inline\"><math aria-label=\"a&gt;1/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>a<\/mi>\n<mo>&gt;<\/mo>\n<mn>1<\/mn>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>, then <span class=\"math-inline\"><math aria-label=\"L_{PM}=(2a^2+b)/d_a\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>L<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>P<\/mi>\n<mi>M<\/mi>\n<\/mrow>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>2<\/mn>\n<msup>\n<mi>a<\/mi>\n<mn>2<\/mn>\n<\/msup>\n<mo>+<\/mo>\n<mi>b<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<msub>\n<mi>d<\/mi>\n<mi>a<\/mi>\n<\/msub>\n<\/math><\/span>.\n<\/summary><ul>\n<li>Since <span class=\"math-inline\"><math aria-label=\"b&gt;1-a\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>b<\/mi>\n<mo>&gt;<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>a<\/mi>\n<\/math><\/span>, the numerator exceeds <span class=\"math-inline\"><math aria-label=\"2a^2-a+1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>2<\/mn>\n<msup>\n<mi>a<\/mi>\n<mn>2<\/mn>\n<\/msup>\n<mo>−<\/mo>\n<mi>a<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<li>The identity <span class=\"math-inline\"><math aria-label=\"(2a^2-a+1)^2-d_a^2=a^2(2a-1)^2\\ge0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<mn>2<\/mn>\n<msup>\n<mi>a<\/mi>\n<mn>2<\/mn>\n<\/msup>\n<mo>−<\/mo>\n<mi>a<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<msup>\n<mo stretchy=\"false\">)<\/mo>\n<mn>2<\/mn>\n<\/msup>\n<mo>−<\/mo>\n<msubsup>\n<mi>d<\/mi>\n<mi>a<\/mi>\n<mn>2<\/mn>\n<\/msubsup>\n<mo>=<\/mo>\n<msup>\n<mi>a<\/mi>\n<mn>2<\/mn>\n<\/msup>\n<mo stretchy=\"false\">(<\/mo>\n<mn>2<\/mn>\n<mi>a<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<msup>\n<mo stretchy=\"false\">)<\/mo>\n<mn>2<\/mn>\n<\/msup>\n<mo>≥<\/mo>\n<mn>0<\/mn>\n<\/math><\/span> completes the comparison.<\/li>\n<\/ul>\n<\/details><\/li>\n<li>The edge <span class=\"math-inline\"><math aria-label=\"MQ\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>M<\/mi>\n<mi>Q<\/mi>\n<\/math><\/span> is symmetric.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>All four candidates require side length greater than <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span>.<\/strong>\n<\/summary><ul>\n<li>Contradiction.<\/li>\n<li>Therefore midpoint containment forces <span class=\"math-inline\"><math aria-label=\"A_i+B_i\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<\/ul>\n<h2>Exact scope<\/h2>\n<p>This uses actual maximal reaches and gives a weak inequality for a closed triangle. Strict inequalities for selected lower bounds require the separate positive-margin argument; they are not silently substituted here.<\/p>\n<hr/>\n<p><strong>Proof sources:<\/strong> <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/2XXX_geometric_lemmas/20XX_V_triangle_geometry/2005_midpoint_self_cover_lemma.md\" rel=\"noopener noreferrer\" target=\"_blank\">2005<\/a> · <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/2XXX_geometric_lemmas/20XX_V_triangle_geometry/2004_admissible_set.md\" rel=\"noopener noreferrer\" target=\"_blank\">2004<\/a>. All source links are pinned to the same repository snapshot.<\/p>\n<p><a class=\"node-link\" href=\"#/MAIN\">[MAIN]<\/a> Return to the main tree.<\/p>\n"},"SETUP":{"id":"SETUP","file":"SETUP.md","title":"Roles, locality, and gaps","group":"Proof trees","html":"<h1>[SETUP] Roles, locality, and gaps<\/h1>\n<p><a class=\"node-link\" href=\"#/MAIN\">[MAIN]<\/a> · <a class=\"node-link\" href=\"#/NOTATION\">[NOTATION]<\/a> · <a class=\"node-link\" href=\"#/USE\">[USE]<\/a> · <a class=\"node-link\" href=\"#/GLOSSARY\">[GLOSSARY]<\/a><\/p>\n<details class=\"local-terms\" open=\"\"><summary>Terms used here<\/summary><ul class=\"proof-tree\">\n<li><strong>Geometry and triangles.<\/strong> <span class=\"math-inline\"><math aria-label=\"H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>H<\/mi>\n<\/math><\/span> is the closed regular hexagon of side <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span>, with center <span class=\"math-inline\"><math aria-label=\"O=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<mo>=<\/mo>\n<mn>0<\/mn>\n<\/math><\/span> and vertices <span class=\"math-inline\"><math aria-label=\"V_0,\\ldots,V_5\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>,<\/mo>\n<mo>…<\/mo>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>5<\/mn>\n<\/msub>\n<\/math><\/span> in cyclic order. Indices are modulo <span class=\"math-inline\"><math aria-label=\"6\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>6<\/mn>\n<\/math><\/span> (so <span class=\"math-inline\"><math aria-label=\"V_6=V_0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mn>6<\/mn>\n<\/msub>\n<mo>=<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<\/math><\/span>). A <strong>spoke<\/strong> is <span class=\"math-inline\"><math aria-label=\"r_i=[O,V_i]\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>r<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<mi>O<\/mi>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<\/math><\/span>; its midpoint is <span class=\"math-inline\"><math aria-label=\"M_i=V_i/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>. The boundary edge <span class=\"math-inline\"><math aria-label=\"e_{i,i+1}=[V_i,V_{i+1}]\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>e<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>,<\/mo>\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<\/math><\/span> has parameterization <span class=\"math-inline\"><math aria-label=\"X_i(t)=(1-t)V_i+tV_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>X<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>t<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>t<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<mi>t<\/mi>\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"0\\le t\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>0<\/mn>\n<mo>≤<\/mo>\n<mi>t<\/mi>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<li><strong>C triangle and V triangles.<\/strong> <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> is an open unit equilateral triangle containing <span class=\"math-inline\"><math aria-label=\"O\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<\/math><\/span>; <span class=\"math-inline\"><math aria-label=\"U_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> is one containing <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>. A <strong>role<\/strong> means one of these assigned triangles. Their closures <span class=\"math-inline\"><math aria-label=\"T_C,T_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>T<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> include their sides and vertices; the open triangles do not. Coverage always uses the open triangles. A <strong>trace<\/strong> is intersection with the stated edge or spoke; the <strong>relative interior<\/strong> of an edge removes its endpoints.<\/li>\n<\/ul><\/details>\n<p><strong>Input:<\/strong> a hypothetical cover by seven open unit equilateral triangles. <strong>Output:<\/strong> the role labels, local coverage restrictions, and gap convention used throughout.<\/p>\n<h2>Tree<\/h2>\n<ul class=\"proof-tree\">\n<li><details open=\"\"><summary><strong>Seven distinguished points force seven distinct roles.<\/strong>\n<\/summary><ul>\n<li>Let <span class=\"math-inline\"><math aria-label=\"O\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<\/math><\/span> be the hexagon center and <span class=\"math-inline\"><math aria-label=\"V_0,\\ldots,V_5\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>,<\/mo>\n<mo>…<\/mo>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>5<\/mn>\n<\/msub>\n<\/math><\/span> its vertices in cyclic order.<\/li>\n<li>They are pairwise at distance at least <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<li>Two points in an open unit equilateral triangle have distance strictly below <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<li>Thus <span class=\"math-inline\"><math aria-label=\"O\\in U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<mo>∈<\/mo>\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"V_i\\in U_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>∈<\/mo>\n<msub>\n<mi>U<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> determine seven distinct triangles.<\/li>\n<li>Write <span class=\"math-inline\"><math aria-label=\"T_C=\\overline{U_C}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<mover>\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<mo accent=\"true\">―<\/mo>\n<\/mover>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"T_i=\\overline{U_i}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<mover>\n<msub>\n<mi>U<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo accent=\"true\">―<\/mo>\n<\/mover>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Coverage by a vertex role is local.<\/strong>\n<\/summary><ul>\n<li><details open=\"\"><summary>A point in the relative interior of a nonincident boundary edge is farther than <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span> from <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>.\n<\/summary><ul>\n<li>Hence <span class=\"math-inline\"><math aria-label=\"T_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> has boundary traces only on the two edges incident with <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary>A noncentral point on a nonlocal spoke is also farther than <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span> from <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>.\n<\/summary><ul>\n<li>For example, for <span class=\"math-inline\"><math aria-label=\"0&lt;d\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>0<\/mn>\n<mo>&lt;<\/mo>\n<mi>d<\/mi>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"\\|dV_{i\\pm2}-V_i\\|^2=1+d+d^2&gt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo data-mjx-texclass=\"ORD\">∥<\/mo>\n<mi>d<\/mi>\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>±<\/mo>\n<mn>2<\/mn>\n<\/mrow>\n<\/msub>\n<mo>−<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<msup>\n<mo data-mjx-texclass=\"ORD\">∥<\/mo>\n<mn>2<\/mn>\n<\/msup>\n<mo>=<\/mo>\n<mn>1<\/mn>\n<mo>+<\/mo>\n<mi>d<\/mi>\n<mo>+<\/mo>\n<msup>\n<mi>d<\/mi>\n<mn>2<\/mn>\n<\/msup>\n<mo>&gt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<li>Also <span class=\"math-inline\"><math aria-label=\"\\|dV_{i+3}-V_i\\|=1+d&gt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo data-mjx-texclass=\"ORD\">∥<\/mo>\n<mi>d<\/mi>\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>3<\/mn>\n<\/mrow>\n<\/msub>\n<mo>−<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo data-mjx-texclass=\"ORD\">∥<\/mo>\n<mo>=<\/mo>\n<mn>1<\/mn>\n<mo>+<\/mo>\n<mi>d<\/mi>\n<mo>&gt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li>Therefore <span class=\"math-inline\"><math aria-label=\"M_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> can be covered only by <span class=\"math-inline\"><math aria-label=\"U_C,U_{i-1},U_i,U_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>U<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>U<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>U<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Record actual boundary reaches.<\/strong>\n<\/summary><ul>\n<li><span class=\"math-inline\"><math aria-label=\"A_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> is the reach from <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> on the preceding edge; <span class=\"math-inline\"><math aria-label=\"B_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> is the reach on the following edge.<\/li>\n<li>Supercritical means <span class=\"math-inline\"><math aria-label=\"A_i+B_i&gt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>&gt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>; count such roles with <span class=\"math-inline\"><math aria-label=\"N_+\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>N<\/mi>\n<mo>+<\/mo>\n<\/msub>\n<\/math><\/span>.<\/li>\n<li>These are actual maximal reaches of the closures, not freely selected lower bounds.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Define gaps using the original open roles.<\/strong>\n<\/summary><ul>\n<li>On edge <span class=\"math-inline\"><math aria-label=\"e_{i,i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>e<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>,<\/mo>\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>, the incident open traces have parameters <span class=\"math-inline\"><math aria-label=\"[0,B_i)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">[<\/mo>\n<mn>0<\/mn>\n<mo>,<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"(1-A_{i+1},1]\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<msub>\n<mi>A<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo stretchy=\"false\">]<\/mo>\n<\/math><\/span>.<\/li>\n<li>If <span class=\"math-inline\"><math aria-label=\"B_i+A_{i+1}&gt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>A<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>&gt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>, they overlap strictly and there is no gap.<\/li>\n<li><details open=\"\"><summary>If <span class=\"math-inline\"><math aria-label=\"B_i+A_{i+1}\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>A<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>, their complement is the closed interval <span class=\"math-inline\"><math aria-label=\"[B_i,1-A_{i+1}]\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">[<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<msub>\n<mi>A<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<\/math><\/span>.\n<\/summary><ul>\n<li>Equality leaves a singleton gap, not a gap-free edge.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary>Every actual gap must belong to <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span>.\n<\/summary><ul>\n<li>Even a singleton forces a positive boundary trace of <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span>, by openness.<\/li>\n<\/ul>\n<\/details><\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Continue to the structural facts.<\/strong>\n<\/summary><ul>\n<li>Center and vertex types — <a class=\"node-link\" href=\"#/CLASSIFICATION\">[CLASSIFICATION]<\/a>.<\/li>\n<li>Midpoint containment and exclusion — <a class=\"node-link\" href=\"#/MIDPOINTS\">[MIDPOINTS]<\/a>.<\/li>\n<li>The skeleton is the perimeter plus six spokes; its total length is <span class=\"math-inline\"><math aria-label=\"12\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>12<\/mn>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<\/ul>\n<hr/>\n<p><strong>Proof sources:<\/strong> <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/0XXX_main/0000_main_theorem.md\" rel=\"noopener noreferrer\" target=\"_blank\">0000<\/a> · <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/1XXX_foundations/12XX_V_triangle/1201_V_triangle_types.md\" rel=\"noopener noreferrer\" target=\"_blank\">1201<\/a> · <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/2XXX_geometric_lemmas/25XX_length_bounds/2500_boundary_length_bounds.md\" rel=\"noopener noreferrer\" target=\"_blank\">2500<\/a> · <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/2XXX_geometric_lemmas/26XX_enclosing_triangle_tools/2612_fixed_witness_unification.md\" rel=\"noopener noreferrer\" target=\"_blank\">2612<\/a>. All source links are pinned to the same repository snapshot.<\/p>\n<p><a class=\"node-link\" href=\"#/MAIN\">[MAIN]<\/a> Return to the main tree.<\/p>\n"},"START":{"id":"START","file":"START.md","title":"Read the proof without knowing its terminology","group":"Reference","html":"<h1>[START] Read the proof without knowing its terminology<\/h1>\n<p><a class=\"node-link\" href=\"#/MAIN\">[MAIN]<\/a> · <a class=\"node-link\" href=\"#/GLOSSARY\">[GLOSSARY]<\/a> · <a class=\"node-link\" href=\"#/USE\">[USE]<\/a><\/p>\n<details class=\"local-terms\" open=\"\"><summary>Terms used here<\/summary><p>The <strong>unit hexagon<\/strong> is the closed regular hexagon whose six sides have length <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span>. An <strong>open unit equilateral triangle<\/strong> has three sides of length <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span> but does not include its boundary. Triangles may be translated or rotated. To <strong>cover<\/strong> the hexagon means every point of the hexagon, including its boundary, belongs to at least one open triangle.<\/p><\/details>\n<h2>Tree<\/h2>\n<ul class=\"proof-tree\">\n<li><details open=\"\"><summary><strong>The claim:<\/strong> seven such triangles cannot cover the unit hexagon.\n<\/summary><ul>\n<li>Assume a cover exists and derive a contradiction.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Assign the triangles to seven special points.<\/strong>\n<\/summary><ul>\n<li>One triangle contains the center, and six others contain the six vertices.<\/li>\n<li>Call them the <strong>C triangle<\/strong> and <strong>V triangles<\/strong>. The letter V means vertex.<\/li>\n<li>Why must they be different? Two points in one open unit triangle have distance less than <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span>, while these seven special points have pairwise distances at least <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<li>Full setup: <a class=\"node-link\" href=\"#/SETUP\">SETUP<\/a>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Measure the boundary/inward tradeoff.<\/strong>\n<\/summary><ul>\n<li>A V triangle covers initial intervals of the two boundary edges at its vertex.<\/li>\n<li>If their actual lengths sum to more than <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span>, call that V triangle <strong>supercritical<\/strong>.<\/li>\n<li>Such a triangle misses the midpoint of its own center-to-vertex segment, called its <strong>spoke<\/strong>.<\/li>\n<li>Short geometric explanation: <a class=\"node-link\" href=\"#/MIDPOINTS\">MIDPOINTS<\/a>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Ask whether the six V triangles cover the perimeter by themselves.<\/strong>\n<\/summary><ul>\n<li>A <strong>gap<\/strong> is a point or interval they miss; the C triangle must cover it. A single missing point is still a gap.<\/li>\n<li>With no gaps, the proof uses either exterior-area loss or nine points that cannot all fit in the C triangle.<\/li>\n<li>With a gap, the C triangle contains exactly one spoke midpoint; length bounds sharply limit the other triangles.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Who contains a missed midpoint?<\/strong>\n<\/summary><ul>\n<li>A V triangle at a neighboring vertex may contain it; call that triangle a <strong>neighboring supplier<\/strong> of the midpoint.<\/li>\n<li>For example, a triangle based at vertex <span class=\"math-inline\"><math aria-label=\"V_0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<\/math><\/span> containing midpoint <span class=\"math-inline\"><math aria-label=\"M_1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<\/math><\/span> supplies <span class=\"math-inline\"><math aria-label=\"M_1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<\/math><\/span> on the next spoke.<\/li>\n<li>This is a concrete point-containment statement, not a new kind of triangle.<\/li>\n<li>The proof shows only one such supplying triangle can remain in the relevant case, then checks its few possible types and positions: <a class=\"node-link\" href=\"#/SUPPLIER\">SUPPLIER<\/a>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Read the linked main tree.<\/strong>\n<\/summary><ul>\n<li><a class=\"node-link\" href=\"#/MAIN\">MAIN<\/a> assembles the cases.<\/li>\n<li><a class=\"node-link\" href=\"#/D\">D<\/a>, for example, is the four-point contradiction when the supplier is based at the center's distinguished vertex index. The D page repeats its input and definitions, so it can be opened directly.<\/li>\n<li>A <strong>calculation leaf<\/strong> marks a long local verification left below the speaking cutoff. The midpoint proofs remain expanded.<\/li>\n<\/ul>\n<\/details><\/li>\n<\/ul>\n<p>This is a navigation and explanation layer. The numbered proof sources linked from each argument remain the mathematical authority. A return link is navigation, not a claim that a proof depends on its parent page.<\/p>\n"},"SUPPLIER":{"id":"SUPPLIER","file":"SUPPLIER.md","title":"One missed midpoint determines the remaining cases","group":"Proof trees","html":"<h1>[SUPPLIER] One missed midpoint determines the remaining cases<\/h1>\n<p><a class=\"node-link\" href=\"#/MAIN\">[MAIN]<\/a> · <a class=\"node-link\" href=\"#/MIDPOINTS\">[MIDPOINTS]<\/a> · <a class=\"node-link\" href=\"#/NOTATION\">[NOTATION]<\/a> · <a class=\"node-link\" href=\"#/USE\">[USE]<\/a> · <a class=\"node-link\" href=\"#/GLOSSARY\">[GLOSSARY]<\/a><\/p>\n<details class=\"local-terms\" open=\"\"><summary>Terms used here<\/summary><ul class=\"proof-tree\">\n<li><strong>Geometry and triangles.<\/strong> <span class=\"math-inline\"><math aria-label=\"H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>H<\/mi>\n<\/math><\/span> is the closed regular hexagon of side <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span>, with center <span class=\"math-inline\"><math aria-label=\"O=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<mo>=<\/mo>\n<mn>0<\/mn>\n<\/math><\/span> and vertices <span class=\"math-inline\"><math aria-label=\"V_0,\\ldots,V_5\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>,<\/mo>\n<mo>…<\/mo>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>5<\/mn>\n<\/msub>\n<\/math><\/span> in cyclic order. Indices are modulo <span class=\"math-inline\"><math aria-label=\"6\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>6<\/mn>\n<\/math><\/span> (so <span class=\"math-inline\"><math aria-label=\"V_6=V_0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mn>6<\/mn>\n<\/msub>\n<mo>=<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<\/math><\/span>). A <strong>spoke<\/strong> is <span class=\"math-inline\"><math aria-label=\"r_i=[O,V_i]\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>r<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<mi>O<\/mi>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<\/math><\/span>; its midpoint is <span class=\"math-inline\"><math aria-label=\"M_i=V_i/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>. The boundary edge <span class=\"math-inline\"><math aria-label=\"e_{i,i+1}=[V_i,V_{i+1}]\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>e<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>,<\/mo>\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<\/math><\/span> has parameterization <span class=\"math-inline\"><math aria-label=\"X_i(t)=(1-t)V_i+tV_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>X<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>t<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>t<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<mi>t<\/mi>\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"0\\le t\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>0<\/mn>\n<mo>≤<\/mo>\n<mi>t<\/mi>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<li><strong>C triangle and V triangles.<\/strong> <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> is an open unit equilateral triangle containing <span class=\"math-inline\"><math aria-label=\"O\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<\/math><\/span>; <span class=\"math-inline\"><math aria-label=\"U_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> is one containing <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>. A <strong>role<\/strong> means one of these assigned triangles. Their closures <span class=\"math-inline\"><math aria-label=\"T_C,T_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>T<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> include their sides and vertices; the open triangles do not. Coverage always uses the open triangles. A <strong>trace<\/strong> is intersection with the stated edge or spoke; the <strong>relative interior<\/strong> of an edge removes its endpoints.<\/li>\n<li><strong>Reaches and criticality.<\/strong> <span class=\"math-inline\"><math aria-label=\"A_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"B_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> are the actual lengths reached by <span class=\"math-inline\"><math aria-label=\"T_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> from <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> toward <span class=\"math-inline\"><math aria-label=\"V_{i-1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"V_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>, respectively. <span class=\"math-inline\"><math aria-label=\"C_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>C<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> is its actual distance along its own spoke from <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> toward <span class=\"math-inline\"><math aria-label=\"O\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<\/math><\/span>. <strong>Supercritical<\/strong> means <span class=\"math-inline\"><math aria-label=\"A_i+B_i&gt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>&gt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>; <strong>nonsupercritical<\/strong> means <span class=\"math-inline\"><math aria-label=\"A_i+B_i\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>. <span class=\"math-inline\"><math aria-label=\"N_+\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>N<\/mi>\n<mo>+<\/mo>\n<\/msub>\n<\/math><\/span> counts supercritical V triangles. Lowercase <span class=\"math-inline\"><math aria-label=\"a_i,b_i,c_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>a<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>b<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>c<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> are selected lower bounds, not necessarily these maxima.<\/li>\n<li><strong>Gaps and skeleton.<\/strong> A <strong>boundary gap<\/strong> is a nonempty part of an edge missed by all six open V triangles. On <span class=\"math-inline\"><math aria-label=\"e_{i,i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>e<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>,<\/mo>\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span> it is <span class=\"math-inline\"><math aria-label=\"X_i([B_i,1-A_{i+1}])\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>X<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<msub>\n<mi>A<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> when <span class=\"math-inline\"><math aria-label=\"B_i+A_{i+1}\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>A<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>; equality leaves one missing point. The <strong>skeleton<\/strong> is <span class=\"math-inline\"><math aria-label=\"S=\\partial H\\cup\\bigcup_i r_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>S<\/mi>\n<mo>=<\/mo>\n<mi>∂<\/mi>\n<mi>H<\/mi>\n<mo>∪<\/mo>\n<munder>\n<mo data-mjx-texclass=\"OP\">⋃<\/mo>\n<mi>i<\/mi>\n<\/munder>\n<msub>\n<mi>r<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>, of length <span class=\"math-inline\"><math aria-label=\"12\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>12<\/mn>\n<\/math><\/span>. Skeleton coverage need not cover points between the spokes.<\/li>\n<li><strong>Neighboring support and supplier.<\/strong> The neighboring spokes for a V triangle at <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> are <span class=\"math-inline\"><math aria-label=\"r_{i-1},r_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>r<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>r<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>. It has <strong>positive adjacent support<\/strong> if its closure meets one of those spokes in an interval of positive length. A <strong>neighboring supplier of <span class=\"math-inline\"><math aria-label=\"M_j\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>j<\/mi>\n<\/msub>\n<\/math><\/span><\/strong> is specifically a triangle <span class=\"math-inline\"><math aria-label=\"U_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> with <span class=\"math-inline\"><math aria-label=\"i=j-1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>i<\/mi>\n<mo>=<\/mo>\n<mi>j<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<\/math><\/span> or <span class=\"math-inline\"><math aria-label=\"j+1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>j<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"M_j\\in U_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>j<\/mi>\n<\/msub>\n<mo>∈<\/mo>\n<msub>\n<mi>U<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>. “Rescuer” means the same thing here. Supplying a midpoint implies positive support by openness; positive support alone does not imply supplying that midpoint. <span class=\"math-inline\"><math aria-label=\"N_{\\rm sp}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>N<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi mathvariant=\"normal\">s<\/mi>\n<mi mathvariant=\"normal\">p<\/mi>\n<\/mrow>\n<\/msub>\n<\/math><\/span> counts V triangles having positive adjacent support.<\/li>\n<li><strong>Type labels.<\/strong> CE0, CE1, CE2 count the boundary edges met by <span class=\"math-inline\"><math aria-label=\"T_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> in positive length; they do not count gaps. For a V triangle let <span class=\"math-inline\"><math aria-label=\"o\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>o<\/mi>\n<\/math><\/span> count its vertices outside <span class=\"math-inline\"><math aria-label=\"H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>H<\/mi>\n<\/math><\/span>, and <span class=\"math-inline\"><math aria-label=\"n\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>n<\/mi>\n<\/math><\/span> its neighboring spokes met in positive length. Vd0 means <span class=\"math-inline\"><math aria-label=\"n=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>n<\/mi>\n<mo>=<\/mo>\n<mn>0<\/mn>\n<\/math><\/span>; Vd1 means <span class=\"math-inline\"><math aria-label=\"(o,n)=(1,1)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<mi>o<\/mi>\n<mo>,<\/mo>\n<mi>n<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>; Vd2 means <span class=\"math-inline\"><math aria-label=\"(1,2)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>,<\/mo>\n<mn>2<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>; T3-like means <span class=\"math-inline\"><math aria-label=\"(2,1)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<mn>2<\/mn>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>. The names are labels, not additional assumptions.<\/li>\n<li><strong>Indices used in the case split.<\/strong> <span class=\"math-inline\"><math aria-label=\"k\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>k<\/mi>\n<\/math><\/span> is the index of the unique midpoint <span class=\"math-inline\"><math aria-label=\"M_k\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>k<\/mi>\n<\/msub>\n<\/math><\/span> contained by <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> when a gap exists. After the count reduction, <span class=\"math-inline\"><math aria-label=\"\\sigma\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>σ<\/mi>\n<\/math><\/span> is the unique supercritical index. When <span class=\"math-inline\"><math aria-label=\"\\sigma\\ne k\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>σ<\/mi>\n<mo>≠<\/mo>\n<mi>k<\/mi>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"\\tau\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>τ<\/mi>\n<\/math><\/span> names the unique neighboring supplier, so <span class=\"math-inline\"><math aria-label=\"\\tau\\in\\{\\sigma-1,\\sigma+1\\}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>τ<\/mi>\n<mo>∈<\/mo>\n<mo fence=\"false\" stretchy=\"false\">{<\/mo>\n<mi>σ<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<mo>,<\/mo>\n<mi>σ<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<mo fence=\"false\" stretchy=\"false\">}<\/mo>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"M_\\sigma\\in U_\\tau\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>σ<\/mi>\n<\/msub>\n<mo>∈<\/mo>\n<msub>\n<mi>U<\/mi>\n<mi>τ<\/mi>\n<\/msub>\n<\/math><\/span>. “At <span class=\"math-inline\"><math aria-label=\"k\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>k<\/mi>\n<\/math><\/span>” means based at vertex <span class=\"math-inline\"><math aria-label=\"V_k\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>k<\/mi>\n<\/msub>\n<\/math><\/span>, not physically located at midpoint <span class=\"math-inline\"><math aria-label=\"M_k\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>k<\/mi>\n<\/msub>\n<\/math><\/span>.<\/li>\n<li><strong>Paths and boundary handoffs.<\/strong> A path is an ordered consecutive group of V triangles, connected by the hexagon edges between their vertices. On a gap-free connecting edge their open traces overlap: <span class=\"math-inline\"><math aria-label=\"B_i+A_{i+1}&gt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>A<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>&gt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>. A <strong>handoff<\/strong> is a point selected inside this overlap, covered by both triangles. <strong>Path monotonicity<\/strong> means the increasing <span class=\"math-inline\"><math aria-label=\"A_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> and decreasing <span class=\"math-inline\"><math aria-label=\"B_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> obtained by combining these overlaps with nonsupercriticality. An edge is <strong>center-free<\/strong> when <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> covers no point in its relative interior (the edge with its endpoints removed).<\/li>\n<\/ul><\/details>\n<p><strong>Input:<\/strong> a skeleton cover with at least one gap. <strong>Output:<\/strong> one supercritical role, at most one positive-support role, and the exhaustive placement routing.<\/p>\n<h2>A concrete supplier example<\/h2>\n<p>If <span class=\"math-inline\"><math aria-label=\"T_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"T_1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<\/math><\/span> both miss <span class=\"math-inline\"><math aria-label=\"M_1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<\/math><\/span>, but <span class=\"math-inline\"><math aria-label=\"M_1\\in U_0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<mo>∈<\/mo>\n<msub>\n<mi>U<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<\/math><\/span>, then <strong><span class=\"math-inline\"><math aria-label=\"U_0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<\/math><\/span> supplies <span class=\"math-inline\"><math aria-label=\"M_1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<\/math><\/span><\/strong>. It is a neighboring supplier because <span class=\"math-inline\"><math aria-label=\"V_0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"V_1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<\/math><\/span> are consecutive hexagon vertices. The point lies on <span class=\"math-inline\"><math aria-label=\"r_1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>r<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<\/math><\/span>, not on <span class=\"math-inline\"><math aria-label=\"U_0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<\/math><\/span>'s own spoke <span class=\"math-inline\"><math aria-label=\"r_0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>r<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<\/math><\/span>. Merely meeting <span class=\"math-inline\"><math aria-label=\"r_1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>r<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<\/math><\/span> near <span class=\"math-inline\"><math aria-label=\"O\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<\/math><\/span> would not make <span class=\"math-inline\"><math aria-label=\"U_0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<\/math><\/span> a supplier unless it actually contained <span class=\"math-inline\"><math aria-label=\"M_1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<\/math><\/span>.<\/p>\n<h2>Tree<\/h2>\n<ul class=\"proof-tree\">\n<li><details open=\"\"><summary><strong>Identify the unique center midpoint.<\/strong>\n<\/summary><ul>\n<li>By <a class=\"node-link\" href=\"#/C-MIDPOINT\">[C-MIDPOINT]<\/a>, <span class=\"math-inline\"><math aria-label=\"M_k\\in U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>k<\/mi>\n<\/msub>\n<mo>∈<\/mo>\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> and every other midpoint is outside <span class=\"math-inline\"><math aria-label=\"T_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Use the count bound.<\/strong>\n<\/summary><ul>\n<li><a class=\"node-link\" href=\"#/LENGTH\">[LENGTH]<\/a> gives <span class=\"math-inline\"><math aria-label=\"N_++N_{\\rm sp}\\le2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>N<\/mi>\n<mo>+<\/mo>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>N<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi mathvariant=\"normal\">s<\/mi>\n<mi mathvariant=\"normal\">p<\/mi>\n<\/mrow>\n<\/msub>\n<mo>≤<\/mo>\n<mn>2<\/mn>\n<\/math><\/span>.<\/li>\n<li><a class=\"node-link\" href=\"#/N0\">[N0]<\/a> gives <span class=\"math-inline\"><math aria-label=\"N_+\\ge1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>N<\/mi>\n<mo>+<\/mo>\n<\/msub>\n<mo>≥<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<li>Positive-support roles and supercritical roles are disjoint.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Exclude <span class=\"math-inline\"><math aria-label=\"N_+\\ge2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>N<\/mi>\n<mo>+<\/mo>\n<\/msub>\n<mo>≥<\/mo>\n<mn>2<\/mn>\n<\/math><\/span>.<\/strong>\n<\/summary><ul>\n<li>Choose a supercritical index <span class=\"math-inline\"><math aria-label=\"\\sigma\\ne k\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>σ<\/mi>\n<mo>≠<\/mo>\n<mi>k<\/mi>\n<\/math><\/span>.<\/li>\n<li>Its role misses <span class=\"math-inline\"><math aria-label=\"M_\\sigma\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>σ<\/mi>\n<\/msub>\n<\/math><\/span> — <a class=\"node-link\" href=\"#/SELF-MIDPOINT\">[SELF-MIDPOINT]<\/a>.<\/li>\n<li>The center also misses <span class=\"math-inline\"><math aria-label=\"M_\\sigma\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>σ<\/mi>\n<\/msub>\n<\/math><\/span> — <a class=\"node-link\" href=\"#/C-MIDPOINT\">[C-MIDPOINT]<\/a>.<\/li>\n<li>Locality forces an adjacent open role to cover <span class=\"math-inline\"><math aria-label=\"M_\\sigma\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>σ<\/mi>\n<\/msub>\n<\/math><\/span>.<\/li>\n<li>Open containment makes that role a positive-support role, distinct from all supercritical roles.<\/li>\n<li>Thus <span class=\"math-inline\"><math aria-label=\"N_++N_{\\rm sp}\\ge3\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>N<\/mi>\n<mo>+<\/mo>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>N<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi mathvariant=\"normal\">s<\/mi>\n<mi mathvariant=\"normal\">p<\/mi>\n<\/mrow>\n<\/msub>\n<mo>≥<\/mo>\n<mn>3<\/mn>\n<\/math><\/span>, contrary to the count bound.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Conclude <span class=\"math-inline\"><math aria-label=\"N_+=1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>N<\/mi>\n<mo>+<\/mo>\n<\/msub>\n<mo>=<\/mo>\n<mn>1<\/mn>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"N_{\\rm sp}\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>N<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi mathvariant=\"normal\">s<\/mi>\n<mi mathvariant=\"normal\">p<\/mi>\n<\/mrow>\n<\/msub>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.<\/strong>\n<\/summary><ul>\n<li>Let <span class=\"math-inline\"><math aria-label=\"\\sigma\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>σ<\/mi>\n<\/math><\/span> denote the unique supercritical index.<\/li>\n<li>If <span class=\"math-inline\"><math aria-label=\"\\sigma=k\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>σ<\/mi>\n<mo>=<\/mo>\n<mi>k<\/mi>\n<\/math><\/span>, apply <a class=\"node-link\" href=\"#/BC\">[BC]<\/a>.<\/li>\n<li><details open=\"\"><summary>Otherwise a neighbor <span class=\"math-inline\"><math aria-label=\"U_\\tau\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>τ<\/mi>\n<\/msub>\n<\/math><\/span> must cover <span class=\"math-inline\"><math aria-label=\"M_\\sigma\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>σ<\/mi>\n<\/msub>\n<\/math><\/span>.\n<\/summary><ul>\n<li>It is a positive-support role.<\/li>\n<li>The count bound makes it unique.<\/li>\n<li>In particular <span class=\"math-inline\"><math aria-label=\"\\tau\\in\\{\\sigma-1,\\sigma+1\\}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>τ<\/mi>\n<mo>∈<\/mo>\n<mo fence=\"false\" stretchy=\"false\">{<\/mo>\n<mi>σ<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<mo>,<\/mo>\n<mi>σ<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<mo fence=\"false\" stretchy=\"false\">}<\/mo>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Classify only that unique supplier.<\/strong>\n<\/summary><ul>\n<li><details open=\"\"><summary><strong>T3-like.<\/strong>\n<\/summary><ul>\n<li>It misses its own midpoint <span class=\"math-inline\"><math aria-label=\"M_\\tau\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>τ<\/mi>\n<\/msub>\n<\/math><\/span> — <a class=\"node-link\" href=\"#/T3-MIDPOINT\">[T3-MIDPOINT]<\/a>.<\/li>\n<li>If <span class=\"math-inline\"><math aria-label=\"\\tau\\ne k\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>τ<\/mi>\n<mo>≠<\/mo>\n<mi>k<\/mi>\n<\/math><\/span>, the center misses <span class=\"math-inline\"><math aria-label=\"M_\\tau\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>τ<\/mi>\n<\/msub>\n<\/math><\/span> too.<\/li>\n<li>Any covering neighbor would be a second positive-support role, impossible.<\/li>\n<li>Hence <span class=\"math-inline\"><math aria-label=\"\\tau=k\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>τ<\/mi>\n<mo>=<\/mo>\n<mi>k<\/mi>\n<\/math><\/span>; apply <a class=\"node-link\" href=\"#/D\">[D]<\/a>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Vd1 at <span class=\"math-inline\"><math aria-label=\"k\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>k<\/mi>\n<\/math><\/span>.<\/strong>\n<\/summary><ul>\n<li>Apply <a class=\"node-link\" href=\"#/D\">[D]<\/a> using the Vd1 local ratio input.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Vd1 away from <span class=\"math-inline\"><math aria-label=\"k\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>k<\/mi>\n<\/math><\/span>.<\/strong>\n<\/summary><ul>\n<li>Both <span class=\"math-inline\"><math aria-label=\"\\sigma\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>σ<\/mi>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"\\tau\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>τ<\/mi>\n<\/math><\/span> differ from <span class=\"math-inline\"><math aria-label=\"k\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>k<\/mi>\n<\/math><\/span>.<\/li>\n<li>Their shared boundary edge is not incident with <span class=\"math-inline\"><math aria-label=\"V_k\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>k<\/mi>\n<\/msub>\n<\/math><\/span>.<\/li>\n<li>All possible center traces are incident with <span class=\"math-inline\"><math aria-label=\"V_k\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>k<\/mi>\n<\/msub>\n<\/math><\/span>, so this edge is center-free.<\/li>\n<li>Apply <a class=\"node-link\" href=\"#/REPLACEMENT\">[REPLACEMENT]<\/a>, then <a class=\"node-link\" href=\"#/N0\">[N0]<\/a>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Vd2.<\/strong>\n<\/summary><ul>\n<li>Covering the neighboring midpoint gives the stronger cap used in <a class=\"node-link\" href=\"#/PERIMETER\">[PERIMETER]<\/a>.<\/li>\n<\/ul>\n<\/details><\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>These supplier cases are exhaustive.<\/strong>\n<\/summary><ul>\n<li>No additional global six-triangle type grid is needed.<\/li>\n<\/ul>\n<\/details><\/li>\n<\/ul>\n<hr/>\n<p><strong>Proof sources:<\/strong> <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/2XXX_geometric_lemmas/26XX_enclosing_triangle_tools/2613_midpoint_supplier_reduction.md\" rel=\"noopener noreferrer\" target=\"_blank\">2613<\/a> · <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/2XXX_geometric_lemmas/25XX_length_bounds/2531_length_budget_corollaries.md\" rel=\"noopener noreferrer\" target=\"_blank\">2531<\/a> · <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/2XXX_geometric_lemmas/26XX_enclosing_triangle_tools/2614_two_vertex_replacement.md\" rel=\"noopener noreferrer\" target=\"_blank\">2614<\/a>. All source links are pinned to the same repository snapshot.<\/p>\n<p><a class=\"node-link\" href=\"#/MAIN\">[MAIN]<\/a> Return to the main tree.<\/p>\n"},"T3-MIDPOINT":{"id":"T3-MIDPOINT","file":"T3-MIDPOINT.md","title":"A T3-like role misses its own midpoint","group":"Proof trees","html":"<h1>[T3-MIDPOINT] A T3-like role misses its own midpoint<\/h1>\n<p><a class=\"node-link\" href=\"#/MAIN\">[MAIN]<\/a> · <a class=\"node-link\" href=\"#/MIDPOINTS\">[MIDPOINTS]<\/a> · <a class=\"node-link\" href=\"#/NOTATION\">[NOTATION]<\/a> · <a class=\"node-link\" href=\"#/USE\">[USE]<\/a> · <a class=\"node-link\" href=\"#/GLOSSARY\">[GLOSSARY]<\/a><\/p>\n<details class=\"local-terms\" open=\"\"><summary>Terms used here<\/summary><ul class=\"proof-tree\">\n<li><strong>Geometry and triangles.<\/strong> <span class=\"math-inline\"><math aria-label=\"H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>H<\/mi>\n<\/math><\/span> is the closed regular hexagon of side <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span>, with center <span class=\"math-inline\"><math aria-label=\"O=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<mo>=<\/mo>\n<mn>0<\/mn>\n<\/math><\/span> and vertices <span class=\"math-inline\"><math aria-label=\"V_0,\\ldots,V_5\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>,<\/mo>\n<mo>…<\/mo>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>5<\/mn>\n<\/msub>\n<\/math><\/span> in cyclic order. Indices are modulo <span class=\"math-inline\"><math aria-label=\"6\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>6<\/mn>\n<\/math><\/span> (so <span class=\"math-inline\"><math aria-label=\"V_6=V_0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mn>6<\/mn>\n<\/msub>\n<mo>=<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<\/math><\/span>). A <strong>spoke<\/strong> is <span class=\"math-inline\"><math aria-label=\"r_i=[O,V_i]\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>r<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<mi>O<\/mi>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<\/math><\/span>; its midpoint is <span class=\"math-inline\"><math aria-label=\"M_i=V_i/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>. The boundary edge <span class=\"math-inline\"><math aria-label=\"e_{i,i+1}=[V_i,V_{i+1}]\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>e<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>,<\/mo>\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<\/math><\/span> has parameterization <span class=\"math-inline\"><math aria-label=\"X_i(t)=(1-t)V_i+tV_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>X<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>t<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>t<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<mi>t<\/mi>\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"0\\le t\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>0<\/mn>\n<mo>≤<\/mo>\n<mi>t<\/mi>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<li><strong>C triangle and V triangles.<\/strong> <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> is an open unit equilateral triangle containing <span class=\"math-inline\"><math aria-label=\"O\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<\/math><\/span>; <span class=\"math-inline\"><math aria-label=\"U_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> is one containing <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>. A <strong>role<\/strong> means one of these assigned triangles. Their closures <span class=\"math-inline\"><math aria-label=\"T_C,T_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>T<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> include their sides and vertices; the open triangles do not. Coverage always uses the open triangles. A <strong>trace<\/strong> is intersection with the stated edge or spoke; the <strong>relative interior<\/strong> of an edge removes its endpoints.<\/li>\n<li><strong>Neighboring support and supplier.<\/strong> The neighboring spokes for a V triangle at <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> are <span class=\"math-inline\"><math aria-label=\"r_{i-1},r_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>r<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>r<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>. It has <strong>positive adjacent support<\/strong> if its closure meets one of those spokes in an interval of positive length. A <strong>neighboring supplier of <span class=\"math-inline\"><math aria-label=\"M_j\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>j<\/mi>\n<\/msub>\n<\/math><\/span><\/strong> is specifically a triangle <span class=\"math-inline\"><math aria-label=\"U_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<m
