,"title":"Notation and logical scopes","group":"Reference","html":"<h1>[NOTATION] Notation and logical scopes<\/h1>\n<p><a class=\"node-link\" href=\"#/MAIN\">[MAIN]<\/a> · <a class=\"node-link\" href=\"#/USE\">[USE]<\/a><\/p>\n<details class=\"local-terms\" open=\"\"><summary>Terms used here<\/summary><p>This is an index of symbols, not required prior reading. Each argument page supplies its own definitions. For ordinary-language explanations and examples, use <a class=\"node-link\" href=\"#/GLOSSARY\">GLOSSARY<\/a>. A <strong>role<\/strong> is a triangle assigned to the center or a vertex. A <strong>trace<\/strong> is its intersection with the named edge or spoke. A <strong>supplier<\/strong> must contain the named midpoint in its open triangle, not merely approach that spoke.<\/p><\/details>\n<h2>Tree<\/h2>\n<ul class=\"proof-tree\">\n<li><details open=\"\"><summary><strong>Hexagon and roles.<\/strong>\n<\/summary><ul>\n<li><span class=\"math-inline\"><math aria-label=\"H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>H<\/mi>\n<\/math><\/span>: the regular side-<span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span> hexagon; <span class=\"math-inline\"><math aria-label=\"O=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<mo>=<\/mo>\n<mn>0<\/mn>\n<\/math><\/span>: its center.<\/li>\n<li><span class=\"math-inline\"><math aria-label=\"V_i=(\\cos(i\\pi/3),\\sin(i\\pi/3))\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mi>cos<\/mi>\n<mo data-mjx-texclass=\"NONE\">⁡<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mi>i<\/mi>\n<mi>π<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>3<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<mo>,<\/mo>\n<mi>sin<\/mi>\n<mo data-mjx-texclass=\"NONE\">⁡<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mi>i<\/mi>\n<mi>π<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>3<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>; all indices are modulo <span class=\"math-inline\"><math aria-label=\"6\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>6<\/mn>\n<\/math><\/span>.<\/li>\n<li><span class=\"math-inline\"><math aria-label=\"r_i=[O,V_i]\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>r<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<mi>O<\/mi>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<\/math><\/span>; <span class=\"math-inline\"><math aria-label=\"M_i=V_i/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span> is a spoke midpoint.<\/li>\n<li><span class=\"math-inline\"><math aria-label=\"e_{i,i+1}=[V_i,V_{i+1}]\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>e<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>,<\/mo>\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<\/math><\/span>; <span class=\"math-inline\"><math aria-label=\"X_i(t)=(1-t)V_i+tV_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>X<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>t<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>t<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<mi>t<\/mi>\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>.<\/li>\n<li><span class=\"math-inline\"><math aria-label=\"U_C,U_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>U<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>: original open role triangles; <span class=\"math-inline\"><math aria-label=\"T_C,T_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>T<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>: their closures.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Actual versus selected reaches.<\/strong>\n<\/summary><ul>\n<li><span class=\"math-inline\"><math aria-label=\"A_i,B_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>: actual preceding-edge and following-edge reaches from <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>.<\/li>\n<li><span class=\"math-inline\"><math aria-label=\"C_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>C<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>: actual own-spoke reach, measured from <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> toward <span class=\"math-inline\"><math aria-label=\"O\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<\/math><\/span>.<\/li>\n<li><span class=\"math-inline\"><math aria-label=\"a_i,b_i,c_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>a<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>b<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>c<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>: selected lower demands, not automatically actual maxima.<\/li>\n<li><span class=\"math-inline\"><math aria-label=\"N_+=\\#\\{i:A_i+B_i&gt;1\\}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>N<\/mi>\n<mo>+<\/mo>\n<\/msub>\n<mo>=<\/mo>\n<mi mathvariant=\"normal\">#<\/mi>\n<mo fence=\"false\" stretchy=\"false\">{<\/mo>\n<mi>i<\/mi>\n<mo>:<\/mo>\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>&gt;<\/mo>\n<mn>1<\/mn>\n<mo fence=\"false\" stretchy=\"false\">}<\/mo>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Types and gaps.<\/strong>\n<\/summary><ul>\n<li>CE0/CE1/CE2 count positive-length center boundary traces.<\/li>\n<li>Vd0 has no positive adjacent-spoke support.<\/li>\n<li>Vd1, Vd2, and T3-like are the positive-support classes — <a class=\"node-link\" href=\"#/CLASSIFICATION\">[CLASSIFICATION]<\/a>.<\/li>\n<li><span class=\"math-inline\"><math aria-label=\"N_{\\rm sp}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>N<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi mathvariant=\"normal\">s<\/mi>\n<mi mathvariant=\"normal\">p<\/mi>\n<\/mrow>\n<\/msub>\n<\/math><\/span> counts these positive-support roles.<\/li>\n<li>A gap is a nonempty complement of the incident open V traces on one edge, including a singleton.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Midpoint-supplier routing.<\/strong>\n<\/summary><ul>\n<li><span class=\"math-inline\"><math aria-label=\"k\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>k<\/mi>\n<\/math><\/span>: unique center midpoint index in a nonzero-gap placement.<\/li>\n<li><span class=\"math-inline\"><math aria-label=\"\\sigma\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>σ<\/mi>\n<\/math><\/span>: unique supercritical index after the count reduction.<\/li>\n<li><span class=\"math-inline\"><math aria-label=\"\\tau\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>τ<\/mi>\n<\/math><\/span>: the neighboring vertex index with <span class=\"math-inline\"><math aria-label=\"M_\\sigma\\in U_\\tau\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>σ<\/mi>\n<\/msub>\n<mo>∈<\/mo>\n<msub>\n<mi>U<\/mi>\n<mi>τ<\/mi>\n<\/msub>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"\\tau=\\sigma\\pm1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>τ<\/mi>\n<mo>=<\/mo>\n<mi>σ<\/mi>\n<mo>±<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>, unique after the reduction when <span class=\"math-inline\"><math aria-label=\"\\sigma\\ne k\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>σ<\/mi>\n<mo>≠<\/mo>\n<mi>k<\/mi>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Witnesses and enclosure.<\/strong>\n<\/summary><ul>\n<li><span class=\"math-inline\"><math aria-label=\"\\widehat P_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mrow data-mjx-texclass=\"ORD\">\n<mover>\n<mi>P<\/mi>\n<mo>^<\/mo>\n<\/mover>\n<\/mrow>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>: total radial frontier including neighboring contributions — <a class=\"node-link\" href=\"#/WITNESS\">[WITNESS]<\/a>.<\/li>\n<li><span class=\"math-inline\"><math aria-label=\"\\Lambda(K)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi mathvariant=\"normal\">Λ<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>K<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>: least side length of a closed equilateral triangle containing compact <span class=\"math-inline\"><math aria-label=\"K\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>K<\/mi>\n<\/math><\/span>.<\/li>\n<li>BC, D, F: active witness families of at most five, four, and nine points.<\/li>\n<li>The letter D in a page label names a witness family; it is not a disk.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Coverage strength.<\/strong>\n<\/summary><ul>\n<li>Skeleton coverage: perimeter plus the six spokes.<\/li>\n<li>Full-hexagon coverage: every point of <span class=\"math-inline\"><math aria-label=\"H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>H<\/mi>\n<\/math><\/span>.<\/li>\n<li>N0, BC, D, and the replacement contradiction use skeleton coverage.<\/li>\n<li>F and the final area contradiction concern full-hexagon coverage.<\/li>\n<\/ul>\n<\/details><\/li>\n<\/ul>\n<hr/>\n<p><strong>Proof sources:<\/strong> <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/0XXX_main/0000_main_theorem.md\" rel=\"noopener noreferrer\" target=\"_blank\">0000<\/a> · <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/2XXX_geometric_lemmas/26XX_enclosing_triangle_tools/2610_finite_enclosure_terminal_interfaces.md\" rel=\"noopener noreferrer\" target=\"_blank\">2610<\/a> · <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/2XXX_geometric_lemmas/26XX_enclosing_triangle_tools/2612_fixed_witness_unification.md\" rel=\"noopener noreferrer\" target=\"_blank\">2612<\/a>. All source links are pinned to the same repository snapshot.<\/p>\n<p><a class=\"node-link\" href=\"#/MAIN\">[MAIN]<\/a> Return to the main tree.<\/p>\n"},"PERIMETER":{"id":"PERIMETER","file":"PERIMETER.md","title":"The Vd2 supplier cannot cover enough boundary","group":"Proof trees","html":"<h1>[PERIMETER] The Vd2 supplier cannot cover enough boundary<\/h1>\n<p><a class=\"node-link\" href=\"#/MAIN\">[MAIN]<\/a> · <a class=\"node-link\" href=\"#/SUPPLIER\">[SUPPLIER]<\/a> · <a class=\"node-link\" href=\"#/NOTATION\">[NOTATION]<\/a> · <a class=\"node-link\" href=\"#/USE\">[USE]<\/a> · <a class=\"node-link\" href=\"#/GLOSSARY\">[GLOSSARY]<\/a><\/p>\n<details class=\"local-terms\" open=\"\"><summary>Terms used here<\/summary><ul class=\"proof-tree\">\n<li><strong>Geometry and triangles.<\/strong> <span class=\"math-inline\"><math aria-label=\"H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>H<\/mi>\n<\/math><\/span> is the closed regular hexagon of side <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span>, with center <span class=\"math-inline\"><math aria-label=\"O=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<mo>=<\/mo>\n<mn>0<\/mn>\n<\/math><\/span> and vertices <span class=\"math-inline\"><math aria-label=\"V_0,\\ldots,V_5\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>,<\/mo>\n<mo>…<\/mo>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>5<\/mn>\n<\/msub>\n<\/math><\/span> in cyclic order. Indices are modulo <span class=\"math-inline\"><math aria-label=\"6\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>6<\/mn>\n<\/math><\/span> (so <span class=\"math-inline\"><math aria-label=\"V_6=V_0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mn>6<\/mn>\n<\/msub>\n<mo>=<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<\/math><\/span>). A <strong>spoke<\/strong> is <span class=\"math-inline\"><math aria-label=\"r_i=[O,V_i]\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>r<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<mi>O<\/mi>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<\/math><\/span>; its midpoint is <span class=\"math-inline\"><math aria-label=\"M_i=V_i/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>. The boundary edge <span class=\"math-inline\"><math aria-label=\"e_{i,i+1}=[V_i,V_{i+1}]\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>e<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>,<\/mo>\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<\/math><\/span> has parameterization <span class=\"math-inline\"><math aria-label=\"X_i(t)=(1-t)V_i+tV_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>X<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>t<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>t<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<mi>t<\/mi>\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"0\\le t\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>0<\/mn>\n<mo>≤<\/mo>\n<mi>t<\/mi>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<li><strong>C triangle and V triangles.<\/strong> <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> is an open unit equilateral triangle containing <span class=\"math-inline\"><math aria-label=\"O\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<\/math><\/span>; <span class=\"math-inline\"><math aria-label=\"U_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> is one containing <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>. A <strong>role<\/strong> means one of these assigned triangles. Their closures <span class=\"math-inline\"><math aria-label=\"T_C,T_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>T<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> include their sides and vertices; the open triangles do not. Coverage always uses the open triangles. A <strong>trace<\/strong> is intersection with the stated edge or spoke; the <strong>relative interior<\/strong> of an edge removes its endpoints.<\/li>\n<li><strong>Reaches and criticality.<\/strong> <span class=\"math-inline\"><math aria-label=\"A_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"B_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> are the actual lengths reached by <span class=\"math-inline\"><math aria-label=\"T_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> from <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> toward <span class=\"math-inline\"><math aria-label=\"V_{i-1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"V_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>, respectively. <span class=\"math-inline\"><math aria-label=\"C_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>C<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> is its actual distance along its own spoke from <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> toward <span class=\"math-inline\"><math aria-label=\"O\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<\/math><\/span>. <strong>Supercritical<\/strong> means <span class=\"math-inline\"><math aria-label=\"A_i+B_i&gt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>&gt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>; <strong>nonsupercritical<\/strong> means <span class=\"math-inline\"><math aria-label=\"A_i+B_i\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>. <span class=\"math-inline\"><math aria-label=\"N_+\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>N<\/mi>\n<mo>+<\/mo>\n<\/msub>\n<\/math><\/span> counts supercritical V triangles. Lowercase <span class=\"math-inline\"><math aria-label=\"a_i,b_i,c_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>a<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>b<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>c<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> are selected lower bounds, not necessarily these maxima.<\/li>\n<li><strong>Gaps and skeleton.<\/strong> A <strong>boundary gap<\/strong> is a nonempty part of an edge missed by all six open V triangles. On <span class=\"math-inline\"><math aria-label=\"e_{i,i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>e<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>,<\/mo>\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span> it is <span class=\"math-inline\"><math aria-label=\"X_i([B_i,1-A_{i+1}])\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>X<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<msub>\n<mi>A<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> when <span class=\"math-inline\"><math aria-label=\"B_i+A_{i+1}\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>A<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>; equality leaves one missing point. The <strong>skeleton<\/strong> is <span class=\"math-inline\"><math aria-label=\"S=\\partial H\\cup\\bigcup_i r_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>S<\/mi>\n<mo>=<\/mo>\n<mi>∂<\/mi>\n<mi>H<\/mi>\n<mo>∪<\/mo>\n<munder>\n<mo data-mjx-texclass=\"OP\">⋃<\/mo>\n<mi>i<\/mi>\n<\/munder>\n<msub>\n<mi>r<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>, of length <span class=\"math-inline\"><math aria-label=\"12\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>12<\/mn>\n<\/math><\/span>. Skeleton coverage need not cover points between the spokes.<\/li>\n<li><strong>Neighboring support and supplier.<\/strong> The neighboring spokes for a V triangle at <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> are <span class=\"math-inline\"><math aria-label=\"r_{i-1},r_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>r<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>r<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>. It has <strong>positive adjacent support<\/strong> if its closure meets one of those spokes in an interval of positive length. A <strong>neighboring supplier of <span class=\"math-inline\"><math aria-label=\"M_j\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>j<\/mi>\n<\/msub>\n<\/math><\/span><\/strong> is specifically a triangle <span class=\"math-inline\"><math aria-label=\"U_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> with <span class=\"math-inline\"><math aria-label=\"i=j-1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>i<\/mi>\n<mo>=<\/mo>\n<mi>j<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<\/math><\/span> or <span class=\"math-inline\"><math aria-label=\"j+1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>j<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"M_j\\in U_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>j<\/mi>\n<\/msub>\n<mo>∈<\/mo>\n<msub>\n<mi>U<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>. “Rescuer” means the same thing here. Supplying a midpoint implies positive support by openness; positive support alone does not imply supplying that midpoint. <span class=\"math-inline\"><math aria-label=\"N_{\\rm sp}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>N<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi mathvariant=\"normal\">s<\/mi>\n<mi mathvariant=\"normal\">p<\/mi>\n<\/mrow>\n<\/msub>\n<\/math><\/span> counts V triangles having positive adjacent support.<\/li>\n<li><strong>Type labels.<\/strong> CE0, CE1, CE2 count the boundary edges met by <span class=\"math-inline\"><math aria-label=\"T_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> in positive length; they do not count gaps. For a V triangle let <span class=\"math-inline\"><math aria-label=\"o\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>o<\/mi>\n<\/math><\/span> count its vertices outside <span class=\"math-inline\"><math aria-label=\"H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>H<\/mi>\n<\/math><\/span>, and <span class=\"math-inline\"><math aria-label=\"n\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>n<\/mi>\n<\/math><\/span> its neighboring spokes met in positive length. Vd0 means <span class=\"math-inline\"><math aria-label=\"n=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>n<\/mi>\n<mo>=<\/mo>\n<mn>0<\/mn>\n<\/math><\/span>; Vd1 means <span class=\"math-inline\"><math aria-label=\"(o,n)=(1,1)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<mi>o<\/mi>\n<mo>,<\/mo>\n<mi>n<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>; Vd2 means <span class=\"math-inline\"><math aria-label=\"(1,2)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>,<\/mo>\n<mn>2<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>; T3-like means <span class=\"math-inline\"><math aria-label=\"(2,1)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<mn>2<\/mn>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>. The names are labels, not additional assumptions.<\/li>\n<li><strong>Perimeter contribution.<\/strong> This is the length of a closed triangle's intersection with <span class=\"math-inline\"><math aria-label=\"\\partial H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>∂<\/mi>\n<mi>H<\/mi>\n<\/math><\/span>, the boundary of <span class=\"math-inline\"><math aria-label=\"H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>H<\/mi>\n<\/math><\/span>. A <strong>cap<\/strong> is an upper bound for that length. The hexagon perimeter is <span class=\"math-inline\"><math aria-label=\"6\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>6<\/mn>\n<\/math><\/span>. Adding triangle contributions can overcount overlap, so a total below <span class=\"math-inline\"><math aria-label=\"6\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>6<\/mn>\n<\/math><\/span> rules out a cover.<\/li>\n<\/ul><\/details>\n<p><strong>Input:<\/strong> a nonzero-gap placement with exactly one supercritical role and a Vd2 role that covers a neighboring midpoint.<\/p>\n<h2>Tree<\/h2>\n<ul class=\"proof-tree\">\n<li><details open=\"\"><summary><strong>Use the neighboring-midpoint cap.<\/strong>\n<\/summary><ul>\n<li>A Vd2 role containing that midpoint contributes boundary length strictly below <span class=\"math-inline\"><math aria-label=\"1/3\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>3<\/mn>\n<\/math><\/span>.<\/li>\n<li><strong>CALCULATION LEAF:<\/strong> the local rescue-dependent cap — <a class=\"node-link\" href=\"#/BOUNDS\">[BOUNDS]<\/a>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Bound all other boundary contributions.<\/strong>\n<\/summary><ul>\n<li>The CE1/CE2 center contributes less than <span class=\"math-inline\"><math aria-label=\"1/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>.<\/li>\n<li>The unique supercritical role contributes at most <span class=\"math-inline\"><math aria-label=\"2/\\sqrt3\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>2<\/mn>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<msqrt>\n<mn>3<\/mn>\n<\/msqrt>\n<\/math><\/span>.<\/li>\n<li>The other four nonsupercritical vertex roles contribute at most <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span> each.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Sum.<\/strong>\n<\/summary><ul>\n<li>Total boundary capacity is below <span class=\"math-inline\"><math aria-label=\"1/2+1/3+2/\\sqrt3+4\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>3<\/mn>\n<mo>+<\/mo>\n<mn>2<\/mn>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<msqrt>\n<mn>3<\/mn>\n<\/msqrt>\n<mo>+<\/mo>\n<mn>4<\/mn>\n<\/math><\/span>.<\/li>\n<li>This is less than <span class=\"math-inline\"><math aria-label=\"6\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>6<\/mn>\n<\/math><\/span>, since <span class=\"math-inline\"><math aria-label=\"12&lt;7\\sqrt3\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>12<\/mn>\n<mo>&lt;<\/mo>\n<mn>7<\/mn>\n<msqrt>\n<mn>3<\/mn>\n<\/msqrt>\n<\/math><\/span>.<\/li>\n<li>But the hexagon perimeter has length <span class=\"math-inline\"><math aria-label=\"6\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>6<\/mn>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Contradiction.<\/strong>\n<\/summary><ul>\n<li>This is a length obstruction, not a finite-witness construction.<\/li>\n<\/ul>\n<\/details><\/li>\n<\/ul>\n<hr/>\n<p><strong>Proof sources:<\/strong> <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/2XXX_geometric_lemmas/25XX_length_bounds/2531_length_budget_corollaries.md\" rel=\"noopener noreferrer\" target=\"_blank\">2531<\/a> · <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/2XXX_geometric_lemmas/25XX_length_bounds/2500_boundary_length_bounds.md\" rel=\"noopener noreferrer\" target=\"_blank\">2500<\/a>. All source links are pinned to the same repository snapshot.<\/p>\n<p><a class=\"node-link\" href=\"#/MAIN\">[MAIN]<\/a> Return to the main tree.<\/p>\n"},"MAIN":{"id":"MAIN","file":"README.md","title":"Seven triangles cannot cover the hexagon","group":"Proof trees","html":"<h1>[MAIN] Seven triangles cannot cover the hexagon<\/h1>\n<p><a class=\"node-link\" href=\"#/NOTATION\">[NOTATION]<\/a> · <a class=\"node-link\" href=\"#/USE\">[USE]<\/a> · <a class=\"node-link\" href=\"#/GLOSSARY\">[GLOSSARY]<\/a><\/p>\n<details class=\"local-terms\" open=\"\"><summary>Terms used here<\/summary><ul class=\"proof-tree\">\n<li><strong>Geometry and triangles.<\/strong> <span class=\"math-inline\"><math aria-label=\"H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>H<\/mi>\n<\/math><\/span> is the closed regular hexagon of side <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span>, with center <span class=\"math-inline\"><math aria-label=\"O=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<mo>=<\/mo>\n<mn>0<\/mn>\n<\/math><\/span> and vertices <span class=\"math-inline\"><math aria-label=\"V_0,\\ldots,V_5\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>,<\/mo>\n<mo>…<\/mo>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>5<\/mn>\n<\/msub>\n<\/math><\/span> in cyclic order. Indices are modulo <span class=\"math-inline\"><math aria-label=\"6\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>6<\/mn>\n<\/math><\/span> (so <span class=\"math-inline\"><math aria-label=\"V_6=V_0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mn>6<\/mn>\n<\/msub>\n<mo>=<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<\/math><\/span>). A <strong>spoke<\/strong> is <span class=\"math-inline\"><math aria-label=\"r_i=[O,V_i]\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>r<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<mi>O<\/mi>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<\/math><\/span>; its midpoint is <span class=\"math-inline\"><math aria-label=\"M_i=V_i/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>. The boundary edge <span class=\"math-inline\"><math aria-label=\"e_{i,i+1}=[V_i,V_{i+1}]\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>e<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>,<\/mo>\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<\/math><\/span> has parameterization <span class=\"math-inline\"><math aria-label=\"X_i(t)=(1-t)V_i+tV_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>X<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>t<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>t<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<mi>t<\/mi>\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"0\\le t\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>0<\/mn>\n<mo>≤<\/mo>\n<mi>t<\/mi>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<li><strong>C triangle and V triangles.<\/strong> <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> is an open unit equilateral triangle containing <span class=\"math-inline\"><math aria-label=\"O\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<\/math><\/span>; <span class=\"math-inline\"><math aria-label=\"U_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> is one containing <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>. A <strong>role<\/strong> means one of these assigned triangles. Their closures <span class=\"math-inline\"><math aria-label=\"T_C,T_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>T<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> include their sides and vertices; the open triangles do not. Coverage always uses the open triangles. A <strong>trace<\/strong> is intersection with the stated edge or spoke; the <strong>relative interior<\/strong> of an edge removes its endpoints.<\/li>\n<li><strong>Reaches and criticality.<\/strong> <span class=\"math-inline\"><math aria-label=\"A_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"B_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> are the actual lengths reached by <span class=\"math-inline\"><math aria-label=\"T_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> from <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> toward <span class=\"math-inline\"><math aria-label=\"V_{i-1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"V_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>, respectively. <span class=\"math-inline\"><math aria-label=\"C_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>C<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> is its actual distance along its own spoke from <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> toward <span class=\"math-inline\"><math aria-label=\"O\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<\/math><\/span>. <strong>Supercritical<\/strong> means <span class=\"math-inline\"><math aria-label=\"A_i+B_i&gt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>&gt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>; <strong>nonsupercritical<\/strong> means <span class=\"math-inline\"><math aria-label=\"A_i+B_i\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>. <span class=\"math-inline\"><math aria-label=\"N_+\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>N<\/mi>\n<mo>+<\/mo>\n<\/msub>\n<\/math><\/span> counts supercritical V triangles. Lowercase <span class=\"math-inline\"><math aria-label=\"a_i,b_i,c_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>a<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>b<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>c<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> are selected lower bounds, not necessarily these maxima.<\/li>\n<li><strong>Gaps and skeleton.<\/strong> A <strong>boundary gap<\/strong> is a nonempty part of an edge missed by all six open V triangles. On <span class=\"math-inline\"><math aria-label=\"e_{i,i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>e<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>,<\/mo>\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span> it is <span class=\"math-inline\"><math aria-label=\"X_i([B_i,1-A_{i+1}])\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>X<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<msub>\n<mi>A<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> when <span class=\"math-inline\"><math aria-label=\"B_i+A_{i+1}\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>A<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>; equality leaves one missing point. The <strong>skeleton<\/strong> is <span class=\"math-inline\"><math aria-label=\"S=\\partial H\\cup\\bigcup_i r_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>S<\/mi>\n<mo>=<\/mo>\n<mi>∂<\/mi>\n<mi>H<\/mi>\n<mo>∪<\/mo>\n<munder>\n<mo data-mjx-texclass=\"OP\">⋃<\/mo>\n<mi>i<\/mi>\n<\/munder>\n<msub>\n<mi>r<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>, of length <span class=\"math-inline\"><math aria-label=\"12\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>12<\/mn>\n<\/math><\/span>. Skeleton coverage need not cover points between the spokes.<\/li>\n<li><strong>Neighboring support and supplier.<\/strong> The neighboring spokes for a V triangle at <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> are <span class=\"math-inline\"><math aria-label=\"r_{i-1},r_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>r<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>r<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>. It has <strong>positive adjacent support<\/strong> if its closure meets one of those spokes in an interval of positive length. A <strong>neighboring supplier of <span class=\"math-inline\"><math aria-label=\"M_j\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>j<\/mi>\n<\/msub>\n<\/math><\/span><\/strong> is specifically a triangle <span class=\"math-inline\"><math aria-label=\"U_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> with <span class=\"math-inline\"><math aria-label=\"i=j-1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>i<\/mi>\n<mo>=<\/mo>\n<mi>j<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<\/math><\/span> or <span class=\"math-inline\"><math aria-label=\"j+1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>j<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"M_j\\in U_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>j<\/mi>\n<\/msub>\n<mo>∈<\/mo>\n<msub>\n<mi>U<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>. “Rescuer” means the same thing here. Supplying a midpoint implies positive support by openness; positive support alone does not imply supplying that midpoint. <span class=\"math-inline\"><math aria-label=\"N_{\\rm sp}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>N<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi mathvariant=\"normal\">s<\/mi>\n<mi mathvariant=\"normal\">p<\/mi>\n<\/mrow>\n<\/msub>\n<\/math><\/span> counts V triangles having positive adjacent support.<\/li>\n<li><strong>Type labels.<\/strong> CE0, CE1, CE2 count the boundary edges met by <span class=\"math-inline\"><math aria-label=\"T_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> in positive length; they do not count gaps. For a V triangle let <span class=\"math-inline\"><math aria-label=\"o\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>o<\/mi>\n<\/math><\/span> count its vertices outside <span class=\"math-inline\"><math aria-label=\"H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>H<\/mi>\n<\/math><\/span>, and <span class=\"math-inline\"><math aria-label=\"n\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>n<\/mi>\n<\/math><\/span> its neighboring spokes met in positive length. Vd0 means <span class=\"math-inline\"><math aria-label=\"n=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>n<\/mi>\n<mo>=<\/mo>\n<mn>0<\/mn>\n<\/math><\/span>; Vd1 means <span class=\"math-inline\"><math aria-label=\"(o,n)=(1,1)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<mi>o<\/mi>\n<mo>,<\/mo>\n<mi>n<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>; Vd2 means <span class=\"math-inline\"><math aria-label=\"(1,2)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>,<\/mo>\n<mn>2<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>; T3-like means <span class=\"math-inline\"><math aria-label=\"(2,1)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<mn>2<\/mn>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>. The names are labels, not additional assumptions.<\/li>\n<li><strong>Indices used in the case split.<\/strong> <span class=\"math-inline\"><math aria-label=\"k\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>k<\/mi>\n<\/math><\/span> is the index of the unique midpoint <span class=\"math-inline\"><math aria-label=\"M_k\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>k<\/mi>\n<\/msub>\n<\/math><\/span> contained by <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> when a gap exists. After the count reduction, <span class=\"math-inline\"><math aria-label=\"\\sigma\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>σ<\/mi>\n<\/math><\/span> is the unique supercritical index. When <span class=\"math-inline\"><math aria-label=\"\\sigma\\ne k\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>σ<\/mi>\n<mo>≠<\/mo>\n<mi>k<\/mi>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"\\tau\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>τ<\/mi>\n<\/math><\/span> names the unique neighboring supplier, so <span class=\"math-inline\"><math aria-label=\"\\tau\\in\\{\\sigma-1,\\sigma+1\\}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>τ<\/mi>\n<mo>∈<\/mo>\n<mo fence=\"false\" stretchy=\"false\">{<\/mo>\n<mi>σ<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<mo>,<\/mo>\n<mi>σ<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<mo fence=\"false\" stretchy=\"false\">}<\/mo>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"M_\\sigma\\in U_\\tau\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>σ<\/mi>\n<\/msub>\n<mo>∈<\/mo>\n<msub>\n<mi>U<\/mi>\n<mi>τ<\/mi>\n<\/msub>\n<\/math><\/span>. “At <span class=\"math-inline\"><math aria-label=\"k\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>k<\/mi>\n<\/math><\/span>” means based at vertex <span class=\"math-inline\"><math aria-label=\"V_k\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>k<\/mi>\n<\/msub>\n<\/math><\/span>, not physically located at midpoint <span class=\"math-inline\"><math aria-label=\"M_k\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>k<\/mi>\n<\/msub>\n<\/math><\/span>.<\/li>\n<li><strong>Page names.<\/strong> BC, D, and F are historical labels for contradictions using at most five, four, and nine fixed points. N0 is the theorem excluding <span class=\"math-inline\"><math aria-label=\"N_+=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>N<\/mi>\n<mo>+<\/mo>\n<\/msub>\n<mo>=<\/mo>\n<mn>0<\/mn>\n<\/math><\/span>, not a new numerical variable. A <strong>calculation leaf<\/strong> states an exact lemma's inputs and output, while leaving its long derivation in the linked numbered proof source.<\/li>\n<\/ul><\/details>\n<p>New to the proof? <a class=\"node-link\" href=\"#/START\">START<\/a> explains the problem and vocabulary without assuming the role names. Every argument page repeats its local setup.<\/p>\n<p><strong>Claim.<\/strong> Seven open equilateral triangles of side <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span> cannot cover the regular hexagon of side <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span>.<\/p>\n<p><a class=\"node-link\" href=\"#/START\">START<\/a> · <a class=\"node-link\" href=\"#/GLOSSARY\">GLOSSARY<\/a><\/p>\n<p><strong>Click a bracketed label to open its tree.<\/strong> Midpoint proofs are expanded. A <strong>CALCULATION LEAF<\/strong> marks the point where the oral explanation stops; its linked page identifies the exact written calculation. Read <a class=\"node-link\" href=\"#/USE\">[USE]<\/a> for the offline browser view.<\/p>\n<h2>Tree<\/h2>\n<ul class=\"proof-tree\">\n<li><details open=\"\"><summary><strong>Assume a cover exists.<\/strong>\n<\/summary><ul>\n<li><details open=\"\"><summary><strong>1. Identify the roles and the local geometry<\/strong> — <a class=\"node-link\" href=\"#/SETUP\">[SETUP]<\/a>.\n<\/summary><ul>\n<li>The center and six vertices occupy seven distinct open triangles.<\/li>\n<li>Classify boundary traces and neighboring-spoke support — <a class=\"node-link\" href=\"#/CLASSIFICATION\">[CLASSIFICATION]<\/a>.<\/li>\n<li>Prove the midpoint containment and exclusion facts — <a class=\"node-link\" href=\"#/MIDPOINTS\">[MIDPOINTS]<\/a>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>2. Establish N0: a skeleton cover must have <span class=\"math-inline\"><math aria-label=\"N_+\\ge1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>N<\/mi>\n<mo>+<\/mo>\n<\/msub>\n<mo>≥<\/mo>\n<mn>1<\/mn>\n<\/math><\/span><\/strong> — <a class=\"node-link\" href=\"#/N0\">[N0]<\/a>.\n<\/summary><ul>\n<li>With no gaps: sum the strict boundary overlaps.<\/li>\n<li>With a gap: use the center-aligned five-point obstruction <a class=\"node-link\" href=\"#/BC\">[BC]<\/a>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>3. Split by boundary gaps.<\/strong>\n<\/summary><ul>\n<li><details open=\"\"><summary><strong>No boundary gaps.<\/strong>\n<\/summary><ul>\n<li><span class=\"math-inline\"><math aria-label=\"N_+=1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>N<\/mi>\n<mo>+<\/mo>\n<\/msub>\n<mo>=<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>: force the nine-point obstruction <a class=\"node-link\" href=\"#/F\">[F]<\/a>.<\/li>\n<li><span class=\"math-inline\"><math aria-label=\"N_+\\ge2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>N<\/mi>\n<mo>+<\/mo>\n<\/msub>\n<mo>≥<\/mo>\n<mn>2<\/mn>\n<\/math><\/span>: force excessive exterior area — <a class=\"node-link\" href=\"#/AREA\">[AREA]<\/a>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>At least one boundary gap.<\/strong>\n<\/summary><ul>\n<li>The center contains exactly one spoke midpoint <span class=\"math-inline\"><math aria-label=\"M_k\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>k<\/mi>\n<\/msub>\n<\/math><\/span> — <a class=\"node-link\" href=\"#/C-MIDPOINT\">[C-MIDPOINT]<\/a>.<\/li>\n<li>The skeleton budget gives <span class=\"math-inline\"><math aria-label=\"N_++N_{\\rm sp}\\le2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>N<\/mi>\n<mo>+<\/mo>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>N<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi mathvariant=\"normal\">s<\/mi>\n<mi mathvariant=\"normal\">p<\/mi>\n<\/mrow>\n<\/msub>\n<mo>≤<\/mo>\n<mn>2<\/mn>\n<\/math><\/span> — <a class=\"node-link\" href=\"#/LENGTH\">[LENGTH]<\/a>.<\/li>\n<li><details open=\"\"><summary>A second supercritical role would require a neighboring V triangle to contain its missed midpoint.\n<\/summary><ul>\n<li>Therefore <span class=\"math-inline\"><math aria-label=\"N_+=1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>N<\/mi>\n<mo>+<\/mo>\n<\/msub>\n<mo>=<\/mo>\n<mn>1<\/mn>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"N_{\\rm sp}\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>N<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi mathvariant=\"normal\">s<\/mi>\n<mi mathvariant=\"normal\">p<\/mi>\n<\/mrow>\n<\/msub>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span> — <a class=\"node-link\" href=\"#/SUPPLIER\">[SUPPLIER]<\/a>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary>Let <span class=\"math-inline\"><math aria-label=\"\\sigma\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>σ<\/mi>\n<\/math><\/span> be the unique supercritical index.\n<\/summary><ul>\n<li><strong><span class=\"math-inline\"><math aria-label=\"\\sigma=k\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>σ<\/mi>\n<mo>=<\/mo>\n<mi>k<\/mi>\n<\/math><\/span>:<\/strong> apply <a class=\"node-link\" href=\"#/BC\">[BC]<\/a>.<\/li>\n<li><details open=\"\"><summary><strong><span class=\"math-inline\"><math aria-label=\"\\sigma\\ne k\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>σ<\/mi>\n<mo>≠<\/mo>\n<mi>k<\/mi>\n<\/math><\/span>:<\/strong> <span class=\"math-inline\"><math aria-label=\"M_\\sigma\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>σ<\/mi>\n<\/msub>\n<\/math><\/span> lies in exactly one neighboring open V triangle <span class=\"math-inline\"><math aria-label=\"U_\\tau\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>τ<\/mi>\n<\/msub>\n<\/math><\/span> (its supplier) — <a class=\"node-link\" href=\"#/SUPPLIER\">[SUPPLIER]<\/a>.\n<\/summary><ul>\n<li><strong>T3-like supplier:<\/strong> its own midpoint exclusion forces <span class=\"math-inline\"><math aria-label=\"\\tau=k\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>τ<\/mi>\n<mo>=<\/mo>\n<mi>k<\/mi>\n<\/math><\/span>; apply <a class=\"node-link\" href=\"#/D\">[D]<\/a>.<\/li>\n<li><strong>Vd1 supplier at <span class=\"math-inline\"><math aria-label=\"k\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>k<\/mi>\n<\/math><\/span>:<\/strong> apply <a class=\"node-link\" href=\"#/D\">[D]<\/a>.<\/li>\n<li><strong>Vd1 supplier away from <span class=\"math-inline\"><math aria-label=\"k\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>k<\/mi>\n<\/math><\/span>:<\/strong> preserve the skeleton by <a class=\"node-link\" href=\"#/REPLACEMENT\">[REPLACEMENT]<\/a>, then contradict <a class=\"node-link\" href=\"#/N0\">[N0]<\/a>.<\/li>\n<li><strong>Vd2 supplier:<\/strong> its midpoint-rescue perimeter cap gives <a class=\"node-link\" href=\"#/PERIMETER\">[PERIMETER]<\/a>.<\/li>\n<\/ul>\n<\/details><\/li>\n<\/ul>\n<\/details><\/li>\n<\/ul>\n<\/details><\/li>\n<\/ul>\n<\/details><\/li>\n<li><strong>Every possible cover leads to a contradiction.<\/strong><\/li>\n<\/ul>\n<\/details><\/li>\n<\/ul>\n<h2>Shared tools<\/h2>\n<ul class=\"proof-tree\">\n<li><a class=\"node-link\" href=\"#/WITNESS\">[WITNESS]<\/a> explains the common fixed-point enclosure contradiction behind BC, D, and F.<\/li>\n<li><a class=\"node-link\" href=\"#/CALIPERS\">[CALIPERS]<\/a> explains why only finitely many enclosing-triangle contacts need consideration.<\/li>\n<\/ul>\n<h2>Scope<\/h2>\n<p>This is a linked presentation of the repository's proof, not a new proof or an independent verification of all calculation leaves. The presentation follows repository snapshot <code>f7fe2f89cde04903cba8ba347bd0645abee9b905<\/code>, checked on <strong>2026-09-22<\/strong>. This directory is the presentation layer; numbered proof sources remain the mathematical authority.<\/p>\n<hr/>\n<p><strong>Proof sources:<\/strong> <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/0XXX_main/0000_main_theorem.md\" rel=\"noopener noreferrer\" target=\"_blank\">0000<\/a> · <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/0XXX_main/0003_reusable_lemma_catalog.md\" rel=\"noopener noreferrer\" target=\"_blank\">0003<\/a> · <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/2XXX_geometric_lemmas/26XX_enclosing_triangle_tools/2613_midpoint_supplier_reduction.md\" rel=\"noopener noreferrer\" target=\"_blank\">2613<\/a>. All source links are pinned to the same repository snapshot.<\/p>\n<h2>BC/D terminal revision<\/h2>\n<p><a class=\"node-link\" href=\"#/BC\">BC<\/a> now uses at most five forced points and the nonuniform capacity envelope. <a class=\"node-link\" href=\"#/D\">D<\/a> uses a ratio-only four-point caliper lemma. The original midpoint/supplier classification remains; no terminal candidate center normal form or CE1 return is required.<\/p>\n"},"REPLACEMENT":{"id":"REPLACEMENT","file":"REPLACEMENT.md","title":"Remove the supercritical role while preserving the skeleton","group":"Proof trees","html":"<h1>[REPLACEMENT] Remove the supercritical role while preserving the skeleton<\/h1>\n<p><a class=\"node-link\" href=\"#/MAIN\">[MAIN]<\/a> · <a class=\"node-link\" href=\"#/SUPPLIER\">[SUPPLIER]<\/a> · <a class=\"node-link\" href=\"#/NOTATION\">[NOTATION]<\/a> · <a class=\"node-link\" href=\"#/USE\">[USE]<\/a> · <a class=\"node-link\" href=\"#/GLOSSARY\">[GLOSSARY]<\/a><\/p>\n<details class=\"local-terms\" open=\"\"><summary>Terms used here<\/summary><ul class=\"proof-tree\">\n<li><strong>Geometry and triangles.<\/strong> <span class=\"math-inline\"><math aria-label=\"H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>H<\/mi>\n<\/math><\/span> is the closed regular hexagon of side <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span>, with center <span class=\"math-inline\"><math aria-label=\"O=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<mo>=<\/mo>\n<mn>0<\/mn>\n<\/math><\/span> and vertices <span class=\"math-inline\"><math aria-label=\"V_0,\\ldots,V_5\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>,<\/mo>\n<mo>…<\/mo>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>5<\/mn>\n<\/msub>\n<\/math><\/span> in cyclic order. Indices are modulo <span class=\"math-inline\"><math aria-label=\"6\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>6<\/mn>\n<\/math><\/span> (so <span class=\"math-inline\"><math aria-label=\"V_6=V_0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mn>6<\/mn>\n<\/msub>\n<mo>=<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<\/math><\/span>). A <strong>spoke<\/strong> is <span class=\"math-inline\"><math aria-label=\"r_i=[O,V_i]\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>r<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<mi>O<\/mi>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<\/math><\/span>; its midpoint is <span class=\"math-inline\"><math aria-label=\"M_i=V_i/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>. The boundary edge <span class=\"math-inline\"><math aria-label=\"e_{i,i+1}=[V_i,V_{i+1}]\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>e<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>,<\/mo>\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<\/math><\/span> has parameterization <span class=\"math-inline\"><math aria-label=\"X_i(t)=(1-t)V_i+tV_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>X<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>t<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>t<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<mi>t<\/mi>\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"0\\le t\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>0<\/mn>\n<mo>≤<\/mo>\n<mi>t<\/mi>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<li><strong>C triangle and V triangles.<\/strong> <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> is an open unit equilateral triangle containing <span class=\"math-inline\"><math aria-label=\"O\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<\/math><\/span>; <span class=\"math-inline\"><math aria-label=\"U_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> is one containing <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>. A <strong>role<\/strong> means one of these assigned triangles. Their closures <span class=\"math-inline\"><math aria-label=\"T_C,T_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>T<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> include their sides and vertices; the open triangles do not. Coverage always uses the open triangles. A <strong>trace<\/strong> is intersection with the stated edge or spoke; the <strong>relative interior<\/strong> of an edge removes its endpoints.<\/li>\n<li><strong>Reaches and criticality.<\/strong> <span class=\"math-inline\"><math aria-label=\"A_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"B_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> are the actual lengths reached by <span class=\"math-inline\"><math aria-label=\"T_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> from <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> toward <span class=\"math-inline\"><math aria-label=\"V_{i-1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"V_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>, respectively. <span class=\"math-inline\"><math aria-label=\"C_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>C<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> is its actual distance along its own spoke from <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> toward <span class=\"math-inline\"><math aria-label=\"O\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<\/math><\/span>. <strong>Supercritical<\/strong> means <span class=\"math-inline\"><math aria-label=\"A_i+B_i&gt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>&gt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>; <strong>nonsupercritical<\/strong> means <span class=\"math-inline\"><math aria-label=\"A_i+B_i\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>. <span class=\"math-inline\"><math aria-label=\"N_+\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>N<\/mi>\n<mo>+<\/mo>\n<\/msub>\n<\/math><\/span> counts supercritical V triangles. Lowercase <span class=\"math-inline\"><math aria-label=\"a_i,b_i,c_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>a<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>b<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>c<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> are selected lower bounds, not necessarily these maxima.<\/li>\n<li><strong>Gaps and skeleton.<\/strong> A <strong>boundary gap<\/strong> is a nonempty part of an edge missed by all six open V triangles. On <span class=\"math-inline\"><math aria-label=\"e_{i,i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>e<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>,<\/mo>\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span> it is <span class=\"math-inline\"><math aria-label=\"X_i([B_i,1-A_{i+1}])\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>X<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<msub>\n<mi>A<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> when <span class=\"math-inline\"><math aria-label=\"B_i+A_{i+1}\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>A<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>; equality leaves one missing point. The <strong>skeleton<\/strong> is <span class=\"math-inline\"><math aria-label=\"S=\\partial H\\cup\\bigcup_i r_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>S<\/mi>\n<mo>=<\/mo>\n<mi>∂<\/mi>\n<mi>H<\/mi>\n<mo>∪<\/mo>\n<munder>\n<mo data-mjx-texclass=\"OP\">⋃<\/mo>\n<mi>i<\/mi>\n<\/munder>\n<msub>\n<mi>r<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>, of length <span class=\"math-inline\"><math aria-label=\"12\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>12<\/mn>\n<\/math><\/span>. Skeleton coverage need not cover points between the spokes.<\/li>\n<li><strong>Neighboring support and supplier.<\/strong> The neighboring spokes for a V triangle at <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> are <span class=\"math-inline\"><math aria-label=\"r_{i-1},r_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>r<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>r<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>. It has <strong>positive adjacent support<\/strong> if its closure meets one of those spokes in an interval of positive length. A <strong>neighboring supplier of <span class=\"math-inline\"><math aria-label=\"M_j\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>j<\/mi>\n<\/msub>\n<\/math><\/span><\/strong> is specifically a triangle <span class=\"math-inline\"><math aria-label=\"U_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> with <span class=\"math-inline\"><math aria-label=\"i=j-1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>i<\/mi>\n<mo>=<\/mo>\n<mi>j<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<\/math><\/span> or <span class=\"math-inline\"><math aria-label=\"j+1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>j<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"M_j\\in U_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>j<\/mi>\n<\/msub>\n<mo>∈<\/mo>\n<msub>\n<mi>U<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>. “Rescuer” means the same thing here. Supplying a midpoint implies positive support by openness; positive support alone does not imply supplying that midpoint. <span class=\"math-inline\"><math aria-label=\"N_{\\rm sp}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>N<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi mathvariant=\"normal\">s<\/mi>\n<mi mathvariant=\"normal\">p<\/mi>\n<\/mrow>\n<\/msub>\n<\/math><\/span> counts V triangles having positive adjacent support.<\/li>\n<li><strong>Type labels.<\/strong> CE0, CE1, CE2 count the boundary edges met by <span class=\"math-inline\"><math aria-label=\"T_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> in positive length; they do not count gaps. For a V triangle let <span class=\"math-inline\"><math aria-label=\"o\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>o<\/mi>\n<\/math><\/span> count its vertices outside <span class=\"math-inline\"><math aria-label=\"H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>H<\/mi>\n<\/math><\/span>, and <span class=\"math-inline\"><math aria-label=\"n\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>n<\/mi>\n<\/math><\/span> its neighboring spokes met in positive length. Vd0 means <span class=\"math-inline\"><math aria-label=\"n=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>n<\/mi>\n<mo>=<\/mo>\n<mn>0<\/mn>\n<\/math><\/span>; Vd1 means <span class=\"math-inline\"><math aria-label=\"(o,n)=(1,1)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<mi>o<\/mi>\n<mo>,<\/mo>\n<mi>n<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>; Vd2 means <span class=\"math-inline\"><math aria-label=\"(1,2)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>,<\/mo>\n<mn>2<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>; T3-like means <span class=\"math-inline\"><math aria-label=\"(2,1)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<mn>2<\/mn>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>. The names are labels, not additional assumptions.<\/li>\n<li><strong>Indices used in the case split.<\/strong> <span class=\"math-inline\"><math aria-label=\"k\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>k<\/mi>\n<\/math><\/span> is the index of the unique midpoint <span class=\"math-inline\"><math aria-label=\"M_k\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>k<\/mi>\n<\/msub>\n<\/math><\/span> contained by <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> when a gap exists. After the count reduction, <span class=\"math-inline\"><math aria-label=\"\\sigma\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>σ<\/mi>\n<\/math><\/span> is the unique supercritical index. When <span class=\"math-inline\"><math aria-label=\"\\sigma\\ne k\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>σ<\/mi>\n<mo>≠<\/mo>\n<mi>k<\/mi>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"\\tau\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>τ<\/mi>\n<\/math><\/span> names the unique neighboring supplier, so <span class=\"math-inline\"><math aria-label=\"\\tau\\in\\{\\sigma-1,\\sigma+1\\}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>τ<\/mi>\n<mo>∈<\/mo>\n<mo fence=\"false\" stretchy=\"false\">{<\/mo>\n<mi>σ<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<mo>,<\/mo>\n<mi>σ<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<mo fence=\"false\" stretchy=\"false\">}<\/mo>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"M_\\sigma\\in U_\\tau\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>σ<\/mi>\n<\/msub>\n<mo>∈<\/mo>\n<msub>\n<mi>U<\/mi>\n<mi>τ<\/mi>\n<\/msub>\n<\/math><\/span>. “At <span class=\"math-inline\"><math aria-label=\"k\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>k<\/mi>\n<\/math><\/span>” means based at vertex <span class=\"math-inline\"><math aria-label=\"V_k\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>k<\/mi>\n<\/msub>\n<\/math><\/span>, not physically located at midpoint <span class=\"math-inline\"><math aria-label=\"M_k\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>k<\/mi>\n<\/msub>\n<\/math><\/span>.<\/li>\n<li><strong>Paths and boundary handoffs.<\/strong> A path is an ordered consecutive group of V triangles, connected by the hexagon edges between their vertices. On a gap-free connecting edge their open traces overlap: <span class=\"math-inline\"><math aria-label=\"B_i+A_{i+1}&gt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>A<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>&gt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>. A <strong>handoff<\/strong> is a point selected inside this overlap, covered by both triangles. <strong>Path monotonicity<\/strong> means the increasing <span class=\"math-inline\"><math aria-label=\"A_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> and decreasing <span class=\"math-inline\"><math aria-label=\"B_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> obtained by combining these overlaps with nonsupercriticality. An edge is <strong>center-free<\/strong> when <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> covers no point in its relative interior (the edge with its endpoints removed).<\/li>\n<li><strong>Replacement and margins.<\/strong> A replacement changes two open V triangles and keeps the C triangle and four other V triangles fixed. A strict margin is positive excess in an inequality, large enough to keep a required point inside an open triangle. A prime, as in <span class=\"math-inline\"><math aria-label=\"N_+'\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msubsup>\n<mi>N<\/mi>\n<mo>+<\/mo>\n<mo data-mjx-alternate=\"1\">′<\/mo>\n<\/msubsup>\n<\/math><\/span>, refers to the new configuration. “Gap rank” means the number of edges with gaps, not a linear-algebra rank.<\/li>\n<\/ul><\/details>\n<p><strong>Input:<\/strong> a Vd1 supplier <span class=\"math-inline\"><math aria-label=\"T_\\tau\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>τ<\/mi>\n<\/msub>\n<\/math><\/span> away from the center midpoint index <span class=\"math-inline\"><math aria-label=\"k\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>k<\/mi>\n<\/math><\/span>, adjacent to the uniquely supercritical <span class=\"math-inline\"><math aria-label=\"T_\\sigma\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>σ<\/mi>\n<\/msub>\n<\/math><\/span>. <strong>Output:<\/strong> another skeleton cover with actual <span class=\"math-inline\"><math aria-label=\"N_+'=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msubsup>\n<mi>N<\/mi>\n<mo>+<\/mo>\n<mo data-mjx-alternate=\"1\">′<\/mo>\n<\/msubsup>\n<mo>=<\/mo>\n<mn>0<\/mn>\n<\/math><\/span>.<\/p>\n<h2>Tree<\/h2>\n<ul class=\"proof-tree\">\n<li><details open=\"\"><summary><strong>Identify the center-free shared edge.<\/strong>\n<\/summary><ul>\n<li>Both <span class=\"math-inline\"><math aria-label=\"\\tau\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>τ<\/mi>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"\\sigma\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>σ<\/mi>\n<\/math><\/span> differ from <span class=\"math-inline\"><math aria-label=\"k\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>k<\/mi>\n<\/math><\/span>.<\/li>\n<li>Their shared edge is not incident with <span class=\"math-inline\"><math aria-label=\"V_k\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>k<\/mi>\n<\/msub>\n<\/math><\/span>.<\/li>\n<li>All possible center boundary traces are incident with <span class=\"math-inline\"><math aria-label=\"V_k\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>k<\/mi>\n<\/msub>\n<\/math><\/span> — <a class=\"node-link\" href=\"#/C-MIDPOINT\">[C-MIDPOINT]<\/a>.<\/li>\n<li>Hence this shared edge receives no center coverage.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Keep the center and four other vertex roles fixed.<\/strong>\n<\/summary><ul>\n<li>Only the supplier and supercritical roles are replaced.<\/li>\n<li>Use two separate local vertex charts; do not identify their coordinates.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Establish the scalar replacement inputs.<\/strong>\n<\/summary><ul>\n<li>The local geometry must give enough boundary and radial slack.<\/li>\n<li><strong>CALCULATION LEAF:<\/strong> the Vd1 adapter and scalar inequalities — <a class=\"node-link\" href=\"#/REPLACE-CALC\">[REPLACE-CALC]<\/a>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Construct two nonsupercritical open unit replacements.<\/strong>\n<\/summary><ul>\n<li>Preserve the incoming boundary reach of the first role.<\/li>\n<li>Preserve its own radial reach.<\/li>\n<li>Make the two new traces overlap strictly on their shared edge.<\/li>\n<li>Preserve the outgoing boundary reach of the second role.<\/li>\n<li>Preserve its overlap with the unchanged center on the second spoke.<\/li>\n<li><strong>CALCULATION LEAF:<\/strong> the two templates and five strict margins — <a class=\"node-link\" href=\"#/REPLACE-CALC\">[REPLACE-CALC]<\/a>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Read the output using actual reaches.<\/strong>\n<\/summary><ul>\n<li>Both replaced roles have actual boundary sum below <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span> and no positive adjacent support.<\/li>\n<li>The four unchanged roles are already nonsupercritical.<\/li>\n<li>Thus the new skeleton cover has <span class=\"math-inline\"><math aria-label=\"N_+'=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msubsup>\n<mi>N<\/mi>\n<mo>+<\/mo>\n<mo data-mjx-alternate=\"1\">′<\/mo>\n<\/msubsup>\n<mo>=<\/mo>\n<mn>0<\/mn>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Apply N0<\/strong> — <a class=\"node-link\" href=\"#/N0\">[N0]<\/a>.\n<\/summary><ul>\n<li>N0 prohibits every such skeleton cover, regardless of the output gap rank.<\/li>\n<li>Contradiction.<\/li>\n<\/ul>\n<\/details><\/li>\n<\/ul>\n<h2>What is not preserved<\/h2>\n<p>Neither full interior coverage nor the number of gap edges is claimed to be preserved. Neither is needed. This branch must end with N0, not with the full-interior nine-point theorem F.<\/p>\n<hr/>\n<p><strong>Proof sources:<\/strong> <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/2XXX_geometric_lemmas/26XX_enclosing_triangle_tools/2613_midpoint_supplier_reduction.md\" rel=\"noopener noreferrer\" target=\"_blank\">2613<\/a> · <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/2XXX_geometric_lemmas/26XX_enclosing_triangle_tools/2614_two_vertex_replacement.md\" rel=\"noopener noreferrer\" target=\"_blank\">2614<\/a> · <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/4XXX_CE1CE2/41XX_Nplus1/414X_CE2_exactly_one_Vd1_Vd2_new/4144_new_two_chart_replacement_and_router.md\" rel=\"noopener noreferrer\" target=\"_blank\">4144<\/a>. All source links are pinned to the same repository snapshot.<\/p>\n<p><a class=\"node-link\" href=\"#/MAIN\">[MAIN]<\/a> Return to the main tree.<\/p>\n"},"SELF-MIDPOINT":{"id":"SELF-MIDPOINT","file":"SELF-MIDPOINT.md","title":"A supercritical role misses its own midpoint","group":"Proof trees","html":"<h1>[SELF-MIDPOINT] A supercritical role misses its own midpoint<\/h1>\n<p><a class=\"node-link\" href=\"#/MAIN\">[MAIN]<\/a> · <a class=\"node-link\" href=\"#/MIDPOINTS\">[MIDPOINTS]<\/a> · <a class=\"node-link\" href=\"#/NOTATION\">[NOTATION]<\/a> · <a class=\"node-link\" href=\"#/USE\">[USE]<\/a> · <a class=\"node-link\" href=\"#/GLOSSARY\">[GLOSSARY]<\/a><\/p>\n<details class=\"local-terms\" open=\"\"><summary>Terms used here<\/summary><ul class=\"proof-tree\">\n<li><strong>Geometry and triangles.<\/strong> <span class=\"math-inline\"><math aria-label=\"H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>H<\/mi>\n<\/math><\/span> is the closed regular hexagon of side <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span>, with center <span class=\"math-inline\"><math aria-label=\"O=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<mo>=<\/mo>\n<mn>0<\/mn>\n<\/math><\/span> and vertices <span class=\"math-inline\"><math aria-label=\"V_0,\\ldots,V_5\" xmlns=\"http://www.w3.org/
