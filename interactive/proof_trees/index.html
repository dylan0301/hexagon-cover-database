of the convex-hull boundary; the chosen disk tangents must support the entire hull, and the connecting lines must satisfy distance bounds. These are additional hypotheses.<\/li>\n<li>Under these hypotheses, the four-contact theorem leaves <span class=\"math-inline\"><math aria-label=\"AB\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>A<\/mi>\n<mi>B<\/mi>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"BC\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>B<\/mi>\n<mi>C<\/mi>\n<\/math><\/span>, and exposed tangents through <span class=\"math-inline\"><math aria-label=\"A\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>A<\/mi>\n<\/math><\/span> or <span class=\"math-inline\"><math aria-label=\"C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>C<\/mi>\n<\/math><\/span>.<\/li>\n<li>This special four-contact list is not asserted for every arbitrary disk-plus-three-point set.<\/li>\n<li>Return to <a class=\"node-link\" href=\"#/F\">[F]<\/a>; the actual contact inequalities are in <a class=\"node-link\" href=\"#/F-CALC\">[F-CALC]<\/a>.<\/li>\n<\/ul>\n<\/details><\/li>\n<\/ul>\n<hr/>\n<p><strong>Proof sources:<\/strong> <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/2XXX_geometric_lemmas/20XX_V_triangle_geometry/2004_admissible_set.md\" rel=\"noopener noreferrer\" target=\"_blank\">2004<\/a> · <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/2XXX_geometric_lemmas/20XX_V_triangle_geometry/2005_midpoint_self_cover_lemma.md\" rel=\"noopener noreferrer\" target=\"_blank\">2005<\/a> · <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/2XXX_geometric_lemmas/26XX_enclosing_triangle_tools/2609_simplified_finite_enclosure_lemmas.md\" rel=\"noopener noreferrer\" target=\"_blank\">2609<\/a> · <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/2XXX_geometric_lemmas/26XX_enclosing_triangle_tools/2611_four_contact_disk_enclosure.md\" rel=\"noopener noreferrer\" target=\"_blank\">2611<\/a> · <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/3XXX_CE0/31XX_Nplus1/310X_all_Vd0/3105X_self_contained_direct_Vd0_nine_point/31057_terminal_nine_point_enclosure.md\" rel=\"noopener noreferrer\" target=\"_blank\">31057<\/a>. All source links are pinned to the same repository snapshot.<\/p>\n<p><a class=\"node-link\" href=\"#/MAIN\">[MAIN]<\/a> Return to the main tree.<\/p>\n<h2>Current terminal applications<\/h2>\n<p><a class=\"node-link\" href=\"#/BC\">BC<\/a> uses five points and five hull-edge calipers; <a class=\"node-link\" href=\"#/D\">D<\/a> uses four points and four calipers. The current BC capacity calculation uses two different pairs and a reusable slack-sensitive envelope, not a uniform radius.<\/p>\n"},"CLASSIFICATION":{"id":"CLASSIFICATION","file":"CLASSIFICATION.md","title":"Local classes without a large case grid","group":"Proof trees","html":"<h1>[CLASSIFICATION] Local classes without a large case grid<\/h1>\n<p><a class=\"node-link\" href=\"#/MAIN\">[MAIN]<\/a> · <a class=\"node-link\" href=\"#/SETUP\">[SETUP]<\/a> · <a class=\"node-link\" href=\"#/NOTATION\">[NOTATION]<\/a> · <a class=\"node-link\" href=\"#/USE\">[USE]<\/a> · <a class=\"node-link\" href=\"#/GLOSSARY\">[GLOSSARY]<\/a><\/p>\n<details class=\"local-terms\" open=\"\"><summary>Terms used here<\/summary><ul class=\"proof-tree\">\n<li><strong>Geometry and triangles.<\/strong> <span class=\"math-inline\"><math aria-label=\"H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>H<\/mi>\n<\/math><\/span> is the closed regular hexagon of side <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span>, with center <span class=\"math-inline\"><math aria-label=\"O=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<mo>=<\/mo>\n<mn>0<\/mn>\n<\/math><\/span> and vertices <span class=\"math-inline\"><math aria-label=\"V_0,\\ldots,V_5\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>,<\/mo>\n<mo>…<\/mo>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>5<\/mn>\n<\/msub>\n<\/math><\/span> in cyclic order. Indices are modulo <span class=\"math-inline\"><math aria-label=\"6\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>6<\/mn>\n<\/math><\/span> (so <span class=\"math-inline\"><math aria-label=\"V_6=V_0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mn>6<\/mn>\n<\/msub>\n<mo>=<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<\/math><\/span>). A <strong>spoke<\/strong> is <span class=\"math-inline\"><math aria-label=\"r_i=[O,V_i]\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>r<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<mi>O<\/mi>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<\/math><\/span>; its midpoint is <span class=\"math-inline\"><math aria-label=\"M_i=V_i/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>. The boundary edge <span class=\"math-inline\"><math aria-label=\"e_{i,i+1}=[V_i,V_{i+1}]\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>e<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>,<\/mo>\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<\/math><\/span> has parameterization <span class=\"math-inline\"><math aria-label=\"X_i(t)=(1-t)V_i+tV_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>X<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>t<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>t<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<mi>t<\/mi>\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"0\\le t\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>0<\/mn>\n<mo>≤<\/mo>\n<mi>t<\/mi>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<li><strong>C triangle and V triangles.<\/strong> <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> is an open unit equilateral triangle containing <span class=\"math-inline\"><math aria-label=\"O\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<\/math><\/span>; <span class=\"math-inline\"><math aria-label=\"U_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> is one containing <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>. A <strong>role<\/strong> means one of these assigned triangles. Their closures <span class=\"math-inline\"><math aria-label=\"T_C,T_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>T<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> include their sides and vertices; the open triangles do not. Coverage always uses the open triangles. A <strong>trace<\/strong> is intersection with the stated edge or spoke; the <strong>relative interior<\/strong> of an edge removes its endpoints.<\/li>\n<li><strong>Reaches and criticality.<\/strong> <span class=\"math-inline\"><math aria-label=\"A_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"B_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> are the actual lengths reached by <span class=\"math-inline\"><math aria-label=\"T_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> from <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> toward <span class=\"math-inline\"><math aria-label=\"V_{i-1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"V_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>, respectively. <span class=\"math-inline\"><math aria-label=\"C_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>C<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> is its actual distance along its own spoke from <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> toward <span class=\"math-inline\"><math aria-label=\"O\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<\/math><\/span>. <strong>Supercritical<\/strong> means <span class=\"math-inline\"><math aria-label=\"A_i+B_i&gt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>&gt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>; <strong>nonsupercritical<\/strong> means <span class=\"math-inline\"><math aria-label=\"A_i+B_i\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>. <span class=\"math-inline\"><math aria-label=\"N_+\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>N<\/mi>\n<mo>+<\/mo>\n<\/msub>\n<\/math><\/span> counts supercritical V triangles. Lowercase <span class=\"math-inline\"><math aria-label=\"a_i,b_i,c_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>a<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>b<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>c<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> are selected lower bounds, not necessarily these maxima.<\/li>\n<li><strong>Gaps and skeleton.<\/strong> A <strong>boundary gap<\/strong> is a nonempty part of an edge missed by all six open V triangles. On <span class=\"math-inline\"><math aria-label=\"e_{i,i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>e<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>,<\/mo>\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span> it is <span class=\"math-inline\"><math aria-label=\"X_i([B_i,1-A_{i+1}])\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>X<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<msub>\n<mi>A<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> when <span class=\"math-inline\"><math aria-label=\"B_i+A_{i+1}\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>A<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>; equality leaves one missing point. The <strong>skeleton<\/strong> is <span class=\"math-inline\"><math aria-label=\"S=\\partial H\\cup\\bigcup_i r_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>S<\/mi>\n<mo>=<\/mo>\n<mi>∂<\/mi>\n<mi>H<\/mi>\n<mo>∪<\/mo>\n<munder>\n<mo data-mjx-texclass=\"OP\">⋃<\/mo>\n<mi>i<\/mi>\n<\/munder>\n<msub>\n<mi>r<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>, of length <span class=\"math-inline\"><math aria-label=\"12\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>12<\/mn>\n<\/math><\/span>. Skeleton coverage need not cover points between the spokes.<\/li>\n<li><strong>Trace, incidence, and coordinates.<\/strong> A trace is the intersection of a triangle with the edge or spoke being discussed; positive trace means positive length, not a single contact point. Two edges are adjacent when they share a vertex. A <strong>local wedge<\/strong> is the <span class=\"math-inline\"><math aria-label=\"120^\\circ\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msup>\n<mn>120<\/mn>\n<mo>∘<\/mo>\n<\/msup>\n<\/math><\/span> corner region at a hexagon vertex. The local coordinates below are coefficients along the two edge directions, not Cartesian coordinates. Their origin is <span class=\"math-inline\"><math aria-label=\"V_0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<\/math><\/span>, not the global center <span class=\"math-inline\"><math aria-label=\"O\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<\/math><\/span>.<\/li>\n<\/ul><\/details>\n<p><strong>Purpose:<\/strong> identify the few local types, without splitting the global proof into all possible six-role type patterns.<\/p>\n<h2>Tree<\/h2>\n<ul class=\"proof-tree\">\n<li><details open=\"\"><summary><strong>Classify the center by positive-length boundary traces.<\/strong>\n<\/summary><ul>\n<li><details open=\"\"><summary>Relative-interior points of nonadjacent hexagon edges are more than distance <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span> apart.\n<\/summary><ul>\n<li>For edges <span class=\"math-inline\"><math aria-label=\"e_{0,1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>e<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mn>0<\/mn>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"e_{2,3}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>e<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mn>2<\/mn>\n<mo>,<\/mo>\n<mn>3<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>, their squared distance minus <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span> is <span class=\"math-inline\"><math aria-label=\"(1-t)(2-t)+s(s+t)&gt;0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>t<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>2<\/mn>\n<mo>−<\/mo>\n<mi>t<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>+<\/mo>\n<mi>s<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>s<\/mi>\n<mo>+<\/mo>\n<mi>t<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>&gt;<\/mo>\n<mn>0<\/mn>\n<\/math><\/span>, for <span class=\"math-inline\"><math aria-label=\"0&lt;t,s&lt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>0<\/mn>\n<mo>&lt;<\/mo>\n<mi>t<\/mi>\n<mo>,<\/mo>\n<mi>s<\/mi>\n<mo>&lt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<li>For opposite edges, it is <span class=\"math-inline\"><math aria-label=\"(t+s-1)^2+2&gt;0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<mi>t<\/mi>\n<mo>+<\/mo>\n<mi>s<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<msup>\n<mo stretchy=\"false\">)<\/mo>\n<mn>2<\/mn>\n<\/msup>\n<mo>+<\/mo>\n<mn>2<\/mn>\n<mo>&gt;<\/mo>\n<mn>0<\/mn>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li>A unit triangle has diameter <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span>; it cannot meet two nonadjacent edges in positive length.<\/li>\n<li>Among any three hexagon edges, two are nonadjacent.<\/li>\n<li><details open=\"\"><summary>Therefore the center has at most two positive traces, and two such traces are adjacent.\n<\/summary><ul>\n<li><strong>CE0:<\/strong> no positive trace.<\/li>\n<li><strong>CE1:<\/strong> exactly one positive trace.<\/li>\n<li><strong>CE2:<\/strong> exactly two positive traces.<\/li>\n<\/ul>\n<\/details><\/li>\n<li>These are trace classes, not gap counts; a center trace can overlap boundary already covered by vertex roles.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Classify a vertex triangle by which neighboring spokes it meets in positive length (its support).<\/strong>\n<\/summary><ul>\n<li>Let <span class=\"math-inline\"><math aria-label=\"n\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>n<\/mi>\n<\/math><\/span> count adjacent spokes met in positive length; let <span class=\"math-inline\"><math aria-label=\"o\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>o<\/mi>\n<\/math><\/span> count triangle vertices outside <span class=\"math-inline\"><math aria-label=\"H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>H<\/mi>\n<\/math><\/span>.<\/li>\n<li>Since <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> is an interior point of its triangle but an extreme point of <span class=\"math-inline\"><math aria-label=\"H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>H<\/mi>\n<\/math><\/span>, at least one triangle vertex is outside <span class=\"math-inline\"><math aria-label=\"H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>H<\/mi>\n<\/math><\/span>.<\/li>\n<li><details open=\"\"><summary>Work in local coordinates <span class=\"math-inline\"><math aria-label=\"V_0=(0,0)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>0<\/mn>\n<mo>,<\/mo>\n<mn>0<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"O=(1,1)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>, with metric <span class=\"math-inline\"><math aria-label=\"x^2+y^2-xy\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msup>\n<mi>x<\/mi>\n<mn>2<\/mn>\n<\/msup>\n<mo>+<\/mo>\n<msup>\n<mi>y<\/mi>\n<mn>2<\/mn>\n<\/msup>\n<mo>−<\/mo>\n<mi>x<\/mi>\n<mi>y<\/mi>\n<\/math><\/span>.\n<\/summary><ul>\n<li>Within distance <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span> of <span class=\"math-inline\"><math aria-label=\"V_0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<\/math><\/span>, membership in <span class=\"math-inline\"><math aria-label=\"H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>H<\/mi>\n<\/math><\/span> is equivalent to <span class=\"math-inline\"><math aria-label=\"x,y\\ge0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>x<\/mi>\n<mo>,<\/mo>\n<mi>y<\/mi>\n<mo>≥<\/mo>\n<mn>0<\/mn>\n<\/math><\/span>.<\/li>\n<li>Adjacent spokes lie on <span class=\"math-inline\"><math aria-label=\"x=1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>x<\/mi>\n<mo>=<\/mo>\n<mn>1<\/mn>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"y=1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>y<\/mi>\n<mo>=<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>One adjacent support requires at least one vertex in <span class=\"math-inline\"><math aria-label=\"H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>H<\/mi>\n<\/math><\/span>.<\/strong>\n<\/summary><ul>\n<li>A vertex with <span class=\"math-inline\"><math aria-label=\"x&gt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>x<\/mi>\n<mo>&gt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span> and distance at most <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span> lies in the local wedge, hence in <span class=\"math-inline\"><math aria-label=\"H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>H<\/mi>\n<\/math><\/span>.<\/li>\n<li>If the maximal <span class=\"math-inline\"><math aria-label=\"x\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>x<\/mi>\n<\/math><\/span> equals <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span>, positive support requires a whole side on <span class=\"math-inline\"><math aria-label=\"x=1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>x<\/mi>\n<mo>=<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>; its endpoints lie in <span class=\"math-inline\"><math aria-label=\"H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>H<\/mi>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Two adjacent supports require at least two vertices in <span class=\"math-inline\"><math aria-label=\"H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>H<\/mi>\n<\/math><\/span>.<\/strong>\n<\/summary><ul>\n<li>Otherwise the same unique inside vertex would need <span class=\"math-inline\"><math aria-label=\"x&gt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>x<\/mi>\n<mo>&gt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"y&gt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>y<\/mi>\n<mo>&gt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<li>But <span class=\"math-inline\"><math aria-label=\"x^2+y^2-xy=(x-y)^2+xy&gt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msup>\n<mi>x<\/mi>\n<mn>2<\/mn>\n<\/msup>\n<mo>+<\/mo>\n<msup>\n<mi>y<\/mi>\n<mn>2<\/mn>\n<\/msup>\n<mo>−<\/mo>\n<mi>x<\/mi>\n<mi>y<\/mi>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mi>x<\/mi>\n<mo>−<\/mo>\n<mi>y<\/mi>\n<msup>\n<mo stretchy=\"false\">)<\/mo>\n<mn>2<\/mn>\n<\/msup>\n<mo>+<\/mo>\n<mi>x<\/mi>\n<mi>y<\/mi>\n<mo>&gt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary>The possibilities are therefore:\n<\/summary><ul>\n<li><strong>Vd0:<\/strong> <span class=\"math-inline\"><math aria-label=\"n=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>n<\/mi>\n<mo>=<\/mo>\n<mn>0<\/mn>\n<\/math><\/span>, with <span class=\"math-inline\"><math aria-label=\"o=1,2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>o<\/mi>\n<mo>=<\/mo>\n<mn>1<\/mn>\n<mo>,<\/mo>\n<mn>2<\/mn>\n<\/math><\/span>, or initially <span class=\"math-inline\"><math aria-label=\"3\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>3<\/mn>\n<\/math><\/span>.<\/li>\n<li><strong>Vd1:<\/strong> <span class=\"math-inline\"><math aria-label=\"(o,n)=(1,1)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<mi>o<\/mi>\n<mo>,<\/mo>\n<mi>n<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>.<\/li>\n<li><strong>Vd2:<\/strong> <span class=\"math-inline\"><math aria-label=\"(o,n)=(1,2)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<mi>o<\/mi>\n<mo>,<\/mo>\n<mi>n<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>,<\/mo>\n<mn>2<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>.<\/li>\n<li><strong>T3-like:<\/strong> <span class=\"math-inline\"><math aria-label=\"(o,n)=(2,1)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<mi>o<\/mi>\n<mo>,<\/mo>\n<mi>n<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>2<\/mn>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Normalize a raw <span class=\"math-inline\"><math aria-label=\"(3,0)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<mn>3<\/mn>\n<mo>,<\/mo>\n<mn>0<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> role without changing coverage.<\/strong>\n<\/summary><ul>\n<li>Inside the local wedge, only one triangle side cuts out the trace; the other two side inequalities are redundant there.<\/li>\n<li>Translate parallel to that active side until a triangle vertex first reaches an endpoint of the cut.<\/li>\n<li>The active cutting line is unchanged; the first new contact lies on its already-excluded open boundary.<\/li>\n<li>Hence both the open trace and the closed trace in <span class=\"math-inline\"><math aria-label=\"H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>H<\/mi>\n<\/math><\/span> stay unchanged.<\/li>\n<li>The resulting role has <span class=\"math-inline\"><math aria-label=\"(o,n)=(2,0)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<mi>o<\/mi>\n<mo>,<\/mo>\n<mi>n<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>2<\/mn>\n<mo>,<\/mo>\n<mn>0<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>; all actual reaches and <span class=\"math-inline\"><math aria-label=\"N_+\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>N<\/mi>\n<mo>+<\/mo>\n<\/msub>\n<\/math><\/span> are preserved.<\/li>\n<li>This is exact-trace normalization, not the different T3-like closed-trace domination translation.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Use the classes only when they matter.<\/strong>\n<\/summary><ul>\n<li>Positive-support roles are Vd1, Vd2, and T3-like; their number is <span class=\"math-inline\"><math aria-label=\"N_{\\rm sp}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>N<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi mathvariant=\"normal\">s<\/mi>\n<mi mathvariant=\"normal\">p<\/mi>\n<\/mrow>\n<\/msub>\n<\/math><\/span>.<\/li>\n<li>Their boundary caps make them nonsupercritical — <a class=\"node-link\" href=\"#/LENGTH\">[LENGTH]<\/a>.<\/li>\n<li>Their midpoint behavior is explained in <a class=\"node-link\" href=\"#/MIDPOINTS\">[MIDPOINTS]<\/a>.<\/li>\n<\/ul>\n<\/details><\/li>\n<\/ul>\n<hr/>\n<p><strong>Proof sources:<\/strong> <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/1XXX_foundations/11XX_C_triangle/1101_CE_classification.md\" rel=\"noopener noreferrer\" target=\"_blank\">1101<\/a> · <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/1XXX_foundations/12XX_V_triangle/1201_V_triangle_types.md\" rel=\"noopener noreferrer\" target=\"_blank\">1201<\/a> · <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/2XXX_geometric_lemmas/25XX_length_bounds/2500_boundary_length_bounds.md\" rel=\"noopener noreferrer\" target=\"_blank\">2500<\/a>. All source links are pinned to the same repository snapshot.<\/p>\n<p><a class=\"node-link\" href=\"#/MAIN\">[MAIN]<\/a> Return to the main tree.<\/p>\n"},"D":{"id":"D","file":"D.md","title":"Four-point ratio obstruction","group":"Proof trees","html":"<h1>[D] Four-point ratio obstruction<\/h1>\n<p><a class=\"node-link\" href=\"#/MAIN\">[MAIN]<\/a> · <a class=\"node-link\" href=\"#/BC\">[BC]<\/a> · <a class=\"node-link\" href=\"#/D\">[D]<\/a> · <a class=\"node-link\" href=\"#/CALIPERS\">[CALIPERS]<\/a><\/p>\n<details class=\"local-terms\" open=\"\"><summary>Terms used here<\/summary><p><span class=\"math-inline\"><math aria-label=\"H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>H<\/mi>\n<\/math><\/span> is the closed regular hexagon of side one, <span class=\"math-inline\"><math aria-label=\"O=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<mo>=<\/mo>\n<mn>0<\/mn>\n<\/math><\/span> its center, and\n<span class=\"math-inline\"><math aria-label=\"V_i=(\\cos(i\\pi/3),\\sin(i\\pi/3))\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mi>cos<\/mi>\n<mo data-mjx-texclass=\"NONE\">⁡<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mi>i<\/mi>\n<mi>π<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>3<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<mo>,<\/mo>\n<mi>sin<\/mi>\n<mo data-mjx-texclass=\"NONE\">⁡<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mi>i<\/mi>\n<mi>π<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>3<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> its vertices (indices modulo six).\nThe spoke is <span class=\"math-inline\"><math aria-label=\"r_i=[O,V_i]\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>r<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<mi>O<\/mi>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<\/math><\/span> and its midpoint is <span class=\"math-inline\"><math aria-label=\"M_i=V_i/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>.\n<span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> is the open unit equilateral triangle containing <span class=\"math-inline\"><math aria-label=\"O\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<\/math><\/span>; <span class=\"math-inline\"><math aria-label=\"U_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> contains <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>.\nTheir closures are <span class=\"math-inline\"><math aria-label=\"T_C,T_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>T<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>. Coverage uses the open triangles.\n<span class=\"math-inline\"><math aria-label=\"A_i,B_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> are the actual boundary reaches toward <span class=\"math-inline\"><math aria-label=\"V_{i-1},V_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>.\nNonsupercritical means <span class=\"math-inline\"><math aria-label=\"A_i+B_i\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>, not a condition on arbitrary lower demands.\nA gap <span class=\"math-inline\"><math aria-label=\"X_i([B_i,1-A_{i+1}])\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>X<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<msub>\n<mi>A<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>, where <span class=\"math-inline\"><math aria-label=\"X_i(w)=(1-w)V_i+wV_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>X<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>w<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>w<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<mi>w<\/mi>\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>,\nincludes a singleton when its endpoints coincide.\nA witness is forced into <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> if the original covering hypotheses imply that membership.\n<span class=\"math-inline\"><math aria-label=\"\\Lambda(F)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi mathvariant=\"normal\">Λ<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>F<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> is the minimum closed equilateral enclosure side of the compact set <span class=\"math-inline\"><math aria-label=\"F\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>F<\/mi>\n<\/math><\/span>;\n<span class=\"math-inline\"><math aria-label=\"F\\subset U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>F<\/mi>\n<mo>⊂<\/mo>\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> implies <span class=\"math-inline\"><math aria-label=\"\\Lambda(F)&lt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi mathvariant=\"normal\">Λ<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>F<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>&lt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.\n<span class=\"math-inline\"><math aria-label=\"C_0(a,b)=c_{\\max}(a,b)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>C<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>a<\/mi>\n<mo>,<\/mo>\n<mi>b<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<msub>\n<mi>c<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mo data-mjx-texclass=\"OP\" movablelimits=\"true\">max<\/mo>\n<\/mrow>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>a<\/mi>\n<mo>,<\/mo>\n<mi>b<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> is the own-ray capacity function, not the actual scalar <span class=\"math-inline\"><math aria-label=\"C_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>C<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>.\n<span class=\"math-inline\"><math aria-label=\"C_+\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>C<\/mi>\n<mo>+<\/mo>\n<\/msub>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"C_-\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>C<\/mi>\n<mo>−<\/mo>\n<\/msub>\n<\/math><\/span> are neighboring-ray capacities for that same prescribed pair.<\/p><\/details>\n<p>A supported midpoint has an adjacent <strong>supplier<\/strong> whose open triangle contains that midpoint;\npositive support alone does not imply supplying that midpoint.\nFor D, <span class=\"math-inline\"><math aria-label=\"Y(w)=V_0-wV_1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>Y<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>w<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>−<\/mo>\n<mi>w<\/mi>\n<msub>\n<mi>V<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"a\\ge0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>a<\/mi>\n<mo>≥<\/mo>\n<mn>0<\/mn>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"\\varepsilon&gt;0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>ε<\/mi>\n<mo>&gt;<\/mo>\n<mn>0<\/mn>\n<\/math><\/span>, and <span class=\"math-inline\"><math aria-label=\"\\beta\\ge0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>β<\/mi>\n<mo>≥<\/mo>\n<mn>0<\/mn>\n<\/math><\/span>.\nThe original placement adapters force the four points and prove the ratio bound.<\/p>\n<h2>Tree<\/h2>\n<ul class=\"proof-tree\">\n<li><details open=\"\"><summary><strong>Separate original placement from the geometric theorem.<\/strong>\n<\/summary><ul>\n<li>The T3-like or Vd1 chart forces <span class=\"math-inline\"><math aria-label=\"O,\\varepsilon V_1,Y(a),Y(1-\\beta)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<mo>,<\/mo>\n<mi>ε<\/mi>\n<msub>\n<mi>V<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<mo>,<\/mo>\n<mi>Y<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>a<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>,<\/mo>\n<mi>Y<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>β<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> into <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span>.<\/li>\n<li>It proves <span class=\"math-inline\"><math aria-label=\"\\beta\\le\\varepsilon/(a+\\varepsilon)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>β<\/mi>\n<mo>≤<\/mo>\n<mi>ε<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mo stretchy=\"false\">(<\/mo>\n<mi>a<\/mi>\n<mo>+<\/mo>\n<mi>ε<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>.<\/li>\n<li>Size bounds may still help force original gap endpoints; the geometric theorem does not require them.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Use diameter at the boundary.<\/strong>\n<\/summary><ul>\n<li>If <span class=\"math-inline\"><math aria-label=\"a=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>a<\/mi>\n<mo>=<\/mo>\n<mn>0<\/mn>\n<\/math><\/span>, the points contain <span class=\"math-inline\"><math aria-label=\"O,V_0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<\/math><\/span>.<\/li>\n<li>Put <span class=\"math-inline\"><math aria-label=\"s=a+\\varepsilon\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>s<\/mi>\n<mo>=<\/mo>\n<mi>a<\/mi>\n<mo>+<\/mo>\n<mi>ε<\/mi>\n<\/math><\/span>. If <span class=\"math-inline\"><math aria-label=\"s\\ge1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>s<\/mi>\n<mo>≥<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>, then <span class=\"math-inline\"><math aria-label=\"\\|Y(a)-\\varepsilon V_1\\|^2=1-s+s^2\\ge1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo data-mjx-texclass=\"ORD\">∥<\/mo>\n<mi>Y<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>a<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>−<\/mo>\n<mi>ε<\/mi>\n<msub>\n<mi>V<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<msup>\n<mo data-mjx-texclass=\"ORD\">∥<\/mo>\n<mn>2<\/mn>\n<\/msup>\n<mo>=<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>s<\/mi>\n<mo>+<\/mo>\n<msup>\n<mi>s<\/mi>\n<mn>2<\/mn>\n<\/msup>\n<mo>≥<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Otherwise reduce by convexity.<\/strong>\n<\/summary><ul>\n<li>Put <span class=\"math-inline\"><math aria-label=\"v=a/s\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>v<\/mi>\n<mo>=<\/mo>\n<mi>a<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mi>s<\/mi>\n<\/math><\/span>, so <span class=\"math-inline\"><math aria-label=\"0&lt;s,v&lt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>0<\/mn>\n<mo>&lt;<\/mo>\n<mi>s<\/mi>\n<mo>,<\/mo>\n<mi>v<\/mi>\n<mo>&lt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"a=sv\\le v\\le1-\\beta\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>a<\/mi>\n<mo>=<\/mo>\n<mi>s<\/mi>\n<mi>v<\/mi>\n<mo>≤<\/mo>\n<mi>v<\/mi>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>β<\/mi>\n<\/math><\/span>.<\/li>\n<li>Replace the far point by <span class=\"math-inline\"><math aria-label=\"Y(v)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>Y<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>v<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> on the same boundary segment.<\/li>\n<li>The smaller quadrilateral is <span class=\"math-inline\"><math aria-label=\"O,Y(v),Y(sv),s(1-v)V_1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<mo>,<\/mo>\n<mi>Y<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>v<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>,<\/mo>\n<mi>Y<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>s<\/mi>\n<mi>v<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>,<\/mo>\n<mi>s<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>v<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Use four hull-edge calipers.<\/strong>\n<\/summary><ul>\n<li>Their side lengths are <span class=\"math-inline\"><math aria-label=\"1/\\sqrt{1-v+v^2}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<msqrt>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>v<\/mi>\n<mo>+<\/mo>\n<msup>\n<mi>v<\/mi>\n<mn>2<\/mn>\n<\/msup>\n<\/msqrt>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"1+s(1-v)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<mo>+<\/mo>\n<mi>s<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>v<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"1/\\sqrt{1-s+s^2}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<msqrt>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>s<\/mi>\n<mo>+<\/mo>\n<msup>\n<mi>s<\/mi>\n<mn>2<\/mn>\n<\/msup>\n<\/msqrt>\n<\/math><\/span>, and <span class=\"math-inline\"><math aria-label=\"1+v(1-s)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<mo>+<\/mo>\n<mi>v<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>s<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>.<\/li>\n<li>All exceed one for <span class=\"math-inline\"><math aria-label=\"0&lt;s,v&lt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>0<\/mn>\n<mo>&lt;<\/mo>\n<mi>s<\/mi>\n<mo>,<\/mo>\n<mi>v<\/mi>\n<mo>&lt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span> — <a class=\"node-link\" href=\"#/D-CALC\">[D-CALC]<\/a>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><strong>Conclude <span class=\"math-inline\"><math aria-label=\"\\Lambda(K_D)\\ge1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi mathvariant=\"normal\">Λ<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<msub>\n<mi>K<\/mi>\n<mi>D<\/mi>\n<\/msub>\n<mo stretchy=\"false\">)<\/mo>\n<mo>≥<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.<\/strong> Compact containment in an open unit triangle is impossible.<\/li>\n<\/ul>\n<p>This proof neither forces a candidate midpoint nor introduces signed center parameters.<\/p>\n<h2>Proof sources<\/h2>\n<p>The active terminal is <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/2XXX_geometric_lemmas/26XX_enclosing_triangle_tools/2616_bc_d_finite_calipers.md\" rel=\"noopener noreferrer\" target=\"_blank\">2616<\/a>.\nThe D terminal does not depend on the BC capacity-envelope lemma. The original supplier adapters remain responsible for forcing its four points and establishing the ratio.\nThe entire page is explanatory; numbered sources supply proof authority.<\/p>\n"},"F":{"id":"F","file":"F.md","title":"The zero-gap nine-point obstruction","group":"Proof trees","html":"<h1>[F] The zero-gap nine-point obstruction<\/h1>\n<p><a class=\"node-link\" href=\"#/MAIN\">[MAIN]<\/a> · <a class=\"node-link\" href=\"#/NOTATION\">[NOTATION]<\/a> · <a class=\"node-link\" href=\"#/USE\">[USE]<\/a> · <a class=\"node-link\" href=\"#/GLOSSARY\">[GLOSSARY]<\/a><\/p>\n<details class=\"local-terms\" open=\"\"><summary>Terms used here<\/summary><ul class=\"proof-tree\">\n<li><strong>Geometry and triangles.<\/strong> <span class=\"math-inline\"><math aria-label=\"H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>H<\/mi>\n<\/math><\/span> is the closed regular hexagon of side <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span>, with center <span class=\"math-inline\"><math aria-label=\"O=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<mo>=<\/mo>\n<mn>0<\/mn>\n<\/math><\/span> and vertices <span class=\"math-inline\"><math aria-label=\"V_0,\\ldots,V_5\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>,<\/mo>\n<mo>…<\/mo>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>5<\/mn>\n<\/msub>\n<\/math><\/span> in cyclic order. Indices are modulo <span class=\"math-inline\"><math aria-label=\"6\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>6<\/mn>\n<\/math><\/span> (so <span class=\"math-inline\"><math aria-label=\"V_6=V_0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mn>6<\/mn>\n<\/msub>\n<mo>=<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<\/math><\/span>). A <strong>spoke<\/strong> is <span class=\"math-inline\"><math aria-label=\"r_i=[O,V_i]\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>r<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<mi>O<\/mi>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<\/math><\/span>; its midpoint is <span class=\"math-inline\"><math aria-label=\"M_i=V_i/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>. The boundary edge <span class=\"math-inline\"><math aria-label=\"e_{i,i+1}=[V_i,V_{i+1}]\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>e<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>,<\/mo>\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<\/math><\/span> has parameterization <span class=\"math-inline\"><math aria-label=\"X_i(t)=(1-t)V_i+tV_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>X<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>t<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>t<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<mi>t<\/mi>\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"0\\le t\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>0<\/mn>\n<mo>≤<\/mo>\n<mi>t<\/mi>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<li><strong>C triangle and V triangles.<\/strong> <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> is an open unit equilateral triangle containing <span class=\"math-inline\"><math aria-label=\"O\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<\/math><\/span>; <span class=\"math-inline\"><math aria-label=\"U_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> is one containing <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>. A <strong>role<\/strong> means one of these assigned triangles. Their closures <span class=\"math-inline\"><math aria-label=\"T_C,T_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>T<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> include their sides and vertices; the open triangles do not. Coverage always uses the open triangles. A <strong>trace<\/strong> is intersection with the stated edge or spoke; the <strong>relative interior<\/strong> of an edge removes its endpoints.<\/li>\n<li><strong>Reaches and criticality.<\/strong> <span class=\"math-inline\"><math aria-label=\"A_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"B_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> are the actual lengths reached by <span class=\"math-inline\"><math aria-label=\"T_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>T<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> from <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> toward <span class=\"math-inline\"><math aria-label=\"V_{i-1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"V_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>, respectively. <span class=\"math-inline\"><math aria-label=\"C_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>C<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> is its actual distance along its own spoke from <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> toward <span class=\"math-inline\"><math aria-label=\"O\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<\/math><\/span>. <strong>Supercritical<\/strong> means <span class=\"math-inline\"><math aria-label=\"A_i+B_i&gt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>&gt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>; <strong>nonsupercritical<\/strong> means <span class=\"math-inline\"><math aria-label=\"A_i+B_i\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>. <span class=\"math-inline\"><math aria-label=\"N_+\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>N<\/mi>\n<mo>+<\/mo>\n<\/msub>\n<\/math><\/span> counts supercritical V triangles. Lowercase <span class=\"math-inline\"><math aria-label=\"a_i,b_i,c_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>a<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>b<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>c<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> are selected lower bounds, not necessarily these maxima.<\/li>\n<li><strong>Gaps and skeleton.<\/strong> A <strong>boundary gap<\/strong> is a nonempty part of an edge missed by all six open V triangles. On <span class=\"math-inline\"><math aria-label=\"e_{i,i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>e<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>,<\/mo>\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span> it is <span class=\"math-inline\"><math aria-label=\"X_i([B_i,1-A_{i+1}])\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>X<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mo stretchy=\"false\">[<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<msub>\n<mi>A<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> when <span class=\"math-inline\"><math aria-label=\"B_i+A_{i+1}\\le1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>A<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>; equality leaves one missing point. The <strong>skeleton<\/strong> is <span class=\"math-inline\"><math aria-label=\"S=\\partial H\\cup\\bigcup_i r_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>S<\/mi>\n<mo>=<\/mo>\n<mi>∂<\/mi>\n<mi>H<\/mi>\n<mo>∪<\/mo>\n<munder>\n<mo data-mjx-texclass=\"OP\">⋃<\/mo>\n<mi>i<\/mi>\n<\/munder>\n<msub>\n<mi>r<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>, of length <span class=\"math-inline\"><math aria-label=\"12\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>12<\/mn>\n<\/math><\/span>. Skeleton coverage need not cover points between the spokes.<\/li>\n<li><strong>Enclosure language.<\/strong> A <strong>witness<\/strong> is a chosen point used to contradict the cover. <strong>Forced into <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span><\/strong> means the cover and previously stated geometry imply that membership. A <strong>candidate<\/strong> is any other open unit equilateral triangle tested against the same fixed witnesses; it need not complete a cover with the old V triangles. <span class=\"math-inline\"><math aria-label=\"\\operatorname{conv}(K)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>conv<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>K<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> is the convex hull, the set of all convex combinations of points of <span class=\"math-inline\"><math aria-label=\"K\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>K<\/mi>\n<\/math><\/span>. For a nonempty compact set <span class=\"math-inline\"><math aria-label=\"K\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>K<\/mi>\n<\/math><\/span> (closed and bounded here), <span class=\"math-inline\"><math aria-label=\"\\Lambda(K)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi mathvariant=\"normal\">Λ<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>K<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> is the least side length of a closed equilateral triangle containing it. Thus <span class=\"math-inline\"><math aria-label=\"K\\subset U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>K<\/mi>\n<mo>⊂<\/mo>\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> gives <span class=\"math-inline\"><math aria-label=\"\\Lambda(K)&lt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi mathvariant=\"normal\">Λ<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>K<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>&lt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span> by shrinking its three sides slightly.<\/li>\n<li><strong>Capacity.<\/strong> <span class=\"math-inline\"><math aria-label=\"c_{\\max}(p,q)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>c<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mo data-mjx-texclass=\"OP\" movablelimits=\"true\">max<\/mo>\n<\/mrow>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>p<\/mi>\n<mo>,<\/mo>\n<mi>q<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> is the largest own-spoke reach possible for a closed unit equilateral triangle that contains a hexagon vertex and reaches at least <span class=\"math-inline\"><math aria-label=\"p,q\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>p<\/mi>\n<mo>,<\/mo>\n<mi>q<\/mi>\n<\/math><\/span> along its two incident edges. More formally, in coordinates based at that vertex, choose unit vectors <span class=\"math-inline\"><math aria-label=\"u,v\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>u<\/mi>\n<mo>,<\/mo>\n<mi>v<\/mi>\n<\/math><\/span> meeting at <span class=\"math-inline\"><math aria-label=\"120^\\circ\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msup>\n<mn>120<\/mn>\n<mo>∘<\/mo>\n<\/msup>\n<\/math><\/span>; it is the largest <span class=\"math-inline\"><math aria-label=\"c\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>c<\/mi>\n<\/math><\/span> such that <span class=\"math-inline\"><math aria-label=\"\\{0,pu,qv,c(u+v)\\}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo fence=\"false\" stretchy=\"false\">{<\/mo>\n<mn>0<\/mn>\n<mo>,<\/mo>\n<mi>p<\/mi>\n<mi>u<\/mi>\n<mo>,<\/mo>\n<mi>q<\/mi>\n<mi>v<\/mi>\n<mo>,<\/mo>\n<mi>c<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<mi>u<\/mi>\n<mo>+<\/mo>\n<mi>v<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo fence=\"false\" stretchy=\"false\">}<\/mo>\n<\/math><\/span> fits in a closed unit equilateral triangle. <span class=\"math-inline\"><math aria-label=\"C_+(p,q),C_-(p,q)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>C<\/mi>\n<mo>+<\/mo>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>p<\/mi>\n<mo>,<\/mo>\n<mi>q<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>,<\/mo>\n<msub>\n<mi>C<\/mi>\n<mo>−<\/mo>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>p<\/mi>\n<mo>,<\/mo>\n<mi>q<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> are the corresponding maximal reaches on the two neighboring spokes, measured from each target spoke's vertex toward <span class=\"math-inline\"><math aria-label=\"O\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<\/math><\/span>. A <strong>capacity bound<\/strong> is an upper bound on one of these reaches.<\/li>\n<li><strong>Handoff and ascent.<\/strong> Write a chosen common boundary point as <span class=\"math-inline\"><math aria-label=\"X_i(x_i)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>X<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<msub>\n<mi>x<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>, with <span class=\"math-inline\"><math aria-label=\"0&lt;x_i&lt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>0<\/mn>\n<mo>&lt;<\/mo>\n<msub>\n<mi>x<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>&lt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>. The V triangle at <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> then realizes the lower demands <span class=\"math-inline\"><math aria-label=\"(a_i,b_i)=(1-x_{i-1},x_i)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<msub>\n<mi>a<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>b<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<msub>\n<mi>x<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>x<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>. An <strong>ascent<\/strong> is <span class=\"math-inline\"><math aria-label=\"x_i&gt;x_{i-1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>x<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>&gt;<\/mo>\n<msub>\n<mi>x<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>, equivalent to <span class=\"math-inline\"><math aria-label=\"a_i+b_i&gt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>a<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>b<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>&gt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>; a descent reverses that inequality. A <strong>frontier witness<\/strong> is a fixed point proved to be outside all open V triangles. The construction lemma below supplies three such points <span class=\"math-inline\"><math aria-label=\"Q_-,Q_0,Q_+\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>Q<\/mi>\n<mo>−<\/mo>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>Q<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>Q<\/mi>\n<mo>+<\/mo>\n<\/msub>\n<\/math><\/span>; these are names, not subtraction or addition operations.<\/li>\n<li><strong>Contact terms.<\/strong> A supporting line touches a convex hull and leaves it on one side. An exposed disk tangent is a line tangent to the disk that also supports the entire hull with the extra points. The inner points named <span class=\"math-inline\"><math aria-label=\"A,B,C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>A<\/mi>\n<mo>,<\/mo>\n<mi>B<\/mi>\n<mo>,<\/mo>\n<mi>C<\/mi>\n<\/math><\/span> below are geometric points, not the numerical reaches <span class=\"math-inline\"><math aria-label=\"A_i,B_i,C_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>A<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>B<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>C<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>.<\/li>\n<\/ul><\/details>\n<p><strong>Input:<\/strong> the six vertex triangles cover the perimeter, exactly one actual vertex role is supercritical, and all seven triangles cover the full hexagon. <strong>No C-type or V-type pattern is assumed.<\/strong><\/p>\n<h2>Tree<\/h2>\n<ul class=\"proof-tree\">\n<li><details open=\"\"><summary><strong>Choose strict boundary handoffs.<\/strong>\n<\/summary><ul>\n<li>Select a point in each overlap of adjacent open vertex traces.<\/li>\n<li>Write selected demands as <span class=\"math-inline\"><math aria-label=\"(a_i,b_i)=(1-x_{i-1},x_i)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<msub>\n<mi>a<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>b<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<msub>\n<mi>x<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>x<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>.<\/li>\n<li>Preserve the unique actual supercritical index as the unique selected ascent.<\/li>\n<li><strong>CALCULATION LEAF:<\/strong> the strict selection theorem — <a class=\"node-link\" href=\"#/HANDOFFS\">[HANDOFFS]<\/a>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Use the one-ascent order.<\/strong>\n<\/summary><ul>\n<li>Rotate so the ascent is at role <span class=\"math-inline\"><math aria-label=\"4\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>4<\/mn>\n<\/math><\/span>.<\/li>\n<li>Then <span class=\"math-inline\"><math aria-label=\"x_3&lt;x_2&lt;x_1&lt;x_0&lt;x_5&lt;x_4\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>x<\/mi>\n<mn>3<\/mn>\n<\/msub>\n<mo>&lt;<\/mo>\n<msub>\n<mi>x<\/mi>\n<mn>2<\/mn>\n<\/msub>\n<mo>&lt;<\/mo>\n<msub>\n<mi>x<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<mo>&lt;<\/mo>\n<msub>\n<mi>x<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>&lt;<\/mo>\n<msub>\n<mi>x<\/mi>\n<mn>5<\/mn>\n<\/msub>\n<mo>&lt;<\/mo>\n<msub>\n<mi>x<\/mi>\n<mn>4<\/mn>\n<\/msub>\n<\/math><\/span>.<\/li>\n<li>Put <span class=\"math-inline\"><math aria-label=\"a=1-x_3\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>a<\/mi>\n<mo>=<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<msub>\n<mi>x<\/mi>\n<mn>3<\/mn>\n<\/msub>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"b=x_4\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>b<\/mi>\n<mo>=<\/mo>\n<msub>\n<mi>x<\/mi>\n<mn>4<\/mn>\n<\/msub>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"p=1-b\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>p<\/mi>\n<mo>=<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>b<\/mi>\n<\/math><\/span>, and <span class=\"math-inline\"><math aria-label=\"q=1-a\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>q<\/mi>\n<mo>=<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>a<\/mi>\n<\/math><\/span>.<\/li>\n<li>Every selected role has both boundary demands at least the common pair <span class=\"math-inline\"><math aria-label=\"(p,q)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<mi>p<\/mi>\n<mo>,<\/mo>\n<mi>q<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>.<\/li>\n<li>The unique ascent gives <span class=\"math-inline\"><math aria-label=\"a+b&gt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>a<\/mi>\n<mo>+<\/mo>\n<mi>b<\/mi>\n<mo>&gt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<li>The two strict handoff points in <span class=\"math-inline\"><math aria-label=\"U_4\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mn>4<\/mn>\n<\/msub>\n<\/math><\/span> give <span class=\"math-inline\"><math aria-label=\"a^2+ab+b^2&lt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msup>\n<mi>a<\/mi>\n<mn>2<\/mn>\n<\/msup>\n<mo>+<\/mo>\n<mi>a<\/mi>\n<mi>b<\/mi>\n<mo>+<\/mo>\n<msup>\n<mi>b<\/mi>\n<mn>2<\/mn>\n<\/msup>\n<mo>&lt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Force six symmetric radial points.<\/strong>\n<\/summary><ul>\n<li>Put <span class=\"math-inline\"><math aria-label=\"c_*=c_{\\max}(p,q)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>c<\/mi>\n<mo>∗<\/mo>\n<\/msub>\n<mo>=<\/mo>\n<msub>\n<mi>c<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mo data-mjx-texclass=\"OP\" movablelimits=\"true\">max<\/mo>\n<\/mrow>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>p<\/mi>\n<mo>,<\/mo>\n<mi>q<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"D_i=(1-c_*)V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>D<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<msub>\n<mi>c<\/mi>\n<mo>∗<\/mo>\n<\/msub>\n<mo stretchy=\"false\">)<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>.<\/li>\n<li>Own and neighboring reach bounds exclude each <span class=\"math-inline\"><math aria-label=\"D_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>D<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> from every open vertex role.<\/li>\n<li>Therefore <span class=\"math-inline\"><math aria-label=\"D_0,\\ldots,D_5\\in U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>D<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>,<\/mo>\n<mo>…<\/mo>\n<mo>,<\/mo>\n<msub>\n<mi>D<\/mi>\n<mn>5<\/mn>\n<\/msub>\n<mo>∈<\/mo>\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span>.<\/li>\n<li><strong>CALCULATION LEAF:<\/strong> common-pair radial forcing — <a class=\"node-link\" href=\"#/F-CALC\">[F-CALC]<\/a>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Obtain a disk by convexity, not pointwise exclusion.<\/strong>\n<\/summary><ul>\n<li>The six radial points form a regular hexagon.<\/li>\n<li>Its convex hull contains the centered disk of radius <span class=\"math-inline\"><math aria-label=\"\\eta=(\\sqrt3/2)(1-c_*)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>η<\/mi>\n<mo>=<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<msqrt>\n<mn>3<\/mn>\n<\/msqrt>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<msub>\n<mi>c<\/mi>\n<mo>∗<\/mo>\n<\/msub>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>.<\/li>\n<li>Hence this entire disk lies in <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Force three asymmetric points near the unique supercritical role.<\/strong>\n<\/summary><ul>\n<li>Construct the fixed frontier points <span class=\"math-inline\"><math aria-label=\"Q_-,Q_0,Q_+\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>Q<\/mi>\n<mo>−<\/mo>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>Q<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>Q<\/mi>\n<mo>+<\/mo>\n<\/msub>\n<\/math><\/span>.<\/li>\n<li>Exclude them from all vertex roles using the actual handoffs and local signs.<\/li>\n<li>Full-hexagon coverage forces all three into <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span>.<\/li>\n<li><strong>CALCULATION LEAF:<\/strong> witness construction and exclusions — <a class=\"node-link\" href=\"#/F-CALC\">[F-CALC]<\/a>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Exclude enclosure of the disk and three points.<\/strong>\n<\/summary><ul>\n<li>If <span class=\"math-inline\"><math aria-label=\"c_*\\le2/3\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>c<\/mi>\n<mo>∗<\/mo>\n<\/msub>\n<mo>≤<\/mo>\n<mn>2<\/mn>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>3<\/mn>\n<\/math><\/span>, the disk alone requires enclosing side at least <span class=\"math-inline\"><math aria-label=\"3(1-c_*)\\ge1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>3<\/mn>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<msub>\n<mi>c<\/mi>\n<mo>∗<\/mo>\n<\/msub>\n<mo stretchy=\"false\">)<\/mo>\n<mo>≥<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<li><details open=\"\"><summary>Otherwise choose inner points <span class=\"math-inline\"><math aria-label=\"A\\in(Q_0,Q_-)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>A<\/mi>\n<mo>∈<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<msub>\n<mi>Q<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>Q<\/mi>\n<mo>−<\/mo>\n<\/msub>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"B=Q_0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>B<\/mi>\n<mo>=<\/mo>\n<msub>\n<mi>Q<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"C\\in(Q_0,Q_+)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>C<\/mi>\n<mo>∈<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<msub>\n<mi>Q<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>Q<\/mi>\n<mo>+<\/mo>\n<\/msub>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>.\n<\/summary><ul>\n<li>Their disk-plus-triangle hull is contained in the original witness hull.<\/li>\n<li><strong>CALCULATION LEAF:<\/strong> exact inner-point construction and line bounds — <a class=\"node-link\" href=\"#/F-CALC\">[F-CALC]<\/a>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary>Reduce minimum enclosing triangles to four relevant contacts — <a class=\"node-link\" href=\"#/CALIPERS\">[CALIPERS]<\/a>.\n<\/summary><ul>\n<li>A side through <span class=\"math-inline\"><math aria-label=\"AB\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>A<\/mi>\n<mi>B<\/mi>\n<\/math><\/span>.<\/li>\n<li>A side through <span class=\"math-inline\"><math aria-label=\"BC\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>B<\/mi>\n<mi>C<\/mi>\n<\/math><\/span>.<\/li>\n<li>An exposed disk tangent through <span class=\"math-inline\"><math aria-label=\"A\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>A<\/mi>\n<\/math><\/span>.<\/li>\n<li>An exposed disk tangent through <span class=\"math-inline\"><math aria-label=\"C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>C<\/mi>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary>Each contact requires side length at least <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span>.\n<\/summary><ul>\n<li>Point–point contacts use supporting-line bounds.<\/li>\n<li>Point–disk contacts use the exact polynomial positivity certificate.<\/li>\n<li><strong>CALCULATION LEAF:<\/strong> the finite exact certificate — <a class=\"node-link\" href=\"#/F-CALC\">[F-CALC]<\/a>.<\/li>\n<\/ul>\n<\/details><\/li>\n<\/ul>\n<\/details><\/li>\n<li><strong>Finish by the common compact-open contradiction<\/strong> — <a class=\"node-link\" href=\"#/WITNESS\">[WITNESS]<\/a>.<\/li>\n<\/ul>\n<h2>Scope that matters later<\/h2>\n<p>The nine directly forced points are <span class=\"math-inline\"><math aria-label=\"D_0,\\ldots,D_5,Q_-,Q_0,Q_+\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>D<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>,<\/mo>\n<mo>…<\/mo>\n<mo>,<\/mo>\n<msub>\n<mi>D<\/mi>\n<mn>5<\/mn>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>Q<\/mi>\n<mo>−<\/mo>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>Q<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>Q<\/mi>\n<mo>+<\/mo>\n<\/msub>\n<\/math><\/span>. The disk is an auxiliary subset of their convex hull. The asymmetric points require <strong>full-hexagon coverage<\/strong>, so F cannot replace N0 after a construction that preserves only the skeleton.<\/p>\n<hr/>\n<p><strong>Proof sources:<\/strong> <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/3XXX_CE0/31XX_Nplus1/310X_all_Vd0/3105X_self_contained_direct_Vd0_nine_point/31058_center_independent_direct_nine_point_obstruction.md\" rel=\"noopener noreferrer\" target=\"_blank\">31058<\/a> · <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/3XXX_CE0/31XX_Nplus1/310X_all_Vd0/3105X_self_contained_direct_Vd0_nine_point/31057_terminal_nine_point_enclosure.md\" rel=\"noopener noreferrer\" target=\"_blank\">31057<\/a> · <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/2XXX_geometric_lemmas/26XX_enclosing_triangle_tools/2611_four_contact_disk_enclosure.md\" rel=\"noopener noreferrer\" target=\"_blank\">2611<\/a>. All source links are pinned to the same repository snapshot.<\/p>\n<p><a class=\"node-link\" href=\"#/MAIN\">[MAIN]<\/a> Return to the main tree.<\/p>\n"},"GLOSSARY":{"id":"GLOSSARY","file":"GLOSSARY.md","title":"The vocabulary of the proof","group":"Reference","html":"<h1>[GLOSSARY] The vocabulary of the proof<\/h1>\n<p><a class=\"node-link\" href=\"#/MAIN\">[MAIN]<\/a> · <a class=\"node-link\" href=\"#/START\">[START]<\/a> · <a class=\"node-link\" href=\"#/NOTATION\">[NOTATION]<\/a><\/p>\n<details class=\"local-terms\" open=\"\"><summary>Terms used here<\/summary><p>This page defines the specialized vocabulary. Individual argument pages repeat the definitions needed to read that page directly. A bracketed page label is a navigation name, not a mathematical variable.<\/p><\/details>\n<h2>Tree<\/h2>\n<ul class=\"proof-tree\">\n<li><details open=\"\"><summary><strong>The objects being covered and used to cover them.<\/strong>\n<\/summary><ul>\n<li><strong>Unit hexagon:<\/strong> the closed regular hexagon <span class=\"math-inline\"><math aria-label=\"H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>H<\/mi>\n<\/math><\/span> with all six sides of length <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span>. It includes its perimeter and interior. Its center is <span class=\"math-inline\"><math aria-label=\"O=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<mo>=<\/mo>\n<mn>0<\/mn>\n<\/math><\/span>; its vertices <span class=\"math-inline\"><math aria-label=\"V_0,\\ldots,V_5\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>,<\/mo>\n<mo>…<\/mo>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>5<\/mn>\n<\/msub>\n<\/math><\/span> are ordered around the perimeter. Indices repeat modulo <span class=\"math-inline\"><math aria-label=\"6\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>6<\/mn>\n<\/math><\/span>.<\/li>\n<li><strong>Unit equilateral triangle:<\/strong> a triangle with three sides of length <span class=\"math-inline\"><math aria-label=\"1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<\/math><\/span>, in any position and orientation.<\/li>\n<li><strong>Open triangle <span class=\"math-inline\"><math aria-label=\"U\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>U<\/mi>\n<\/math><\/span>:<\/strong> its interior, excluding its three sides and vertices. <strong>Closure <span class=\"math-inline\"><math aria-label=\"T=\\overline U\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>T<\/mi>\n<mo>=<\/mo>\n<mover>\n<mi>U<\/mi>\n<mo accent=\"true\">―<\/mo>\n<\/mover>\n<\/math><\/span>:<\/strong> the same triangle with the sides and vertices included. Membership in <span class=\"math-inline\"><math aria-label=\"T\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>T<\/mi>\n<\/math><\/span> need not give membership in <span class=\"math-inline\"><math aria-label=\"U\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>U<\/mi>\n<\/math><\/span>.<\/li>\n<li><strong>Cover:<\/strong> every point of the stated set belongs to at least one of the seven open triangles. Covering only selected points or only the boundary is weaker than covering <span class=\"math-inline\"><math aria-label=\"H\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>H<\/mi>\n<\/math><\/span>.<\/li>\n<li><strong>C triangle:<\/strong> the open triangle <span class=\"math-inline\"><math aria-label=\"U_C\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>C<\/mi>\n<\/msub>\n<\/math><\/span> assigned to contain the center <span class=\"math-inline\"><math aria-label=\"O\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>O<\/mi>\n<\/math><\/span>. <strong>V triangle:<\/strong> the open triangle <span class=\"math-inline\"><math aria-label=\"U_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>U<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> assigned to contain vertex <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>. A <strong>role<\/strong> is simply one of these assignments. They are distinct by the diameter argument in <a class=\"node-link\" href=\"#/SETUP\">SETUP<\/a>.<\/li>\n<li><strong>Spoke <span class=\"math-inline\"><math aria-label=\"r_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>r<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>:<\/strong> the segment <span class=\"math-inline\"><math aria-label=\"[O,V_i]\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">[<\/mo>\n<mi>O<\/mi>\n<mo>,<\/mo>\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo stretchy=\"false\">]<\/mo>\n<\/math><\/span>, not an infinite ray. <strong>Own spoke:<\/strong> <span class=\"math-inline\"><math aria-label=\"r_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>r<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span> for the triangle at <span class=\"math-inline\"><math aria-label=\"V_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>. <strong>Neighboring spokes:<\/strong> <span class=\"math-inline\"><math aria-label=\"r_{i-1},r_{i+1}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>r<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>r<\/mi>\n<mrow data-mjx-texclass=\"ORD\">\n<mi>i<\/mi>\n<mo>+<\/mo>\n<mn>1<\/mn>\n<\/mrow>\n<\/msub>\n<\/math><\/span>.<\/li>\n<li><strong>Midpoint <span class=\"math-inline\"><math aria-label=\"M_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>M<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>:<\/strong> <span class=\"math-inline\"><math aria-label=\"V_i/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>V<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>, halfway along a spoke; never the midpoint of a perimeter edge in this guide.<\/li>\n<li><strong>Skeleton <span cla
