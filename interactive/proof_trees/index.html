own declared scalar variables, not the generic freely selected <span class=\"math-inline\"><math aria-label=\"a_i,b_i\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>a<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<mo>,<\/mo>\n<msub>\n<mi>b<\/mi>\n<mi>i<\/mi>\n<\/msub>\n<\/math><\/span>. The two adjacent charts are <span class=\"math-inline\"><math aria-label=\"X_0(x,y)=V_0+x(V_5-V_0)+y(V_1-V_0)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>X<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>x<\/mi>\n<mo>,<\/mo>\n<mi>y<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>+<\/mo>\n<mi>x<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>5<\/mn>\n<\/msub>\n<mo>−<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo stretchy=\"false\">)<\/mo>\n<mo>+<\/mo>\n<mi>y<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<mo>−<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span> and <span class=\"math-inline\"><math aria-label=\"X_1(x,y)=V_1+x(V_0-V_1)+y(V_2-V_1)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>X<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<mo stretchy=\"false\">(<\/mo>\n<mi>x<\/mi>\n<mo>,<\/mo>\n<mi>y<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>=<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<mo>+<\/mo>\n<mi>x<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<mo>−<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<mo stretchy=\"false\">)<\/mo>\n<mo>+<\/mo>\n<mi>y<\/mi>\n<mo stretchy=\"false\">(<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>2<\/mn>\n<\/msub>\n<mo>−<\/mo>\n<msub>\n<mi>V<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>. A template is an explicitly defined triangle in those coordinates. A strict margin is a positive difference that must survive the small displacement <span class=\"math-inline\"><math aria-label=\"\\varepsilon\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>ε<\/mi>\n<\/math><\/span>.<\/li>\n<\/ul><\/details>\n<p><strong>Below the oral cutoff.<\/strong> Source 2614 supplies a scalar replacement theorem; source 4144 verifies that the away Vd1 placement meets its inputs. Return to <a class=\"node-link\" href=\"#/REPLACEMENT\">[REPLACEMENT]<\/a>.<\/p>\n<h2>Tree<\/h2>\n<ul class=\"proof-tree\">\n<li><details open=\"\"><summary><strong>Establish the scalar inputs.<\/strong>\n<\/summary><ul>\n<li>In the two adjacent vertex charts, let <span class=\"math-inline\"><math aria-label=\"a,c\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>a<\/mi>\n<mo>,<\/mo>\n<mi>c<\/mi>\n<\/math><\/span> be the first role's incoming boundary and own-radial reaches to preserve.<\/li>\n<li>Let <span class=\"math-inline\"><math aria-label=\"B\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>B<\/mi>\n<\/math><\/span> be the second role's outgoing boundary reach, and <span class=\"math-inline\"><math aria-label=\"r\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>r<\/mi>\n<\/math><\/span> the radial demand needed to overlap the unchanged center.<\/li>\n<li>Verify <span class=\"math-inline\"><math aria-label=\"a&lt;1/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>a<\/mi>\n<mo>&lt;<\/mo>\n<mn>1<\/mn>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"a+c&lt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>a<\/mi>\n<mo>+<\/mo>\n<mi>c<\/mi>\n<mo>&lt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>, <span class=\"math-inline\"><math aria-label=\"a+B&lt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>a<\/mi>\n<mo>+<\/mo>\n<mi>B<\/mi>\n<mo>&lt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>, and <span class=\"math-inline\"><math aria-label=\"r&lt;\\max\\{1-a,1-B\\}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>r<\/mi>\n<mo>&lt;<\/mo>\n<mo data-mjx-texclass=\"OP\" movablelimits=\"true\">max<\/mo>\n<mo fence=\"false\" stretchy=\"false\">{<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>a<\/mi>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>B<\/mi>\n<mo fence=\"false\" stretchy=\"false\">}<\/mo>\n<\/math><\/span>.<\/li>\n<li>Placement-specific verification: source <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/4XXX_CE1CE2/41XX_Nplus1/414X_CE2_exactly_one_Vd1_Vd2_new/4144_new_two_chart_replacement_and_router.md\" rel=\"noopener noreferrer\" target=\"_blank\">4144<\/a>.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Choose strict parameters — source <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/2XXX_geometric_lemmas/26XX_enclosing_triangle_tools/2614_two_vertex_replacement.md\" rel=\"noopener noreferrer\" target=\"_blank\">2614<\/a>.<\/strong>\n<\/summary><ul>\n<li>Choose <span class=\"math-inline\"><math aria-label=\"a&lt;p_2&lt;1-B\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>a<\/mi>\n<mo>&lt;<\/mo>\n<msub>\n<mi>p<\/mi>\n<mn>2<\/mn>\n<\/msub>\n<mo>&lt;<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>B<\/mi>\n<\/math><\/span> with <span class=\"math-inline\"><math aria-label=\"\\max\\{p_2,1-p_2\\}&gt;r\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo data-mjx-texclass=\"OP\" movablelimits=\"true\">max<\/mo>\n<mo fence=\"false\" stretchy=\"false\">{<\/mo>\n<msub>\n<mi>p<\/mi>\n<mn>2<\/mn>\n<\/msub>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<msub>\n<mi>p<\/mi>\n<mn>2<\/mn>\n<\/msub>\n<mo fence=\"false\" stretchy=\"false\">}<\/mo>\n<mo>&gt;<\/mo>\n<mi>r<\/mi>\n<\/math><\/span>.<\/li>\n<li>Choose <span class=\"math-inline\"><math aria-label=\"a&lt;p_1&lt;\\min\\{p_2,1/2,1-c\\}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>a<\/mi>\n<mo>&lt;<\/mo>\n<msub>\n<mi>p<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<mo>&lt;<\/mo>\n<mo data-mjx-texclass=\"OP\" movablelimits=\"true\">min<\/mo>\n<mo fence=\"false\" stretchy=\"false\">{<\/mo>\n<msub>\n<mi>p<\/mi>\n<mn>2<\/mn>\n<\/msub>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>c<\/mi>\n<mo fence=\"false\" stretchy=\"false\">}<\/mo>\n<\/math><\/span>.<\/li>\n<li><details open=\"\"><summary>Choose <span class=\"math-inline\"><math aria-label=\"\\varepsilon&gt;0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>ε<\/mi>\n<mo>&gt;<\/mo>\n<mn>0<\/mn>\n<\/math><\/span> smaller than all five quantities:\n<\/summary><ul>\n<li><span class=\"math-inline\"><math aria-label=\"p_1-a\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>p<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<mo>−<\/mo>\n<mi>a<\/mi>\n<\/math><\/span>.<\/li>\n<li><span class=\"math-inline\"><math aria-label=\"p_2-p_1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>p<\/mi>\n<mn>2<\/mn>\n<\/msub>\n<mo>−<\/mo>\n<msub>\n<mi>p<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<\/math><\/span>.<\/li>\n<li><span class=\"math-inline\"><math aria-label=\"1-B-p_2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>B<\/mi>\n<mo>−<\/mo>\n<msub>\n<mi>p<\/mi>\n<mn>2<\/mn>\n<\/msub>\n<\/math><\/span>.<\/li>\n<li><span class=\"math-inline\"><math aria-label=\"1-p_1-c\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<mo>−<\/mo>\n<msub>\n<mi>p<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<mo>−<\/mo>\n<mi>c<\/mi>\n<\/math><\/span>.<\/li>\n<li><span class=\"math-inline\"><math aria-label=\"\\max\\{p_2,1-p_2\\}-r\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo data-mjx-texclass=\"OP\" movablelimits=\"true\">max<\/mo>\n<mo fence=\"false\" stretchy=\"false\">{<\/mo>\n<msub>\n<mi>p<\/mi>\n<mn>2<\/mn>\n<\/msub>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<msub>\n<mi>p<\/mi>\n<mn>2<\/mn>\n<\/msub>\n<mo fence=\"false\" stretchy=\"false\">}<\/mo>\n<mo>−<\/mo>\n<mi>r<\/mi>\n<\/math><\/span>.<\/li>\n<\/ul>\n<\/details><\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Use the correct template in each vertex chart.<\/strong>\n<\/summary><ul>\n<li>For <span class=\"math-inline\"><math aria-label=\"p\\le1/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>p<\/mi>\n<mo>≤<\/mo>\n<mn>1<\/mn>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>, the minus template is <span class=\"math-inline\"><math aria-label=\"\\operatorname{int}\\operatorname{conv}\\{(0,1-p),(1,1-p),(0,-p)\\}+(-\\varepsilon,0)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>int<\/mi>\n<mi>conv<\/mi>\n<mo fence=\"false\" stretchy=\"false\">{<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>0<\/mn>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>p<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>,<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>1<\/mn>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>p<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo>,<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>0<\/mn>\n<mo>,<\/mo>\n<mo>−<\/mo>\n<mi>p<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<mo fence=\"false\" stretchy=\"false\">}<\/mo>\n<mo>+<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mo>−<\/mo>\n<mi>ε<\/mi>\n<mo>,<\/mo>\n<mn>0<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>.<\/li>\n<li>For <span class=\"math-inline\"><math aria-label=\"p&gt;1/2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>p<\/mi>\n<mo>&gt;<\/mo>\n<mn>1<\/mn>\n<mrow data-mjx-texclass=\"ORD\">\n<mo>/<\/mo>\n<\/mrow>\n<mn>2<\/mn>\n<\/math><\/span>, the plus template is <span class=\"math-inline\"><math aria-label=\"\\operatorname{int}\\operatorname{conv}\\{(p,0),(p,1),(p-1,0)\\}+(0,-\\varepsilon)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>int<\/mi>\n<mi>conv<\/mi>\n<mo fence=\"false\" stretchy=\"false\">{<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mi>p<\/mi>\n<mo>,<\/mo>\n<mn>0<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<mo>,<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mi>p<\/mi>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<mo>,<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mi>p<\/mi>\n<mo>−<\/mo>\n<mn>1<\/mn>\n<mo>,<\/mo>\n<mn>0<\/mn>\n<mo stretchy=\"false\">)<\/mo>\n<mo fence=\"false\" stretchy=\"false\">}<\/mo>\n<mo>+<\/mo>\n<mo stretchy=\"false\">(<\/mo>\n<mn>0<\/mn>\n<mo>,<\/mo>\n<mo>−<\/mo>\n<mi>ε<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>.<\/li>\n<li>Here <span class=\"math-inline\"><math aria-label=\"\\operatorname{int}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>int<\/mi>\n<\/math><\/span> removes the sides and vertices, <span class=\"math-inline\"><math aria-label=\"\\operatorname{conv}\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mi>conv<\/mi>\n<\/math><\/span> means convex hull, and adding a vector translates every point. Use the minus template at <span class=\"math-inline\"><math aria-label=\"p_1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>p<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<\/math><\/span> in <span class=\"math-inline\"><math aria-label=\"X_0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>X<\/mi>\n<mn>0<\/mn>\n<\/msub>\n<\/math><\/span> and the appropriate template at <span class=\"math-inline\"><math aria-label=\"p_2\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>p<\/mi>\n<mn>2<\/mn>\n<\/msub>\n<\/math><\/span> in <span class=\"math-inline\"><math aria-label=\"X_1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msub>\n<mi>X<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<\/math><\/span>.<\/li>\n<li>The minus template has incoming, outgoing, and own-radial reaches <span class=\"math-inline\"><math aria-label=\"(p-\\varepsilon,1-p,1-p)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<mi>p<\/mi>\n<mo>−<\/mo>\n<mi>ε<\/mi>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>p<\/mi>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>p<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>.<\/li>\n<li>The plus template has reaches <span class=\"math-inline\"><math aria-label=\"(p,1-p-\\varepsilon,p)\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mo stretchy=\"false\">(<\/mo>\n<mi>p<\/mi>\n<mo>,<\/mo>\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>p<\/mi>\n<mo>−<\/mo>\n<mi>ε<\/mi>\n<mo>,<\/mo>\n<mi>p<\/mi>\n<mo stretchy=\"false\">)<\/mo>\n<\/math><\/span>.<\/li>\n<li>Both have actual boundary sum <span class=\"math-inline\"><math aria-label=\"1-\\varepsilon\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<mo>−<\/mo>\n<mi>ε<\/mi>\n<\/math><\/span> and no positive adjacent support.<\/li>\n<li>The two physical vertex charts are different; their axes must not be identified.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Check the five affected skeleton pieces.<\/strong>\n<\/summary><ul>\n<li>Incoming boundary and own spoke at the first vertex.<\/li>\n<li>Shared edge: the two new reaches sum to at least <span class=\"math-inline\"><math aria-label=\"1-p_1+p_2-\\varepsilon&gt;1\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<mn>1<\/mn>\n<mo>−<\/mo>\n<msub>\n<mi>p<\/mi>\n<mn>1<\/mn>\n<\/msub>\n<mo>+<\/mo>\n<msub>\n<mi>p<\/mi>\n<mn>2<\/mn>\n<\/msub>\n<mo>−<\/mo>\n<mi>ε<\/mi>\n<mo>&gt;<\/mo>\n<mn>1<\/mn>\n<\/math><\/span>.<\/li>\n<li>Outgoing boundary and own spoke at the second vertex.<\/li>\n<li>Every other skeleton piece is unchanged.<\/li>\n<\/ul>\n<\/details><\/li>\n<li><details open=\"\"><summary><strong>Read the conclusion.<\/strong>\n<\/summary><ul>\n<li>With four untouched nonsupercritical roles, the output has actual <span class=\"math-inline\"><math aria-label=\"N_+'=0\" xmlns=\"http://www.w3.org/1998/Math/MathML\">\n<msubsup>\n<mi>N<\/mi>\n<mo>+<\/mo>\n<mo data-mjx-alternate=\"1\">′<\/mo>\n<\/msubsup>\n<mo>=<\/mo>\n<mn>0<\/mn>\n<\/math><\/span>.<\/li>\n<li>The output gap rank may change; full interior coverage is not claimed.<\/li>\n<li>Finish with <a class=\"node-link\" href=\"#/N0\">[N0]<\/a>.<\/li>\n<\/ul>\n<\/details><\/li>\n<\/ul>\n<hr/>\n<p><strong>Proof sources:<\/strong> <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/2XXX_geometric_lemmas/26XX_enclosing_triangle_tools/2614_two_vertex_replacement.md\" rel=\"noopener noreferrer\" target=\"_blank\">2614<\/a> · <a class=\"external\" href=\"https://github.com/dylan0301/hexagon-cover-database/blob/f7fe2f89cde04903cba8ba347bd0645abee9b905/proof/4XXX_CE1CE2/41XX_Nplus1/414X_CE2_exactly_one_Vd1_Vd2_new/4144_new_two_chart_replacement_and_router.md\" rel=\"noopener noreferrer\" target=\"_blank\">4144<\/a>. All source links are pinned to the same repository snapshot.<\/p>\n<p><a class=\"node-link\" href=\"#/MAIN\">[MAIN]<\/a> Return to the main tree.<\/p>\n"}}</script>
<script>
'use strict';
const pages=JSON.parse(document.getElementById('proof-pages').textContent);
const content=document.getElementById('content');
const select=document.getElementById('page-select');
const trail=[];
let current=null;
const state=new Map();
function remember(){if(current)state.set(current,Array.from(content.querySelectorAll('details')).map(d=>d.open));}
function route(){
  let id=decodeURIComponent(location.hash.replace(/^#\//,''))||'MAIN';
  if(!pages[id])id='MAIN';
  if(current===id)return;
  remember();
  if(current)trail.push(current);
  current=id;
  const p=pages[id];
  content.innerHTML=p.html;
  if(state.has(id))content.querySelectorAll('details').forEach((d,i)=>d.open=state.get(id)[i]??true);
  select.value=id;
  document.title='['+id+'] '+p.title+' — Hexagon proof trees';
  document.getElementById('status').textContent=p.file+'  ·  Local Markdown links navigate within this viewer. Source links open the pinned GitHub proof.';
  document.getElementById('back').disabled=trail.length===0;
  window.scrollTo({top:0,behavior:'instant'});
}
window.addEventListener('hashchange',route);
select.addEventListener('change',()=>{location.hash='/'+select.value;});
document.getElementById('intro').addEventListener('click',()=>location.hash='/START');
document.getElementById('glossary').addEventListener('click',()=>location.hash='/GLOSSARY');
document.getElementById('home').addEventListener('click',()=>location.hash='/MAIN');
document.getElementById('expand').addEventListener('click',()=>content.querySelectorAll('details').forEach(d=>d.open=true));
document.getElementById('collapse').addEventListener('click',()=>content.querySelectorAll('details').forEach(d=>d.open=false));
document.getElementById('back').addEventListener('click',()=>{
 if(!trail.length)return;
 const target=trail.pop();
 remember();current=null;
 location.hash='/'+target;
 route();
});
// A label link navigates; clicking elsewhere in its summary toggles the branch.
content.addEventListener('click',ev=>{const a=ev.target.closest('a');if(a&&a.closest('summary'))ev.stopPropagation();});
route();
</script></body></html>
