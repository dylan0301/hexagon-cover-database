.form-check {

.form-check-input {

<body>
<div id="s2-chain-geometry">
  <div class="viz-controls">
    <label class="sr-only" for="s2-case">Strategy 2 certificate</label>
    <select class="form-select" id="s2-case">

<script>
(() => {
  const root = document.getElementById("s2-chain-geometry");
  if (!root) return;

  const svg = root.querySelector("#s2-stage");
  const caseSelect = root.querySelector("#s2-case");
  const prevButton = root.querySelector("#s2-prev");
  const nextButton = root.querySelector("#s2-next");
  const stepBox = root.querySelector("#s2-steps");
  const equationBox = root.querySelector("#s2-equation");
  const stateBox = root.querySelector("#s2-state");
  const centerLayer = root.querySelector("#s2-center-layer");
  const triangleLayer = root.querySelector("#s2-triangle-layer");
  const skeletonLayer = root.querySelector("#s2-skeleton-layer");
  const transferLayer = root.querySelector("#s2-transfer-layer");
  const labelLayer = root.querySelector("#s2-label-layer");

  const NS = "http://www.w3.org/2000/svg";
  const W = 760;
  const cx = 380;
  const cy = 295;
  const radius = 190;
  let activeCase = "exact5";
  let activeStep = 0;

  const mod6 = n => ((n % 6) + 6) % 6;
  const clamp = (x, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, x));
  const fmt = x => Number.isFinite(x) ? x.toFixed(3) : "—";
  const add = (p, q) => ({x: p.x + q.x, y: p.y + q.y});
  const sub = (p, q) => ({x: p.x - q.x, y: p.y - q.y});
  const mul = (p, t) => ({x: p.x * t, y: p.y * t});
  const mix = (p, q, t) => add(p, mul(sub(q, p), t));
  const norm = p => Math.hypot(p.x, p.y);
  const unit = p => {
    const n = norm(p) || 1;
    return {x: p.x / n, y: p.y / n};
  };
  const screen = p => ({x: cx + radius * p.x, y: cy + radius * p.y});
  const pointsAttr = pts => pts.map(p => `${p.x.toFixed(2)},${p.y.toFixed(2)}`).join(" ");

  const V = Array.from({length: 6}, (_, i) => ({
    x: Math.cos(i * Math.PI / 3),
    y: -Math.sin(i * Math.PI / 3)
  }));
  const O = {x: 0, y: 0};

  function svgEl(name, attrs, parent, text) {
    const node = document.createElementNS(NS, name);
    Object.entries(attrs || {}).forEach(([key, value]) => node.setAttribute(key, String(value)));
    if (text !== undefined) node.textContent = text;
    (parent || svg).appendChild(node);
    return node;
  }

  function clear(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
  }

  function line(parent, p, q, cls) {
    return svgEl("line", {x1: p.x, y1: p.y, x2: q.x, y2: q.y, class: cls}, parent);
  }

  function text(parent, p, value, cls, anchor = "middle") {
    return svgEl("text", {x: p.x, y: p.y, class: cls || "", "text-anchor": anchor}, parent, value);
  }

  function admissible(a, b, c) {
    const s = a + b;
    const d = a * a + a * b + b * b;
    const m = Math.min(a, b);
    const M = Math.max(a, b);
    const q = Math.pow(s, 4) - s * s + a * b;
    const FL = Math.pow(c, 4) - c * c + m * c - m * m;
    const FT = (s * s - 1) * c * c + M * c - M * M;
    const FS = (m * m - 1) * c * c + (2 * m * M * M + M) * c + Math.pow(M, 4) - M * M;
    const e = 1e-9;
    const L = d <= 1 + e && s <= 1 + e && q <= e && FL <= e;
    const T = d <= 1 + e && s <= 1 + e && q >= -e && FT <= e && c <= 2 * M + e;
    const S = d <= 1 + e && s > 1 - e && FS <= e && c <= 0.5 + e;
    return L || T || S;
  }

  function maxB(a, c) {
    let lo = 0;
    let hi = 1;
    for (let i = 0; i < 62; i += 1) {
      const mid = (lo + hi) / 2;
      if (admissible(a, mid, c)) lo = mid;
      else hi = mid;
    }
    return lo;
  }

  function gRaw(x, c) {
    return maxB(clamp(1 - x), clamp(c));
  }

  function gHatDual(a, c) {
    const x = 1 - clamp(a);
    return 1 - Math.min(gRaw(x, c), x);
  }

  function lowRoot(d) {
    const t = 1 - d;
    return t * (1 - Math.sqrt(Math.max(0, 4 * t * t - 3))) / 2;
  }

  function signed(R, alpha, delta) {
    const w = 1 - R;
    const E = Math.sqrt(1 - R * w);
    const eta = 1 - E;
    const P = E * eta;
    const k = eta + alpha + delta;
    const m3 = Math.min(alpha / R, delta / w);
    return {
      R,
      w,
      E,
      eta,
      P,
      alpha,
      delta,
      k,
      m3,
      xin: R - delta,
      hterm: k / (2 * R),
      deltaR: P - alpha - w * delta,
      deltaL: P - R * alpha - delta
    };
  }

  function cases() {
    const p1 = signed(0.66, 0.088, 0.048);
    const p2a = signed(0.60, 0.020, 0.090);
    const p2d = signed(0.60, 0.090, 0.020);
    const p2 = signed(0.60, 0.050, 0.050);
    const exact5c = [
      1 - p1.delta / p1.R,
      1 - p1.delta,
      1 - p1.m3,
      1 - p1.alpha,
      1 - p1.alpha / p1.w
    ];

    const oneA5 = p1.k / p1.R;
    const oneA1 = p1.R - p1.delta;
    const oneC5 = 1 - p1.alpha / p1.w;
    const oneC1 = 1 - p1.delta / p1.R;

    const twoA5 = p2.w - p2.alpha;
    const twoA1 = p2.R - p2.delta;
    const twoC5 = twoA5 / p2.w;
    const twoC1 = twoA1 / p2.R;

    return {
      exact5: {
        params: p1,
        gapMode: "one",
        start: p1.xin,
        equation: "Z=[ĝ<sub>c₁⁽⁵⁾</sub><sup>∨</sup>|ĝ<sub>c₂⁽⁵⁾</sub><sup>∨</sup>|ĝ<sub>c₃⁽⁵⁾</sub><sup>∨</sup>|ĝ<sub>c₄⁽⁵⁾</sub><sup>∨</sup>|ĝ<sub>c₅⁽⁵⁾</sub><sup>∨</sup>](x<sub>in</sub>)",
        slots: exact5c.map((c, j) => ({
          row: j + 1,
          dir: 1,
          c,
          relax: "exact",
          label: `ĝ∨c${j + 1}⁽⁵⁾`
        }))
      },
      ce1: {
        params: p1,
        gapMode: "one",
        start: p1.hterm,
        equation: "[ĝ<sub>1−α</sub><sup>∨,1−4α</sup>|ĝ<sub>1−m₃</sub><sup>∨,1−5m₃</sup>|ĝ<sub>1−δ</sub><sup>∨,th</sup>](h<sub>term</sub>) &gt; 1−x<sub>in</sub>",
        slots: [
          {row: 4, dir: -1, c: 1 - p1.alpha, relax: "affine", d: p1.alpha, lambda: 1 - 4 * p1.alpha, label: "ĝ∨,1−4α"},
          {row: 3, dir: -1, c: 1 - p1.m3, relax: "affine", d: p1.m3, lambda: 1 - 5 * p1.m3, label: "ĝ∨,1−5m₃"},
          {row: 2, dir: -1, c: 1 - p1.delta, relax: "threshold", d: p1.delta, label: "ĝ∨,th"}
        ]
      },
      ce2a: {
        params: p2a,
        gapMode: "two",
        start: p2a.xin,
        equation: "e(α)&lt;h<sub>term</sub>, [I|I|I|ĝ<sub>1−α</sub><sup>∨,th</sup>|I](x<sub>in</sub>) &gt; 1−h<sub>term</sub>",
        slots: [
          {row: 1, dir: 1, c: 1 - p2a.delta / p2a.R, relax: "identity", label: "I"},
          {row: 2, dir: 1, c: 1 - p2a.delta, relax: "identity", label: "I"},
          {row: 3, dir: 1, c: 1 - p2a.m3, relax: "identity", label: "I"},
          {row: 4, dir: 1, c: 1 - p2a.alpha, relax: "threshold", d: p2a.alpha, label: "ĝ∨,thα"},
          {row: 5, dir: 1, c: 1 - p2a.alpha / p2a.w, relax: "identity", label: "I"}
        ]
      },
      ce2d: {
        params: p2d,
        gapMode: "two",
        start: p2d.xin,
        equation: "e(α)≥h<sub>term</sub>&gt;e(δ), [I|ĝ<sub>1−δ</sub><sup>∨,th</sup>|I|I|I](x<sub>in</sub>) &gt; 1−h<sub>term</sub>",
        slots: [
          {row: 1, dir: 1, c: 1 - p2d.delta / p2d.R, relax: "identity", label: "I"},
          {row: 2, dir: 1, c: 1 - p2d.delta, relax: "threshold", d: p2d.delta, label: "ĝ∨,thδ"},
          {row: 3, dir: 1, c: 1 - p2d.m3, relax: "identity", label: "I"},
          {row: 4, dir: 1, c: 1 - p2d.alpha, relax: "identity", label: "I"},
          {row: 5, dir: 1, c: 1 - p2d.alpha / p2d.w, relax: "identity", label: "I"}
        ]
      },
      cycle: {
        start: 0.30,
        equation: "A₀&lt;A₁&lt;A₂&lt;A₃&lt;A₄&lt;A₅&lt;A₀, [I|I|I|I|I|I]",
        slots: Array.from({length: 6}, (_, j) => ({
          row: j,
          dir: 1,
          c: 0.80,
          relax: "identity",
          label: "I"
        }))
      },
      onegap: {
        params: p1,
        gapMode: "one",
        start: oneA5,
        equation: "ĝ<sub>c₅ᵒⁿᵉ</sub>(1−a₅ᵒⁿᵉ)+ĝ<sub>c₁ᵒⁿᵉ</sub>(1−a₁ᵒⁿᵉ)&lt;1, exact|I³|exact",
        slots: [
          {row: 5, dir: -1, c: oneC5, relax: "exact", label: "ĝ∨c₅ᵒⁿᵉ"},
          {row: 4, dir: -1, c: 0.82, relax: "identity", label: "I"},
          {row: 3, dir: -1, c: 0.82, relax: "identity", label: "I"},
          {row: 2, dir: -1, c: 0.82, relax: "identity", label: "I"},
          {row: 1, dir: -1, c: oneC1, relax: "exact", inputOverride: oneA1, breakBefore: true, label: "ĝ∨c₁ᵒⁿᵉ"}
        ]
      },
      twogap: {
        params: p2,
        gapMode: "two",
        start: twoA5,
        equation: "ĝ<sub>c₅ᵗʷᵒ</sub>(1−a₅ᵗʷᵒ)+ĝ<sub>c₁ᵗʷᵒ</sub>(1−a₁ᵗʷᵒ)&lt;1, exact|I³|exact",
        slots: [
          {row: 5, dir: -1, c: twoC5, relax: "exact", label: "ĝ∨c₅ᵗʷᵒ"},
          {row: 4, dir: -1, c: 0.80, relax: "identity", label: "I"},
          {row: 3, dir: -1, c: 0.80, relax: "identity", label: "I"},
          {row: 2, dir: -1, c: 0.80, relax: "identity", label: "I"},
          {row: 1, dir: -1, c: twoC1, relax: "exact", inputOverride: twoA1, breakBefore: true, label: "ĝ∨c₁ᵗʷᵒ"}
        ]
      },
      t3: {
        params: p1,
        gapMode: "two",
        special: "t3",
        start: 0.31,
        equation: "a₁*=ℛ<sub>J₊</sub>(b₀₁), a₅*=ℛ<sub>J₋</sub>(b₀₅), ĝ<sub>c₅*</sub>(1−a₅*)+ĝ<sub>c₁*</sub>(1−a₁*)&lt;1",
        slots: [
          {row: 5, dir: -1, c: 0.76, relax: "exact", label: "ĝ∨c₅*"},
          {row: 4, dir: -1, c: 0.82, relax: "identity", label: "I"},
          {row: 3, dir: -1, c: 0.82, relax: "identity", label: "I"},
          {row: 2, dir: -1, c: 0.82, relax: "identity", label: "I"},
          {row: 1, dir: -1, c: 0.88, relax: "exact", inputOverride: 0.47, breakBefore: true, label: "ĝ∨c₁*"}
        ]
      }
    };
  }

  const caseData = cases();

  function computeState(slot, prior) {
    const input = clamp(slot.inputOverride === undefined ? prior : slot.inputOverride);
    let exact;
    let b;
    let lower;

    if (slot.relax === "sc") {
      b = clamp(slot.actualB);
      exact = 1 - b;
      lower = 1 - slot.scCap;
    } else {
      exact = gHatDual(input, slot.c);
      b = 1 - exact;
      if (slot.relax === "identity") {
        lower = input;
      } else if (slot.relax === "affine") {
        lower = input + slot.lambda * (input - slot.d);
      } else if (slot.relax === "threshold") {
        const e = lowRoot(slot.d);
        lower = input <= e ? input : 1 - e;
      } else {
        lower = exact;
      }
    }

    lower = clamp(Math.min(exact, lower));
    return {
      ...slot,
      input,
      exact,
      lower,
      b,
      gap: Math.max(0, exact - lower)
    };
  }

  function buildStates(data) {
    const out = [];
    let prior = data.start;
    data.slots.forEach(slot => {
      const state = computeState(slot, prior);
      out.push(state);
      prior = state.lower;
    });
    return out;
  }

  function triangleLoss(points, theta) {
    const q = {x: Math.cos(theta), y: Math.sin(theta)};
    const r = {x: Math.cos(theta + Math.PI / 3), y: Math.sin(theta + Math.PI / 3)};
    const det = q.x * r.y - q.y * r.x;
    let minL = Infinity;
    let minM = Infinity;
    let maxSum = -Infinity;
    points.forEach(p => {
      const l = (p.x * r.y - p.y * r.x) / det;
      const m = (-p.x * q.y + p.y * q.x) / det;
      minL = Math.min(minL, l);
      minM = Math.min(minM, m);
      maxSum = Math.max(maxSum, l + m);
    });
    return {value: maxSum - minL - minM, q, r, minL, minM};
  }

  function enclosingUnitTriangle(points) {
    const samples = 300;
    let bestTheta = 0;
    let best = triangleLoss(points, 0);
    for (let i = 1; i < samples; i += 1) {
      const theta = 2 * Math.PI * i / samples;
      const now = triangleLoss(points, theta);
      if (now.value < best.value) {
        best = now;
        bestTheta = theta;
      }
    }
    let lo = bestTheta - 2 * Math.PI / samples;
    let hi = bestTheta + 2 * Math.PI / samples;
    for (let i = 0; i < 34; i += 1) {
      const a = lo + (hi - lo) / 3;
      const b = hi - (hi - lo) / 3;
      if (triangleLoss(points, a).value <= triangleLoss(points, b).value) hi = b;
      else lo = a;
    }
    best = triangleLoss(points, (lo + hi) / 2);
    const z = add(mul(best.q, best.minL), mul(best.r, best.minM));
    return [z, add(z, best.q), add(z, best.r)];
  }

  function convexHull(points) {
    const unique = [];
    points
      .slice()
      .sort((p, q) => p.x === q.x ? p.y - q.y : p.x - q.x)
      .forEach(p => {
        const last = unique[unique.length - 1];
        if (!last || Math.hypot(p.x - last.x, p.y - last.y) > 1e-9) unique.push(p);
      });
    if (unique.length <= 2) return unique;
    const cross = (a, b, c) =>
      (b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x);
    const lower = [];
    unique.forEach(p => {
      while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 1e-10) {
        lower.pop();
      }
      lower.push(p);
    });
    const upper = [];
    unique.slice().reverse().forEach(p => {
      while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 1e-10) {
        upper.pop();
      }
      upper.push(p);
    });
    lower.pop();
    upper.pop();
    return lower.concat(upper);
  }

  function rowGeometry(state) {
    const i = state.row;
    const outgoing = mod6(i + state.dir);
    const incoming = mod6(i - state.dir);
    const vi = V[i];
    const vin = V[incoming];
    const vout = V[outgoing];
    const pin = mix(vi, vin, state.input);
    const pout = mix(vi, vout, clamp(state.b - 0.00003));
    const prad = mix(vi, O, state.c);
    const hull = convexHull([vi, pin, prad, pout]);
    const triangle = enclosingUnitTriangle(hull);
    const exactPoint = mix(vi, vout, 1 - state.exact);
    const lowerPoint = mix(vi, vout, 1 - state.lower);
    return {
      i,
      incoming,
      outgoing,
      vi,
      vin,
      vout,
      pin,
      pout,
      prad,
      hull,
      triangle,
      exactPoint,
      lowerPoint
    };
  }

  function centerTriangle(params) {
    if (!params) return null;
    const {R, w, alpha, delta, k} = params;
    const equations = [
      {a: -1, b: w, d: -R - alpha},
      {a: w, b: R, d: k},
      {a: R, b: -1, d: -w - delta}
    ];
    const solve = (u, v) => {
      const det = u.a * v.b - u.b * v.a;
      return {
        a: (u.d * v.b - u.b * v.d) / det,
        b: (u.a * v.d - u.d * v.a) / det
      };
    };
    const local = [
      solve(equations[0], equations[1]),
      solve(equations[1], equations[2]),
      solve(equations[2], equations[0])
    ];
    return local.map(p => add(V[0], add(mul(sub(V[5], V[0]), p.a), mul(sub(V[1], V[0]), p.b))));
  }

  function stripPolygon(a, b, width) {
    const d = sub(b, a);
    const n = unit({x: -d.y, y: d.x});
    return [
      add(a, mul(n, width)),
      add(b, mul(n, width)),
      add(b, mul(n, -width)),
      add(a, mul(n, -width))
    ];
  }

  function drawSkeleton() {
    clear(skeletonLayer);
    const hex = V.map(screen);
    svgEl("polygon", {points: pointsAttr(hex), class: "s2-skeleton"}, skeletonLayer);
    V.forEach(v => line(skeletonLayer, screen(v), screen(O), "s2-ray"));
    V.forEach(v => svgEl("circle", {cx: screen(v).x, cy: screen(v).y, r: 3.1, class: "s2-point"}, skeletonLayer));
    svgEl("circle", {cx, cy, r: 3.1, class: "s2-point"}, skeletonLayer);
  }

  function drawCenter(data) {
    clear(centerLayer);
    const tri = centerTriangle(data.params);
    if (tri) {
      svgEl("polygon", {
        points: pointsAttr(tri.map(screen)),
        class: "s2-center-triangle"
      }, centerLayer);
    }
    if (!data.params || !data.gapMode) return;

    const p = data.params;
    const rightL = clamp(p.k / p.R);
    const rightU = clamp(p.w + p.delta);
    line(centerLayer, screen(mix(V[0], V[1], rightL)), screen(mix(V[0], V[1], rightU)), "s2-center-trace");
    const midR = (rightL + rightU) / 2;
    const halfR = Math.min(0.055, Math.max(0.001, (rightU - rightL) / 5), Math.max(0, (rightU - rightL) * 0.45));
    line(centerLayer, screen(mix(V[0], V[1], midR - halfR)), screen(mix(V[0], V[1], midR + halfR)), "s2-vgap");

    if (data.gapMode === "two") {
      const leftL = clamp(p.k / p.w);
      const leftU = clamp(p.R + p.alpha);
      line(centerLayer, screen(mix(V[0], V[5], leftL)), screen(mix(V[0], V[5], leftU)), "s2-center-trace");
      const midL = (leftL + leftU) / 2;
      const halfL = Math.min(0.055, Math.max(0.001, (leftU - leftL) / 5), Math.max(0, (leftU - leftL) * 0.45));
      line(centerLayer, screen(mix(V[0], V[5], midL - halfL)), screen(mix(V[0], V[5], midL + halfL)), "s2-vgap");
    }
  }

  function drawSpecial(data) {
    if (data.special === "t3") {
      const pseudo = {row: 0, dir: 1, input: 0.28, b: 0.24, c: 0.56};
      const geo = rowGeometry(pseudo);
      svgEl("polygon", {
        points: pointsAttr(geo.triangle.map(screen)),
        class: "s2-unit-triangle s2-special"
      }, triangleLayer);
      svgEl("polygon", {
        points: pointsAttr(geo.hull.map(screen)),
        class: "s2-hull s2-special"
      }, triangleLayer);
      text(labelLayer, add(screen(V[0]), {x: 28, y: -18}), "T̃₀", "s2-detail-label");
      text(labelLayer, screen(mix(V[0], V[1], 0.49)), "J₊", "s2-detail-label");
      text(labelLayer, screen(mix(V[0], V[5], 0.49)), "J₋", "s2-detail-label");
    }
    if (data.special === "rescuer") {
      const pseudo = {row: 0, dir: -1, input: 0.26, b: 0.22, c: 0.40};
      const geo = rowGeometry(pseudo);
      svgEl("polygon", {
        points: pointsAttr(geo.triangle.map(screen)),
        class: "s2-unit-triangle s2-special"
      }, triangleLayer);
      svgEl("polygon", {
        points: pointsAttr(geo.hull.map(screen)),
        class: "s2-hull s2-special"
      }, triangleLayer);
      const r1a = screen(mix(V[1], O, 0.34));
      const r1b = screen(mix(V[1], O, 0.68));
      line(transferLayer, r1a, r1b, "s2-exact");
      text(labelLayer, add(screen(V[0]), {x: 31, y: 22}), "T̃ᵣₑₛ", "s2-detail-label");
      text(labelLayer, add(screen(mix(V[1], O, 0.52)), {x: 20, y: 0}), "[cᵣₑₛ,uᵣₑₛ]", "s2-detail-label", "start");
    }
  }

  function drawState(state, index, current) {
    const geo = rowGeometry(state);
    const triClass = current ? "s2-unit-triangle s2-current" : "s2-unit-triangle";
    const hullClass = current ? "s2-hull s2-current" : "s2-hull";

    svgEl("polygon", {points: pointsAttr(geo.triangle.map(screen)), class: triClass}, triangleLayer);
    svgEl("polygon", {points: pointsAttr(geo.hull.map(screen)), class: hullClass}, triangleLayer);

    const alpha = current ? 1 : 0.42;
    const group = svgEl("g", {opacity: alpha}, transferLayer);
    line(group, screen(geo.vi), screen(geo.pin), "s2-incoming");
    line(group, screen(geo.vi), screen(geo.prad), "s2-radial-demand");
    line(group, screen(geo.vout), screen(geo.exactPoint), "s2-exact");
    line(group, screen(geo.vout), screen(geo.lowerPoint), "s2-lower");

    if (state.gap > 0.0015) {
      const poly = stripPolygon(screen(geo.exactPoint), screen(geo.lowerPoint), current ? 6 : 4);
      svgEl("polygon", {
        points: pointsAttr(poly),
        fill: "url(#s2-relax-hatch)",
        stroke: "var(--viz-series-4)",
        "stroke-width": current ? 1.5 : 0.8
      }, group);
    } else if (state.relax !== "exact") {
      svgEl("circle", {
        cx: screen(geo.exactPoint).x,
        cy: screen(geo.exactPoint).y,
        r: current ? 5 : 3,
        fill: "var(--background)",
        stroke: "var(--viz-series-4)",
        "stroke-width": 1.5
      }, group);
    }

    const a0 = screen(mul(geo.vi, 1.18));
    const a1 = screen(mul(geo.vout, 1.18));
    const arrowClass = current ? "s2-chain-arrow s2-current" : "s2-chain-arrow";
    line(transferLayer, a0, a1, arrowClass);

    if (state.breakBefore) {
      const m = screen(mix(geo.vi, geo.vout, 0.10));
      const edge = unit(sub(screen(geo.vout), screen(geo.vi)));
      const n = {x: -edge.y, y: edge.x};
      line(transferLayer, add(m, add(mul(edge, -4), mul(n, -8))), add(m, add(mul(edge, -4), mul(n, 8))), "s2-break");
      line(transferLayer, add(m, add(mul(edge, 4), mul(n, -8))), add(m, add(mul(edge, 4), mul(n, 8))), "s2-break");
    }

    if (current) {
      const sv = screen(geo.vi);
      svgEl("circle", {cx: sv.x, cy: sv.y, r: 9, class: "s2-current-ring"}, labelLayer);
      svgEl("circle", {cx: sv.x, cy: sv.y, r: 3.1, class: "s2-point"}, labelLayer);
      const centroid = screen(mul(add(add(geo.triangle[0], geo.triangle[1]), geo.triangle[2]), 1 / 3));
      text(labelLayer, add(centroid, {x: 0, y: -10}), `Δ${state.row}*∈𝔈₁`, "s2-current-text s2-detail-label");
      text(labelLayer, add(centroid, {x: 0, y: 10}), `K(${fmt(state.input)},${fmt(state.b)},${fmt(state.c)})`, "s2-current-text s2-detail-label");
    }

    return geo;
  }

  function drawLabels(states) {
    V.forEach((v, i) => {
      const p = screen(mul(v, 1.10));
      const isCurrent = states[activeStep] && states[activeStep].row === i;
      text(labelLayer, p, `T${i}`, isCurrent ? "s2-current-text" : "");
    });
    text(labelLayer, {x: cx + 10, y: cy - 10}, "O", "s2-detail-label", "start");
  }

  function mapSymbol(state) {
    if (state.relax === "exact") return "Φ̲ⱼ=Φⱼ";
    if (state.relax === "identity") return "Φ̲ⱼ=I";
    if (state.relax === "affine") return `Φ̲ⱼ(z)=z+${fmt(state.lambda)}(z−${fmt(state.d)})`;
    if (state.relax === "threshold") return `Φ̲ⱼ=ĝ∨,th₁₋${fmt(state.d)}`;
    return `Φ̲ⱼ=1−gᶜˢᶜ_${fmt(state.c)}`;
  }

  function updateControls(states) {
    clear(stepBox);
    states.forEach((state, i) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = i === activeStep ? "btn btn-primary" : "btn btn-ghost";
      button.textContent = `T${state.row}`;
      button.setAttribute("aria-pressed", i === activeStep ? "true" : "false");
      button.setAttribute("aria-label", `Row T${state.row}, slot ${i + 1}`);
      button.addEventListener("click", () => {
        activeStep = i;
        render();
      });
      stepBox.appendChild(button);
    });
    prevButton.disabled = activeStep === 0;
    nextButton.disabled = activeStep === states.length - 1;
  }

  function updateText(data, states) {
    equationBox.innerHTML = data.equation;
    const state = states[activeStep];
    const relation = state.gap <= 0.0006 ? "=" : "≥";
    stateBox.innerHTML = [
      `<span>T<sub>${state.row}</sub>: K(${fmt(state.input)},${fmt(state.b)},${fmt(state.c)})⊂Δ<sub>${state.row}</sub><sup>*</sup>∈𝔈₁</span>`,
      `<span>Φ<sub>${activeStep + 1}</sub>(${fmt(state.input)})=${fmt(state.exact)}</span>`,
      `<span>${mapSymbol(state)}, Φ̲<sub>${activeStep + 1}</sub>(${fmt(state.input)})=${fmt(state.lower)}</span>`,
      `<span>Φ<sub>${activeStep + 1}</sub>−Φ̲<sub>${activeStep + 1}</sub>${relation}${fmt(state.gap)}</span>`
    ].join("");
  }

  function render() {
    const data = caseData[activeCase];
    const states = buildStates(data);
    activeStep = Math.max(0, Math.min(activeStep, states.length - 1));
    clear(triangleLayer);
    clear(transferLayer);
    clear(labelLayer);
    drawCenter(data);
    drawSkeleton();
    states.forEach((state, i) => drawState(state, i, i === activeStep));
    drawSpecial(data);
    drawLabels(states);
    updateControls(states);
    updateText(data, states);
  }

  caseSelect.addEventListener("change", () => {
    activeCase = caseSelect.value;
    activeStep = 0;
    render();
  });
  prevButton.addEventListener("click", () => {
    activeStep = Math.max(0, activeStep - 1);
    render();
  });
  nextButton.addEventListener("click", () => {
    const n = caseData[activeCase].slots.length;
    activeStep = Math.min(n - 1, activeStep + 1);
    render();
  });
  root.addEventListener("keydown", event => {
    if (event.key === "ArrowLeft" && document.activeElement !== caseSelect) {
      activeStep = Math.max(0, activeStep - 1);
      render();
    }
    if (event.key === "ArrowRight" && document.activeElement !== caseSelect) {
      activeStep = Math.min(caseData[activeCase].slots.length - 1, activeStep + 1);
      render();
    }
  });

  const resize = () => {
    const measured = svg.getBoundingClientRect().width;
    if (measured < 40) {
      root.style.setProperty("--s2-svg-font", "14px");
      return;
    }
    const width = measured;
    const needed = Math.max(14, 11 * W / width);
    root.style.setProperty("--s2-svg-font", `${needed.toFixed(2)}px`);
  };
  if (typeof ResizeObserver !== "undefined") {
    const observer = new ResizeObserver(resize);
    observer.observe(svg);
  }
  window.addEventListener("resize", resize);

  render();
  resize();
})();
</script>

<script id="codex-visualization-floating-ui-dom" src="https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js"></script>

<script id="codex-visualization-tooltip">/* oxlint-disable typescript/no-unsafe-argument, typescript/no-unsafe-call, typescript/no-unsafe-return */
// Runs inside the visualization sandbox, not the host webview.
(() => {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set(["top", "right", "bottom", "left"]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =>
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest("[data-tooltip]")
      : null;
  const containsTarget = (trigger, target) =>
    target?.nodeType != null && trigger.contains(target);
  const getContent = (trigger) =>
    trigger.getAttribute("data-tooltip")?.trim() ?? "";
  const getPlacement = (trigger) => {
    const placement = trigger.getAttribute("data-tooltip-placement");
    return tooltipPlacements.has(placement) ? placement : "top";
  };
  const getTooltip = () => {
    if (tooltip == null) {
      tooltip = document.createElement("div");
      tooltip.id = tooltipId;
      tooltip.className = "tooltip";
      tooltip.setAttribute("role", "tooltip");
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) => {
    const ids = new Set(
      (trigger.getAttribute("aria-describedby") ?? "")
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute("aria-describedby");
    } else {
      trigger.setAttribute("aria-describedby", [...ids].join(" "));
    }
  };
  const clearOpenTimeout = () => {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) => {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) => {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              "--tooltip-available-width",
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              "--tooltip-available-height",
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: "fixed",
    })
      .then(({ x, y }) => {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = "visible";
      })
      .catch(() => {
        if (activeTrigger === trigger && request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) => {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = "hidden";
    floating.style.transform = "translate(0, 0)";
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () => {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) => {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() < skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() => {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) => {
    if (event.pointerType === "touch") {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) => {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) => {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(":focus-visible")) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) => {
    if (event.key === "Escape") {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) => {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () => {
    closeTooltip(false);
    document.removeEventListener("pointerover", handlePointerOpen);
    document.removeEventListener("pointerout", handleLeave);
    document.removeEventListener("focusin", handleFocusIn);
    document.removeEventListener("focusout", handleLeave);
    document.removeEventListener("keydown", handleKeyDown);
    document.removeEventListener("contextmenu", handleContextMenu);
    tooltip = null;
  };

  document.addEventListener("pointerover", handlePointerOpen);
  document.addEventListener("pointerout", handleLeave);
  document.addEventListener("focusin", handleFocusIn);
  document.addEventListener("focusout", handleLeave);
  document.addEventListener("keydown", handleKeyDown);
  document.addEventListener("contextmenu", handleContextMenu);
  window.addEventListener("pagehide", destroy, { once: true });
})();
</script>
<script id="codex-visualization-lucide-initialization">(() => {
  const initialize = () => {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById("codex-visualization-lucide")
    ?.addEventListener("load", initialize, { once: true });
