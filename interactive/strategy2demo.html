<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strategy 2 Demo — Exact Geometry Explorer</title>
<style>
:root {
  color-scheme: light;
  --paper: #f5f2eb;
  --plot: #fffefa;
  --ink: #172129;
  --muted: #657078;
  --hair: #d8d5cd;
  --blue: #2878aa;
  --coral: #df745e;
  --gold: #d7a433;
  --violet: #8067a6;
  --teal: #288a80;
  --green: #4d8a62;
  --warn: #9d641b;
  --shadow: 0 18px 55px rgba(39, 43, 45, .11);
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(circle at 12% 0%, rgba(255,255,255,.9), transparent 36rem),
    var(--paper);
  color: var(--ink);
  font: 14px/1.4 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
button, select { font: inherit; color: inherit; }
button, select, summary, a, [tabindex] { -webkit-tap-highlight-color: transparent; }
button:focus-visible, select:focus-visible, summary:focus-visible, a:focus-visible, .drag-handle:focus-visible {
  outline: 3px solid rgba(40, 138, 128, .42);
  outline-offset: 3px;
}
a { color: #176e9c; }
.skip {
  position: fixed;
  z-index: 20;
  left: 1rem;
  top: -5rem;
  padding: .65rem .85rem;
  border-radius: .5rem;
  background: var(--ink);
  color: white;
}
.skip:focus { top: 1rem; }
.page {
  width: min(1320px, 100%);
  margin: 0 auto;
  padding: clamp(14px, 2.5vw, 28px);
}
.masthead {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: 16px;
}
.eyebrow {
  margin: 0 0 3px;
  color: var(--teal);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .16em;
  text-transform: uppercase;
}
h1 {
  margin: 0;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(27px, 4vw, 43px);
  font-weight: 500;
  letter-spacing: -.035em;
  line-height: 1;
}
.reference {
  flex: none;
  border: 1px solid var(--hair);
  border-radius: 999px;
  padding: 6px 10px;
  background: rgba(255,255,255,.55);
  color: var(--muted);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .09em;
  text-transform: uppercase;
}
.shell {
  overflow: hidden;
  border: 1px solid #d2cfc7;
  border-radius: 18px;
  background: var(--plot);
  box-shadow: var(--shadow);
}
.family-tabs {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  border-bottom: 1px solid var(--hair);
  background: #f0eee7;
}
.family-tab {
  min-height: 58px;
  border: 0;
  border-right: 1px solid var(--hair);
  padding: 9px 11px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  text-align: left;
}
.family-tab:last-child { border-right: 0; }
.family-tab span {
  display: block;
  margin-bottom: 2px;
  color: inherit;
  font-size: 9px;
  font-weight: 850;
  letter-spacing: .1em;
  text-transform: uppercase;
}
.family-tab strong { font-size: 12px; }
.family-tab[aria-selected="true"] {
  box-shadow: inset 0 -3px var(--teal);
  background: var(--plot);
  color: var(--ink);
}
.toolbar {
  display: grid;
  grid-template-columns: auto minmax(260px, 1fr) auto auto;
  gap: 9px;
  align-items: center;
  padding: 12px 14px;
  border-bottom: 1px solid var(--hair);
}
.toolbar label {
  color: var(--muted);
  font-size: 10px;
  font-weight: 850;
  letter-spacing: .08em;
  text-transform: uppercase;
}
select, .icon-button, .step-button {
  min-height: 38px;
  border: 1px solid #cbc8c0;
  border-radius: 8px;
  background: white;
}
select { width: 100%; padding: 6px 32px 6px 10px; }
.icon-button, .step-button {
  padding: 7px 11px;
  cursor: pointer;
}
.icon-button:hover, .step-button:hover { border-color: var(--teal); }
.plot-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 58px;
  padding: 10px 15px;
}
.instruction {
  margin: 0;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(15px, 2vw, 19px);
}
.chips {
  display: flex;
  justify-content: flex-end;
  gap: 6px;
  flex-wrap: wrap;
}
.chip {
  border: 1px solid var(--hair);
  border-radius: 999px;
  padding: 5px 9px;
  background: #f4f2ec;
  color: var(--muted);
  font: 700 10px/1.1 ui-monospace, SFMono-Regular, Menlo, monospace;
  white-space: nowrap;
}
.chip.ok { border-color: #b9d5c1; background: #edf6ef; color: #2f7047; }
.chip.relax { border-color: #e2c996; background: #fff6df; color: var(--warn); }
.plot-wrap {
  position: relative;
  border-block: 1px solid var(--hair);
  background:
    linear-gradient(rgba(112, 107, 97, .04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(112, 107, 97, .04) 1px, transparent 1px),
    var(--plot);
  background-size: 24px 24px;
}
svg {
  display: block;
  width: 100%;
  height: min(68vh, 720px);
  min-height: 470px;
  touch-action: none;
}
.skeleton-edge { fill: none; stroke: #252b30; stroke-width: 3; stroke-linejoin: round; }
.radial-arm { stroke: #a5a39d; stroke-width: 1.35; stroke-dasharray: 5 6; }
.vertex-dot { fill: #20272c; }
.vertex-label, .mid-label, .role-label, .measure-label {
  paint-order: stroke;
  stroke: var(--plot);
  stroke-width: 5px;
  stroke-linejoin: round;
  fill: #29323a;
  font-family: Georgia, "Times New Roman", serif;
}
.vertex-label { font-size: 15px; font-style: italic; }
.mid-label { fill: #7e7b75; font-size: 12px; font-style: italic; }
.midpoint { fill: var(--plot); stroke: #777873; stroke-width: 1.5; }
.triangle {
  vector-effect: non-scaling-stroke;
  stroke-width: 2.1;
  stroke-linejoin: round;
  transition: opacity 180ms ease;
}
.role-c { fill: rgba(40,120,170,.19); stroke: var(--blue); }
.role-vd0 { fill: rgba(215,164,51,.19); stroke: #c28711; }
.role-super { fill: rgba(223,116,94,.18); stroke: var(--coral); }
.role-t3 { fill: rgba(128,103,166,.17); stroke: var(--violet); }
.role-vd { fill: rgba(40,138,128,.17); stroke: var(--teal); }
.role-relax {
  fill: url(#relaxPattern);
  stroke: var(--warn);
  stroke-width: 2.2;
  stroke-dasharray: 8 5;
}
.role-after {
  fill: rgba(77,138,98,.13);
  stroke: var(--green);
  stroke-dasharray: 3 4;
}
.role-ghost {
  fill: none;
  stroke: #aaa59a;
  stroke-dasharray: 5 6;
  opacity: .65;
}
.role-label { font-size: 13px; font-weight: 700; }
.measure-label { fill: var(--muted); font: 10px ui-monospace, SFMono-Regular, monospace; }
.trace {
  fill: none;
  stroke-width: 5;
  stroke-linecap: round;
}
.trace-center { stroke: var(--blue); }
.trace-gap { stroke: var(--coral); stroke-width: 7; }
.trace-t3 { stroke: var(--violet); stroke-dasharray: 4 4; }
.trace-vd { stroke: var(--teal); stroke-dasharray: 3 4; }
.handoff {
  fill: var(--plot);
  stroke: var(--coral);
  stroke-width: 2;
}
.helper {
  fill: none;
  stroke: #9b968c;
  stroke-width: 1.2;
  stroke-dasharray: 3 5;
}
.constraint-mark { fill: none; stroke: var(--green); stroke-width: 2; }
.drag-handle {
  fill: var(--plot);
  stroke-width: 3;
  cursor: grab;
  filter: url(#handleShadow);
}
.drag-handle:active { cursor: grabbing; }
.drag-handle[data-kind="center"] { stroke: var(--blue); }
.drag-handle[data-kind="vd0"] { stroke: #c28711; }
.drag-handle[data-kind="super"] { stroke: var(--coral); }
.drag-handle[data-kind="t3"] { stroke: var(--violet); }
.drag-handle[data-kind="vd"] { stroke: var(--teal); }
.hidden-step { opacity: .055; pointer-events: none; }
.limit-line { stroke: var(--coral); stroke-width: 1.5; stroke-dasharray: 2 5; }
.step-bar {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto auto;
  gap: 10px;
  align-items: center;
  padding: 11px 14px;
}
.step-count {
  color: var(--muted);
  font: 700 10px ui-monospace, SFMono-Regular, Menlo, monospace;
  white-space: nowrap;
}
.step-name {
  overflow: hidden;
  font-weight: 750;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.step-dots { display: flex; gap: 4px; }
.step-dot {
  width: 7px;
  height: 7px;
  border: 0;
  border-radius: 50%;
  padding: 0;
  background: #d4d0c7;
  cursor: pointer;
}
.step-dot.on { background: var(--teal); }
.below {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  align-items: start;
  padding: 10px 14px 13px;
  border-top: 1px solid var(--hair);
  background: #f8f6f0;
}
details { min-width: 0; }
summary {
  width: fit-content;
  cursor: pointer;
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
}
.exact-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 7px;
  margin-top: 9px;
}
.datum {
  overflow: hidden;
  border-left: 2px solid #d5d0c5;
  padding-left: 7px;
  color: var(--muted);
  font: 10px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
}
.datum strong { display: block; overflow: hidden; color: var(--ink); text-overflow: ellipsis; }
.proof-link {
  min-height: 34px;
  border: 1px solid var(--hair);
  border-radius: 8px;
  padding: 7px 10px;
  background: white;
  font-size: 11px;
  font-weight: 800;
  text-decoration: none;
  white-space: nowrap;
}
.proof-link:hover { border-color: var(--blue); }
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  white-space: nowrap;
}
@media (max-width: 820px) {
  .family-tabs { grid-template-columns: 1fr; }
  .family-tab {
    min-height: 43px;
    border-right: 0;
    border-bottom: 1px solid var(--hair);
  }
  .family-tab span, .family-tab strong { display: inline; margin-right: 6px; }
  .toolbar { grid-template-columns: 1fr auto auto; }
  .toolbar label { grid-column: 1 / -1; }
  .plot-head { align-items: flex-start; flex-direction: column; }
  .chips { justify-content: flex-start; }
  svg { height: 58vh; min-height: 410px; }
  .exact-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 520px) {
  .masthead { align-items: flex-start; flex-direction: column; }
  .toolbar { grid-template-columns: 1fr auto; }
  .toolbar select { grid-column: 1 / -1; }
  .step-bar { grid-template-columns: 1fr auto auto; }
  .step-count { display: none; }
  .step-dots { grid-column: 1 / -1; }
  .below { grid-template-columns: 1fr; }
  .proof-link { width: fit-content; }
  .exact-grid { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
}
</style>
</head>
<body>
<a class="skip" href="#explorer">Skip to explorer</a>
<div class="page">
  <header class="masthead">
    <div>
      <p class="eyebrow">Hexagon covering · proof geometry</p>
      <h1>Strategy 2 case explorer</h1>
    </div>
    <span class="reference">Reference visualization</span>
  </header>

  <main id="explorer" class="shell">
    <nav id="familyTabs" class="family-tabs" aria-label="Strategy 2 proof families"></nav>

    <div class="toolbar">
      <label for="sceneSelect">Geometric state <span id="sceneCount"></span></label>
      <select id="sceneSelect" aria-describedby="dragHint"></select>
      <button id="reflectButton" class="icon-button" type="button" title="Open the reflected state">Reflect</button>
      <button id="resetButton" class="icon-button" type="button">Reset</button>
    </div>

    <section aria-labelledby="sceneTitle">
      <div class="plot-head">
        <p id="sceneTitle" class="instruction"></p>
        <div id="chips" class="chips" aria-live="polite"></div>
      </div>

      <div class="plot-wrap">
        <svg id="plot" viewBox="0 0 1000 680" role="img" aria-labelledby="svgTitle svgDesc">
          <title id="svgTitle">Exact Strategy 2 geometric state</title>
          <desc id="svgDesc">Interactive hexagon diagram. Use Tab to reach a contact handle, then use arrow keys to vary its exact proof parameter.</desc>
          <defs>
            <pattern id="relaxPattern" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
              <line x1="0" y1="0" x2="0" y2="8" stroke="#c89432" stroke-width="2" opacity=".3"></line>
            </pattern>
            <filter id="handleShadow" x="-80%" y="-80%" width="260%" height="260%">
              <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity=".24"></feDropShadow>
            </filter>
          </defs>
          <g id="skeletonLayer"></g>
          <g id="traceLayer"></g>
          <g id="triangleLayer"></g>
          <g id="annotationLayer"></g>
          <g id="handleLayer"></g>
        </svg>
        <p id="dragHint" class="sr-only">Drag a circular contact handle. Arrow keys move it by one proof-parameter step; Shift plus an arrow uses a larger step.</p>
      </div>

      <div class="step-bar" aria-label="Proof construction sequence">
        <span id="stepCount" class="step-count"></span>
        <strong id="stepName" class="step-name"></strong>
        <button id="backButton" class="step-button" type="button">Back</button>
        <button id="nextButton" class="step-button" type="button">Reveal</button>
        <div id="stepDots" class="step-dots" aria-label="Choose construction step"></div>
      </div>

      <div class="below">
        <details>
          <summary>Exact data</summary>
          <div id="exactData" class="exact-grid"></div>
        </details>
        <a id="proofLink" class="proof-link" href="#">Open canonical proof ↗</a>
      </div>
    </section>
  </main>
</div>

<script>
(() => {
  "use strict";

  const NS = "http://www.w3.org/2000/svg";
  const SQ3 = Math.sqrt(3);
  const SQ3_2 = SQ3 / 2;
  const EPS = 1e-9;
  const CENTER = { x: 500, y: 336 };
  const HEX_SIDE = 238;
  const COLORS = {
    c: "#2878aa", vd0: "#c28711", super: "#df745e",
    t3: "#8067a6", vd: "#288a80", relax: "#9d641b", after: "#4d8a62"
  };

  const PATHS = {
    center: "../proof/2XXX_geometric_lemmas/21XX_C_triangle_geometry/2109_signed_CE1_CE2_center_normal_form.md",
    admissible: "../proof/2XXX_geometric_lemmas/20XX_V_triangle_geometry/2004_admissible_set.md",
    map: "../proof/2XXX_geometric_lemmas/20XX_V_triangle_geometry/2011_capped_demand_map.md",
    t3: "../proof/2XXX_geometric_lemmas/20XX_V_triangle_geometry/2013_T3_like_side_tradeoff.md",
    vd: "../proof/2XXX_geometric_lemmas/20XX_V_triangle_geometry/2014_Vd1_Vd2_corner_normal_form.md",
    f1: "../proof/4XXX_CE1CE2/40XX_Nplus0/401X_all_Vd0_boundary_loss/4013_boundary_loss_index.md",
    f2: "../proof/4XXX_CE1CE2/40XX_Nplus0/407X_T3_like_no_Vd1Vd2/4070_CE1CE2_Nplus0_T3_like_no_Vd1Vd2_index.md",
    f3ce1: "../proof/4XXX_CE1CE2/41XX_Nplus1/410X_all_Vd0/4106_CE1_one_gap_five_map_completion.md",
    f3ce2: "../proof/4XXX_CE1CE2/41XX_Nplus1/410X_all_Vd0/4107_CE2_one_gap_five_map_completion.md",
    f3two: "../proof/4XXX_CE1CE2/41XX_Nplus1/410X_all_Vd0/4102_CE2_two_gap_completion.md",
    f4: "../proof/4XXX_CE1CE2/41XX_Nplus1/413X_exactly_one_T3_like/4132_CE1_CE2_exactly_one_T3_like_boundary_obstruction.md",
    f5adjacent: "../proof/4XXX_CE1CE2/41XX_Nplus1/414X_CE2_exactly_one_Vd1_Vd2/4144_CE2_Nplus1_T0_supercritical_T1_Vd1_Vd2_adjacent_obstruction.md",
    f5nonadjacent: "../proof/4XXX_CE1CE2/41XX_Nplus1/414X_CE2_exactly_one_Vd1_Vd2/4146_CE2_Nplus1_T0_supercritical_nonadjacent_Vd1_Vd2_obstruction.md",
    f5tau0: "../proof/4XXX_CE1CE2/41XX_Nplus1/414X_CE2_exactly_one_Vd1_Vd2/4143_CE2_Nplus1_T0_Vd1_M1_T1_supercritical_obstruction.md",
    f5replacement: "../proof/4XXX_CE1CE2/41XX_Nplus1/414X_CE2_exactly_one_Vd1_Vd2/4147_CE2_Nplus1_Vd1_supercritical_pair_axis_replacement.md"
  };

  const FAMILIES = [
    { id: 1, short: "N₊=0 · all Vd0", title: "Center-gap states" },
    { id: 2, short: "N₊=0 · T3-like", title: "Support isolation" },
    { id: 3, short: "N₊=1 · all Vd0", title: "Five-row propagation" },
    { id: 4, short: "N₊=1 · one T3-like", title: "Forced tail" },
    { id: 5, short: "CE2 · one Vd1/Vd2", title: "Exact placements" }
  ];

  const $ = id => document.getElementById(id);
  const plot = $("plot");
  const layers = {
    skeleton: $("skeletonLayer"),
    trace: $("traceLayer"),
    triangle: $("triangleLayer"),
    annotation: $("annotationLayer"),
    handle: $("handleLayer")
  };

  const V = Array.from({ length: 6 }, (_, i) => {
    const angle = -i * Math.PI / 3;
    return { x: CENTER.x + HEX_SIDE * Math.cos(angle), y: CENTER.y + HEX_SIDE * Math.sin(angle) };
  });
  const M = V.map(p => midpoint(CENTER, p));

  const state = {
    family: 1,
    sceneId: "",
    step: 0,
    params: {},
    drag: null
  };

  function n(value, digits = 3) {
    if (!Number.isFinite(value)) return "—";
    const rounded = Math.abs(value) < 5e-13 ? 0 : value;
    return rounded.toFixed(digits).replace(/\.?0+$/, "");
  }
  function clamp(x, lo, hi) { return Math.max(lo, Math.min(hi, x)); }
  function add(p, q) { return { x: p.x + q.x, y: p.y + q.y }; }
  function sub(p, q) { return { x: p.x - q.x, y: p.y - q.y }; }
  function mul(p, k) { return { x: p.x * k, y: p.y * k }; }
  function dot(p, q) { return p.x * q.x + p.y * q.y; }
  function norm(p) { return Math.hypot(p.x, p.y); }
  function unit(p) { const d = norm(p) || 1; return mul(p, 1 / d); }
  function midpoint(p, q) { return mul(add(p, q), .5); }
  function rotate(p, a) {
    return { x: p.x * Math.cos(a) - p.y * Math.sin(a), y: p.x * Math.sin(a) + p.y * Math.cos(a) };
  }
  function cross(p, q) { return p.x * q.y - p.y * q.x; }
  function polygonCenter(points) {
    return mul(points.reduce((s, p) => add(s, p), { x: 0, y: 0 }), 1 / points.length);
  }
  function lineIntersection(l1, l2) {
    const det = l1.A * l2.B - l2.A * l1.B;
    if (Math.abs(det) < 1e-12) return null;
    return {
      x: (l1.C * l2.B - l2.C * l1.B) / det,
      y: (l1.A * l2.C - l2.A * l1.C) / det
    };
  }
  function triangleFromLines(lines) {
    const out = [];
    for (let i = 0; i < lines.length; i++) {
      for (let j = i + 1; j < lines.length; j++) {
        const p = lineIntersection(lines[i], lines[j]);
        if (p && lines.every(l => l.A * p.x + l.B * p.y <= l.C + 1e-7)) out.push(p);
      }
    }
    const c = polygonCenter(out);
    return out.sort((p, q) => Math.atan2(p.y - c.y, p.x - c.x) - Math.atan2(q.y - c.y, q.x - c.x));
  }

  function svgEl(tag, attrs = {}, parent = null) {
    const node = document.createElementNS(NS, tag);
    Object.entries(attrs).forEach(([key, value]) => {
      if (value !== undefined && value !== null) node.setAttribute(key, String(value));
    });
    if (parent) parent.appendChild(node);
    return node;
  }
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
  function pointsAttr(points) { return points.map(p => `${n(p.x, 2)},${n(p.y, 2)}`).join(" "); }

  function basisAt(i) {
    return {
      x: unit(sub(V[(i + 5) % 6], V[i])),
      y: unit(sub(V[(i + 1) % 6], V[i]))
    };
  }
  function affineToScreen(i, x, y) {
    const b = basisAt(i);
    return add(V[i], mul(add(mul(b.x, x), mul(b.y, y)), HEX_SIDE));
  }
  function screenToAffine(i, p) {
    const d = mul(sub(p, V[i]), 1 / HEX_SIDE);
    const b = basisAt(i);
    const det = cross(b.x, b.y);
    return {
      x: cross(d, b.y) / det,
      y: cross(b.x, d) / det
    };
  }
  function canonicalToScreen(i, p) {
    const a = p.x + p.y / SQ3;
    const b = p.x - p.y / SQ3;
    return affineToScreen(i, a, b);
  }

  function centerData(kind, overrides = {}) {
    const base = kind === "CE1"
      ? { R: .5, alpha: .04, delta: .10 }
      : { R: .5, alpha: .05, delta: .05 };
    const p = { ...base, ...overrides };
    p.R = clamp(p.R, .08, .92);
    p.alpha = Math.max(.0005, p.alpha);
    p.delta = Math.max(.0005, p.delta);
    const compute = () => {
      p.W = 1 - p.R;
      p.E = Math.sqrt(1 - p.R * p.W);
      p.eta = 1 - p.E;
      p.P = p.E * (1 - p.E);
      p.k = p.eta + p.alpha + p.delta;
      p.deltaR = p.P - p.alpha - p.W * p.delta;
      p.deltaL = p.P - p.R * p.alpha - p.delta;
    };
    compute();
    if (p.deltaR <= .0001 || (kind === "CE1" && p.deltaL > 0) || (kind === "CE2" && p.deltaL <= .0001)) {
      Object.assign(p, base);
      compute();
    }
    const lines = [
      { A: 1, B: -p.W, C: p.R + p.alpha, id: "F0" },
      { A: -p.W, B: -p.R, C: -p.k, id: "F1" },
      { A: -p.R, B: 1, C: p.W + p.delta, id: "F2" }
    ];
    p.localPolygon = triangleFromLines(lines);
    p.screenPolygon = p.localPolygon.map(q => affineToScreen(0, q.x, q.y));
    p.rightTrace = [p.k / p.R, p.W + p.delta];
    p.leftTrace = kind === "CE2" ? [p.k / p.W, p.R + p.alpha] : null;
    return p;
  }

  function projectCenterDelta(kind, R, alpha, target, extraUpper = Infinity) {
    const W = 1 - R;
    const E = Math.sqrt(1 - R * W);
    const P = E * (1 - E);
    const margin = .00012;
    const lower = kind === "CE1" ? Math.max(.0005, P - R * alpha + .00002) : .0005;
    const signUpper = kind === "CE2" ? P - R * alpha - margin : Infinity;
    const upper = Math.min(.235, (P - alpha - margin) / W, signUpper, extraUpper);
    if (upper <= lower) return clamp(target, .0005, .235);
    return clamp(target, lower, upper);
  }

  function lMin(a, b, c) {
    const s = a + b;
    if (s < EPS) return c;
    const D = Math.sqrt(a * a + a * b + b * b);
    if (c * s <= a * b + EPS) return D;
    const Ra = Math.sqrt(a * a - a * c + c * c);
    const Rb = Math.sqrt(b * b - b * c + c * c);
    const Loa = b + Math.max(a, c);
    const Lbo = a + Math.max(b, c);
    let Lac;
    if (a >= c) Lac = (a * a + b * c) / Ra;
    else if (c <= a + b) Lac = c * (a + b) / Ra;
    else Lac = c * c / Ra;
    let Lcb;
    if (b >= c) Lcb = (b * b + a * c) / Rb;
    else if (c <= a + b) Lcb = c * (a + b) / Rb;
    else Lcb = c * c / Rb;
    return Math.min(Loa, Lbo, Lac, Lcb);
  }

  function maxAdmissibleB(a, c) {
    let lo = 0, hi = 1;
    for (let k = 0; k < 58; k++) {
      const mid = (lo + hi) / 2;
      if (lMin(a, mid, c) <= 1 + 2e-13) lo = mid;
      else hi = mid;
    }
    return lo;
  }

  function projectSupercriticalA(target, c) {
    const clipped = clamp(target, .04, .9);
    const isStrict = a => a + maxAdmissibleB(a, c) > 1.002;
    if (isStrict(clipped)) return clipped;
    let best = null, distance = Infinity;
    for (let i = 0; i <= 500; i++) {
      const a = .04 + .86 * i / 500;
      if (isStrict(a) && Math.abs(a - clipped) < distance) {
        best = a;
        distance = Math.abs(a - clipped);
      }
    }
    return best ?? .58;
  }

  function mapF(a, c) {
    const full = 1 - a;
    if (c <= .5 || c >= 1) {
      const B = maxAdmissibleB(a, c);
      return { b: Math.min(B, full), label: B >= full - 1e-8 ? "Full" : "exact 2004" };
    }
    const h = 2 * c / (Math.sqrt(16 * c * c - 3) + 1);
    const tm = Math.sqrt(a * a - a * c + c * c) / c - a;
    const disc = (2 * a * c * c + c) ** 2 - 4 * (1 - c * c) * (1 - a * a) * c * c;
    const tp = 2 * (1 - a * a) * c * c / (2 * a * c * c + c + Math.sqrt(Math.max(0, disc)));
    if (c <= SQ3_2) {
      if (a <= 1 - c || a >= c) return { b: full, label: "Full" };
      if (a < h) return { b: tp, label: "T₊" };
      if (a === h) return { b: h, label: "T₊ = T₋" };
      return { b: tm, label: "T₋" };
    }
    const root = Math.sqrt(4 * c * c - 3);
    const ell = c * (1 - root) / 2;
    const r = c - ell;
    if (a <= 1 - c || a >= c) return { b: full, label: "Full", ell, r };
    if (a <= ell) return { b: tp, label: "T₊", ell, r };
    if (a < r) return { b: ell, label: "L", ell, r };
    return { b: tm, label: "T₋", ell, r };
  }

  function convexHull(points) {
    const sorted = [...points].sort((p, q) => p.x - q.x || p.y - q.y);
    if (sorted.length <= 2) return sorted;
    const turn = (o, a, b) => cross(sub(a, o), sub(b, o));
    const lower = [];
    sorted.forEach(p => {
      while (lower.length >= 2 && turn(lower[lower.length - 2], lower[lower.length - 1], p) <= EPS) lower.pop();
      lower.push(p);
    });
    const upper = [];
    [...sorted].reverse().forEach(p => {
      while (upper.length >= 2 && turn(upper[upper.length - 2], upper[upper.length - 1], p) <= EPS) upper.pop();
      upper.push(p);
    });
    lower.pop(); upper.pop();
    return [...lower, ...upper];
  }

  function enclosingUnitTriangle(a, b, c) {
    const O = { x: 0, y: 0 };
    const A = { x: a / 2, y: a * SQ3_2 };
    const B = { x: b / 2, y: -b * SQ3_2 };
    const C = { x: c, y: 0 };
    const hull = convexHull([O, A, B, C]);
    const center = polygonCenter(hull);
    const candidates = [];
    for (let i = 0; i < hull.length; i++) {
      const p = hull[i], q = hull[(i + 1) % hull.length];
      let normal = unit({ x: q.y - p.y, y: -(q.x - p.x) });
      if (dot(center, normal) > dot(p, normal)) normal = mul(normal, -1);
      const normals = [normal, rotate(normal, 2 * Math.PI / 3), rotate(normal, 4 * Math.PI / 3)];
      const hs = normals.map(nn => Math.max(...hull.map(x => dot(x, nn))));
      const side = 2 * hs.reduce((s, x) => s + x, 0) / SQ3;
      candidates.push({ normals, hs, side, contact: `support edge ${i + 1}` });
    }
    candidates.sort((x, y) => x.side - y.side);
    const best = candidates[0];
    const grow = Math.max(0, 1 - best.side) / (2 * SQ3);
    const lines = best.normals.map((nn, i) => ({ A: nn.x, B: nn.y, C: best.hs[i] + grow }));
    return {
      polygon: triangleFromLines(lines),
      minSide: best.side,
      contact: best.contact
    };
  }

  function t3Data(D, R, a, reflect, extra = {}) {
    const s = D - R;
    const r = -R;
    const tau = a * D;
    const lines = [
      { A: -s, B: r, C: 0 },
      { A: D, B: -s, C: tau },
      { A: r, B: D, C: 1 - tau }
    ];
    let polygon = triangleFromLines(lines);
    if (reflect) polygon = polygon.map(p => ({ x: p.y, y: p.x }));
    return {
      polygon, D, R, a, tau,
      edgeSum: 1 / D,
      radialFirst: (D * (1 + a) - 1) / R,
      radialLast: 1 - R / D + a,
      ...extra
    };
  }

  function t3RescuerTriangle(reflect = false, overrides = {}) {
    const D = clamp(overrides.D ?? 1.055, 1.0001, 2 / SQ3 - .000001);
    const E = Math.sqrt(4 - 3 * D * D);
    const R = (D + E) / 2;
    const amin = E / (2 * D);
    const amax = (4 - 3 * D + E) / (4 * D);
    const frac = clamp(overrides.frac ?? .5, .001, .999);
    const a = overrides.a ?? amin + frac * (amax - amin);
    return t3Data(D, R, a, reflect, { E, frac, amin, amax, sheet: 1, mode: "rescuer" });
  }

  function t3BoundaryTriangle(reflect = false, overrides = {}) {
    const D = clamp(overrides.D ?? 1.10, 1.0001, 2 / SQ3 - .000001);
    const E = Math.sqrt(4 - 3 * D * D);
    const sheet = overrides.sheet === 1 ? 1 : -1;
    const R = (D + sheet * E) / 2;
    const amin = .00001;
    const amax = R / (D * (D + 1));
    const frac = clamp(overrides.frac ?? .5, .001, .999);
    const a = overrides.a ?? amin + frac * (amax - amin);
    return t3Data(D, R, a, reflect, { E, frac, amin, amax, sheet, mode: "boundary" });
  }

  function t3ContainsCenterExit(data, gamma) {
    return 1 - data.radialLast <= gamma && gamma <= 1 - data.radialFirst;
  }
  function projectT3Fraction(D, sheet, target, gamma, wantHit) {
    const clipped = clamp(target, .001, .999);
    const matches = frac => t3ContainsCenterExit(t3BoundaryTriangle(false, { D, sheet, frac }), gamma) === wantHit;
    if (matches(clipped)) return clipped;
    let best = null, distance = Infinity;
    for (let i = 0; i <= 500; i++) {
      const frac = .001 + .998 * i / 500;
      if (matches(frac) && Math.abs(frac - clipped) < distance) {
        best = frac;
        distance = Math.abs(frac - clipped);
      }
    }
    return best ?? clipped;
  }

  function vdTriangle(type = "Vd1", reflect = false, overrides = {}) {
    const defaultShape = type === "Vd2"
      ? { t: .6, a: .08, b: .15 }
      : { t: 1.5, a: .06, b: .20 };
    const t = clamp(overrides.t ?? defaultShape.t, .28, 3.6);
    const d = Math.sqrt(t * t + t + 1);
    let a = clamp(overrides.a ?? defaultShape.a, .0002, .32);
    let b = clamp(overrides.b ?? defaultShape.b, .0002, .32);
    if (a + b >= .48) {
      const f = .47 / (a + b);
      a *= f; b *= f;
    }
    const lines = [
      { A: 1, B: -(t + 1), C: a },
      { A: -(t + 1), B: t, C: t * b },
      { A: t, B: 1, C: d - a - t * b }
    ];
    let polygon = triangleFromLines(lines);
    if (reflect) polygon = polygon.map(p => ({ x: p.y, y: p.x }));
    const ray1 = [t * (1 - b) / (t + 1), (d - a - t * b - 1) / t];
    const ray5 = [(1 - a) / (t + 1), d - a - t * b - t];
    return { polygon, t, d, a, b, ray1, ray5, c0: (d - a - t * b) / (t + 1) };
  }

  function intervalLength(interval) {
    return Math.max(0, Math.min(1, interval[1]) - Math.max(0, interval[0]));
  }
  function vdPredicate(type, t, a, b) {
    const data = vdTriangle(type, false, { t, a, b });
    const positive = [data.ray1, data.ray5].filter(interval => intervalLength(interval) > 1e-7).length;
    const hasM1 = data.ray1[0] <= .5 && .5 <= data.ray1[1];
    const hasM5 = data.ray5[0] <= .5 && .5 <= data.ray5[1];
    return type === "Vd1" ? positive === 1 : positive === 2 && !hasM1 && !hasM5;
  }
  function projectVdParameter(type, target, a, b) {
    const clipped = clamp(target, .28, 3.6);
    if (vdPredicate(type, clipped, a, b)) return clipped;
    let best = null, distance = Infinity;
    for (let i = 0; i <= 900; i++) {
      const t = .28 + i * (3.6 - .28) / 900;
      if (vdPredicate(type, t, a, b) && Math.abs(t - clipped) < distance) {
        best = t;
        distance = Math.abs(t - clipped);
      }
    }
    return best ?? (type === "Vd2" ? .6 : 1.5);
  }

  function projectVdRescueParameter(type, target, a, b, localReflect, rescueRay, centerReach = null) {
    const matches = t => {
      if (!vdPredicate(type, t, a, b)) return false;
      const data = vdTriangle(type, false, { t, a, b });
      const shownRay1 = localReflect ? data.ray5 : data.ray1;
      const shownRay5 = localReflect ? data.ray1 : data.ray5;
      const interval = rescueRay === "r5" ? shownRay5 : shownRay1;
      return interval[0] <= .4995 && .5 <= interval[1]
        && (centerReach === null || centerReach + 1e-9 >= 1 - interval[1]);
    };
    const clipped = clamp(target, .28, 3.6);
    if (matches(clipped)) return clipped;
    let best = null, distance = Infinity;
    for (let i = 0; i <= 1200; i++) {
      const t = .28 + i * (3.6 - .28) / 1200;
      if (matches(t) && Math.abs(t - clipped) < distance) {
        best = t;
        distance = Math.abs(t - clipped);
      }
    }
    return best ?? 1.5;
  }

  function makeFamily1() {
    const out = [];
    [["CE1", "no"], ["CE1", "left"], ["CE1", "right"], ["CE2", "no"],
      ["CE2", "left"], ["CE2", "right"], ["CE2", "two"]].forEach(([ce, gap]) => {
      const gapText = gap === "no" ? "no active gap" : gap === "two" ? "two active gaps" : `one ${gap} gap`;
      out.push({
        id: `f1-${ce.toLowerCase()}-${gap}`, family: 1, ce, gap,
        label: `${ce} · ${gapText}`,
        title: `${ce}: ${gapText}. Reveal the exact boundary construction.`,
        source: PATHS.f1,
        reflect: gap === "left" ? `f1-${ce.toLowerCase()}-right` : gap === "right" ? `f1-${ce.toLowerCase()}-left` : null,
        steps: gap === "no"
          ? ["Place exact center", "Mark open handoffs", "Force positive overlap"]
          : gap === "two"
            ? ["Place exact center", "Maximize T₅", "Maximize T₁", "Compare endpoint outputs"]
            : ["Place exact center", "Maximize T₅", "Relax axis-aligned T₀", "Maximize T₁", "Compare endpoint outputs"]
      });
    });
    return out;
  }

  function makeFamily2() {
    const out = [];
    ["CE1", "CE2"].forEach(ce => {
      ["r1", "r5"].forEach(support => {
        ["hit", "miss"].forEach(hit => {
          const side = support === "r1" ? "right" : "left";
          out.push({
            id: `f2-${ce.toLowerCase()}-${support}-${hit}`,
            family: 2, ce, support, hit,
            label: `${ce} · ${support} support · center ${hit}`,
            title: `${ce}: isolate the ${side} T3-like support and its exact endpoint demand.`,
            source: PATHS.f2,
            reflect: `f2-${ce.toLowerCase()}-${support === "r1" ? "r5" : "r1"}-${hit}`,
            steps: ["Place exact center", "Translate T₀ to T3-like normal form", "Isolate selected support", "Place universal endpoint comparator", "Apply strict capped output"]
          });
        });
      });
    });
    return out;
  }

  function makeFamily3() {
    return [["CE1", "left"], ["CE1", "right"], ["CE2", "left"], ["CE2", "right"], ["CE2", "two"]].map(([ce, gap]) => ({
      id: `f3-${ce.toLowerCase()}-${gap}`, family: 3, ce, gap,
      label: `${ce} · ${gap === "two" ? "two gaps" : `${gap} positive gap`}`,
      title: gap === "two"
        ? "CE2: compare the two exact endpoint caps and the center-free three-row path."
        : `${ce}: propagate the exact positive-gap demand around five Vd0 rows.`,
      source: gap === "two" ? PATHS.f3two : ce === "CE1" ? PATHS.f3ce1 : PATHS.f3ce2,
      reflect: gap === "left" ? `f3-${ce.toLowerCase()}-right` : gap === "right" ? `f3-${ce.toLowerCase()}-left` : null,
      steps: gap === "two"
        ? ["Place exact center", "Place unique supercritical row", "Maximize T₅ endpoint cap", "Maximize T₁ endpoint cap", "Expose the center-free path budget"]
        : ["Place exact center", "Relax T₀ to its exact admissible capacity", "Propagate to T₁", "Propagate to T₂", "Propagate to T₃", "Propagate to T₄", "Propagate to T₅", "Close the return inequality"]
    }));
  }

  function makeFamily4() {
    const out = [];
    ["left", "right"].forEach(side => out.push({
      id: `f4-ce1-direct-${side}`, family: 4, ce: "CE1", side, regime: "direct",
      label: `CE1 · direct tail · ${side} reflection`,
      title: `CE1: T₀ is T3-like, T₁ is supercritical, and the four-row tail is forced.`,
      source: PATHS.f4,
      reflect: `f4-ce1-direct-${side === "left" ? "right" : "left"}`,
      steps: ["Place exact center", "Place midpoint-rescuing T3-like T₀", "Place the strict supercritical envelope", "Verify center hiding", "Expose the four-row Vd0 path budget"]
    }));
    [
      ["past", "T≤a"],
      ["inside", "S≤a<T"],
      ["before", "a<S"]
    ].forEach(([regime, regimeLabel]) => {
      ["left", "right"].forEach(side => out.push({
        id: `f4-ce2-${regime}-${side}`, family: 4, ce: "CE2", side, regime,

        label: `CE2 · ${regimeLabel} · ${side} reflection`,
        title: `CE2: compare the T3-like boundary reach a with the companion trace [S,T].`,
        source: PATHS.f4,
        reflect: `f4-ce2-${regime}-${side === "left" ? "right" : "left"}`,
        steps: ["Place exact center", "Place midpoint-rescuing T3-like T₀", "Place the strict supercritical envelope", `Verify ${regimeLabel}`, "Verify center hiding", "Expose the four-row Vd0 path budget"]
      }));
    });

  }

  function makeFamily5() {
    const out = [];
    for (let tau = 1; tau <= 5; tau++) {
      ["Vd1", "Vd2"].forEach(type => out.push({
        id: `f5-s0-t${tau}-${type.toLowerCase()}`, family: 5, ce: "CE2",
        sigma: 0, tau, type, category: tau === 1 || tau === 5 ? "adjacent" : "nonadjacent",
        label: `σ=0 · τ=${tau} · ${type}`,
        title: `CE2: T₀ is supercritical and T${subscript(tau)} is the unique ${type} row.`,
        source: tau === 1 || tau === 5 ? PATHS.f5adjacent : PATHS.f5nonadjacent,
        reflect: tau === 3 ? null : `f5-s0-t${6 - tau}-${type.toLowerCase()}`,
        steps: ["Place exact center", "Place supercritical T₀", `Place ${type} T${subscript(tau)}`, tau === 1 || tau === 5 ? "Test adjacent radial cap" : "Test nonadjacent boundary cap", "Expose obstruction"]
      }));

      title: `CE2: T₀ is Vd1 and rescues the neighboring midpoint of supercritical T${subscript(sigma)}.`,

    }));

      id: `f5-s${sigma}-t${tau}-vd1`, family: 5, ce: "CE2",
      sigma, tau, type: "Vd1", category: "replacement",
      label: `σ=${sigma} · τ=${tau} · Vd1 replacement`,
      title: `CE2: replace the adjacent Vd1–supercritical rescue pair by two Vd0 rows.`,
      source: PATHS.f5replacement,

  function subscript(i) {
    return String(i).split("").map(x => "₀₁₂₃₄₅₆₇₈₉"[Number(x)]).join("");
  }

  const SCENES = [...makeFamily1(), ...makeFamily2(), ...makeFamily3(), ...makeFamily4(), ...makeFamily5()];
  const SCENE_BY_ID = new Map(SCENES.map(scene => [scene.id, scene]));

  function defaultsFor(scene) {
    let center;
    if (scene.family === 2) {

        : { R: .1, alpha: .005, delta: .035 };
    } else if (scene.family === 4 && scene.ce === "CE1") {

    } else if (scene.family === 4 && scene.regime === "past") {

    } else if (scene.family === 4 && scene.regime === "inside") {
      center = { R: .113222979599377, alpha: .000514880012754, delta: .044993337016789 };
    } else if (scene.family === 4 && scene.regime === "before") {

    } else if (scene.family === 5 && (scene.category === "tau0" || scene.category === "replacement")) {
      center = { R: .1, alpha: .001, delta: .0406 };
    } else if (scene.family === 5) {
      center = { R: .5, alpha: .015, delta: .015 };
    } else {
      center = scene.ce === "CE1"
        ? { R: .5, alpha: .04, delta: .10 }
        : { R: .5, alpha: .05, delta: .05 };
    }

      center,
      demandC: scene.family === 2 ? .90 : .78,
      t3D: scene.family === 2 ? 1.10
        : scene.regime === "past" ? 1.15466392054997
          : scene.regime === "inside" ? 1.154691003236756
            : scene.regime === "before" ? 1.15469512415621
              : scene.family === 4 ? 1.154691003236756 : 1.045,
      t3Sheet: -1,
      t3Frac: scene.family === 2 ? (scene.hit === "hit" ? .1 : .8)
        : scene.regime === "past" ? .99480001534539
          : scene.regime === "inside" ? .945053169430139
            : scene.regime === "before" ? .990883807040518
              : scene.family === 4 ? .95 : .5,
      vdT: scene.type === "Vd2" ? .6 : 1.5,
      vdA: scene.category === "tau0" || scene.category === "replacement" ? .0005 : scene.type === "Vd2" ? .08 : .06,
      vdB: scene.category === "tau0" || scene.category === "replacement" ? .19 : scene.type === "Vd2" ? .15 : .20,

  function activeScene() { return SCENE_BY_ID.get(state.sceneId) || SCENES[0]; }
  function reflectsScene(scene) {
    return (scene.family === 1 && scene.gap === "left")
      || (scene.family === 2 && scene.support === "r5")
      || (scene.family === 3 && scene.gap === "left")
      || (scene.family === 4 && scene.side === "left");

  function setScene(id, preserveFamily = false) {
    const scene = SCENE_BY_ID.get(id);
    if (!scene) return;
    state.sceneId = id;
    if (!preserveFamily) state.family = scene.family;
    state.step = 0;
    state.params = defaultsFor(scene);
    syncControls();
    render();
  }

  function buildControls() {
    FAMILIES.forEach(family => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "family-tab";
      button.dataset.family = family.id;
      button.setAttribute("role", "tab");
      button.innerHTML = `<span>Family ${family.id}</span><strong>${family.short}</strong>`;
      button.addEventListener("click", () => {
        const first = SCENES.find(scene => scene.family === family.id);
        setScene(first.id);
      });
      $("familyTabs").appendChild(button);
    });
    $("sceneSelect").addEventListener("change", event => setScene(event.target.value));
    $("reflectButton").addEventListener("click", () => {
      const scene = activeScene();
      if (scene.reflect && SCENE_BY_ID.has(scene.reflect)) setScene(scene.reflect);
    });
    $("resetButton").addEventListener("click", () => setScene(state.sceneId));
    $("backButton").addEventListener("click", () => {
      state.step = Math.max(0, state.step - 1); render();
    });
    $("nextButton").addEventListener("click", () => {
      const last = activeScene().steps.length - 1;
      state.step = state.step >= last ? 0 : state.step + 1;
      render();
    });
    window.addEventListener("pointermove", pointerMove);
    window.addEventListener("pointerup", () => { state.drag = null; });
    $("sceneCount").textContent = `(${SCENES.length})`;
  }

  function syncControls() {
    document.querySelectorAll(".family-tab").forEach(button => {
      button.setAttribute("aria-selected", String(Number(button.dataset.family) === state.family));
    });
    const select = $("sceneSelect");
    clear(select);
    const family = FAMILIES.find(x => x.id === state.family);
    const group = document.createElement("optgroup");
    group.label = `Family ${family.id}: ${family.title}`;
    SCENES.filter(scene => scene.family === state.family).forEach((scene, index) => {
      const option = document.createElement("option");
      option.value = scene.id;
      option.textContent = `${index + 1}. ${scene.label}`;
      option.selected = scene.id === state.sceneId;
      group.appendChild(option);
    });
    select.appendChild(group);
    const reflected = activeScene().reflect;
    $("reflectButton").disabled = !reflected || !SCENE_BY_ID.has(reflected);
  }

  function drawSkeleton() {
    clear(layers.skeleton);
    svgEl("polygon", { points: pointsAttr(V), class: "skeleton-edge" }, layers.skeleton);
    V.forEach((vertex, i) => {
      svgEl("line", { x1: vertex.x, y1: vertex.y, x2: CENTER.x, y2: CENTER.y, class: "radial-arm" }, layers.skeleton);
      svgEl("circle", { cx: vertex.x, cy: vertex.y, r: 3.7, class: "vertex-dot" }, layers.skeleton);
      const direction = unit(sub(vertex, CENTER));
      const lp = add(vertex, mul(direction, 24));
      const label = svgEl("text", { x: lp.x, y: lp.y + 5, "text-anchor": "middle", class: "vertex-label" }, layers.skeleton);
      label.textContent = `V${subscript(i)}`;
      svgEl("circle", { cx: M[i].x, cy: M[i].y, r: 4, class: "midpoint" }, layers.skeleton);
      const mp = add(M[i], mul(unit(sub(M[i], CENTER)), 15));
      const ml = svgEl("text", { x: mp.x, y: mp.y + 4, "text-anchor": "middle", class: "mid-label" }, layers.skeleton);
      ml.textContent = `M${subscript(i)}`;
    });
    svgEl("circle", { cx: CENTER.x, cy: CENTER.y, r: 2.8, fill: "#777873" }, layers.skeleton);
    const ol = svgEl("text", { x: CENTER.x + 9, y: CENTER.y - 8, class: "mid-label" }, layers.skeleton);
    ol.textContent = "O";
  }

  function addPathLine(p, q, cls, step = 0, extra = {}) {
    return svgEl("line", {
      x1: p.x, y1: p.y, x2: q.x, y2: q.y,
      class: `${cls}${step > state.step ? " hidden-step" : ""}`,
      "data-reveal": step,
      ...extra
    }, layers.trace);
  }

  function addTriangle(points, role, step, label, options = {}) {
    const classes = ["triangle", `role-${role}`, step > state.step ? "hidden-step" : ""].filter(Boolean).join(" ");
    svgEl("polygon", { points: pointsAttr(points), class: classes, "data-reveal": step }, layers.triangle);
    const pc = options.labelPoint || polygonCenter(points);
    const text = svgEl("text", {
      x: pc.x, y: pc.y + 4, "text-anchor": "middle",
      class: `role-label${step > state.step ? " hidden-step" : ""}`,
      "data-reveal": step
    }, layers.annotation);
    text.textContent = label;
    if (options.note) {
      const note = svgEl("text", {
        x: pc.x, y: pc.y + 20, "text-anchor": "middle",
        class: `measure-label${step > state.step ? " hidden-step" : ""}`
      }, layers.annotation);
      note.textContent = options.note;
    }
  }

  function addHandle(p, binding, step, label) {
    const handle = svgEl("circle", {
      cx: p.x, cy: p.y, r: 7,
      class: `drag-handle${step > state.step ? " hidden-step" : ""}`,
      "data-kind": binding.kind,
      "data-binding": binding.id,
      tabindex: step <= state.step ? 0 : -1,
      role: "slider",
      "aria-label": label,
      "aria-valuemin": binding.min,
      "aria-valuemax": binding.max,
      "aria-valuenow": n(binding.value, 4)
    }, layers.handle);
    handle.addEventListener("pointerdown", event => {
      event.preventDefault();
      state.drag = binding;
      handle.setPointerCapture?.(event.pointerId);
    });
    handle.addEventListener("keydown", event => {
      if (!["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(event.key)) return;
      event.preventDefault();
      const direction = event.key === "ArrowRight" || event.key === "ArrowUp" ? 1 : -1;
      binding.apply(clamp(binding.value + direction * (event.shiftKey ? .025 : .006), binding.min, binding.max));
      render();
      requestAnimationFrame(() => {
        const next = layers.handle.querySelector(`[data-binding="${binding.id}"]`);
        next?.focus();
      });
    });
  }

  function pointerInSvg(event) {
    const point = plot.createSVGPoint();
    point.x = event.clientX; point.y = event.clientY;
    return point.matrixTransform(plot.getScreenCTM().inverse());
  }
  function pointerMove(event) {
    if (!state.drag) return;
    const p = pointerInSvg(event);
    const value = state.drag.project(p);
    state.drag.apply(clamp(value, state.drag.min, state.drag.max));
    render();
  }

  function drawCenter(scene, step = 0) {
    const data = centerData(scene.ce, state.params.center);
    state.params.center = { R: data.R, alpha: data.alpha, delta: data.delta };
    const reflected = reflectsScene(scene);
    const polygon = reflected
      ? data.localPolygon.map(p => affineToScreen(0, p.y, p.x))
      : data.screenPolygon;
    addTriangle(polygon, "c", step, "C", { note: `${scene.ce}${reflected ? " · reflected" : ""}` });
    const activeA = reflected
      ? affineToScreen(0, data.rightTrace[0], 0)
      : affineToScreen(0, 0, data.rightTrace[0]);
    const activeB = reflected
      ? affineToScreen(0, data.rightTrace[1], 0)
      : affineToScreen(0, 0, data.rightTrace[1]);
    addPathLine(activeA, activeB, "trace trace-center", step);
    if (data.leftTrace) {
      const companionA = reflected
        ? affineToScreen(0, 0, data.leftTrace[0])
        : affineToScreen(0, data.leftTrace[0], 0);
      const companionB = reflected
        ? affineToScreen(0, 0, data.leftTrace[1])
        : affineToScreen(0, data.leftTrace[1], 0);
      addPathLine(companionA, companionB, "trace trace-center", step);
    }
    if (scene.family !== 2 && scene.family !== 4
      && !(scene.family === 5 && (scene.category === "tau0" || scene.category === "replacement"))) {
      const handlePoint = activeB;
      addHandle(handlePoint, {
        id: "center-delta", kind: "center", min: .0005, max: .235,
        value: data.delta,
        project: p => {
          const q = screenToAffine(0, p);
          return (reflected ? q.x : q.y) - data.W;
        },
        apply: value => {
          const extraUpper = scene.family === 5 ? 1 / 24 - data.alpha - .00012 : Infinity;
          state.params.center.delta = projectCenterDelta(scene.ce, data.R, data.alpha, value, extraUpper);
        }
      }, step, `Center right-trace endpoint δ = ${n(data.delta)}`);
    }
    data.reflected = reflected;
    data.activeTrace = data.rightTrace;
    return data;
  }

  function comparatorAt(index, step, options = {}) {
    const side = options.reflected ? (6 - index) % 6 : index;
    const paramKey = options.paramKey || `demandA${side}`;
    if (!options.locked && state.params[paramKey] === undefined) state.params[paramKey] = options.a ?? .24;
    const aBase = options.locked ? options.a : state.params[paramKey];
    const c = options.c ?? state.params.demandC;
    const a = options.supercritical
      ? projectSupercriticalA(aBase, c)
      : clamp(aBase, .035, .94);
    if (options.supercritical && !options.locked) state.params[paramKey] = a;
    const map = options.supercritical
      ? { b: maxAdmissibleB(a, c), label: "B₂₀₀₄" }
      : mapF(a, c);
    const b = map.b;
    const actualA = a;
    const tri = enclosingUnitTriangle(actualA, b, c);
    const localPolygon = options.reflected ? tri.polygon.map(p => ({ x: p.x, y: -p.y })) : tri.polygon;
    const points = localPolygon.map(p => canonicalToScreen(side, p));
    const role = options.supercritical ? "super" : "vd0";
    const label = options.label || `T${subscript(side)}`;
    addTriangle(points, role, step, label, {
      note: options.supercritical ? `a+b=${n(actualA + b)} > 1` : `${map.label} comparator`
    });
    if (!options.locked) {
      const contact = options.reflected ? affineToScreen(side, 0, actualA) : affineToScreen(side, actualA, 0);
      addHandle(contact, {
        id: `${paramKey}-${side}`, kind: role, min: .04, max: options.supercritical ? .76 : .72,
        value: actualA,
        project: p => options.reflected ? screenToAffine(side, p).y : screenToAffine(side, p).x,
        apply: value => {
          state.params[paramKey] = options.supercritical ? projectSupercriticalA(value, c) : value;
        }
      }, step, `${label} incoming demand a = ${n(actualA)}`);
    }
    return { ...tri, a: actualA, b, c, label: map.label, side };
  }

  function demandTriangleAt(index, step, options) {
    const side = options.reflected ? (6 - index) % 6 : index;
    const tri = enclosingUnitTriangle(options.a, options.b, options.c);
    const polygon = options.localReflect ? tri.polygon.map(p => ({ x: p.x, y: -p.y })) : tri.polygon;
    addTriangle(polygon.map(p => canonicalToScreen(side, p)), options.role || "relax", step, options.label, {
      note: options.note
    });
    return { ...tri, a: options.a, b: options.b, c: options.c, label: options.mapLabel || "exact 2004", side };
  }

  function projectFreeEpsilon(target, c, limit) {
    const matches = epsilon => {
      const a = 1 - limit + epsilon;
      return a + maxAdmissibleB(a, c) > 1 + 1e-9;
    };
    const clipped = clamp(target, .00001, .03);
    if (matches(clipped)) return clipped;
    let best = null, distance = Infinity;
    for (let i = 0; i <= 1500; i++) {
      const epsilon = .00001 + .02999 * i / 1500;
      if (matches(epsilon) && Math.abs(epsilon - clipped) < distance) {
        best = epsilon; distance = Math.abs(epsilon - clipped);
      }
    }
    return best ?? .00001;
  }

  function freeSuperAt(index, step, reflected, label, c) {
    const side = reflected ? (6 - index) % 6 : index;
    const limit = (c + Math.sqrt(c * c - 8 * c + 4)) / 2;
    const epsilon = projectFreeEpsilon(state.params.epsilon, c, limit);
    state.params.epsilon = epsilon;
    const a = 1 - limit + epsilon;
    const b = Math.max(0, maxAdmissibleB(a, c) - 1e-10);
    const ghost = enclosingUnitTriangle(1 - limit, limit, c);
    const actual = enclosingUnitTriangle(a, b, c);
    const orient = polygon => reflected ? polygon.map(p => ({ x: p.x, y: -p.y })) : polygon;
    addTriangle(orient(ghost.polygon).map(p => canonicalToScreen(side, p)), "ghost", step, "B(c)", { note: "nonattained limit" });
    addTriangle(orient(actual.polygon).map(p => canonicalToScreen(side, p)), "super", step, label, { note: `strict interior · a+b=${n(a + b)}` });
    addHandle(reflected ? affineToScreen(side, 0, a) : affineToScreen(side, a, 0), {
      id: `free-super-${side}`, kind: "super", min: .00001, max: .03, value: epsilon,
      project: p => clamp((reflected ? screenToAffine(side, p).y : screenToAffine(side, p).x) - (1 - limit), .00001, .03),
      apply: value => { state.params.epsilon = projectFreeEpsilon(value, c, limit); }
    }, step, `Strict interior epsilon = ${n(epsilon)}`);
    return { ...actual, a, b, c, label: "Bfree−ε", side };
  }

  function relaxedAxisAt(index, step, reflected = false, seed = .5) {
    const side = reflected ? (6 - index) % 6 : index;
    const s = clamp(seed, .001, .999);
    const canonical = [{ x: -s, y: 0 }, { x: 1 - s, y: 0 }, { x: 1 - s, y: 1 }];
    const local = reflected ? canonical.map(p => ({ x: p.y, y: p.x })) : canonical;
    const points = local.map(q => affineToScreen(side, q.x, q.y));
    addTriangle(points, "relax", step, `T${subscript(side)}`, { note: `axis relaxation · B₀=s=${n(s)} · r₀ omitted` });
  }

  function family4Regime(data, center) {
    const S = center.k / center.W;
    const T = center.R + center.alpha;
    return T <= data.a ? "past" : S <= data.a ? "inside" : "before";
  }

  function projectRescuerFraction(D, target, center, regime) {
    const clipped = clamp(target, .001, .999);
    const matches = frac => {
      const data = t3RescuerTriangle(false, { D, frac });
      return data.radialFirst <= .4995
        && (regime === "any" || family4Regime(data, center) === regime)
        && center.delta / center.R + 1e-9 >= 1 - data.radialLast;
    };
    if (matches(clipped)) return clipped;
    let best = null, distance = Infinity;
    for (let i = 0; i <= 800; i++) {
      const frac = .001 + .998 * i / 800;
      if (matches(frac) && Math.abs(frac - clipped) < distance) {
        best = frac; distance = Math.abs(frac - clipped);
      }
    }
    return best ?? clipped;
  }

  function t3At(index, step, options = {}) {
    const side = options.reflected ? (6 - index) % 6 : index;
    const mode = options.mode || "rescuer";
    if (options.hit !== undefined) {
      state.params.t3Frac = projectT3Fraction(
        state.params.t3D,
        state.params.t3Sheet,
        state.params.t3Frac,
        options.gamma,
        options.hit
      );
    } else if (options.center && options.regime) {
      state.params.t3Frac = projectRescuerFraction(state.params.t3D, state.params.t3Frac, options.center, options.regime);
    }
    const factory = mode === "boundary" ? t3BoundaryTriangle : t3RescuerTriangle;
    const data = factory(options.reflected, {
      D: state.params.t3D,
      sheet: state.params.t3Sheet,
      frac: state.params.t3Frac
    });
    const points = data.polygon.map(p => affineToScreen(side, p.x, p.y));
    addTriangle(points, "t3", step, options.label || `T${subscript(side)}`, { note: "T3-like exact normal form" });
    const ray = options.reflected
      ? [affineToScreen(side, 1, data.radialFirst), affineToScreen(side, 1, data.radialLast)]
      : [affineToScreen(side, data.radialFirst, 1), affineToScreen(side, data.radialLast, 1)];
    addPathLine(ray[0], ray[1], "trace trace-t3", step);
    const handle = options.reflected
      ? affineToScreen(side, 0, data.a)
      : affineToScreen(side, data.a, 0);
    addHandle(handle, {
      id: `t3-${side}`, kind: "t3", min: .001, max: .999,
      value: data.frac,
      project: p => {
        const q = screenToAffine(side, p);
        const coordinate = options.reflected ? q.y : q.x;
        return (coordinate - data.amin) / (data.amax - data.amin);
      },
      apply: value => {
        state.params.t3Frac = options.hit === undefined
          ? options.center && options.regime
            ? projectRescuerFraction(state.params.t3D, value, options.center, options.regime)
            : value
          : projectT3Fraction(state.params.t3D, state.params.t3Sheet, value, options.gamma, options.hit);
      }
    }, step, `T3-like contact fraction = ${n(data.frac)}`);
    return data;
  }

  function vdAt(index, step, type, options = {}) {
    const side = index;
    const localReflect = Boolean(options.localReflect);
    const baseShape = options.shape || (type === "Vd2" ? { a: .08, b: .15 } : { a: .06, b: .20 });
    const projector = value => options.rescueRay
      ? projectVdRescueParameter(type, value, baseShape.a, baseShape.b, localReflect, options.rescueRay, options.centerReach ?? null)
      : projectVdParameter(type, value, baseShape.a, baseShape.b);
    state.params.vdT = projector(state.params.vdT);
    const data = vdTriangle(type, localReflect, { t: state.params.vdT, ...baseShape });
    const points = data.polygon.map(p => affineToScreen(side, p.x, p.y));
    addTriangle(points, "vd", step, options.label || `T${subscript(side)}`, { note: `${type} corner form` });
    const shownRay1 = localReflect ? data.ray5 : data.ray1;
    const shownRay5 = localReflect ? data.ray1 : data.ray5;
    if (intervalLength(shownRay1) > 0) {
      addPathLine(
        affineToScreen(side, shownRay1[0], 1),
        affineToScreen(side, shownRay1[1], 1),
        "trace trace-vd",
        step
      );
    }
    if (intervalLength(shownRay5) > 0) {
      addPathLine(
        affineToScreen(side, 1, shownRay5[0]),
        affineToScreen(side, 1, shownRay5[1]),
        "trace trace-vd",
        step
      );
    }
    const handle = localReflect
      ? affineToScreen(side, 0, data.a)
      : affineToScreen(side, data.a, 0);
    addHandle(handle, {
      id: `vd-${side}`, kind: "vd", min: .28, max: 3.6, value: data.t,
      project: p => {
        const q = screenToAffine(side, p);
        return .28 + clamp(localReflect ? q.y : q.x, 0, 1) * 3.32;
      },
      apply: value => {
        state.params.vdT = projector(value);
      }
    }, step, `${type} orientation t = ${n(data.t)}`);
    data.localReflect = localReflect;
    data.shownRay1 = shownRay1;
    data.shownRay5 = shownRay5;
    return data;
  }

  function drawGap(scene, center, step) {
    if (scene.gap === "no") return;
    const onLeft = scene.gap === "left";
    const onRight = scene.gap === "right";
    if (scene.gap === "two" || onRight) {
      const interval = center.reflected ? center.leftTrace : center.rightTrace;
      if (!interval) return;
      const a = affineToScreen(0, 0, interval[0]);
      const b = affineToScreen(0, 0, interval[1]);
      const one = add(a, mul(sub(b, a), .25));
      const two = add(a, mul(sub(b, a), .74));
      addPathLine(one, two, "trace trace-gap", step);
    }
    if (scene.gap === "two" || onLeft) {
      const interval = center.reflected ? center.rightTrace : center.leftTrace;
      if (!interval) return;
      const a = affineToScreen(0, interval[0], 0);
      const b = affineToScreen(0, interval[1], 0);
      addPathLine(add(a, mul(sub(b, a), .25)), add(a, mul(sub(b, a), .74)), "trace trace-gap", step);
    }
  }

  function drawHandoffs(step) {
    for (let edge = 0; edge < 6; edge++) {
      const p = midpoint(V[edge], V[(edge + 1) % 6]);
      svgEl("circle", {
        cx: p.x, cy: p.y, r: 7, class: `handoff${step > state.step ? " hidden-step" : ""}`
      }, layers.annotation);
      if (step <= state.step && edge === 3) {
        const label = svgEl("text", { x: p.x, y: p.y - 12, "text-anchor": "middle", class: "measure-label" }, layers.annotation);
        label.textContent = "six strict handoffs";
      }
    }
  }

  function displayedIndex(index, reflected) { return reflected ? (6 - index) % 6 : index; }
  function thetaRequirement(p, interval) {
    if (!interval || p < interval[0]) return 1 - p;
    return 1 - Math.max(p, interval[1]);
  }

  function drawFamily1(scene, center) {
    if (scene.gap === "no") {
      drawHandoffs(1);
      if (state.step >= 2) for (let i = 0; i < 6; i++) addPathLine(V[i], V[(i + 1) % 6], "trace trace-gap", 2);
      return [];
    }
    drawGap(scene, center, 1);
    const reflected = scene.gap === "left";
    const results = [];
    const q = center.R - center.delta;
    const p = center.W - center.alpha;
    const s = center.k / center.R;
    const leftInput = scene.gap === "two" ? p : s;
    const c5 = scene.gap === "two" ? p / center.W : 1 - center.alpha / center.W;
    const c1 = scene.gap === "two" ? q / center.R : 1 - center.delta / center.R;
    results.push(comparatorAt(5, 1, {
      reflected, locked: true, a: leftInput, c: c5,
      label: `T${subscript(displayedIndex(5, reflected))}`
    }));
    if (scene.gap !== "two") relaxedAxisAt(0, 2, reflected, s);
    results.push(comparatorAt(1, scene.gap === "two" ? 2 : 3, {
      reflected, locked: true, a: q, c: c1,
      label: `T${subscript(displayedIndex(1, reflected))}`
    }));
    return results;
  }

  function drawFamily2(scene, center) {
    const reflected = scene.support === "r5";
    const results = [];
    const gamma1 = center.delta / center.R;
    const gamma5 = center.alpha / center.W;
    const t3 = t3At(0, 1, { reflected, mode: "boundary", gamma: gamma1, hit: scene.hit === "hit" });
    const p1 = t3.edgeSum - t3.a;
    const A1 = thetaRequirement(p1, center.rightTrace);
    const A5 = thetaRequirement(t3.a, scene.ce === "CE2" ? center.leftTrace : null);
    const C1 = scene.hit === "hit" ? t3.radialFirst : 1 - gamma1;
    const C5 = 1 - gamma5;
    state.lastT3 = {
      ...t3, gamma: gamma1, contains: t3ContainsCenterExit(t3, gamma1),
      p1, A1, A5, C1, C5
    };
    const supportStep = 2;
    const supportPoint = reflected
      ? affineToScreen(0, 1, 1 - gamma1)
      : affineToScreen(0, 1 - gamma1, 1);
    const traceNear = reflected
      ? affineToScreen(0, 1, t3.radialFirst)
      : affineToScreen(0, t3.radialFirst, 1);
    addPathLine(traceNear, supportPoint, "helper", supportStep);
    svgEl("circle", {
      cx: supportPoint.x, cy: supportPoint.y, r: 8,
      class: `constraint-mark${supportStep > state.step ? " hidden-step" : ""}`
    }, layers.annotation);
    if (supportStep <= state.step) {
      const gammaLabel = svgEl("text", {
        x: supportPoint.x + (reflected ? -10 : 10),
        y: supportPoint.y - 11,
        "text-anchor": reflected ? "end" : "start",
        class: "measure-label"
      }, layers.annotation);
      gammaLabel.textContent = `${reflected ? "γ₅" : "γ₁"}=${n(gamma1)} · ${scene.hit}`;
    }
    results.push(comparatorAt(5, 3, {
      reflected, locked: true, a: A5, c: C5,
      label: `T${subscript(displayedIndex(5, reflected))}`
    }));
    results.push(comparatorAt(1, 3, {
      reflected, locked: true, a: A1, c: C1,
      label: `T${subscript(displayedIndex(1, reflected))}`
    }));
    return results;
  }

  function drawFamily3(scene, center) {
    const reflected = scene.gap === "left";
    const results = [];
    const s = center.k / center.R;
    const t0Incoming = maxAdmissibleB(s, center.k);
    results.push(demandTriangleAt(0, 1, {
      reflected, localReflect: reflected, a: t0Incoming, b: s, c: center.k,
      label: "T₀", role: "relax", mapLabel: "exact 2004 capacity",
      note: `relaxed capacity · A₀=${n(t0Incoming)} · B₀=${n(s)}`
    }));
    if (scene.gap === "two") {
      const p = center.W - center.alpha;
      const q = center.R - center.delta;
      results.push(comparatorAt(5, 2, { locked: true, a: p, c: p / center.W, label: "T₅" }));
      results.push(comparatorAt(1, 3, { locked: true, a: q, c: q / center.R, label: "T₁" }));
      return results;
    }
    let demand = center.R - center.delta;
    const m = Math.min(center.alpha / center.R, center.delta / center.W);
    const caps = [1 - center.delta / center.R, 1 - center.delta, 1 - m, 1 - center.alpha, 1 - center.alpha / center.W];
    for (let k = 1; k <= 5; k++) {
      const index = displayedIndex(k, reflected);
      const result = comparatorAt(k, k + 1, {
        reflected, locked: true, a: demand, c: caps[k - 1], label: `T${subscript(index)}`
      });
      results.push(result);
      demand = 1 - result.b;
    }
    state.lastChain = { z5: demand, bound: 1 - center.k / (2 * center.R) };
    return results;
  }

  function drawFamily4(scene, center) {
    const reflected = scene.side === "left";
    const results = [];
    const t3 = t3At(0, 1, { reflected, center, regime: scene.ce === "CE2" ? scene.regime : "any" });
    results.push(freeSuperAt(1, 2, reflected, `T${subscript(displayedIndex(1, reflected))}`, t3.radialFirst));
    state.lastF4 = {
      regime: family4Regime(t3, center),
      S: center.k / center.W,
      T: center.R + center.alpha,
      a: t3.a,
      hidden: center.delta / center.R >= 1 - t3.radialLast,
      gamma: center.delta / center.R,
      gap: 1 - t3.radialLast,
      c: t3.radialFirst
    };
    if (scene.ce === "CE2") {
      const toPoint = value => reflected ? affineToScreen(0, 0, value) : affineToScreen(0, value, 0);
      addPathLine(toPoint(state.lastF4.S), toPoint(state.lastF4.T), "trace trace-center", 3);
      const mark = toPoint(t3.a);
      svgEl("circle", { cx: mark.x, cy: mark.y, r: 7, class: `constraint-mark${3 > state.step ? " hidden-step" : ""}` }, layers.annotation);
      if (state.step >= 3) {
        const label = svgEl("text", { x: mark.x, y: mark.y - 12, "text-anchor": "middle", class: "measure-label" }, layers.annotation);
        label.textContent = `a=${n(t3.a)} · ${scene.regimeLabel}`;
      }
    }
    const budgetStep = scene.steps.length - 1;
    for (let k = 2; k <= 5; k++) {
      const edge = reflected ? (5 - k + 6) % 6 : k;
      addPathLine(V[edge], V[(edge + 1) % 6], "helper", budgetStep);
    }
    return results;
  }

  function pairMarker(sigma, tau, step, text, target = null) {
    const p = target || midpoint(V[sigma], V[tau]);
    addPathLine(V[tau], target || V[sigma], "helper", step);
    if (step <= state.step) {
      const label = svgEl("text", { x: p.x, y: p.y - 10, "text-anchor": "middle", class: "measure-label" }, layers.annotation);
      label.textContent = text;
    }
  }

  function centerRadialExit(center, index) {
    if (index === 1) return center.delta / center.R;
    if (index === 2) return center.delta;
    if (index === 3) return Math.min(center.alpha / center.R, center.delta / center.W);
    if (index === 4) return center.alpha;
    if (index === 5) return center.alpha / center.W;
    return 1;
  }

  function drawFamily5(scene, center) {
    const results = [];
    const sigmaStep = 1;
    const tauStep = 2;
    const previous = (scene.tau + 5) % 6;
    const next = (scene.tau + 1) % 6;
    const adjacent = scene.sigma === previous || scene.sigma === next;
    const needsRescue = scene.category === "replacement" || scene.category === "tau0";
    const localReflect = adjacent && scene.sigma === previous;
    const rescueRay = needsRescue ? (scene.sigma === previous ? "r5" : "r1") : null;
    const vd = vdAt(scene.tau, tauStep, scene.type, {
      label: `T${subscript(scene.tau)}`,
      localReflect,
      rescueRay,
      centerReach: scene.category === "tau0" ? center.delta / center.R : null,
      shape: { a: state.params.vdA, b: state.params.vdB }
    });
    const targetInterval = scene.sigma === previous ? vd.shownRay5 : vd.shownRay1;
    vd.rescueValid = adjacent
      && targetInterval[0] <= .5
      && .5 <= targetInterval[1];
    vd.centerHides = scene.category === "tau0"
      ? center.delta / center.R >= 1 - targetInterval[1]
      : null;
    state.lastVd = vd;
    const superResult = needsRescue
      ? freeSuperAt(scene.sigma, sigmaStep, false, `T${subscript(scene.sigma)}`, targetInterval[0])
      : comparatorAt(scene.sigma, sigmaStep, {
          supercritical: true, a: .58, c: .30, paramKey: "demandA", label: `T${subscript(scene.sigma)}`
        });
    results.push(superResult);
    const pairText = scene.category === "replacement" || scene.category === "tau0"
      ? "midpoint rescue"
      : scene.category === "nonadjacent" ? "nonadjacent placement" : "selected adjacent support";
    pairMarker(scene.sigma, scene.tau, 3, pairText, needsRescue ? M[scene.sigma] : null);
    if (scene.category === "replacement") {
      const beforeStep = 4;
      const afterStep = 5;
      const dExit = centerRadialExit(center, scene.sigma);
      const room = Math.max(.00003, Math.min((1 - vd.c0 - vd.a) / 4, (dExit - vd.a) / 4, (1 - superResult.b - vd.a) / 4, .02));
      const p1 = vd.a + room;
      const p2 = vd.a + 2 * room;
      const epsilon = room / 3;
      const deltaMinus = p => [
        { x: -epsilon, y: 1 - p },
        { x: 1 - epsilon, y: 1 - p },
        { x: -epsilon, y: -p }
      ];
      const orient = polygon => localReflect ? polygon.map(p => ({ x: p.y, y: p.x })) : polygon;
      addTriangle(
        vd.polygon.map(p => affineToScreen(scene.tau, p.x, p.y)),
        "ghost", beforeStep, "before", { note: "conditional antecedent pair" }
      );
      addTriangle(
        orient(deltaMinus(p1)).map(p => affineToScreen(scene.tau, p.x, p.y)),
        "after", afterStep, "Δp₁−", { note: `p₁=${n(p1)} · ε=${n(epsilon, 5)}` }
      );
      addTriangle(
        orient(deltaMinus(p2)).map(p => affineToScreen(scene.tau, p.x, p.y)),
        "after", afterStep, "Δp₂−", { note: `p₂=${n(p2)} · same local chart` }
      );
      const cRequired = 1 - dExit;
      state.lastReplacement = {
        p1, p2, epsilon, dExit,
        valid: vd.a < p1 && p1 < p2 && p1 < .5
          && p2 < dExit && p2 < 1 - superResult.b
          && 1 - p1 > vd.c0 && Math.max(p2, 1 - p2) > cRequired
      };
    }
    return results;
  }

  function drawAnnotations(scene, center, results) {
    if (state.step >= scene.steps.length - 1) {
      const label = svgEl("text", {
        x: 500, y: 648, "text-anchor": "middle", class: "measure-label"
      }, layers.annotation);
      if (scene.family === 1 && scene.gap === "no") label.textContent = "six strict handoffs force positive total overlap";
      else if (scene.family === 1 || scene.family === 2 || (scene.family === 3 && scene.gap === "two")) {
        const sum = results.slice(-2).reduce((s, r) => s + (r?.b || 0), 0);
        label.textContent = `paired exact endpoint output = ${n(sum)}`;
      } else if (scene.family === 3) {
        label.textContent = `z₅=${n(state.lastChain?.z5)} · T₀ bound=${n(state.lastChain?.bound)}`;
      } else if (scene.family === 4) {
        label.textContent = `center hiding: ${n(state.lastF4?.gamma)} ≥ ${n(state.lastF4?.gap)}`;
      } else if (scene.family === 5 && scene.category === "replacement") {
        label.textContent = `axis replacement margins ${state.lastReplacement?.valid ? "verified" : "not verified"}`;
      } else if (scene.family === 5) label.textContent = "radial obstruction exposed";
    }
  }

  function roleClassLabel(scene) {
    if (scene.family === 1) return scene.gap === "no" ? "open-boundary overlap" : "Vd0 endpoint loss";
    if (scene.family === 2) return "T3-like support";
    if (scene.family === 3) return scene.gap === "two" ? "paired endpoint loss" : "five-row F-chain";
    if (scene.family === 4) return "T3-like + supercritical";
    return `${scene.type} placement`;
  }

  function updateReadouts(scene, center, results) {
    $("sceneTitle").textContent = scene.title;
    $("svgTitle").textContent = scene.label;
    $("svgDesc").textContent = `${scene.label}. Exact center and role triangles on the hexagon skeleton. Step ${state.step + 1} of ${scene.steps.length}: ${scene.steps[state.step]}.`;
    const chips = [
      { text: scene.ce, cls: "ok" },
      { text: `ΔR=${n(center.deltaR)}`, cls: center.deltaR > 0 ? "ok" : "" },
      { text: `ΔL=${n(center.deltaL)}`, cls: scene.ce === "CE1" ? (center.deltaL <= 0 ? "ok" : "") : (center.deltaL > 0 ? "ok" : "") },
      { text: roleClassLabel(scene), cls: "" }
    ];
    if (scene.family === 1 && scene.gap !== "no" && scene.gap !== "two") chips.push({ text: "radial obligation relaxed", cls: "relax" });
    if (scene.family === 2) {
      const expected = scene.hit === "hit";
      chips.push({ text: `center exit ${state.lastT3?.contains ? "inside" : "outside"} T3 trace`, cls: state.lastT3?.contains === expected ? "ok" : "relax" });
      chips.push({ text: `4073 sheet ${state.params.t3Sheet < 0 ? "−" : "+"}`, cls: "" });
      chips.push({ text: "two exact endpoint caps", cls: "" });
    }
    if (scene.family === 4) {
      if (scene.ce === "CE2") chips.push({ text: state.lastF4?.regime === scene.regime ? scene.regimeLabel : `left ${scene.regimeLabel}`, cls: state.lastF4?.regime === scene.regime ? "ok" : "relax" });
      chips.push({ text: "center hides O-side gap", cls: state.lastF4?.hidden ? "ok" : "relax" });
    }
    if (scene.family === 5) {
      if (scene.category === "tau0" || scene.category === "replacement") chips.push({ text: "midpoint rescue", cls: state.lastVd?.rescueValid ? "ok" : "relax" });
      if (scene.category === "tau0") chips.push({ text: "center hides O-side gap", cls: state.lastVd?.centerHides ? "ok" : "relax" });
      chips.push({ text: "Vd2 neighbor rescue excluded (4149)", cls: "relax" });
    }
    const mapLabels = [...new Set(results.map(result => result?.label).filter(Boolean))];
    if (mapLabels.length) chips.push({ text: `map${mapLabels.length > 1 ? "s" : ""}: ${mapLabels.join(" / ")}`, cls: "" });
    $("chips").innerHTML = chips.map(chip => `<span class="chip ${chip.cls}">${chip.text}</span>`).join("");

    $("stepCount").textContent = `${state.step + 1} / ${scene.steps.length}`;
    $("stepName").textContent = scene.steps[state.step];
    $("backButton").disabled = state.step === 0;
    $("nextButton").textContent = state.step === scene.steps.length - 1 ? "Replay" : "Reveal";
    clear($("stepDots"));
    scene.steps.forEach((step, i) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = `step-dot${i <= state.step ? " on" : ""}`;
      button.setAttribute("aria-label", `Show step ${i + 1}: ${step}`);
      button.addEventListener("click", () => { state.step = i; render(); });
      $("stepDots").appendChild(button);
    });
    const first = results.find(Boolean);
    const data = [
      ["signed center", `R=${n(center.R)}, α=${n(center.alpha)}, δ=${n(center.delta)}`],
      ["trace interval", `[${n(center.rightTrace[0])}, ${n(center.rightTrace[1])}]`],
      ["center domain", `ΔR>0; ${scene.ce === "CE1" ? "ΔL≤0" : "ΔL>0"}`],
      ["scene", scene.id]
    ];
    if (first?.a !== undefined) {
      data.push(["demand", `(a,b,c)=(${n(first.a)}, ${n(first.b)}, ${n(first.c)})`]);
      data.push(["2004 contact", `${first.contact}; Lmin=${n(first.minSide, 6)}`]);
      data.push(["capped label", first.label]);
    }
    if (scene.family === 5) data.push(["placement", `(σ,τ)=(${scene.sigma},${scene.tau}) · ${scene.type}`]);
    if (scene.family === 2 && state.lastT3) {
      data.push(["center exit", `γ=${n(state.lastT3.gamma)}; [1−u,1−c]=[${n(1 - state.lastT3.radialLast)},${n(1 - state.lastT3.radialFirst)}]`]);
      data.push(["boundary inputs", `A₅=${n(state.lastT3.A5)}, A₁=${n(state.lastT3.A1)}`]);
      data.push(["radial inputs", `C₅=${n(state.lastT3.C5)}, C₁=${n(state.lastT3.C1)}`]);
    }
    if (scene.family === 3 && scene.gap !== "two" && state.lastChain) {
      data.push(["five-map return", `z₅=${n(state.lastChain.z5)}; bound=${n(state.lastChain.bound)}`]);
    }
    if (scene.family === 4 && state.lastF4) {
      data.push(["T3 interface", `c=${n(state.lastF4.c)}, 1−u=${n(state.lastF4.gap)}`]);
      if (scene.ce === "CE2") data.push(["companion trace", `S=${n(state.lastF4.S)}, a=${n(state.lastF4.a)}, T=${n(state.lastF4.T)}`]);
    }
    if (scene.family === 5 && state.lastVd) {
      data.push(["Vd supports", `r1=${n(intervalLength(state.lastVd.shownRay1))}; r5=${n(intervalLength(state.lastVd.shownRay5))}`]);
      if (scene.category === "replacement" || scene.category === "tau0") data.push(["rescue predicate", String(state.lastVd.rescueValid)]);
      if (scene.category === "tau0") data.push(["center hiding", String(state.lastVd.centerHides)]);
      if (scene.category === "replacement" && state.lastReplacement) data.push(["axis replacement", `p₁=${n(state.lastReplacement.p1, 5)}, p₂=${n(state.lastReplacement.p2, 5)}, ε=${n(state.lastReplacement.epsilon, 6)}`]);
    }
    $("exactData").innerHTML = data.map(([key, value]) => `<div class="datum">${key}<strong>${value}</strong></div>`).join("");
    $("proofLink").href = scene.source;
  }

  function render() {
    const scene = activeScene();
    clear(layers.trace); clear(layers.triangle); clear(layers.annotation); clear(layers.handle);
    drawSkeleton();
    const center = drawCenter(scene, 0);
    let results = [];
    if (scene.family === 1) results = drawFamily1(scene, center);
    if (scene.family === 2) results = drawFamily2(scene, center);
    if (scene.family === 3) results = drawFamily3(scene, center);
    if (scene.family === 4) results = drawFamily4(scene, center);
    if (scene.family === 5) results = drawFamily5(scene, center);
    drawAnnotations(scene, center, results);
    updateReadouts(scene, center, results);
  }

  buildControls();
  setScene(SCENES[0].id);

  window.Strategy2Explorer = Object.freeze({
    sceneCount: SCENES.length,
    familyCounts: FAMILIES.map(f => SCENES.filter(s => s.family === f.id).length),
    lMin,
    mapF,
    centerData,
    projectCenterDelta,
    enclosingUnitTriangle,
    t3BoundaryTriangle,
    t3RescuerTriangle,
    t3ContainsCenterExit,
    vdTriangle,
    vdPredicate,
    scenes: SCENES.map(({ id, family, label }) => ({ id, family, label }))
  });
})();
</script>
</body>
</html>
